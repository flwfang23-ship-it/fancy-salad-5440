# B03 推广位管理



## 1. 需求背景与目标

### 1.1 为什么要做

商户在 SaaS 平台上推广外卖活动前，需要先创建推广位作为生成推广链接的基础单元。推广位决定了链接的投放渠道归属和平台归因参数。推广位数量增多后，商户需要按运营场景（如日常推广、活动推广）对推广位进行分组归类管理。

```text
改造前

商户注册后无任何推广位
        ↓
商户需自行创建推广位才能开始推广
        ↓
缺乏默认组织和分类管理，推广位散落不便于查找


改造后

商户注册成功
        ↓
系统自动创建默认分组 + 默认推广位（注册即可取链）
        ↓
商户可按需自行创建分组和推广位
        ↓
推广位按分组归类，支持统一管理、搜索和删除
```

### 1.2 一句话业务模型

```text
商户注册触发系统自动准备默认分组和默认推广位
        +
商户按运营需要自行创建更多分组
        +
在各分组下创建推广位
        ↓
推广位被取链功能引用 → 生成带平台归因的推广链接
```

### 1.3 最终目标

- **注册即用：** 商户注册成功后系统自动创建默认分组和默认推广位，商户无需任何操作即可开始取链推广。
- **灵活分组归类：** 商户可按运营场景自行创建分组和管理推广位，分组与推广位支持搜索、筛选和安全删除。
- **平台统一查阅：** 总后台可查看全部商户的推广位及平台参数（美团和饿了么联盟共 8 个字段），AppSecret 类字段默认脱敏。


## 2. 业务流程

### 2.1 多方业务泳道图

> 标准参与方参照为"外部系统—SaaS 总后台—客户端后台—C 端用户"。  
> 根据当前功能的真实参与方增删泳道，不参与当前业务的角色应删除。  
> 泳道按业务责任划分，不按服务、接口、任务或部署位置等技术边界拆分。  
> 泳道图是后续所有"流程位置"的唯一来源。每个编号只允许对应一个参与方和一个业务动作。  
> 美团联盟和饿了么联盟是外部系统，但在本功能中是后端异步调用的接口方，商户完全无感知，不作为独立泳道出现。  
> 本功能的核心状态主线为"推广位联盟同步状态"，贯穿从创建到可用的完整链路。

```text
┌────────────────────────┬────────────────────────┬────────────────────────┐
│ SaaS系统（自动）        │ 客户端后台             │ SaaS总后台              │
├────────────────────────┼────────────────────────┼────────────────────────┤
│ ① 商户注册成功         │                        │                        │
│        │               │                        │                        │
│ ② 自动创建默认分组    │                        │                        │
│    和默认推广位        │                        │                        │
│ 【推广位联盟同步状态：  │                        │                        │
│  ready / pending】     │                        │                        │
│        │               │                        │                        │
│        └──────────────→│ ③ 进入推广分组管理     │                        │
│                        │   ├─ 新建分组          │                        │
│                        │   ├─ 编辑分组名称      │                        │
│                        │   └─ 删除空分组        │                        │
│                        │        │               │                        │
│                        │ ④ 进入推广位列表       │                        │
│                        │   ├─ 按分组Tab查看    │                        │
│                        │   ├─ 新建推广位        │                        │
│                        │   │  【推广位联盟同步   │                        │
│                        │   │   状态：            │                        │
│                        │   │   ready / pending   │                        │
│                        │   │   / failed】        │                        │
│                        │   └─ 删除推广位        │                        │
│                        │                        │                        │
│                        │                        │ ⑤ 查阅全部商户         │
│                        │                        │    推广位列表           │
│                        │                        │        │               │
│                        │                        │ ⑥ 查看推广位详情       │
│                        │                        │    （平台参数只读）     │
└────────────────────────┴────────────────────────┴────────────────────────┘
```

泳道图状态说明：

- 节点编号只表示参与方实际执行的业务动作。
- 状态标注写在触发该状态的动作之后，不占用新的流程序号，固定采用"【推广位联盟同步状态：状态名称】"。
- 核心状态主线选择"推广位联盟同步状态"：贯穿推广位创建（② 和 ④ 的新建推广位）到可用的完整链路，直接决定推广位能否正常用于取链。该状态对商户端透明（商户列表中不展示），仅在总后台详情中可查阅。
- ready 表示联盟同步全部成功；pending 表示同步未完成或部分失败，自动重试中；failed 表示 3 次重试后仍失败，触发运营告警。pending 和 failed 状态下推广位在商户端仍可见，取链时不受影响（取链不依赖联盟同步结果）。

### 2.2 阶段划分与阅读说明

后续正文按照业务实际发生顺序线性展开，不按操作端分别集中介绍。根据当前业务闭环，可划分为三个阶段：

1. **第一阶段：系统自动准备（主要参与方：SaaS 系统）**：商户注册成功后，系统自动创建默认分组和默认推广位，同步调用联盟接口获取 sid/pid。本阶段不需要商户或运营手动操作，结果是商户至少拥有一个可用分组和一个可用推广位。
2. **第二阶段：商户自主管理（主要参与方：客户端后台）**：商户在客户端后台管理推广分组和推广位。先进入分组管理页查看和创建分组，再进入推广位列表页按分组查看、新建和删除推广位。
3. **第三阶段：总后台查阅（主要参与方：SaaS 总后台）**：总后台运营查阅全部商户的推广位列表及平台参数，仅限只读。

```text
第一阶段：系统自动准备
① 商户注册成功 → ② 自动创建默认分组和默认推广位
                    ↓
第二阶段：商户自主管理
③ 进入推广分组管理（新建/编辑/删除空分组） → ④ 进入推广位列表（按分组查看/新建/删除推广位）
                    ↓
第三阶段：总后台查阅
⑤ 查阅全部商户推广位列表 → ⑥ 查看推广位详情（平台参数只读）
```

第一阶段必须先完成，它是第二阶段商户能够看到默认分组和默认推广位的前置条件。第二阶段中的分组管理和推广位管理同属商户后台，商户可自由切换使用。第三阶段是总后台的独立运营能力，与第二阶段并行存在（总后台可随时查阅，不受商户是否在操作的影响）。

每个主流程小节开头必须提供"流程位置"，使用三阶段分组格式完整复用 2.1 泳道图的全部节点，并通过"序号（当前位置）"标明本节覆盖的环节。

### 2.3 业务路径与真实汇合点

推广位的来源有两条路径，形成记录后汇合到统一列表：

```text
路径一：系统自动创建
商户注册成功 → 系统自动创建默认分组+默认推广位
                                                 ┐
                                                 ├→ 推广位列表统一展示和管理
路径二：商户手动创建                               │
进入推广位列表 → 选择分组 → 新建推广位 → 保存 ────┘
```

推广分组的来源同理：

```text
路径一：系统自动创建
商户注册成功 → 系统自动创建默认分组
                                     ┐
                                     ├→ 推广分组列表统一展示和管理
路径二：商户手动创建                   │
进入推广分组 → 新建分组 → 保存 ───────┘
```

两条路径的汇合点分别是"推广位列表"和"推广分组列表"。无论推广位或分组来自哪条路径，在列表中的展示和管理方式一致。系统创建的默认分组和默认推广位带有 isDefault 标记，在列表中展示"默认"标签且不可删除。

## 3. 第一阶段：系统自动准备

本阶段由 SaaS 系统在商户注册成功后自动执行，不需要商户或运营手动操作。执行结果确保每个商户至少拥有一个可用分组和一个可用推广位，后续取链功能可立即使用。

### 3.1 注册时自动创建默认分组和默认推广位

#### 功能使命

商户注册成功后，系统在同一事务内自动创建默认分组和默认推广位，并同步调用美团联盟和饿了么联盟接口获取 sid 和 pid。该功能保证商户注册后立即可用，不因缺少推广位而无法取链。

#### 流程位置

```text
第一阶段：系统自动准备
①（当前位置）商户注册成功 → ②（当前位置）自动创建默认分组和默认推广位
                    ↓
第二阶段：商户自主管理
③ 进入推广分组管理（新建/编辑/删除空分组） → ④ 进入推广位列表（按分组查看/新建/删除推广位）
                    ↓
第三阶段：总后台查阅
⑤ 查阅全部商户推广位列表 → ⑥ 查看推广位详情（平台参数只读）
```

#### 业务说明

商户注册成功后，系统在同一事务内自动完成两项创建：

**创建默认分组：**

| 属性 | 值 |
| --- | --- |
| 分组名称 | 默认分组 |
| isDefault | true |
| 删除规则 | 不可删除 |
| 初始推广位数 | 0（创建默认推广位后变为 1） |

**创建默认推广位（归属于默认分组）：**

| 属性 | 值 |
| --- | --- |
| 推广位名称 | 默认推广位 |
| isDefault | true |
| 所属分组 | 默认分组 |
| 删除规则 | 不可删除 |
| 联盟同步 | 同商户手动创建，同步调用美团和饿了么联盟接口 |

创建默认推广位时，后端同步调用美团联盟和饿了么联盟接口，在各平台创建对应的推广位，获取 sid（美团）和 pid（饿了么）写入 platformConfig。mediaId、appkey、appSecret 由 SaaS 侧直接填入平台参数。

#### 业务逻辑

**默认分组和默认推广位不可删除：** isDefault=true 的记录在客户端不显示删除按钮，后端校验并拒绝删除请求。默认分组允许编辑名称，默认推广位编辑能力后续补充。

**联盟同步与创建事务的关系：** 创建默认分组和默认推广位在同一数据库事务内完成。联盟同步在事务提交后异步执行，不阻塞商户注册流程。

**联盟同步失败处理：** 同步全部成功则推广位正常可用（status=ready）。任一联盟同步失败则推广位标记为 pending，自动重试最多 3 次（间隔 5s/15s/60s 递增）；3 次后仍失败则标记为 failed，触发运营告警。pending 和 failed 状态下推广位在商户端仍可见可用，取链不依赖联盟同步结果。


## 4. 第二阶段：商户自主管理

本阶段承接系统自动准备，商户在客户端后台对推广分组和推广位进行日常管理。商户可创建新分组来组织推广位，在各分组下创建推广位，以及删除不再需要的推广位或空分组。本章先介绍分组管理页，再介绍推广位列表页——读者先了解上层组织单元，再深入推广位本身。

### 4.1 推广分组管理（新增页面）

#### 功能使命

推广分组是推广位的上一级组织单元，拥有独立的菜单入口（推广管理 → 推广分组）。商户在此集中查看和管理所有分组，包括默认分组（系统创建）和自建分组，支持新建、编辑名称和删除空分组。

#### 流程位置

```text
第一阶段：系统自动准备
① 商户注册成功 → ② 自动创建默认分组和默认推广位
                    ↓
第二阶段：商户自主管理
③（当前位置）进入推广分组管理（新建/编辑/删除空分组） → ④ 进入推广位列表（按分组查看/新建/删除推广位）
                    ↓
第三阶段：总后台查阅
⑤ 查阅全部商户推广位列表 → ⑥ 查看推广位详情（平台参数只读）
```

#### 页面说明

**页面路径：** 客户端后台 / 推广管理 / 推广分组。<br>
**页面改动：** 新增独立页面。商户管理推广分组的唯一入口，包含分组列表和新建/编辑弹窗。<br>
**页面作用：** 集中展示当前商户的全部分组，支持按名称搜索、新建分组、编辑名称和删除空分组。默认分组置顶且不可删除。<br>
**主要展示：** 分组列表每行展示分组名称（默认分组带红色"默认"标签）、包含推广位数、创建时间。列表上方提供分组名称搜索框和"新建分组"按钮。默认分组始终置顶。<br>
**可执行操作：** 商户可新建分组（打开弹窗填写名称）、点击分组名称旁的编辑图标修改名称、删除推广位数为 0 的非默认分组。默认分组仅允许编辑名称，不允许删除。<br>

#### 字段说明

[图 B03-01：推广分组管理页面]

> 下图覆盖分组列表和新建/编辑弹窗。分组列表展示全部字段；新建/编辑弹窗仅包含分组名称。列表中的"包含推广位数"由系统根据分组下推广位数量实时计算。

| 字段名称 | 字段类型 | 列表 | 详情 | 新增 | 字段解释 |
| --- | --- | --- | --- | --- | --- |
| 分组名称 | string | 是 | 否 | 是（可编辑） | **数据来源：** 系统自动生成（默认分组）或商户手动输入（自建分组）。<br>**逻辑：** 1-10 字符，同商户下不可重复。默认分组名称为"默认分组"，允许编辑。<br>**用途：** 作为推广位的归属分组，展示在分组列表、推广位列表的分组 Tab 栏和新建推广位的分组下拉中。 |
| 包含推广位数 | number | 是 | 否 | 否 | **数据来源：** 系统根据该分组下未删除推广位数量实时计算。<br>**逻辑：** 展示当前数值；为 0 时分组可删除，大于 0 时删除被阻止。<br>**用途：** 判断分组是否为空，决定能否删除。 |
| 创建时间 | datetime | 是 | 否 | 否 | **数据来源：** 系统在分组创建时记录。<br>**逻辑：** 展示格式为 yyyy-MM-dd HH:mm。<br>**用途：** 排序和追溯。 |

> 列表中的"默认"标签（红色）不属于独立业务字段，由 isDefault 属性控制显示。

#### 列表交互

**交互：新建分组**  <br>
**业务用途**：打开新建分组弹窗，商户填写分组名称后保存。创建成功后分组列表刷新，推广位列表的分组 Tab 栏同步新增该分组。<br>

**交互：编辑分组名称**  <br>
**业务用途**：打开编辑弹窗（回填当前名称），商户修改后保存。名称更新后，推广位列表中该分组名称同步更新。默认分组同样可编辑名称。<br>

**交互：删除空分组**  <br>
**业务用途**：分组下推广位数为 0 且非默认分组时，点击删除并二次确认后执行。分组被删除后，推广位列表的分组 Tab 栏移除该分组。含推广位的分组（推广位数大于 0）点击删除时 Toast 提示"该分组下有 N 个推广位，请先移出或删除"。<br>

#### 业务逻辑

**默认分组删除保护：** 默认分组不显示删除按钮，后端同时校验 isDefault 并拒绝删除。

**分组删除约束：** 分组下有推广位时（推广位数大于 0），前端阻止删除并 Toast 提示，后端二次校验。只有推广位数为 0 且非默认分组时才能删除。

**分组名称唯一性：** 同商户下分组名称不可重复。新建和编辑时前端校验，后端二次校验。


### 4.2 推广位列表（新增页面）

#### 功能使命

推广位列表是商户管理推广位的主要入口（推广管理 → 推广位管理）。商户在此按分组 Tab 查看各分组下的推广位，支持新建推广位和删除推广位。列表和新建弹窗共同组成推广位的完整管理能力。

#### 流程位置

```text
第一阶段：系统自动准备
① 商户注册成功 → ② 自动创建默认分组和默认推广位
                    ↓
第二阶段：商户自主管理
③ 进入推广分组管理（新建/编辑/删除空分组） → ④（当前位置）进入推广位列表（按分组查看/新建/删除推广位）
                    ↓
第三阶段：总后台查阅
⑤ 查阅全部商户推广位列表 → ⑥ 查看推广位详情（平台参数只读）
```

#### 页面说明

**页面路径：** 客户端后台 / 推广管理 / 推广位管理。<br>
**页面改动：** 新增独立页面。商户管理推广位的主要入口，包含推广位列表、分组 Tab 栏、搜索筛选、新建推广位弹窗和删除推广位二次确认。<br>

**业务用途**：打开新建推广位弹窗，商户填写推广位名称、选择所属分组后保存。保存成功后列表刷新，Toast 提示"推广位已创建"。创建时后端同步调用美团和饿了么联盟接口，商户无感知。联盟同步全部成功则推广位正常可用（status=ready）；任一失败则标记为 pending 并自动重试，3 次后仍失败标记为 failed 并触发运营告警。pending 和 failed 状态下推广位在商户端仍正常展示和可用。<br>

#### 业务逻辑

**推广位名称唯一性：** 同一分组下推广位名称不可重复。新建时前端校验，后端二次校验。

**所属分组默认值：** 新建推广位时所属分组默认选中默认分组。支持在弹窗内通过"+新建"快捷创建新分组，创建成功后自动选中新分组。

**推广位软删除：** 商户删除推广位为软删除（deleted=true），数据永久保留不做物理删除。已删除推广位从推广位列表隐藏，但已生成推广链接继续有效，取链清单中该推广位的记录保留，第三方活动中该推广位的路径配置保留。

**联盟同步与商户可见性：** 联盟同步状态（ready/pending/failed）不影响推广位在商户端的展示和取链可用性。同步全部成功则 platformConfig 写入完毕；同步失败时推广位仍可正常使用，运营需关注告警处理。

**默认推广位删除保护：** 默认推广位（isDefault=true）在列表操作列不显示删除按钮，后端校验并拒绝删除请求。

## 6. 关键业务规则

> 本章只汇总跨页面、跨阶段或特别容易误解的已确认规则。已在单个页面小节的"业务逻辑"中完整讲清的规则，本章不再重复。

### 6.1 默认分组和默认推广位保护

- 商户注册成功后系统自动创建默认分组（名称"默认分组"）和默认推广位（名称"默认推广位"），isDefault 标记为 true。
- 默认分组和默认推广位不可删除：客户端不显示删除按钮，后端拒绝删除请求。
- 默认分组允许编辑名称；默认推广位编辑能力后续补充。

### 6.2 推广位软删除

- 商户删除推广位为软删除（deleted=true），数据永久保留不做物理删除。
- 已删除推广位从商户端推广位列表隐藏，但基于该推广位已生成的推广链接继续有效。
- 取链清单中该推广位的记录保留；第三方活动中该推广位的路径配置保留。
- 删除确认后不可自行撤销（无回收站或恢复入口，如需恢复需联系运营）。

### 6.3 联盟推广位同步

- 创建推广位时（系统自动创建或商户手动创建均触发），后端异步调用美团联盟和饿了么联盟接口创建对应推广位。
- SaaS 侧传入 mediaId、appkey、appSecret；联盟接口返回 sid（美团）和 pid（饿了么），写入 platformConfig。
- 同步全部成功 → status=ready，platformConfig 写入完毕。
- 同步任一失败 → status=pending，自动重试 3 次（间隔 5s/15s/60s 递增）；3 次后仍失败 → status=failed，触发运营告警。
- pending 和 failed 状态下推广位在商户端仍可见可用，取链不依赖联盟同步结果。

### 6.4 平台参数权限隔离

- 平台参数（platformConfig，含美团 4 字段 + 饿了么 4 字段）仅总后台通过详情抽屉可查阅。
- 商户端所有接口和页面不返回、不展示平台参数。
- AppSecret 类字段（meituanAppSecret、taobaoAppSecret）默认脱敏展示，支持临时查看明文。

### 6.5 总后台只读查阅

- 总后台仅提供推广位的查询和查阅能力，不直接创建、编辑或删除商户的推广位和分组。
- 总后台可查看全部商户的推广位数据，不做商户隔离。

### 8.1 文档设计理念

本文档采用双层结构：

1. **人类阅读模块**：第 1～7 章。通过泳道图建立全局认知，再按照真实业务发生顺序线性表达，使读者能够连续理解业务起点、分支、汇合、处理和结果。
2. **AI 维护模块**：第 8 章。集中保存维护顺序、边界约束、术语同步要求、信息可信度判断、上下游检查和待确认逻辑。

维护目标：

```text
人类正文：连续、真实、简洁、好读
AI 说明：可维护、可检查、不擅自推导
```

不得把 AI 维护所需的检查清单、推测和疑点大量前置到人类正文中，也不得让人类正文承担数据模型、系统架构或技术实现说明的职责。

### 8.2 正文组织原则

正式正文按照以下顺序组织：

```text
泳道图建立全局认知
        ↓
阶段划分解释整体流程和主要参与方
        ↓
识别真实业务分支
        ↓
各分支在自身小节内讲完特有处理
        ↓
在真实业务汇合点合并
        ↓
继续线性表达后续流程和结果
```

具体规则：

- 正文按业务实际发生顺序展开（系统自动 → 商户管理 → 总后台查阅），不按总后台、客户端、C 端分别集中成章。
- 2.1 泳道图是流程信息的唯一事实源；所有主流程小节完整复制同一组节点，只在当前节点的流程序号后增加"（当前位置）"标记。
- 不得为缩短"流程位置"而只保留前一步、当前步和后一步。局部截取容易造成节点遗漏、改写和粒度漂移。
- 泳道图后的解释内容应保持连续：先用阶段划分解释整体流程、正文结构和主要参与方，再展开某一节点的分支、路径或汇合细节。不得让局部细节插入总览与其整体解释之间。
- 分支应各自走到真实汇合点，不能为了复用章节而提前强行统一。
- 阶段应体现业务目标、责任方或结果的明显变化；单纯技术接收、自动任务或数据转换不一定构成独立阶段。
- 三级标题按完整页面能力或独立功能单元划分。同一管理页面内的列表、新增、编辑、详情和预览应在一个三级章节内连续展开，不按操作动作拆成多个平级章节。
- 页面章节只保留六段结构。列表、新增、编辑、详情、预览等页面场景只能在"页面说明"的五行短标签中交代，不能新增为平级或下级标题；页面说明每行末尾使用 `<br>`，主页面截图默认放到"字段说明"开头；跨场景字段统一进入"字段说明"，列表交互紧跟字段表并优先使用轻量文本。每个页面章节末尾固定保留"列表交互"，无交互时写"无交互。"；简单操作的结果、详情用途和编辑范围合并到列表交互。
- 页面/功能小节内部采用"功能使命 → 流程位置 → 页面说明 → 字段说明 → 列表交互 → 业务逻辑"。
- "业务逻辑"是页面小节最后的小模块，只写前五节未覆盖但读者必须理解的规则、条件、状态、边界、联动和限制。默认使用 `**规则标题：** 说明。`，不写无标题 bullet，不扩写成独立规则库，不重复页面、字段和交互说明。
- 模板按需使用，不要求每个栏目都填写。
- 同一规则优先在实际发生位置完整说明一次；"关键业务规则"和"AI 维护说明"不机械复述正文。
- "最终目标"只保留 1～3 条核心结果，统一使用"短标题：一句话结果"。

### 8.3 泳道和参与方识别规则

实际编写时：

- 根据功能真实参与方增删泳道，不要求四方全部出现。
- 泳道按业务职责划分，不按技术架构划分。
- 多个技术系统如果共同承担一个连续业务职责，可统一为一个业务称谓。
- 不得把服务、接口、数据库、自动任务或内部处理模块直接当成业务参与方。
- 同一个参与方在泳道和正文中应使用统一称谓。

参与方命名应优先回答"业务上是谁完成这件事？"，而不是"这段处理分别运行在哪些系统或服务中？"。

### 8.4 业务文档与系统架构的边界

本文档描述业务背景、业务关系、操作流程、生效条件、字段口径、上下游影响、状态变化和异常结果。

除非用户明确要求，不写入：服务、接口、数据库表、定时任务等技术实现；按部署位置拆分的系统架构；为技术复用而设计的中间处理层；与人类理解业务无关的数据模型细节。

AI 不得因为看见多个系统名称，就自动将其拆成多个业务参与方；也不得因为某个处理由 SaaS 自动完成，就将其独立包装成一个业务阶段。

### 8.5 信息可信度与写入位置

写入任何规则前，必须先判断信息来源：

| 信息类型 | 写入方式 |
| --- | --- |
| 用户已经明确确认 | 写入人类正文，作为正式规则 |
| 现有原型、旧文档或其他材料明确表达 | 写入人类正文，并保持原口径 |
| AI 根据常见产品经验合理推导，但尚未确认 | 只写入"待确认逻辑" |
| 与当前业务主线无关 | 不写 |

核心原则：

```text
合理不等于已确认
常见做法不等于当前产品规则
文档完整不等于可以自行补充
```

### 8.6 AI 思考和维护顺序

AI 修改文档前，先逆向检查业务是否闭环：

```text
最终结果为什么形成
← 后续处理方执行了什么操作
← 业务发起方提交或确认了什么
← 每条上游路径分别提供了什么条件
```

确认闭环后，再正向组织正文。

具体维护步骤：

1. 识别当前功能的真实参与方和业务称谓。
2. 区分已确认事实、材料明确内容、AI 推测和无关信息。
3. 找出业务分支及其真实汇合点。
4. 按业务发生顺序划分阶段，不按技术组件划分。
5. 建立唯一泳道图，为每个节点分配唯一编号、参与方和业务动作。
6. 将同一组主流程节点复制到全部"流程位置"，仅在当前章节覆盖节点的流程序号后标记"（当前位置）"。
7. 对照页面原型判断页面改动性质，并在功能标题中标记"（新增页面）"或"（改造页面）"；页面说明使用五行短标签，主页面截图放在字段说明开头。
8. 先按业务入口判断页面边界，将同一页面内的列表、新增、编辑、详情和预览合并为一个页面能力章节。
9. 分别识别列表、详情和新增的真实字段；同一业务对象使用一张后置的统一字段表汇总，通过位置列表达页面差异，并用 `是`、`否`、`是（可编辑）` 明确每个字段在对应页面是否展示、是否可编辑。
10. 将已确认内容写入正文，将未确认推测放入待确认逻辑。
11. 删除机械套用模板产生的空栏目、重复表达和要求读者反向查找的引用。
12. 检查称谓、字段、状态、上下游边界和权限是否全篇一致。

### 8.7 上下游与模块边界检查

| 修改内容 | 必须检查的影响 |
| --- | --- |
| 推广位创建规则 | B05 自动取链的推广位选择、B03-A 推广路径与取链 |
| 推广位删除规则 | B05 的取链清单、已生成链接的有效性 |
| 推广位字段和名称 | 总后台查阅页面、取链时的推广位展示 |
| 平台参数字段 | 总后台详情抽屉、联盟同步逻辑、B03-B 收入归因 |
| 默认分组/默认推广位 | 商户注册流程、初始化逻辑 |
| 分组和推广位关系 | 推广位列表的分组 Tab、取链时的推广位选择范围 |

模块边界：

- 本模块负责形成和维护推广位及分组数据。
- 上游模块（商户注册）触发默认创建。
- 下游模块（B05 自动取链、B03-A 推广路径）引用推广位作为投放单元。
- 不得将上游对象误写为由当前模块生成，也不得把下游处理规则提前塞入当前模块正文。

### 8.8 术语、字段和状态同步规则

- 全文统一使用"推广位"和"推广分组"，不使用"PromotionSlot""PromotionGroup"等英文名。
- 推广位标识统一为 slotId，推广位名称统一为 slotName。
- 平台参数字段按数据字典统一：meituanMediaId、meituanSlotSid、meituanAppkey、meituanAppSecret、elemeMediaId、elemePid、taobaoAppkey、taobaoAppSecret。
- "软删除"指 deleted=true，数据保留，从常规列表隐藏，不等于数据被物理销毁。
- 字段解释优先使用"数据来源 / 逻辑 / 用途"三段表达；能明确数据来源时必须以"数据来源："开头。
- "列表、详情、新增"三列只使用 `是`、`否`、`是（可编辑）` 三种枚举。
- 来源优先写业务对象和直接形成方式，例如"系统自动生成""商户手动输入""关联分组记录""SaaS 侧填入""联盟接口返回"。
- 不同业务对象的状态必须分别定义。推广位联盟同步状态（ready/pending/failed）与推广位是否默认（isDefault）是不同维度，不得合并。

### 8.9 不得混淆

- 商户删除推广位（软删除）不等于推广位数据被物理删除。
- 删除推广位不等于已生成推广链接失效。
- 删除分组不等于该分组下的推广位被自动删除（含推广位的分组阻止删除）。
- 总后台查阅不等于总后台可编辑商户推广位。
- 平台参数可见不等于平台参数可修改（当前版本仅查阅）。
- 联盟同步返回的 sid/pid 不等于平台参数的全部字段（mediaId/appkey/appSecret 由 SaaS 侧填入）。
- 推广位 pending/failed 是联盟同步状态，不等于推广位在商户端不可见或不可用。
- 业务参与方不等于技术系统或内部服务。
- 业务阶段不等于技术处理步骤。

### 8.10 待确认逻辑

> 只记录与当前业务闭环有关、但现有材料和用户尚未明确的内容。使用问题形式表达，确认后移入正文对应位置。

      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 0.92em;
      background: #eef2f6;
      border: 1px solid #dde5ed;
      border-radius: 4px;
      padding: 1px 5px;
    }
    pre.flow {
      margin: 16px 0;
      padding: 16px;
      overflow-x: auto;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-text);
      line-height: 1.55;
      border: 1px solid var(--line);
    }
    pre.flow code {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 13px;
      white-space: pre;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #fff;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    th { background: #f1f5f9; font-weight: 750; color: #26364a; }
    figure {
      margin: 18px 0 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    figure img,
    .doc-content p > img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      background: #f8fafc;
    }
    figcaption {
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      background: #fbfcfe;
    }
    .section-outline {
      position: sticky;
      top: calc(var(--sticky-stack-height, 86px) + 16px);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
      max-height: calc(100vh - 112px);
      overflow: auto;
    }
    .outline-title {
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 750;
      color: #344054;
    }
    .section-outline a {
      display: block;
      border-radius: 6px;
      padding: 5px 7px;
      color: #475467;
      font-size: 13px;
      line-height: 1.4;
      text-decoration: none;
    }
    .section-outline a:hover { background: var(--accent-soft); color: var(--accent-strong); }
    .section-outline .level-4 { padding-left: 18px; }
    .section-outline .level-5 { padding-left: 30px; }
    .section-outline.muted span { color: var(--muted); font-size: 13px; }
    @media (max-width: 1100px) {
      .header-inner, .tabs-inner, .reader-shell { width: min(100vw - 28px, 980px); }
      .tabs-wrap.has-global-flow .tabs-inner { padding-left: 0; }
      .reader-shell.has-global-flow { display: block; width: min(100vw - 28px, 980px); }
      .left-rail { position: static; max-height: none; overflow: visible; padding-top: 16px; }
      .reader-shell.has-global-flow > main { padding-top: 0; }
      .global-flow { margin-bottom: 24px; }
      .panel-layout { grid-template-columns: 1fr; }
      .section-outline { position: static; max-height: none; order: -1; }
      .tab-panel { padding: 20px; }
    }
    @media print {
      body { background: #fff; }
      .tabs-wrap, .left-rail, .section-outline { display: none; }
      .tab-panel { display: block !important; box-shadow: none; border: 0; break-inside: avoid; }
      main, .header-inner, .reader-shell { width: 100%; margin: 0; }
    }

    .prototype-image img { cursor: zoom-in; }
    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(15, 23, 42, 0.72);
    }
    .image-lightbox.active { display: flex; }
    .image-lightbox img {
      max-width: min(96vw, 1440px);
      max-height: 90vh;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }
    .image-lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: #111827;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }
    .image-lightbox-close:hover { background: #fff; }
    @media print {
      .image-lightbox { display: none; }
    }
  </style>
</head>

  <script>
(function () {
    (function () {
      const sourceEl = document.getElementById('canonical-md');
      const imageIndexEl = document.getElementById('image-index');
      const app = document.getElementById('reading-app');
      const markdown = (sourceEl ? sourceEl.textContent : '').replace(/\r\n?/g, '\n').trim();
      const imageIndex = imageIndexEl ? JSON.parse(imageIndexEl.textContent || '[]') : [];
      const imageMap = new Map(imageIndex.map((item) => [item.label, item]));

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      function formatInlineText(text) {
        let html = escapeHtml(text);
        html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        return html;
      }

      function renderInline(text) {
        const imageRef = String(text).match(/^\[图\s+([A-Z0-9]+-\d{2})：([^\]]+)\]$/);
        if (imageRef) {
          const item = imageMap.get('图 ' + imageRef[1]);
          if (item) return `<a href="#image-${escapeAttr(item.key)}">${escapeHtml(item.label)}：${escapeHtml(item.title)}</a>`;
        }

        const tokenRe = /\[([^\]]+)\]\((<[^>]+>|[^)]+)\)/g;
        let out = '';
        let last = 0;
        let match;
        while ((match = tokenRe.exec(text)) !== null) {
          out += formatInlineText(text.slice(last, match.index));
          const label = match[1];
          let href = String(match[2] || '').trim();
          if (href.startsWith('<') && href.endsWith('>')) href = href.slice(1, -1);
          out += `<a href="${escapeAttr(href)}">${formatInlineText(label)}</a>`;
          last = tokenRe.lastIndex;
        }
        out += formatInlineText(text.slice(last));
        return out;
      }

      function stripMarkdown(value) {
        return value
          .replace(/\[([^\]]+)\]\((<[^>]+>|[^)]+)\)/g, '$1')
          .replace(/[`*_]/g, '')
          .trim();
      }

      function isTableSeparator(line) {
        const trimmed = line.trim();
        if (!trimmed.includes('|')) return false;
        const cells = trimmed.replace(/^\|/, '').replace(/\|$/, '').split('|').map((value) => value.trim());
        return cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
      }

      function isTableStart(lines, index) {
        return index + 1 < lines.length && lines[index].includes('|') && isTableSeparator(lines[index + 1]);
      }

      function splitTableRow(row) {
        let trimmed = row.trim();
        if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
        if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
        return trimmed.split('|').map((cell) => cell.trim());
      }

      function isBlockStart(lines, index) {
        const line = lines[index] || '';
        const trimmed = line.trim();
        if (!trimmed) return true;
        return /^#{1,6}\s+/.test(trimmed)
          || /^```/.test(trimmed)
          || /^>\s?/.test(trimmed)
          || /^[-*]\s+/.test(trimmed)
          || /^\d+\.\s+/.test(trimmed)
          || isTableStart(lines, index)
          || /^\[图\s+[A-Z0-9]+-\d{2}：/.test(trimmed);
      }

      function renderImageIndexRef(trimmed) {
        const match = trimmed.match(/^\[图\s+([A-Z0-9]+-\d{2})：([^\]]+)\]$/);
        if (!match) return null;
        const item = imageMap.get('图 ' + match[1]);
        if (!item) return null;
        return `<figure id="image-${escapeAttr(item.key)}" class="prototype-image"><img src="${escapeAttr(item.src)}" alt="${escapeAttr(item.alt)}" loading="lazy"><figcaption>${escapeHtml(item.label)}：${escapeHtml(item.title)}</figcaption></figure>`;
      }

      function renderMarkdownLines(lines, prefix) {
        const html = [];
        const outline = [];
        let index = 0;
        let headingCounter = 0;

        while (index < lines.length) {
          const line = lines[index];
          const trimmed = line.trim();
          if (!trimmed) {
            index += 1;
            continue;
          }

          const imageHtml = renderImageIndexRef(trimmed);
          if (imageHtml) {
            html.push(imageHtml);
            index += 1;
            continue;
          }

          const fence = trimmed.match(/^```\s*([^`]*)$/);
          if (fence) {
            const lang = fence[1].trim();
            const code = [];
            index += 1;
            while (index < lines.length && !/^```/.test(lines[index].trim())) {
              code.push(lines[index]);
              index += 1;
            }
            if (index < lines.length) index += 1;
            html.push(`<pre class="flow"><code${lang ? ` class="language-${escapeAttr(lang)}"` : ''}>${escapeHtml(code.join('\n'))}</code></pre>`);
            continue;
          }

          const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            const title = heading[2].trim();
            headingCounter += 1;
            const id = `${prefix}-h${headingCounter}`;
            if (level >= 3 && level <= 4) outline.push({ level, title: stripMarkdown(title), id });
            html.push(`<h${level} id="${id}">${renderInline(title)}</h${level}>`);
            index += 1;
            continue;
          }

          if (/^>\s?/.test(trimmed)) {
            const quote = [];
            while (index < lines.length && /^>\s?/.test(lines[index].trim())) {
              quote.push(lines[index].trim().replace(/^>\s?/, ''));
              index += 1;
            }
            html.push(`<blockquote>${quote.map((item) => `<p>${renderInline(item)}</p>`).join('')}</blockquote>`);
            continue;
          }

          if (isTableStart(lines, index)) {
            const tableLines = [];
            while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
              tableLines.push(lines[index]);
              index += 1;
            }
            const header = splitTableRow(tableLines[0]);
            const body = tableLines.slice(2).map(splitTableRow);
            const headHtml = header.map((cell) => `<th>${renderInline(cell)}</th>`).join('');
            const rowsHtml = body.map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join('')}</tr>`).join('');
            html.push(`<div class="table-wrap"><table><thead><tr>${headHtml}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`);
            continue;
          }

          if (/^[-*]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
            const ordered = /^\d+\.\s+/.test(trimmed);
            const tag = ordered ? 'ol' : 'ul';
            const items = [];
            while (index < lines.length && lines[index].trim()) {
              const current = lines[index].trim();
              const matchesType = ordered ? /^\d+\.\s+/.test(current) : /^[-*]\s+/.test(current);
              if (!matchesType) break;
              items.push(current.replace(ordered ? /^\d+\.\s+/ : /^[-*]\s+/, ''));
              index += 1;
            }
            html.push(`<${tag}>${items.map((item) => `<li>${renderInline(item)}</li>`).join('')}</${tag}>`);
            continue;
          }

          const paragraph = [trimmed];
          index += 1;
          while (index < lines.length && lines[index].trim() && !isBlockStart(lines, index)) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          html.push(`<p>${renderInline(paragraph.join(' '))}</p>`);
        }

        return { html: html.join('\n'), outline };
      }

      function splitDocument(md) {
        const lines = md.split('\n');
        const titleLineIndex = lines.findIndex((line) => /^#\s+/.test(line));
        const title = titleLineIndex >= 0 ? lines[titleLineIndex].replace(/^#\s+/, '').trim() : document.title;
        const firstSection = lines.findIndex((line, idx) => idx > titleLineIndex && /^##\s+/.test(line));
        const introLines = firstSection >= 0 ? lines.slice(titleLineIndex + 1, firstSection) : lines.slice(titleLineIndex + 1);
        const sections = [];
        let current = null;
        for (let i = firstSection >= 0 ? firstSection : lines.length; i < lines.length; i += 1) {
          const match = lines[i].match(/^##\s+(.+)$/);
          if (match) {
            if (current) sections.push(current);
            current = { title: match[1].trim(), lines: [] };
          } else if (current) {
            current.lines.push(lines[i]);
          }
        }
        if (current) sections.push(current);
        return { title, introLines, sections };
      }

      function extractGlobalFlowLines(sections) {
        for (const section of sections) {
          for (let i = 0; i < section.lines.length; i += 1) {
            const match = section.lines[i].match(/^###\s+(.+)$/);
            if (!match) continue;
            const title = stripMarkdown(match[1]);
            if (!/^2\.1\s+/.test(title) && !title.includes('多方业务泳道图')) continue;
            const copied = [section.lines[i]];
            for (let j = i + 1; j < section.lines.length; j += 1) {
              if (/^###\s+/.test(section.lines[j])) break;
              copied.push(section.lines[j]);
            }
            return copied;
          }
        }
        return [];
      }

      function renderDocument() {
        const doc = splitDocument(markdown);
        const intro = renderMarkdownLines(doc.introLines, 'intro');
        const globalFlowLines = extractGlobalFlowLines(doc.sections);
        const globalFlow = globalFlowLines.length ? renderMarkdownLines(globalFlowLines, 'global-flow-copy') : null;
        const tabs = doc.sections.map((section, index) => {
          const sectionId = `section-${index + 1}`;
          const shortTitle = section.title.replace(/^\d+\.\s*/, '');
          return `<button class="tab-button" type="button" id="tab-${sectionId}" data-target="${sectionId}" aria-controls="${sectionId}"><span>${String(index + 1).padStart(2, '0')}</span>${escapeHtml(shortTitle)}</button>`;
        }).join('');

        const panels = doc.sections.map((section, index) => {
          const sectionId = `section-${index + 1}`;
          const rendered = renderMarkdownLines(section.lines, sectionId);
          const outline = rendered.outline.length
            ? `<nav class="section-outline" aria-label="本章目录"><div class="outline-title">本章目录</div>${rendered.outline.map((item) => `<a class="level-${item.level}" href="#${item.id}">${escapeHtml(item.title)}</a>`).join('')}</nav>`
            : '<nav class="section-outline muted" aria-label="本章目录"><div class="outline-title">本章目录</div><span>本章无下级标题</span></nav>';
          return `<section class="tab-panel" id="${sectionId}" data-title="${escapeAttr(section.title)}" aria-labelledby="tab-${sectionId}">
  <div class="panel-heading">
    <span class="chapter-index">${String(index + 1).padStart(2, '0')}</span>
    <h2>${renderInline(section.title)}</h2>
  </div>
  <div class="panel-layout">
    <article class="doc-content">${rendered.html}</article>
    ${outline}
  </div>
</section>`;
        }).join('\n');

        const leftRail = globalFlow
          ? `<aside class="left-rail" aria-label="${escapeAttr(doc.title)}概览与多方业务泳道图">
  <div class="content-summary">
    <div class="content-summary-inner">
    <h1>${escapeHtml(doc.title)}</h1>
    <div class="intro">${intro.html}</div>
  </div>
  </div>
  <div class="global-flow" aria-label="2.1 多方业务泳道图">${globalFlow.html}</div>
</aside>`
          : '';

        const header = globalFlow
          ? ''
          : `<header class="page-header"><div class="header-inner"><h1>${escapeHtml(doc.title)}</h1><div class="intro">${intro.html}</div></div></header>`;

        app.innerHTML = `${header}<div class="${globalFlow ? 'tabs-wrap has-global-flow' : 'tabs-wrap'}" aria-label="章节导航"><div class="tabs-inner" role="tablist">${tabs}</div></div><div class="${globalFlow ? 'reader-shell has-global-flow' : 'reader-shell'}">${leftRail}<main>${panels}</main></div>`;
        initInteractions();
      }

      function initInteractions() {
        document.documentElement.classList.add('js');
        const pageHeader = document.querySelector('.page-header');
        const tabsWrap = document.querySelector('.tabs-wrap');
        const tabsInner = document.querySelector('.tabs-inner');
        const tabs = Array.from(document.querySelectorAll('.tab-button'));
        const panels = Array.from(document.querySelectorAll('.tab-panel'));

        function syncStickyOffsets() {
          const headerHeight = pageHeader?.offsetHeight || 0;
          const tabsHeight = tabsWrap?.offsetHeight || 0;
          document.documentElement.style.setProperty('--sticky-header-height', headerHeight + 'px');
          document.documentElement.style.setProperty('--sticky-stack-height', (headerHeight + tabsHeight) + 'px');
        }

        function scrollTabsToEnd() {
          if (!tabsInner || !tabsWrap?.classList.contains('has-global-flow')) return;
          tabsInner.scrollLeft = tabsInner.scrollWidth;
        }

        function activate(id, updateHash = true, scrollTop = true) {
          const panel = document.getElementById(id) || panels[0];
          if (!panel) return;
          panels.forEach((item) => item.classList.toggle('active', item === panel));
          tabs.forEach((tab) => {
            const active = tab.dataset.target === panel.id;
            tab.classList.toggle('active', active);
            tab.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          if (updateHash && location.hash !== '#' + panel.id) {
            history.replaceState(null, '', '#' + panel.id);
          }
          if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function activateFromHash(scrollToTarget = false) {
          const hash = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
          const target = hash ? document.getElementById(hash) : null;
          const panel = target?.classList.contains('tab-panel') ? target : target?.closest('.tab-panel');
          activate(panel?.id || panels[0]?.id, false, !scrollToTarget);
          if (scrollToTarget && target && !target.classList.contains('tab-panel')) {
            requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
          }
        }

        tabs.forEach((tab) => {
          tab.addEventListener('click', () => activate(tab.dataset.target));
        });

        const lightbox = document.createElement('div');
        lightbox.className = 'image-lightbox';
        lightbox.setAttribute('role', 'dialog');
        lightbox.setAttribute('aria-modal', 'true');
        lightbox.setAttribute('aria-label', '图片预览');
        lightbox.innerHTML = '<button class="image-lightbox-close" type="button" aria-label="关闭图片预览">×</button><img alt="">';
        document.body.appendChild(lightbox);

        const lightboxImage = lightbox.querySelector('img');
        const lightboxClose = lightbox.querySelector('.image-lightbox-close');

        function closeLightbox() {
          lightbox.classList.remove('active');
          lightboxImage.removeAttribute('src');
          lightboxImage.alt = '';
          document.body.style.overflow = '';
        }

        document.querySelectorAll('figure img, .doc-content p > img').forEach((image) => {
          image.addEventListener('click', () => {
            lightboxImage.src = image.currentSrc || image.src;
            lightboxImage.alt = image.alt || '图片预览';
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
          });
        });

        lightbox.addEventListener('click', (event) => {
          if (event.target === lightbox || event.target === lightboxImage) closeLightbox();
        });
        lightboxClose.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
        });

        syncStickyOffsets();
        window.addEventListener('resize', syncStickyOffsets);
        if ('ResizeObserver' in window) {
          const stickyObserver = new ResizeObserver(syncStickyOffsets);
          if (pageHeader) stickyObserver.observe(pageHeader);
          if (tabsWrap) stickyObserver.observe(tabsWrap);
        }

        activateFromHash(true);
        requestAnimationFrame(scrollTabsToEnd);
        window.addEventListener('hashchange', () => activateFromHash(true));
      }

      renderDocument();
    })();
  })();
  </script>
</body>
</html>
