<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测评导航 — 第8批</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#f1f5f9;height:100vh;display:flex;overflow:hidden;}

/* 左侧导航栏 */
.侧栏{width:260px;min-width:260px;height:100vh;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;}
.侧栏头{padding:18px 16px 14px;border-bottom:1px solid #e2e8f0;flex:0 0 auto;}
.侧栏头 h2{margin:0;font-size:16px;color:#172033;}
.侧栏头 p{margin:4px 0 0;font-size:11px;color:#94a3b8;}
.侧栏体{flex:1;overflow-y:auto;padding:10px 0;}
.侧栏尾{flex:0 0 auto;padding:10px 16px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;}

/* 分组标题 */
.分组头{padding:10px 16px 6px;font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;}
.导航项{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none;font-size:13.5px;color:#334155;border-left:3px solid transparent;transition:all .12s;overflow:hidden;}
.导航项:hover{background:#f1f5f9;}
.导航项.活跃{background:#eff6ff;color:#0f6b8f;border-left-color:#0f6b8f;font-weight:700;}
.导航项 .图标{font-size:16px;flex-shrink:0;}
.导航项 .标签{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.导航项 .类型{font-size:10px;color:#94a3b8;background:#f1f5f9;padding:2px 6px;border-radius:3px;flex-shrink:0;}
.导航项.活跃 .类型{background:#dbeafe;color:#2563eb;}

/* 右侧内容区 */
.内容区{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.内容顶栏{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;min-height:48px;}
.内容顶栏 .面包屑{font-size:13px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.内容顶栏 .面包屑 b{color:#172033;}
.内容顶栏 .格式标签{flex-shrink:0;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:650;background:#dbeafe;color:#1d4ed8;}

#内容容器{flex:1;min-height:0;position:relative;}
.内容iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}

/* 欢迎占位 */
.欢迎占位{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;background:#f8fafc;}
.欢迎占位 .图标{font-size:56px;margin-bottom:14px;}
.欢迎占位 .标题{font-size:18px;font-weight:700;color:#64748b;margin-bottom:6px;}
.欢迎占位 .说明{font-size:13px;text-align:center;}
</style>
</head>
<body>

<!-- 左侧导航 -->
<aside class="侧栏">
  <div class="侧栏头">
    <h2>📋 测评导航</h2>
    <p>第8批 · 小程序优化</p>
  </div>
  <div class="侧栏体">
    <div class="分组头">测评文档</div>
    <div class="导航项 活跃" data-src="D-1测评-B端.html" data-名="测评 · B端">
      <span class="图标">🅱️</span>
      <span class="标签">测评 · B端</span>
      <span class="类型">HTML</span>
    </div>
    <div class="导航项" data-src="D-1测评_C端页面.html" data-名="测评 · C端页面">
      <span class="图标">📱</span>
      <span class="标签">测评 · C端页面</span>
      <span class="类型">HTML</span>
    </div>
  </div>
  <div class="侧栏尾">共 2 篇测评文档</div>
</aside>

<!-- 右侧内容 -->
<main class="内容区">
  <div class="内容顶栏">
    <div class="面包屑">第8批_小程序优化 / <b id="当前名">测评 · B端</b></div>
    <span class="格式标签">HTML</span>
  </div>
  <div id="内容容器">
    <div class="欢迎占位" id="欢迎占位" style="display:none;">
      <div class="图标">📋</div>
      <div class="标题">请选择左侧文档</div>
      <div class="说明">点击左侧任一测评文档即可在此预览</div>
    </div>
    <iframe class="内容iframe" id="内容iframe" src="D-1测评-B端.html"></iframe>
  </div>
</main>

<script>
const 导航项列表 = document.querySelectorAll('.导航项');
const iframe = document.getElementById('内容iframe');
const 当前名 = document.getElementById('当前名');
const 欢迎占位 = document.getElementById('欢迎占位');

导航项列表.forEach(项 => {
  项.addEventListener('click', () => {
    导航项列表.forEach(x => x.classList.remove('活跃'));
    项.classList.add('活跃');
    const src = 项.dataset.src;
    当前名.textContent = 项.dataset.名;
    iframe.src = src;
    iframe.style.display = 'block';
    欢迎占位.style.display = 'none';
  });
});
</script>

</body>
</html>
