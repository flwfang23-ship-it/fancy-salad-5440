<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>附近团购 · C 端交互稿 v3（交付优化版）</title>
<style>
/* ============================================================
 * ① 设计 token —— 直接复用积分小程序调色板
 * ============================================================ */
:root{
  --ink:#171615;--ink2:#625e59;--ink3:#9c9690;--line:#ece9e5;--panel:#fff;--stage:#f1f1f2;
  --green:#21845b;--red:#d85a42;--orange:#d78b38;--blue:#1686b8;
  --stamp-bg:#f7f3ea;--stamp-paper:#fffdf8;--stamp-ink:#3c2622;--stamp-muted:#958d89;
  --stamp-accent:#d9903d;--stamp-line:#e7e0d6;
  --sans:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
button,select{font:inherit}
button{color:inherit}
body{height:100vh;overflow:hidden;background:var(--stage);font-family:var(--sans);color:var(--ink)}
.app{display:grid;grid-template-columns:232px 300px minmax(560px,1fr);height:100vh}

/* ---------- rail 左栏 ---------- */
.rail{min-height:0;display:flex;flex-direction:column;border-right:1px solid #dfdfe1;background:#fff}
.rail-head{padding:18px 16px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}
.eyebrow{font:700 9px/1 var(--mono);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.rail-title{margin-top:8px;font-size:16px;font-weight:800;letter-spacing:.04em}
.rail-sub{margin-top:5px;font-size:10.5px;color:var(--ink3);line-height:1.45}
.rail-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.rail-meta span{padding:3px 6px;border-radius:5px;background:#f3f3f4;font:700 8px/1.2 var(--mono);color:#777}
.rail-meta .review{background:#fff1dc;color:#a65e10}
.rail-body{flex:1;min-height:0;overflow:auto;padding:10px 10px 24px;scrollbar-width:thin}
.mode-switch{display:flex;gap:3px;padding:3px;background:#f3f3f4;border-radius:8px;margin-bottom:8px}
.mode-btn{flex:1;padding:6px 0;border:0;border-radius:6px;background:transparent;font-size:11px;color:#888;cursor:pointer}
.mode-btn.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.group-head{display:flex;align-items:center;gap:7px;padding:14px 8px 7px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#4a4744}
.group-head::before{content:"";width:5px;height:5px;border-radius:50%;background:#c8c4c0}
.group-head em{margin-left:auto;font:400 9px var(--mono);color:#aaa;font-style:normal}
.rail-item,.page-item{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;font-size:12px;color:#555}
.rail-item:hover,.page-item:hover,.step:hover{background:#f3f3f4}
.rail-item.on,.page-item.on{background:#eeeef0;color:#151515;font-weight:750}
.rail-dot{width:5px;height:5px;border-radius:50%;background:#ccc;flex:none}.on .rail-dot{background:#191919}
.rail-name{min-width:0;flex:1;line-height:1.38;word-break:break-word}
.rail-sub{display:block;font-style:normal;font-size:9px;font-weight:400;color:#999;margin-top:1px;letter-spacing:.02em}
.rail-count,.page-code{font:9px var(--mono);color:#aaa}

/* ---------- flowcol 流程栏 ---------- */
.flowcol{min-height:0;display:flex;flex-direction:column;border-right:1px solid #dfdfe1;background:#fafafa}
.flow-head{padding:18px 16px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}
.flow-title{font-size:12.5px;font-weight:800;letter-spacing:.05em}
.flow-sub{margin-top:5px;font-size:10px;color:#aaa;line-height:1.5}
.flow-body{flex:1;min-height:0;overflow:auto;padding:10px 10px 24px;scrollbar-width:thin}
.section-label{margin:16px 8px 7px;font:700 9px var(--mono);letter-spacing:.16em;color:#aaa}
.step{display:flex;gap:9px;padding:8px;border-radius:8px;cursor:pointer}
.step.on{background:#fff;box-shadow:0 0 0 1px #e4e2df}
.step-index{width:22px;height:22px;border:1px solid #bdb8b3;border-radius:50%;display:grid;place-items:center;flex:none;font:700 9px var(--mono);color:#777}
.step.on .step-index{background:#191919;color:#fff;border-color:#191919}
.step.ext .step-index{border-style:dashed}
.step-title{font-size:11.5px;font-weight:700;line-height:1.35}
.step-sub{font-size:9.5px;color:#aaa;margin-top:2px;line-height:1.45}
.flow-arrow{height:12px;border-left:1px dashed #ddd;margin-left:19px}

/* ---------- stage 舞台 ---------- */
.stage{min-width:0;overflow:auto;display:flex;justify-content:center;align-items:center;gap:18px;padding:18px 22px}
.stage-main{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.stage-meta{width:392px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#888;font-size:10.5px}
.stage-name{display:flex;align-items:center;gap:7px;min-width:0}
.stage-name i{width:5px;height:5px;border-radius:50%;background:#171615}
.frame-select{max-width:222px;border:1px solid #ddd9d5;border-radius:7px;background:#fff;padding:6px 7px;font-size:10px;color:#34312e;outline:none}

/* ---------- phone 手机 ---------- */
.phone{width:392px;height:min(820px,calc(100vh - 88px));min-height:650px;border-radius:44px;background:var(--stamp-bg);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 45px rgba(0,0,0,.13);overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:39px;padding:14px 25px 0;display:flex;align-items:center;justify-content:space-between;flex:none;font:700 10px var(--mono);color:var(--stamp-ink);z-index:8}
.status-icons{display:flex;gap:4px;align-items:center}
.status-icons i{display:block;width:4px;height:4px;border-radius:50%;background:#1f1e1c}
.status-icons b{width:18px;height:9px;border:1.5px solid #1f1e1c;border-radius:3px;display:block;margin-left:4px;position:relative}
.status-icons b::after{content:"";position:absolute;inset:1px;background:#1f1e1c;border-radius:1px}
#screen{flex:1;min-height:0;display:flex;position:relative}
.mobile-page{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;color:var(--stamp-ink);background:#fff}
.page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.page-scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
#tabbar{flex:none}
#sheetRoot{position:absolute;inset:0;z-index:30;pointer-events:none}
.global-tabs{height:62px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,248,.96);border-top:1px solid var(--stamp-line);padding:6px 8px 8px;z-index:10}
.global-tabs button{border:0;background:transparent;border-radius:13px;color:#9d958f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8.5px;cursor:pointer}
.global-tabs button.on{color:var(--stamp-accent);background:#f4ede3;font-weight:800}
.global-tabs .ico{font-size:17px;line-height:1}

/* ---------- sheet / modal ---------- */
.mask{position:absolute;inset:0;background:rgba(29,22,17,.35);pointer-events:auto;animation:fade .18s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--stamp-paper);border-radius:26px 26px 0 0;padding:10px 16px 22px;pointer-events:auto;animation:rise .24s cubic-bezier(.2,.8,.25,1) both}
.sheet-handle{width:34px;height:4px;border-radius:4px;background:#d7d0c8;margin:2px auto 16px}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:0 2px 14px}
.sheet-title{flex:1;text-align:center}
.sheet-title h2{font-size:20px}
.sheet-title p{font-size:11px;color:var(--stamp-muted);margin-top:7px}
.sheet-close{width:30px;height:30px;border:0;border-radius:11px;background:#f1ede7;color:#8f8780;cursor:pointer}
.sheet-spacer{width:30px}
.modal-mask{position:absolute;inset:0;background:rgba(20,15,11,.5);pointer-events:auto;animation:fade .18s ease both}
.modal{position:absolute;left:34px;right:34px;top:50%;transform:translateY(-50%);background:var(--stamp-paper);border-radius:25px;padding:20px 18px 22px;text-align:center;pointer-events:auto;box-shadow:0 18px 50px rgba(0,0,0,.22);animation:pop .25s cubic-bezier(.2,.8,.25,1) both}
.modal h2{font-size:19px;margin-top:12px;color:var(--stamp-ink)}
.modal p{font-size:11px;color:#8f8780;line-height:1.65;margin-top:8px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;border:0;height:42px;border-radius:13px;font-size:11px;font-weight:800;cursor:pointer}
.modal-actions .secondary{background:#f0ece6;color:#776f68}
.modal-actions .primary{background:var(--green);color:#fff}
#toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,8px);background:rgba(35,29,25,.92);color:#fff;padding:9px 13px;border-radius:9px;font-size:10.5px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;z-index:50;max-width:84%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- inspector 右栏 ---------- */
.inspector{width:280px;height:min(820px,calc(100vh - 88px));margin-top:38px;background:#fafafa;border:1px solid #dfdcd8;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;flex:none}
.inspector-head{padding:14px 15px;border-bottom:1px solid #e6e3df;background:#fff}
.inspector-top{display:flex;align-items:center;gap:8px}
.inspector-title{font-size:13px;font-weight:800}
.inspector-status{margin-left:auto;padding:2px 6px;border-radius:4px;background:#e8f6ef;color:#19714b;font-size:8px;font-weight:800}
.inspector-status.warn{background:#fff0ec;color:#c6503c}
.inspector-sub{margin-top:4px;font-size:9.5px;color:#aaa}
.inspector-body{flex:1;overflow:auto;padding:14px 15px}
.note-section{padding:11px 0;border-bottom:1px solid #e8e5e1}
.note-section:first-child{padding-top:0}
.note-section h4{font-size:9px;letter-spacing:.14em;color:#999;margin-bottom:8px}
.note-row{display:flex;gap:7px;font-size:10.5px;line-height:1.6;color:#666;margin-top:5px}
.note-row i{font:9px var(--mono);font-style:normal;color:#bbb;flex:none;margin-top:2px}
.note-row.warn{color:#c6503c;font-weight:650}

/* ---------- 团购业务样式 ---------- */
.gb-head{padding:2px 16px 10px;background:linear-gradient(180deg,#e3f1e9 0%,#f4faf6 58%,#fff 100%);flex:none}
.gb-nav{display:flex;align-items:center;justify-content:space-between;height:34px}
.loc-pill{display:flex !important;align-items:center;flex-wrap:nowrap !important;gap:4px;height:28px;padding:0 10px;border-radius:99px;background:#fff;border:1px solid #dfeeee;font-size:11.5px;font-weight:800;color:var(--stamp-ink);box-shadow:0 2px 7px rgba(23,61,42,.06);white-space:nowrap !important;overflow:hidden}
.loc-pill svg{width:11px;height:11px;fill:var(--green);flex:none}
.loc-pill .chev{width:8px;height:8px;fill:#8a9a91;margin-left:1px}
.ghost-btn{height:26px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.72);border:1px solid #dfeeee;font-size:10px;color:var(--green);font-weight:700;white-space:nowrap !important;flex:none}
.gb-title{margin-top:8px;font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.28;color:var(--stamp-ink)}
.gb-sub{margin-top:5px;font-size:10px;color:#8a9790;letter-spacing:.01em}
.gb-tabs{display:flex;gap:6px;margin-top:13px}
.tabbtn{height:30px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid #e2efe7;font-size:11.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:4px}
.tabbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.gb-strip{margin:10px 2px 0;display:flex;align-items:center;gap:6px;font-size:9.5px;color:#8a9790}
.gb-strip i{width:5px;height:5px;border-radius:50%;background:var(--green);flex:none}
.gb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 20px}
.gb-card{border-radius:14px;background:#fff;border:1px solid #edf3ef;box-shadow:0 5px 14px rgba(23,64,42,.05);overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0;cursor:pointer}
.gb-card:active{transform:scale(.985)}
.gb-thumb{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#e8f2ee,#d8e7e1);overflow:hidden}
.gb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gb-thumb.img-fail img{display:none}
.gb-thumb.img-fail::after{content:attr(data-brand);position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--green);letter-spacing:.04em}
.mt-badge{position:absolute;left:6px;top:6px;height:16px;padding:0 5px;border-radius:4px;background:#ffd100;color:#2b2100;font-size:8.5px;font-weight:900;display:grid;place-items:center;letter-spacing:.02em}
.sold-badge{position:absolute;right:0;bottom:0;padding:3px 6px;background:rgba(20,32,25,.58);color:#fff;font-size:8px;border-radius:7px 0 0 0;letter-spacing:.02em}
.gb-info{padding:8px 9px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.gb-name{font-size:12px;font-weight:800;line-height:1.38;color:var(--stamp-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px;letter-spacing:-.2px}
.gb-tagrow{display:flex;gap:3px;overflow:hidden;height:16px}
.gb-tag{flex:none;height:16px;padding:0 4px;border-radius:3px;font-size:8px;font-weight:700;display:grid;place-items:center;letter-spacing:.01em}
.gb-tag.rank{background:#fff3e6;color:#b3671c}
.gb-tag.price{background:#ffeceb;color:#d9432c}
.gb-tag.score{background:#eef4ee;color:#2f6b51}
.gb-price{display:flex;align-items:baseline;gap:4px;margin-top:1px}
.gb-price b{font-size:16.5px;font-weight:900;color:var(--red);letter-spacing:-.4px;line-height:1}
.gb-price b i{font-style:normal;font-size:9.5px;margin-right:1px;font-weight:800}
.gb-price s{font-size:9px;color:#a6b1aa}
.gb-price em{font-style:normal;font-size:8px;font-weight:800;color:var(--red);background:#fff0ec;border-radius:3px;padding:1.5px 3px}
.gb-meta{display:flex;align-items:center;justify-content:space-between;font-size:8.5px;color:#93a39a;margin-top:auto;padding-top:1px}
.gb-footer{padding:0 16px 14px;text-align:center;font-size:8.5px;color:#b2bdb6}

/* 骨架 / 定位中 */
.skeleton-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 20px}
.sk-card{border-radius:14px;border:1px solid #eef4f0;overflow:hidden;background:#fff}
.sk-img{aspect-ratio:1/1;background:linear-gradient(100deg,#eef5f1 20%,#f8fbf9 38%,#eef5f1 56%);background-size:220% 100%;animation:shimmer 1.3s infinite linear}
.sk-body{padding:9px;display:flex;flex-direction:column;gap:6px}
.sk-line{height:9px;border-radius:4px;background:#f0f5f2;animation:shimmer 1.3s infinite linear}
.sk-line.w70{width:70%}.sk-line.w45{width:45%}.sk-line.big{height:14px;width:52%}
@keyframes shimmer{0%{background-position:180% 0}100%{background-position:-20% 0}}
.locating-bar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border:1px solid #e3f0e8;box-shadow:0 10px 30px rgba(23,64,42,.12);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:11px;z-index:5;width:240px}
.pin-pulse{width:32px;height:32px;border-radius:50%;background:#e8f4ee;display:grid;place-items:center;flex:none;position:relative}
.pin-pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #b7e6cb;animation:pulse 1.4s infinite}
.pin-pulse svg{width:14px;height:14px;fill:var(--green)}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.locating-bar b{display:block;font-size:12px;font-weight:800;color:var(--stamp-ink)}
.locating-bar span{display:block;font-size:9.5px;color:#8da095;margin-top:3px}

/* 微信授权 modal */
.wx-icon{width:46px;height:46px;margin:10px auto 10px;border-radius:12px;background:linear-gradient(145deg,#3ea56e,#21845b);display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900}

/* 异常页 */
.ex-body{padding:42px 28px 24px;text-align:center}
.ex-icon{width:76px;height:76px;margin:0 auto;border-radius:50%;background:linear-gradient(160deg,#eaf2ee,#f6faf8);display:grid;place-items:center;border:1px solid #e2ece6}
.ex-icon svg{width:28px;height:28px;fill:var(--green)}
.ex-icon.warn{background:linear-gradient(160deg,#fff6ee,#fffdfa);border-color:#f6e7d7}
.ex-icon.warn svg{fill:#c98a45}
.ex-title{margin-top:18px;font-size:17px;font-weight:900;letter-spacing:-.3px;color:var(--stamp-ink)}
.ex-desc{margin:9px auto 0;max-width:280px;font-size:10.5px;line-height:1.7;color:#8b9a91}
.ex-list{margin:18px auto 0;max-width:290px;text-align:left;background:#f7f3ea;border:1px solid #ecdfc9;border-radius:12px;padding:11px 12px}
.ex-list div{display:flex;gap:7px;font-size:9.5px;line-height:1.6;color:#6c5e4f;padding:3px 0}
.ex-list i{font:700 8px var(--mono);color:#b2a79a;font-style:normal;margin-top:1px}
.ex-actions{margin-top:20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.btn-primary{width:100%;max-width:290px;height:42px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:12px;font-weight:800;box-shadow:0 6px 16px rgba(33,132,91,.24);cursor:pointer}
.btn-primary:active{background:#186b48}
.btn-ghost{width:100%;max-width:290px;height:40px;border-radius:13px;background:#f0ece6;color:#6c5e4f;font-size:11.5px;font-weight:700;border:0;cursor:pointer}
.ex-note{margin-top:16px;font-size:8.5px;line-height:1.6;color:#aab5ae}

/* 位置 sheet */
.sheet-label{font-size:9px;font-weight:800;letter-spacing:.12em;color:#a29a92;margin:12px 2px 7px}
.loc-now{display:flex;align-items:center;gap:9px;width:100%;padding:10px 11px;border-radius:11px;background:#f7f3ea;border:1px solid #e7e0d6;text-align:left;cursor:pointer}
.loc-now svg{width:14px;height:14px;fill:var(--green);flex:none}
.loc-now b{font-size:11px;font-weight:800;color:var(--stamp-ink)}
.loc-now span{margin-left:auto;font-size:9px;color:var(--green);font-weight:800}
.city-row{display:flex;gap:6px;flex-wrap:wrap}
.city-chip{height:26px;padding:0 11px;border-radius:99px;background:#f1ede7;border:1px solid #e7e0d6;font-size:10.5px;color:#6c5e4f;font-weight:700;cursor:pointer}
.city-chip.on{background:var(--green);border-color:var(--green);color:#fff}
.area-row{display:flex;align-items:center;width:100%;padding:10px 2px;border-bottom:1px solid #efe9de;text-align:left;font-size:11.5px;color:#3c2622;cursor:pointer}
.area-row:last-child{border-bottom:0}
.area-row.on{color:var(--green);font-weight:800}
.area-row em{margin-left:auto;font-style:normal;font-size:9px;color:#a4ada4}
.area-row.on em{color:var(--green)}
.sheet-tip{margin-top:10px;font-size:8.5px;line-height:1.6;color:#a8a19a;background:#f7f3ea;border-radius:8px;padding:8px 9px}

/* 动画 */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:.45;transform:translateY(35px)}}
@keyframes pop{from{opacity:.2;transform:translateY(-48%) scale(.9)}}

/* ---------- 订单明细 ---------- */
.order-page{background:#fff;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.order-head{padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf2ef;background:linear-gradient(180deg,#eaf7ef 0%,#fff 100%);flex:none}
.order-back{height:24px;padding:0 8px;border:0;background:rgba(255,255,255,.7);color:var(--green);font-size:11px;font-weight:800;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.order-title{flex:1;font-size:13px;font-weight:900;color:var(--stamp-ink);text-align:center}
.order-meta{font-size:8.5px;color:#aab5ae}
.order-nav{padding:9px 12px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-bottom:1px solid #edf2ef;background:linear-gradient(180deg,#f5fbf7 0%,#fff 100%)}
.order-nav button{height:28px;border:0;border-radius:9px;background:transparent;color:#7e9388;font-size:11px;font-weight:800;cursor:pointer;padding:0 4px;position:relative}
.order-nav button.on{color:var(--green);background:#eaf6ef}
.order-subnav{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid #edf2ef;background:#fbfdfc}
.order-subnav span{font-size:8.5px;color:#9eaaa3;margin-right:2px}

.order-subnav button.on{border-color:var(--green);background:#edf8f2;color:var(--green)}
.order-list{padding:2px 0 14px}
.order-summary{padding:10px 16px 2px;font-size:9px;line-height:1.5;color:#87978e}
.ob-card{margin:10px 16px;border-radius:15px;background:#fff;border:1px solid #e8efeb;box-shadow:0 4px 14px rgba(23,64,42,.05);padding:12px;display:flex;flex-direction:row;gap:11px;align-items:flex-start;cursor:pointer;outline:none}
.ob-thumb{position:relative;width:72px;height:72px;flex:none;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#e8f2ee,#d8e7e1)}
.ob-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ob-thumb.img-fail img{display:none}
.ob-thumb.img-fail::after{content:attr(data-brand);position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--green)}
.ob-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ob-card:hover,.ob-card:focus-visible{border-color:#b9d9c8;box-shadow:0 7px 18px rgba(23,64,42,.09)}
.ob-head{display:flex;justify-content:space-between;align-items:center}
.ob-badges{display:flex;align-items:center;gap:5px}
.ob-status{font-size:10.5px;font-weight:800}
.ob-title{font-size:12.5px;font-weight:800;line-height:1.38;color:var(--stamp-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ob-type,.ob-plat{height:19px;padding:0 6px;border-radius:5px;font-size:8.5px;font-weight:850;display:grid;place-items:center}
.ob-meta{display:flex;align-items:center;gap:7px;font-size:9px;color:#96a39c}
.ob-meta span+span::before{content:"·";margin-right:7px;color:#c0c9c4}
.ob-points{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid #f0f3f1;font-size:9.5px;color:#75857c}
.ob-points b{font-size:11.5px;font-weight:900;color:var(--green)}
.ob-points b.pending{color:#b5732d}.ob-points b.none{color:#9aa49e}
.ob-chevron{color:#b9c2bd;font-size:15px;line-height:1}
.order-empty{margin:42px 28px;padding:24px 18px;border:1px dashed #dce8e1;border-radius:14px;text-align:center;color:#8b9991;font-size:10.5px;line-height:1.7;background:#fbfdfc}

/* ---------- 单笔订单详情 ---------- */
.detail-title{font-size:16px;font-weight:900;line-height:1.4;color:var(--stamp-ink);margin:1px 2px 12px}
.detail-badges{display:flex;gap:6px;margin-bottom:12px}
.detail-grid{border:1px solid #ebe5dc;border-radius:13px;background:#fff;overflow:hidden}
.detail-row{display:flex;align-items:flex-start;gap:12px;padding:10px 11px;border-bottom:1px solid #f1ece5;font-size:10.5px;line-height:1.5}
.detail-row:last-child{border-bottom:0}
.detail-row dt{width:62px;flex:none;color:#9a928b}.detail-row dd{flex:1;text-align:right;color:#4d433d;font-weight:700;word-break:break-all}
.detail-points{margin-top:11px;padding:12px;border-radius:12px;background:#edf8f2;color:#236b4b;display:flex;align-items:center;justify-content:space-between;font-size:10px}
.detail-points b{font-size:15px}.detail-points.pending{background:#fff7ea;color:#9b651f}.detail-points.none{background:#f4f5f4;color:#7e8782}
.detail-note{margin-top:10px;padding:9px 10px;border-radius:9px;background:#f7f3ea;color:#8e837b;font-size:9px;line-height:1.6}
.detail-actions{margin-top:13px}.detail-actions .btn-primary{max-width:none}

/* ---------- 订阅抽屉 ---------- */
.sub-list{margin:6px 0 0;border:1px solid #e7e0d6;border-radius:12px;overflow:hidden;background:#fff}
.sub-item{padding:10px 12px;border-bottom:1px solid #f3efe9}
.sub-item:last-child{border-bottom:0}
.sub-name{font-size:11.5px;font-weight:800;color:var(--stamp-ink)}
.sub-desc{font-size:9.5px;color:#8f8780;margin-top:3px;line-height:1.5}
.sub-actions{display:flex;gap:8px;margin-top:12px}
.sub-actions .btn-ghost{flex:1}
.sub-actions .btn-primary{flex:1;background:var(--green);color:#fff;font-size:11.5px;font-weight:800;height:40px;border-radius:13px;border:0;cursor:pointer;box-shadow:0 6px 14px rgba(33,132,91,.22)}
.sub-tip{margin-top:10px;font-size:8.5px;line-height:1.6;color:#a8a19a;background:#f7f3ea;border-radius:8px;padding:8px 9px}

/* ---------- 积分到账弹窗 ---------- */
.pa-ring{width:56px;height:56px;border-radius:50%;margin:4px auto 6px;background:linear-gradient(135deg,#43cd8b,#21845b);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;box-shadow:0 6px 20px rgba(33,132,91,.35)}

function productCard(p){

  if(p.priceTag)tags.push('<span class="gb-tag price">'+esc(p.priceTag)+'</span>');
  return '<article class="gb-card" tabindex="0" role="button" data-field-id="FD-GB-CARD" data-act="product" data-name="'+esc(p.n)+'">'
    +'<div class="gb-thumb" data-brand="'+esc(p.b)+'">'

    +'<div class="gb-info">'

    +'<div class="gb-tagrow">'+(tags.join("")||'<span class="gb-tag score">附近可用</span>')+'</div>'
    +'<div class="gb-price"><b><i>¥</i>'+p.p+'</b><s>¥'+p.o+'</s><em>'+off+'折</em></div>'
    +'<div class="gb-meta"><span>'+fmt(p.ps)+' 家门店可用</span></div>'
    +'</div></article>';
}

function frameView(){
  const k=state.currentRoute;
  if(k==="a-auth"){
    return '<div class="mobile-page">'
      +headerView({locating:true})
      +'<div class="page-scroll">'+skeletonCards(4)+'</div>'
      +'</div>'
      +'<div class="modal-mask">'
        +'<div class="modal" style="cursor:auto"><div class="wx-icon">团</div>'
        +'<h2>获取你的位置信息</h2>'
        +'<p>用于为你推荐附近的团购单品，不会用于其他用途。拒绝后仍可手动选择城市。</p>'
        +'<div class="modal-actions"><button class="secondary" data-act="deny">拒绝</button><button class="primary" data-act="allow">允许</button></div>'
        +'</div></div>';
  }
  if(k==="b-locating"){
    return '<div class="mobile-page">'+headerView({locating:true})
      +'<div class="page-scroll">'+skeletonCards(4)+'</div>'
      +'<div class="locating-bar"><div class="pin-pulse">'+SVG.pin+'</div>'
      +'<div><b>正在定位…</b><span>获取附近门店与团购</span></div></div></div>';
  }
  if(k==="c-home-today"){ return '<div class="mobile-page">'+headerView()+listBody()+'</div>'; }
  if(k==="c-home-city"){
    const tmpTab=state.tab; state.tab="city";
    const v='<div class="mobile-page">'+headerView()+listBody()+'</div>';
    state.tab=tmpTab;
    return v;
  }
  if(k==="x-denied"){
    return '<div class="mobile-page">'
      +exceptionHomeView(
        "未获取到你的位置",
        "你还没有允许小程序获取位置。手动选择城市后，同样可以查看该城市的团购单品。",
        ["手动选择城市与商圈","页面会明确展示当前选择","之后仍可重新定位"],
        '<button class="btn-primary" data-act="open-loc">手动选择城市</button><button class="btn-ghost" data-act="relocate">重新授权定位</button>',
        "", true)
      +'</div>';
  }
  if(k==="x-failed"){
    return '<div class="mobile-page">'
      +exceptionHomeView(
        "定位失败，请重试",
        "没能获取到你的位置，可能是系统定位关闭、信号弱或请求超时。",
        ["检查手机定位开关与微信定位权限","换到信号更好的位置后重试","也可以直接手动选择城市"],
        '<button class="btn-primary" data-act="relocate">重新定位</button><button class="btn-ghost" data-act="open-loc">手动选择城市</button>',
        "", true)
      +'</div>';
  }
  if(k==="x-empty"){ return '<div class="mobile-page">'+headerView()+emptyBody()+'</div>'; }
  if(k==="x-error"){ return '<div class="mobile-page">'+headerView()+errorBody()+'</div>'; }

  if(k==="c-order-list"){ return '<div class="mobile-page">'+orderHeaderView()+orderListBody()+'</div>'; }
  if(k==="c-order-detail"){
    return '<div class="mobile-page">'+orderHeaderView()+orderListBody()+'</div>'+orderDetailSheetView();
  }
  if(k==="b-subscribe-drawer"){
    return '<div class="mobile-page">'+headerView()+listBody()+'</div>'
      +subscribeDrawerView();
  }
  if(k==="x-subscribe-rejected"){
    return '<div class="mobile-page">'+headerView()+listBody()+'</div>'+subscribeRejectedModal();
  }
  if(k==="b-points-arrived"){
    return '<div class="mobile-page">'+orderHeaderView()+orderListBody()+'</div>'
      +pointsArrivedModal();
  }

  return '<div class="mobile-page">'+headerView()+listBody()+'</div>';

/* ============================================================
 * ⑪ SHELL RENDERERS —— 严格对齐参考稿的三栏渲染协议
 * ============================================================ */
function go(key, opts){
  state.currentRoute=key;
  state.sheet=(opts&&opts.sheet)||null;
  state.pendingCity=null;
  if(key==="c-home-city")state.tab="city";
  if(key==="c-home-today"||key==="a-auth"||key==="b-locating")state.tab="today";
  state.globalTab=(key==="c-order-list"||key==="c-order-detail"||key==="b-points-arrived")?"mine":"group";
  const frameFlow=FRAMES[key]&&FRAMES[key].flow;
  if(frameFlow)state.activeFlowId=frameFlow;  // frame 切换时同步 rail 高亮
  renderAll();
}
function openSheet(key){state.sheet=key;renderAll();}
function closeSheet(){state.sheet=null;state.pendingCity=null;renderAll();}

function renderScreen(){
  document.getElementById("screen").innerHTML=frameView();
  const r=routeOf(state.currentRoute);
  document.getElementById("stageName").textContent=r.name;
  const sel=document.getElementById("frameSelect");
  let opts="";
  PAGE_TREE.forEach(g=>g.pages.forEach(p=>{
    opts+='<optgroup label="'+p.code+' '+p.name+'">';
    p.frames.forEach(k=>{
      const rr=routeOf(k);
      opts+='<option value="'+k+'" '+(k===state.currentRoute?"selected":"")+'>'+PAD2(rr.id)+' · '+rr.frame+'</option>';
    });
    p.sheets.forEach(k=>{
      const sm=p.sheetMeta[k];
      opts+='<option value="__sheet__:'+k+'" '+(state.sheet===k?"selected":"")+'>·弹层 · '+sm.name+'</option>';
    });
    opts+='</optgroup>';
  }));
  sel.innerHTML=opts;
}

function renderTabbar(){
  document.getElementById("tabbar").innerHTML=tabbarView();
}
function renderSheet(){document.getElementById("sheetRoot").innerHTML=sheetView();}

function renderRail(){
  const root=document.getElementById("railBody");
  let html='<div class="mode-switch">'
    +'<button class="mode-btn '+(state.railMode==="flow"?"on":"")+'" data-modes="flow">流程</button>'
    +'<button class="mode-btn '+(state.railMode==="page"?"on":"")+'" data-modes="page">页面</button></div>';
  if(state.railMode==="flow"){
    FLOWS.forEach(g=>{
      html+='<div class="group-head">'+g.group+'<em>'+g.flows.length+' 条</em></div>';
      g.flows.forEach(f=>{
        const frameFlow=FRAMES[state.currentRoute]&&FRAMES[state.currentRoute].flow;
        const active=(frameFlow||state.activeFlowId)===f.id;
        html+='<button class="rail-item '+(active?"on":"")+'" data-flow="'+f.id+'">'
          +'<span class="rail-dot"></span><span class="rail-name">'+f.summary
          +(f.goal?'<em class="rail-sub">'+f.goal+'</em>':'')+'</span>'
          +'<span class="rail-count">'+f.steps.length+'</span></button>';
      });
    });
  }else{
    PAGE_TREE.forEach(g=>{
      html+='<div class="group-head">'+g.group+'<em>'+g.pages.length+' 页</em></div>';
      g.pages.forEach(p=>{
        const on=p.frames.includes(state.currentRoute)||p.sheets.includes(state.sheet);
        html+='<button class="page-item '+(on?"on":"")+'" data-page="'+p.code+'">'
          +'<span class="page-code">'+p.code+'</span>'
          +'<span class="rail-name">'+p.name+'<em class="rail-sub">'+p.frames.length+' 帧 · '+p.sheets.length+' 弹层</em></span>'
          +'<span class="rail-count">'+p.frames.length+'</span></button>';
      });
    });
  }
  root.innerHTML=html;
}

function pageByCode(code){for(const g of PAGE_TREE){for(const p of g.pages){if(p.code===code)return p;}}return null;}
function pageForCurrent(){for(const g of PAGE_TREE){for(const p of g.pages){if(p.frames.includes(state.currentRoute)||p.sheets.includes(state.sheet))return p;}}return null;}

function renderFlowCol(){
  const title=document.getElementById("flowTitle");
  const sub=document.getElementById("flowSub");
  const root=document.getElementById("flowBody");
  if(state.railMode==="flow"){
    let f=flowById(state.activeFlowId);
    if(!f)f=FLOWS[0].flows[0];
    if(!f){root.innerHTML="";return;}
    title.textContent=f.summary||"";
    sub.textContent=f.goal||"";
    const stepIndex=state.currentRoute&&FRAMES[state.currentRoute]&&FRAMES[state.currentRoute].flow===f.id?FRAMES[state.currentRoute].stepIndex:-1;
    root.innerHTML=f.steps.map((s,i)=>
      (i?'<div class="flow-arrow"></div>':"")
      +'<div class="step '+(i===stepIndex?"on":"")+' '+(s.ext?"ext":"")+'" data-step="'+i+'" data-flow="'+f.id+'">'
      +'<div class="step-index">'+PAD2(i+1)+'</div>'
      +'<div><div class="step-title">'+s.title+'</div>'
      +(s.sub?'<div class="step-sub">'+s.sub+'</div>':'')+'</div></div>'
    ).join("");
  }else{
    const p=pageForCurrent()||PAGE_TREE[0].pages[0];
    title.textContent=p.code+" "+p.name;
    sub.textContent=p.frames.length>1?"同一路由 · "+p.frames.length+" 个状态帧":p.frames.length+" 帧页面";
    let html="";
    html+='<div class="section-label">STATES / 同一页面的帧</div>';
    html+=p.frames.map((k,i)=>{
      const meta=p.frameMeta[k];
      const rr=routeOf(k);
      return '<div class="step '+(state.currentRoute===k&&!state.sheet?"on":"")+'" data-page-route="'+k+'">'
        +'<div class="step-index">'+PAD2(i+1)+'</div>'
        +'<div><div class="step-title">'+(meta?meta.name:rr.frame)+'</div></div></div>';
    }).join("");
    if(p.sheets.length){
      html+='<div class="section-label">SHEETS · 本页弹层</div>';
      html+=p.sheets.map(k=>{
        const sm=p.sheetMeta[k];
        return '<div class="step '+(state.sheet===k?"on":"")+'" data-page-sheet="'+k+'">'
          +'<div class="step-index" style="border-style:dashed">▸</div>'
          +'<div><div class="step-title">'+(sm?sm.name:k)+'</div></div></div>';
      }).join("");
    }
    root.innerHTML=html;
  }
}

function renderNotes(){
  const key=state.sheet?state.sheet:state.currentRoute;
  let n=NOTES[state.currentRoute]||{status:"说明",sections:[{h:"页面",rows:[routeOf(state.currentRoute).name]}]};
  if(state.sheet)n=NOTES[state.sheet]||n;
  document.getElementById("noteStatus").textContent=n.status;

function renderAll(){renderScreen();renderTabbar();renderSheet();renderRail();renderFlowCol();renderNotes();}

/* ============================================================
 * ⑫ toast & 状态辅助
 * ============================================================ */
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("on"),1900);
}

function startLocating(){
  clearTimeout(timer);
  state.currentRoute="b-locating";
  state.sheet=null;
  state.pendingCity=null;
  state.activeFlowId="F-MAIN";
  state.globalTab="group";
  renderAll();
  timer=setTimeout(()=>{
    state.currentRoute="c-home-today";
    state.city="北京";state.area="国贸";state.tab="today";
    state.activeFlowId="F-MAIN";
    renderAll();
    toast("定位成功：北京·国贸");
  },1500);
}

/* ============================================================
 * ⑬ EVENT DELEGATION
 * ============================================================ */
document.addEventListener("click",e=>{
  // rail 模式切换：流程 / 页面
  const modeEl=e.target.closest("[data-modes]");
  if(modeEl){
    state.railMode=modeEl.dataset.modes;
    renderRail();
    renderFlowCol();
    return;
  }
  // flowcol step 点击 → 切换帧
  const stepEl=e.target.closest("[data-step]");
  if(stepEl){
    const f=flowById(stepEl.dataset.flow||FLOWS[0].flows[0].id);
    const idx=Number(stepEl.dataset.step);
    let frameKey=null, openSheetKey=null;
    const map={
      "F-MAIN":     [ ["a-auth",null], ["b-locating",null], ["c-home-today",null], ["c-home-today","c2-sheet"], ["c-home-city",null] ],
      "F-MAIN2":    [ ["b-subscribe-drawer",null], ["x-subscribe-rejected",null], ["b-points-arrived",null], ["c-order-list",null], ["c-order-detail",null] ],
      "F-ERR-AUTH": [ ["x-denied",null], ["x-failed",null] ],
      "F-ERR-API":  [ ["x-empty",null], ["x-error",null] ]
    };
    if(f&&map[f.id]&&map[f.id][idx]){
      frameKey=map[f.id][idx][0];
      openSheetKey=map[f.id][idx][1];
    }
    if(frameKey){go(frameKey,{sheet:openSheetKey||null});state.activeFlowId=f.id;renderAll();}
    return;
  }
  // flow rail 点击 → 切换 activeFlowId，同时跳到该 flow 的代表帧
  const flowRailEl=e.target.closest("[data-flow]");
  if(flowRailEl){
    const fid=flowRailEl.dataset.flow;
    let target=null;
    for(const k of Object.keys(FRAMES)){
      if(FRAMES[k].flow===fid){target=k;break;}
    }
    if(target){go(target);state.activeFlowId=fid;renderAll();}
    return;
  }
  // rail page 点击 → 跳到该页首帧
  const pageRailEl=e.target.closest("[data-page]");
  if(pageRailEl){
    const p=pageByCode(pageRailEl.dataset.page);
    if(p&&p.frames[0])go(p.frames[0]);
    return;
  }
  // page mode flowcol step 点击
  const routeStepEl=e.target.closest("[data-page-route]");
  if(routeStepEl){go(routeStepEl.dataset.pageRoute);return;}
  const sheetStepEl=e.target.closest("[data-page-sheet]");
  if(sheetStepEl){openSheet(sheetStepEl.dataset.pageSheet);return;}

  // 业务 data-act
  const actEl=e.target.closest("[data-act]");
  if(!actEl)return;
  const act=actEl.dataset.act;

  if(act==="allow"){startLocating();return;}
  if(act==="deny"){clearTimeout(timer);state.activeFlowId="F-ERR-AUTH";go("x-denied");return;}
  if(act==="relocate"){startLocating();return;}
  if(act==="retry-api"){startLocating();return;}
  if(act==="open-loc"){state.sheet="c2-sheet";state.pendingCity=state.city;renderAll();return;}
  if(act==="close-sheet"){closeSheet();return;}
  if(act==="back-home"){state.activeFlowId="F-MAIN";go("c-home-today");return;}
  if(act==="city"){state.pendingCity=actEl.dataset.city;renderSheet();renderRail();renderFlowCol();return;}
  if(act==="area"){
    state.city=state.pendingCity||state.city;
    state.pendingCity=null;
    state.area=actEl.dataset.area;
    state.sheet=null;
    state.currentRoute=EMPTY_AREAS[state.area]?"x-empty":(state.tab==="city"?"c-home-city":"c-home-today");
    state.activeFlowId=EMPTY_AREAS[state.area]?"F-ERR-API":"F-MAIN";
    renderAll();
    toast(EMPTY_AREAS[state.area]?"该商圈暂无团购":"已切换到 "+state.city+"·"+state.area);
    return;
  }
  if(act==="all-city"){
    state.pendingCity=null;state.area="全城";state.currentRoute=state.tab==="city"?"c-home-city":"c-home-today";state.activeFlowId="F-MAIN";
    renderAll();toast("已切换到 "+state.city+"·全城");return;
  }
  if(act==="tab"){state.tab=actEl.dataset.tab;state.currentRoute=state.tab==="city"?"c-home-city":"c-home-today";state.activeFlowId="F-MAIN";renderAll();return;}
  if(act==="product"){
    state.pendingProductName=actEl.dataset.name||null;
    state.activeFlowId="F-MAIN2";
    go("b-subscribe-drawer");
    return;
  }
  if(act==="global-tab"){
    const t=actEl.dataset.tab;
    if(t==="mine"){go("c-order-list");return;}
    if(t==="group"){go("c-home-today");return;}
    toast("本轮仅优化「团购」和「我的」");
    return;
  }

  // —— F-MAIN2 订阅链路 ——
  if(act==="subscribe-allow"){
    go("c-home-today");
    toast("到账提醒已开启 · 继续前往美团");
    return;
  }
  if(act==="subscribe-deny"){
    state.activeFlowId="F-MAIN2";
    go("x-subscribe-rejected");
    return;
  }
  if(act==="subscribe-back"){go("c-home-today");return;}
  if(act==="continue-external"){go("c-home-today");toast("继续前往美团");return;}
  if(act==="points-dismiss"){go("c-order-list");return;}
  if(act==="points-open-order"){
    state.selectedOrderId="MT-GB-20261105-1830";
    go("c-order-detail");
    return;
  }

  // —— 订单明细：业务类型与外卖平台筛选 ——
  if(act==="order-filter"){
    state.orderFilter=actEl.dataset.f;
    if(state.orderFilter!=="takeout")state.orderPlatformFilter="all";
    renderAll();
    return;
  }
  if(act==="order-platform-filter"){state.orderPlatformFilter=actEl.dataset.p;renderAll();return;}
  if(act==="order-detail"){
    state.selectedOrderId=actEl.dataset.orderId;
    go("c-order-detail");
    return;
  }
  if(act==="order-detail-close"){go("c-order-list");return;}

  if(act==="noop")return;
});

document.addEventListener("change",e=>{
  if(e.target.id==="frameSelect"){
    const v=e.target.value;
    if(v.startsWith("__sheet__:")){openSheet(v.slice(10));}
    else{go(v);}
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(state.currentRoute==="c-order-detail")go("c-order-list");
    else if(state.sheet)closeSheet();
  }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[data-act="order-detail"],[data-act="product"]'))e.target.click();
});

// 初始化 activeFlowId 到主链路
state.activeFlowId="F-MAIN";
renderAll();

/* ============================================================
 * R3 交付约束
 * - 手机预览只出现用户可理解的字段与状态。
 * - 订单采用“业务类型 → 平台”两层分类；类型不可缺省。
 * - 团购状态使用用户文案，不在 C 端暴露券状态码。
 * - 外部下单与异步到账不在原型中用定时器伪造。
 * - inspector 只记录可见字段、交互验收与待确认项。
 * ============================================================ */
</script>
