<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小喵生活图鉴 · 交互稿</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
button,select{font:inherit}
button{color:inherit}

.app{display:grid;grid-template-columns:232px 300px minmax(560px,1fr);height:100vh}

.rail-body,.flow-body{flex:1;min-height:0;overflow:auto;padding:10px 10px 24px;scrollbar-width:thin}

.group-head em{margin-left:auto;font:400 9px var(--mono);color:#aaa;font-style:normal}
.rail-item,.page-item{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;font-size:12px;color:#555}

.rail-dot{width:5px;height:5px;border-radius:50%;background:#ccc;flex:none}.on .rail-dot{background:#191919}

.rail-count,.page-code{font:9px var(--mono);color:#aaa}
.flow-title{font-size:12.5px;font-weight:800;letter-spacing:.05em}

.step{display:flex;gap:9px;padding:8px;border-radius:8px;cursor:pointer}

.step.on .step-index{background:#191919;color:#fff;border-color:#191919}
.step.ext .step-index{border-style:dashed}.step-title{font-size:11.5px;font-weight:700;line-height:1.35}.step-sub{font-size:9.5px;color:#aaa;margin-top:2px;line-height:1.45}
.flow-arrow{height:12px;border-left:1px dashed #ddd;margin-left:19px}
.section-label{margin:16px 8px 7px;font:700 9px var(--mono);letter-spacing:.16em;color:#aaa}

.stage{min-width:0;overflow:auto;display:flex;justify-content:center;align-items:center;gap:18px;padding:18px 22px}
.stage-main{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}

.stage-name{display:flex;align-items:center;gap:7px;min-width:0}.stage-name i{width:5px;height:5px;border-radius:50%;background:#171615}
.frame-select{max-width:222px;border:1px solid #ddd9d5;border-radius:7px;background:#fff;padding:6px 7px;font-size:10px;color:#34312e;outline:none}
.phone{width:392px;height:min(820px,calc(100vh - 88px));min-height:650px;border-radius:44px;background:var(--stamp-bg);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 45px rgba(0,0,0,.13);overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:39px;padding:14px 25px 0;display:flex;align-items:center;justify-content:space-between;flex:none;font:700 10px var(--mono);z-index:8}
.status-icons{display:flex;gap:4px;align-items:center}.status-icons i{display:block;width:4px;height:4px;border-radius:50%;background:#1f1e1c}.status-icons b{width:18px;height:9px;border:1.5px solid #1f1e1c;border-radius:3px;display:block;margin-left:4px;position:relative}.status-icons b::after{content:"";position:absolute;inset:1px;background:#1f1e1c;border-radius:1px}
#screen{flex:1;min-height:0;display:flex;position:relative}.mobile-page{flex:1;min-width:0;max-width:100%;min-height:0;display:flex;flex-direction:column;position:relative;color:var(--stamp-ink);background:var(--stamp-bg)}
.paper-bg{background-color:var(--stamp-bg);background-image:radial-gradient(rgba(91,66,42,.035) .8px,transparent .8px),radial-gradient(rgba(255,255,255,.55) 1px,transparent 1px);background-size:13px 13px,19px 19px;background-position:0 0,6px 8px}
.page-scroll{flex:1;min-width:0;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 22px}.page-scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.product-top{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.round-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.62);box-shadow:0 4px 14px rgba(79,58,35,.05);border-radius:13px;display:grid;place-items:center;cursor:pointer;font-size:16px}
.product-title{flex:1;text-align:center;font-size:17px;font-weight:850;letter-spacing:.03em}.top-spacer{width:34px}
.stamp-switch{display:flex;margin:2px 16px 10px;padding:3px;background:rgba(255,255,255,.58);border:1px solid rgba(225,218,207,.9);border-radius:12px;flex:none}
.stamp-switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 5px;font-size:11px;color:#978e87;cursor:pointer}.stamp-switch button.on{background:#fff;color:var(--stamp-ink);font-weight:800;box-shadow:0 2px 8px rgba(69,46,25,.08)}
.today{text-align:center;padding:9px 0 15px}.today h1{font-size:34px;letter-spacing:.06em;font-weight:850}.today p{margin-top:7px;color:var(--stamp-muted);font-size:13px}
.calendar-card{background:rgba(255,255,255,.88);border:1px solid rgba(236,230,221,.9);border-radius:24px;padding:18px 13px 15px;box-shadow:0 10px 26px rgba(83,61,38,.055)}
.week-row,.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week-row{margin-bottom:12px}.week-row span{text-align:center;font-size:9.5px;color:#a09a94;font-weight:700}.day-grid{grid-auto-rows:43px}.day{position:relative;border:0;border-radius:14px;background:var(--stamp-cell);color:var(--stamp-ink);display:grid;place-items:center;font:500 12px var(--mono);cursor:pointer;overflow:visible}.day.blank{background:transparent;pointer-events:none}.day.today-cell{background:var(--stamp-accent);color:#fff;font-weight:800}.day.has-record{background:#fff;box-shadow:0 2px 8px rgba(63,43,24,.08)}.day.has-record img{width:35px;height:35px;object-fit:cover;border-radius:10px}.day .day-num{position:absolute;left:4px;top:3px;font:700 7px var(--mono);background:rgba(255,255,255,.82);border-radius:4px;padding:1px 3px;color:#6c5650}.day-count{position:absolute;right:-4px;top:-5px;width:18px;height:18px;border-radius:50%;background:#e4ae6d;color:#fff;display:grid;place-items:center;font:800 9px var(--mono);box-shadow:0 2px 6px rgba(72,42,12,.16)}
.month-section{margin-top:13px;display:grid;grid-template-columns:1.16fr .84fr;gap:10px}.month-summary,.album-entry{min-height:125px;border:0;background:rgba(255,255,255,.88);border-radius:22px;padding:16px;box-shadow:0 9px 24px rgba(76,53,31,.05);cursor:pointer;text-align:left;position:relative;overflow:hidden}.month-summary small{color:var(--stamp-muted);font-size:11px;font-weight:700}.month-total{margin-top:10px;display:flex;align-items:baseline;gap:5px}.month-total b{font:800 34px var(--mono)}.month-total span{font-size:12px;color:var(--stamp-muted)}.month-shops{margin-top:7px;color:var(--stamp-muted);font-size:11px}.month-summary img{position:absolute;right:10px;bottom:6px;width:70px;height:86px;object-fit:cover;border-radius:16px;transform:rotate(-3deg);box-shadow:0 4px 13px rgba(0,0,0,.1)}
.album-entry{display:flex;flex-direction:column;justify-content:flex-end}.album-stack{position:absolute;inset:13px 12px 43px}.album-stack img{position:absolute;width:62px;height:66px;object-fit:cover;border:4px solid #fff;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1)}.album-stack img:first-child{left:7px;top:4px;transform:rotate(-7deg)}.album-stack img:last-child{right:4px;top:10px;transform:rotate(8deg)}.album-entry span{font-size:10.5px;color:var(--stamp-muted);font-weight:700}.album-entry b{font-size:12px;margin-top:2px}
.source-tip{margin:12px 2px 0;display:flex;align-items:flex-start;gap:8px;font-size:9.5px;line-height:1.55;color:#9d958d}.source-tip i{font-style:normal;width:17px;height:17px;border-radius:50%;background:#ede6da;display:grid;place-items:center;flex:none;color:#7c6c5d;font-size:9px}
.global-tabs{height:62px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,248,.96);border-top:1px solid var(--stamp-line);padding:6px 8px 8px;z-index:10}.global-tabs button{border:0;background:transparent;border-radius:13px;color:#9d958f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8.5px;cursor:pointer}.global-tabs button.on{color:var(--stamp-accent);background:#f4ede3;font-weight:800}.global-tabs .ico{font-size:17px;line-height:1}
.badge-summary{text-align:center;padding:12px 0 15px}.badge-summary h1{font-size:26px;letter-spacing:.04em}.badge-summary p{margin-top:10px;color:var(--stamp-muted);font-size:11px}.badge-summary p b{color:var(--stamp-ink)}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:0 2px 20px}.badge-card{border:0;background:transparent;min-height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.stamp-art{width:132px;height:132px;border:3px solid var(--c,#1686b8);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--c,#1686b8);transform:rotate(var(--r,-3deg));background:rgba(255,255,255,.27);position:relative}.stamp-art::before{content:"";position:absolute;inset:6px;border:1px dashed currentColor;border-radius:50%;opacity:.55}.stamp-art .emoji{font-size:42px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.08))}.stamp-art .badge-img{width:54px;height:54px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.07))}.stamp-art strong{font-size:11px;max-width:88px;text-align:center;line-height:1.2;position:relative;z-index:1}.stamp-art time{font:700 9px var(--mono);letter-spacing:.07em;position:relative;z-index:1}.stamp-art.locked{filter:grayscale(1);opacity:.35;border-style:dashed}.stamp-art.locked time{display:none}.badge-progress{position:absolute;bottom:3px;left:20px;right:20px;height:4px;background:#e5dfd7;border-radius:99px;overflow:hidden}.badge-progress i{display:block;height:100%;background:#afa49a;border-radius:99px}.badge-filter-row{display:flex;justify-content:center;gap:6px;margin-bottom:13px}.filter-chip{border:1px solid var(--stamp-line);background:rgba(255,255,255,.65);padding:6px 10px;border-radius:99px;font-size:9.5px;color:var(--stamp-muted);cursor:pointer}.filter-chip.on{background:var(--stamp-ink);border-color:var(--stamp-ink);color:#fff}
.gallery-page{background:#f1eee8}.gallery-head{display:flex;align-items:center;padding:0 16px 9px}.gallery-head h1{flex:1;text-align:center;font-size:20px}.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 10px;padding:10px 15px 28px}.polaroid{border:0;background:#fff;padding:8px 8px 12px;border-radius:5px;box-shadow:0 5px 12px rgba(55,45,36,.12);text-align:left;cursor:pointer;transform:rotate(var(--rot,0deg))}.polaroid img{width:100%;height:150px;object-fit:cover;display:block;background:#eee}.polaroid strong{display:block;font-size:10.5px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.polaroid time{display:block;font:9px var(--mono);color:#999;margin-top:3px}.gallery-empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:#aaa;font-size:12px}
.detail-hero{height:260px;margin:0 16px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(68,48,29,.1)}.detail-hero img{width:100%;height:100%;object-fit:cover}.detail-body{padding:18px 19px 28px}.detail-kicker{display:flex;align-items:center;gap:6px;color:#8f8780;font-size:10px}.platform-dot{width:18px;height:18px;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}.platform-dot.eleme{background:#1677ff}.platform-dot.meituan{background:#ffd000;color:#352e00}.detail-body h1{font-size:22px;margin-top:12px}.detail-meta{margin-top:9px;color:#8e8580;font-size:11px}.detail-rows{margin-top:18px;background:rgba(255,255,255,.72);border:1px solid var(--stamp-line);border-radius:16px;padding:4px 14px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--stamp-line);font-size:10.5px}.detail-row:last-child{border:0}.detail-row span{color:#999}.detail-row b{font-weight:700;text-align:right}.favorite-btn{width:100%;height:42px;border:0;border-radius:13px;margin-top:14px;background:var(--stamp-ink);color:#fff;font-weight:800;cursor:pointer}
.placeholder-page{background:#faf9f6;align-items:center;justify-content:center;text-align:center;padding:30px}.placeholder-icon{width:64px;height:64px;border-radius:22px;background:#f0ece5;display:grid;place-items:center;font-size:28px}.placeholder-page h1{font-size:20px;margin-top:18px}.placeholder-page p{font-size:11px;line-height:1.7;color:#999;margin-top:8px;max-width:240px}
.external-page{background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}.external-mark{width:68px;height:68px;border:1px dashed #bbb;border-radius:23px;display:grid;place-items:center;font-size:28px}.external-page h1{font-size:19px;margin-top:19px}.external-page p{font-size:11px;line-height:1.7;color:#999;margin-top:8px}.external-card{width:100%;margin-top:20px;border:1px solid #eee;border-radius:16px;padding:15px;text-align:left}.external-row{display:flex;justify-content:space-between;padding:7px 0;font-size:10.5px}.external-row span{color:#999}.simulate-btn{width:100%;height:44px;border:0;border-radius:13px;background:#171615;color:#fff;font-weight:800;margin-top:16px;cursor:pointer}
#sheetRoot{position:absolute;inset:0;z-index:30;pointer-events:none}.mask{position:absolute;inset:0;background:rgba(29,22,17,.35);pointer-events:auto;animation:fade .18s ease both}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--stamp-paper);border-radius:26px 26px 0 0;padding:10px 16px 26px;pointer-events:auto;animation:rise .24s cubic-bezier(.2,.8,.25,1) both}.sheet-handle{width:34px;height:4px;border-radius:4px;background:#d7d0c8;margin:2px auto 16px}.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:0 2px 14px}.sheet-title{flex:1;text-align:center}.sheet-title h2{font-size:22px}.sheet-title p{font-size:11px;color:var(--stamp-muted);margin-top:7px}.sheet-close{width:30px;height:30px;border:0;border-radius:11px;background:#f1ede7;color:#8f8780;cursor:pointer}.sheet-spacer{width:30px}.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.record-card{border:0;background:#fff;border-radius:18px;padding:8px 8px 11px;box-shadow:0 4px 13px rgba(61,44,28,.06);text-align:left;cursor:pointer;position:relative}.record-card img{width:100%;height:116px;object-fit:cover;border-radius:14px}.record-card strong{display:block;font-size:11px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-card time{font:9px var(--mono);color:#999;display:block;margin-top:4px}.record-star{position:absolute;right:12px;top:12px;width:24px;height:24px;border:0;border-radius:9px;background:rgba(255,255,255,.88);font-size:15px;cursor:pointer}.month-list-empty{padding:55px 18px;text-align:center;color:#aaa;font-size:11px}.month-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.month-option{border:1px solid var(--stamp-line);background:#fff;padding:10px 5px;border-radius:12px;font-size:10.5px;cursor:pointer}.month-option.on{background:var(--stamp-ink);color:#fff;border-color:var(--stamp-ink)}
.month-option.future{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.month-option b{display:block;font-size:11px;font-weight:750}
.month-option small{display:block;font-size:9px;margin-top:5px;opacity:.72;font-family:var(--mono)}
.month-option.on small{opacity:.85}
.month-option.none{opacity:.42;cursor:not-allowed;background:#f7f5f2;color:#8f8780}
.month-option.none small{font-family:inherit}
.modal-mask{position:absolute;inset:0;background:rgba(20,15,11,.5);pointer-events:auto;animation:fade .18s ease both}.modal{position:absolute;left:38px;right:38px;top:50%;transform:translateY(-50%);background:var(--stamp-paper);border-radius:25px;padding:24px 20px;text-align:center;pointer-events:auto;box-shadow:0 18px 50px rgba(0,0,0,.22);animation:pop .25s cubic-bezier(.2,.8,.25,1) both}.unlock-stamp{width:130px;height:130px;margin:0 auto;border:4px solid var(--stamp-accent);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--stamp-accent);transform:rotate(-5deg);position:relative}.unlock-stamp::after{content:"";position:absolute;inset:7px;border:1px dashed currentColor;border-radius:50%}.unlock-stamp b{font-size:42px}.unlock-stamp span{font-size:13px;font-weight:900}.modal h2{font-size:20px;margin-top:19px}.modal p{font-size:11px;color:#999;line-height:1.65;margin-top:8px}.modal-actions{display:flex;gap:8px;margin-top:19px}.modal-actions button{flex:1;border:0;height:42px;border-radius:13px;font-size:11px;font-weight:800;cursor:pointer}.modal-actions .secondary{background:#f0ece6;color:#776f68}.modal-actions .primary{background:var(--stamp-ink);color:#fff}
/* 记录中 / 记录成功：下单双时点告知，暖白底 + 单一绿色强调，无渐变发光 */
.rec-ring{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;border:2px solid var(--green)}
.rec-ring span{font-size:27px;font-weight:800;color:var(--green);line-height:1}
.rec-ring.pending span{animation:lagPulse 1.6s ease-in-out infinite}
.rec-kicker{margin-top:18px;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--green)}
.modal.rec-notice h2{margin-top:7px}
.rec-foot{margin-top:15px;padding-top:13px;border-top:1px solid var(--stamp-line);font-size:9.5px;color:#a49c94;line-height:1.5}

.sheet.rec-drawer .rec-thumb{width:100%;height:140px;object-fit:cover;border-radius:16px;display:block;margin-bottom:16px}
.sheet.rec-drawer .rec-thumb.pending{border:2px dashed var(--green);opacity:.62}
.rec-drawer-desc{font-size:11.5px;color:#6f675f;line-height:1.7;margin:0 2px}
.rec-drawer .rec-foot{margin-top:14px}
.rec-drawer .modal-actions button{height:44px}
/* C3 多单抽屉：登记中/已登记 两张卡的状态区分 */
.record-card.pending img{border:2px dashed var(--green);opacity:.62}
.rec-state-tag{position:absolute;left:14px;top:14px;padding:2px 6px;border-radius:6px;font-size:8px;font-weight:800;color:#fff;background:var(--green)}
.rec-state-tag.pending{background:#c9a227}
.record-card .rec-foot{margin-top:10px;padding-top:9px}

/* ---- ⑪ 参考图对齐 + 系统兜底状态 ---- */
/* 今天且有记录：优先级高于“多条记录”，用橙色描边表达今日态 */
.day.has-record.today-cell{background:#fff;box-shadow:0 0 0 2px var(--stamp-accent),0 4px 12px rgba(63,43,24,.12)}

.day.syncing .day-num{background:transparent;color:#b08a55}
/* 日期格子状态切换器 */

.cell-demo-chip b{font:800 9px var(--mono);color:#6f675f}.cell-demo-chip span{font-size:7px;white-space:nowrap;transform:scale(.92)}
.cell-demo-chip.on{background:var(--stamp-ink);border-color:var(--stamp-ink)}.cell-demo-chip.on b,.cell-demo-chip.on span{color:#fff}
.cell-demo-foot{margin-top:8px;font-size:8.5px;color:#aaa;text-align:center}.cell-demo-reset{border:0;background:transparent;color:var(--stamp-accent);font-size:9px;font-weight:700;cursor:pointer}

.day.has-record.demo-focus{background:#fff}
.day.demo-b{background:var(--stamp-accent);color:#fff;font-weight:800}
.demo-cell-tag{position:absolute;right:-4px;bottom:-6px;z-index:2;padding:1px 3px;border-radius:4px;background:var(--stamp-ink);color:#fff;font:800 7px var(--mono);box-shadow:0 2px 5px rgba(0,0,0,.16)}

.day.has-record img.pending{border:1.5px dashed var(--green);opacity:.6;border-radius:10px;padding:1px}
/* 相册入口：照片堆收在上半区，底部文案留出干净白底 */
.album-entry{min-height:140px}
.album-stack{inset:12px 10px 64px}
.album-stack img{width:54px;height:58px}
.album-entry::after{content:"";position:absolute;left:0;right:0;bottom:0;height:66px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.96) 48%);border-radius:0 0 22px 22px;z-index:1}

.record-card{text-align:center;padding:13px 10px 14px}

.tag-wall-head{text-align:center;padding:6px 0 4px}

.tag-card{position:relative;min-width:0;border:1px solid rgba(60,38,34,.07);background:rgba(255,255,255,.62);border-radius:15px;padding:13px 9px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(120,95,60,.04)}

.pts-banner-art h3 u{position:absolute;left:-4px;bottom:-9px;width:126px;height:9px;border-radius:6px;background:rgba(255,255,255,.55);text-decoration:none;transform:rotate(-2deg)}
.pts-banner-art img{position:absolute;right:6px;bottom:-18px;width:118px;height:118px;object-fit:cover;border-radius:16px;transform:rotate(6deg);box-shadow:0 10px 20px rgba(6,62,34,.22)}
.pts-banner-art img.second{right:74px;bottom:-24px;width:84px;height:84px;transform:rotate(-8deg);border-radius:14px}
.pts-banner-foot{padding:11px 13px 12px;display:flex;align-items:center;gap:10px}
.pts-banner-foot b{display:block;font-size:12.5px;font-weight:900;letter-spacing:-.3px}
.pts-banner-foot small{display:block;margin-top:5px;font-size:9px;color:#9ba49e}
.pts-banner-btn{margin-left:auto;flex:none;height:30px;padding:0 14px;border:0;border-radius:99px;background:#37BC7C;color:#fff;font-size:11px;font-weight:850;cursor:pointer}
.pts-checkin{text-align:center}
.pts-checkin-coin{width:74px;height:74px;margin:0 auto;border-radius:50%;background:linear-gradient(150deg,#FFD97A,#FFA92E);display:grid;place-items:center;font-size:26px;font-weight:900;color:#8A5000;box-shadow:0 10px 22px rgba(214,146,32,.3);position:relative}
.pts-checkin-coin::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(255,255,255,.75);border-radius:50%}
.pts-checkin-add{margin-top:15px;font-size:12px;color:#8b968f}
.pts-checkin-add b{font-size:19px;color:#1C9A5F;font-weight:900;margin-left:2px}
.pts-checkin .modal-actions{margin-top:18px}
.pts-checkin .modal-actions .primary{background:#2FB271}

/* ── 获得印章抽屉 v2（2026-11-17 按 ASCII 稿重做）：
      图为主、字为辅，无渐变无发光无浮层阴影；绿是唯一强调色 ── */
.sheet.seal-gain{background:#FFFCF6;text-align:center;padding-bottom:22px}
.gain-art{width:148px;height:148px;margin:6px auto 12px;animation:gainIn .45s cubic-bezier(.2,.8,.3,1.15) both}
.gain-art img{width:100%;height:100%;object-fit:contain}
.gain-kicker{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-indent:.18em;color:#2FA36B}
.gain-title{font-size:22px;font-weight:900;letter-spacing:.04em;color:#2B211C;margin:8px 0 0}
.gain-desc{font-size:11px;color:#8F857B;margin:9px 0 0}
.gain-divider{height:1px;background:rgba(60,38,34,.12);margin:18px 6px 12px}
.gain-next-label{font-size:9px;font-weight:700;letter-spacing:.16em;color:#B3A99C;text-align:left;padding:0 6px;margin-bottom:8px}
.gain-next{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:8px 6px;border-radius:12px;text-align:left;cursor:pointer}
.gain-next:active{background:rgba(47,163,107,.07)}
.gain-next img{width:36px;height:36px;flex:none;object-fit:contain}
.gain-next div{flex:1;min-width:0}
.gain-next b{display:block;font-size:11.5px;color:#2B211C}
.gain-next span{display:block;font-size:9.5px;color:#A29889;margin-top:2px}
.gain-next i{font-style:normal;font-size:15px;font-weight:700;color:#2FA36B;flex:none}
.gain-next.as-note{justify-content:center;cursor:default;padding:9px 6px}
.gain-next.as-note span{margin:0;font-size:10px;color:#A29889;letter-spacing:.04em}
.gain-next.as-note b{display:inline;color:#2FA36B;font-size:11px}
.gain-next.as-note:active{background:transparent}
@keyframes gainIn{0%{transform:translateY(-14px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.gain-art{animation:none}}
.seal-gain .modal-actions{margin-top:18px}
.seal-gain .modal-actions .primary{height:44px;font-size:12px}

/* ── 主流程 A：图鉴开张 / 露脸的小喵到手（2026-11-17 改两抽屉） ── */
.first-seal{padding-top:20px}
.sheet.first-seal{text-align:center}
.sheet.first-seal h2{margin:0}
.sheet.first-seal p{margin:8px 0 0;text-align:center}
.newbie-sheet .modal-actions{margin-top:16px}
/* 头像昵称输入器 */
.avatar-row{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:13px;background:#f8f4ec;border:1px dashed #ddd0bc;text-align:left}
.avatar-frame{width:52px;height:52px;flex:none;border-radius:50%;border:2.5px solid var(--stamp-line);background:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;color:#b3a797}
.avatar-frame.picked{color:var(--stamp-ink);border-color:#b8453a}
.avatar-row b{font-size:11.5px;color:var(--stamp-ink);display:block}
.avatar-row small{font-size:9.5px;color:#b3a797;display:block;margin-top:3px}
.nick-label{flex:none;width:62px}
.avatar-field{margin-top:11px;text-align:left}
.avatar-field label{display:flex;align-items:baseline;gap:7px;font-size:10.5px;font-weight:700;color:var(--stamp-ink);margin-bottom:6px}
.avatar-field label small{font-size:9px;font-weight:400;color:#b3a797}
.avatar-field .nick-input{width:100%}
.nick-input{flex:1;min-width:0;height:40px;border:1.5px solid var(--stamp-line);border-radius:11px;padding:0 11px;font-size:12px;background:#fff;color:var(--stamp-ink)}
.nick-input:focus{outline:none;border-color:#b8453a}
/* 印章猫耳：全库章面加两只耳朵，图鉴即小饭喵猫谱 */
.tag-seal::before,.tag-seal::after{content:"";position:absolute;top:-8px;width:15px;height:13px;background:var(--tint,#1686b8);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.tag-seal::before{left:9px;transform:rotate(-14deg)}
.tag-seal::after{right:9px;transform:rotate(14deg)}
/* 到手章的猫耳（.seal-drop::after 已被墨迹外扩占用，用内部元素画） */
.seal-drop .ear{position:absolute;top:-8px;width:19px;height:16px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:0}
.seal-drop .ear.l{left:15px;transform:rotate(-15deg)}
.seal-drop .ear.r{right:15px;transform:rotate(15deg)}
.seal-drop{position:relative;width:104px;height:104px;margin:0 auto 9px;display:grid;place-items:center;border-radius:50%;
  border:3.5px solid #b8453a;color:#b8453a;background:#fff7f4;font:900 40px/1 var(--sans);letter-spacing:0;
  animation:sealDrop .66s cubic-bezier(.18,1.5,.4,1) both}
.seal-drop::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #b8453a;opacity:0;
  animation:inkSpread .95s ease-out .4s both}
.seal-drop.gain{border-color:#b8651f;color:#b8651f;background:#fffaf0}
.seal-drop.gain::after{border-color:#b8651f}
/* ── 真素材章面：官方插画替换刻字印面（assets/badges/badge-cat-*.png，已去白底） ──
   图内自带猫耳与名字缎带，所以有素材时关掉 CSS 猫耳、内圈虚线、边框和旋转。
   白底由 trim-badge-bg.py 从四角泛洪去掉，不能用 multiply 凑合规——
   JPEG 白不纯，乘上去会留一个浅灰方块。 */
.seal-art{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;user-select:none}
.tag-seal.has-art{width:78px;height:78px;border:0;background:transparent;transform:none}
.tag-seal.has-art::before,.tag-seal.has-art::after{display:none}
.tag-seal.has-art .seal-art{filter:drop-shadow(0 2px 3px rgba(120,95,60,.13))}
.tag-seal.big.has-art{width:106px;height:106px}
.tag-card.locked .tag-seal.has-art{filter:grayscale(1) opacity(.42)}
.seal-drop.has-art{width:146px;height:146px;border:0;background:transparent;border-radius:0;margin-bottom:12px}
.seal-drop.has-art::after{inset:8px;border-width:2px}
.seal-drop.has-art .seal-art{filter:drop-shadow(0 3px 5px rgba(120,95,60,.16))}
.coupon-gain .seal-drop.has-art{background:transparent}
.seal-ink{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(184,69,58,.22),transparent 70%);opacity:0;animation:inkBloom .8s ease-out .38s both}
.seal-ink.two{background:radial-gradient(circle,rgba(184,101,31,.24),transparent 70%)}
@keyframes sealDrop{
  0%{transform:translateY(-54px) scale(2.2) rotate(-14deg);opacity:0}
  52%{transform:translateY(0) scale(.9) rotate(-7deg);opacity:1}
  70%{transform:translateY(-3px) scale(1.06) rotate(-4deg)}
  100%{transform:translateY(0) scale(1) rotate(-4deg);opacity:1}}
@keyframes inkSpread{0%{transform:scale(.68);opacity:.62}100%{transform:scale(1.5);opacity:0}}
@keyframes inkBloom{0%{transform:scale(.5);opacity:0}40%{opacity:1}100%{transform:scale(1.12);opacity:0}}
.seal-name{font-size:12px;font-weight:900;letter-spacing:.14em;color:#b8453a;margin-top:2px}
.coupon-gain .seal-name{color:#b8651f}
.first-seal h2{margin-top:9px}
.first-seal p b{color:var(--stamp-ink)}
.seal-progress{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-top:13px;font-size:10px;color:var(--stamp-muted)}
.seal-progress b{font:900 20px var(--mono);color:var(--stamp-ink);letter-spacing:-.02em}
.seal-progress em{font-style:normal;margin-left:6px;font-size:9.5px;color:#b8651f;font-weight:800}
/* 积分页领券进度与已领态 */
.pts-coupon-bar{margin:9px 0 2px;padding:10px 12px;border-radius:13px;background:#fff8ea;border:1px solid #f0e2c6}
.pts-coupon-bar div{display:flex;align-items:baseline;justify-content:space-between}
.pts-coupon-bar b{font-size:11px;font-weight:900;color:#8a5a12}
.pts-coupon-bar span{font-size:9.5px;color:#a89070}
.pts-coupon-bar i{display:block;height:4px;border-radius:3px;background:#f0e2c6;margin-top:7px;overflow:hidden}
.pts-coupon-bar em{display:block;height:100%;background:linear-gradient(90deg,#f0b95c,#e08c2f);border-radius:3px;transition:width .32s ease}
.pts-coupon-btn{border:0;margin-top:8px;width:100%;height:27px;border-radius:9px;background:#D9481F;color:#fff;font-size:10px;font-weight:800;cursor:pointer;transition:transform .14s ease,background .2s ease}
.pts-coupon-btn:active{transform:scale(.96)}
.pts-col.mt .pts-coupon-btn{background:#A96C00}
.pts-coupon-btn.on{background:#efe9df;color:#a89d90;cursor:default}
.pts-col.mt .pts-coupon-btn.on{background:#efe9df;color:#a89d90}
.pts-coupon.got{background:#fbf7f0;box-shadow:none;border:1px dashed #e6dccc}
.pts-coupon.got b{color:#a89d90}
@media(prefers-reduced-motion:reduce){.seal-drop,.seal-drop::after,.seal-ink{animation:none}}
@media(max-width:1220px){.inspector{display:none}.stage{padding-right:18px}}
@media(max-width:900px){.app{grid-template-columns:210px minmax(520px,1fr)}.flowcol{display:none}}

/* ── v3：生活记录型图鉴 / 隐藏条件 / 自动发现 / 分享 ── */
.tag-wall-head{padding:12px 2px 10px;text-align:left}
.tag-wall-title{font-size:25px;letter-spacing:.02em}
.tag-wall-sub{margin-top:5px;font-size:10px;color:#9b9288;line-height:1.5}
.collection-line{display:flex;align-items:baseline;gap:6px;margin-top:11px;color:var(--stamp-muted)}
.collection-line b{font:900 23px var(--mono);color:var(--stamp-ink)}
.collection-line span{font-size:10px}
.collection-line em{font-style:normal;margin-left:auto;font-size:9px;color:#b0a69a}
.tag-progress{display:none}
.tag-bar{display:none}
.fam-head em{display:none}
.fam-section{padding-top:14px}
.fam-hint{margin-top:4px}
.tag-card{min-height:178px;padding:12px 9px 10px;gap:6px}
.tag-mark{background:#6f9b7a}
.tag-mark.waiting{background:#f0ece5;color:#9c9186}
.tag-people{display:none}
.tag-story{font-size:9px;color:#a09790;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px;width:100%;min-width:0;overflow-wrap:anywhere}
.tag-hint{font:8.5px var(--sans);color:#b0a69e;letter-spacing:0}
.tag-hint.hot{color:#6f9b7a;opacity:1;font-weight:700}
.tag-card.locked .tag-seal{filter:grayscale(.92);opacity:.4}
.tag-card.progress .tag-seal{filter:none;opacity:1}
.discovery-note{display:flex;align-items:flex-start;gap:8px;margin:2px 2px 11px;padding:9px 11px;border-radius:11px;background:#f3f5ed;color:#7d8d6f;font-size:9px;line-height:1.55}
.discovery-note i{font-style:normal;color:#6f9b7a;flex:none}
.mystery-section{padding-top:17px;border-top:1px dashed #e4ddd2;margin-top:16px}
.mystery-section .fam-head span{margin-left:auto;color:#b7aa98;font:700 14px var(--mono)}
.mystery-card{border-style:dashed;background:rgba(255,255,255,.35)}
.mystery-seal{width:78px;height:78px;border:2px dashed #c7bcae;background:#f6f2eb;color:#b7aa98;font-size:28px;display:grid;place-items:center;border-radius:50%;position:relative}
.mystery-seal::before,.mystery-seal::after{content:"";position:absolute;top:-7px;width:15px;height:13px;background:#c7bcae;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mystery-seal::before{left:10px;transform:rotate(-14deg)}
.mystery-seal::after{right:10px;transform:rotate(14deg)}
.tag-detail.life-detail .tag-hero{padding:2px 0 4px;gap:9px}
.detail-seal{width:116px;height:116px;display:grid;place-items:center;margin:0 auto}
.detail-seal img{width:100%;height:100%;object-fit:contain}
.detail-seal.waiting img{filter:grayscale(1);opacity:.55}
.tag-hero-meta{font-size:10px;color:#8f877e}
.tag-hero-story{font-size:11px;line-height:1.7;color:#655d55;max-width:290px}
.detail-note{font-size:9.5px;line-height:1.6;color:#a1988d;text-align:center;margin:7px 8px 2px}
.badge-how{margin:12px 6px 2px;padding:10px 12px;background:rgba(0,0,0,.025);border:1px solid var(--stamp-line);border-radius:12px;text-align:center}
.badge-how span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--stamp-accent);margin-bottom:5px}
.badge-how p{margin:0;font-size:10.5px;line-height:1.65;color:#6f675f}
.life-detail .modal-actions{margin-top:16px}
.life-detail .modal-actions button{height:43px}
.life-detail .modal-actions .primary{background:var(--stamp-ink);color:#fff}
.life-detail .modal-actions .secondary{background:#f0ece6;color:#776f68}
.life-gain .gain-art{width:148px;height:148px;display:grid;place-items:center}
.life-gain .gain-art .tag-seal{width:116px;height:116px}
.gain-footnote{font-size:9.5px;color:#a1988d;line-height:1.6;margin:12px 8px 0}
.life-gain .gain-footnote{margin:0 8px}
.life-gain .modal-actions button{height:43px}
.life-gain .modal-actions .secondary{background:#f0ece6;color:#776f68}
.life-gain .modal-actions .primary{background:var(--stamp-ink);color:#fff}
.first-seal-life .gain-art{margin-top:4px}
.first-seal-life .gain-footnote{margin-top:0}
.share-sheet .share-card-preview{width:100%;aspect-ratio:5/4;border:1px solid #e8dfd2;border-radius:17px;background:#f7f3ea;padding:13px 15px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--stamp-ink)}
.share-card-top,.share-card-bottom{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:8px;color:#9b8f81}
.share-card-top span:first-child{font-weight:800;color:#6f8b62}
.share-card-art{height:112px;width:112px;display:grid;place-items:center}
.share-card-art img{width:100%;height:100%;object-fit:contain}
.share-card-art .tag-seal{width:92px;height:92px}
.share-card-preview h3{font-size:18px;font-weight:900;letter-spacing:.02em;margin-top:2px}
.share-card-preview p{font-size:9px;color:#8f857b;line-height:1.45;text-align:center;max-width:245px;margin:2px 0 0}
.share-card-bottom{border-top:1px solid #e8dfd2;padding-top:8px}
.share-card-bottom b{color:#6f9b7a;font-size:8px}
.share-tip{font-size:9px;color:#aaa096;text-align:center;margin-top:9px}
.share-sheet .modal-actions{margin-top:14px}
.share-sheet .modal-actions button{height:42px}
.share-sheet .modal-actions .primary{background:var(--stamp-ink);color:#fff}
.share-sheet .modal-actions .secondary{background:#f0ece6;color:#776f68}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head"><div class="eyebrow">STAMP JOURNEY · PROTOTYPE</div><div class="rail-title">小喵生活图鉴</div><div class="rail-sub">交互稿 · 生活记录自动发现成就</div></div>
    <div class="rail-body" id="railBody"></div>
  </aside>

      <div class="inspector-body" id="noteBody"></div>

<script>
"use strict";

/* ① 页面菜单：一级页面（Tab 入口，弹窗挂宿主页）→ 二级页面（整页跳转、非 Tab）→ 外部页面（非 App 内） */
const PAGE_DEFS=[
  {code:"A",group:"一级页面",page:"印章-日历",kind:"calendar",status:"core",
   sheets:[{key:"record-pending",name:"记录中抽屉"},{key:"record-success",name:"记录成功抽屉"},{key:"cell-demo-records",name:"多单合并抽屉（C3）"},{key:"month-records",name:"本月记录弹层"},{key:"day-records",name:"当日记录弹层"},{key:"surprise-unlock",name:"意外解锁抽屉"}],
   frames:[
     {key:"stamp-calendar",name:"有记录"},
     {key:"stamp-calendar-newbie",name:"无单用户",scene:"newbie"},
     {key:"stamp-calendar-empty",name:"空月份",scene:"empty"},
     {key:"stamp-calendar-syncing",name:"订单同步中",scene:"syncing"},
     {key:"stamp-calendar-fallback",name:"美团配置图",scene:"after-meituan"}
   ]},
  {code:"B",group:"一级页面",page:"印章-印章墙",kind:"badge",status:"core",
   sheets:[{key:"badge-filter",name:"族筛选弹层"},{key:"badge-detail-unlocked",name:"标签详情（已收）"},{key:"badge-detail-locked",name:"标签详情（未点亮）"},{key:"badge-unlock",name:"自动发现成就反馈"},{key:"badge-share",name:"勋章分享预览"},{key:"newbie-guide",name:"初次见面喵抽屉"},{key:"avatar-editor",name:"头像昵称输入器"},{key:"avatar-unlock",name:"第二枚到手抽屉"}],
   frames:[
     {key:"badge-wall-all",name:"标签图鉴",filter:"all"},
     {key:"badge-wall-newbie",name:"无单用户图鉴",scene:"newbie",filter:"all"},
     {key:"badge-wall-unlocked",name:"已收录",filter:"collected"},
     {key:"badge-wall-empty",name:"空态",scene:"empty",filter:"all"},
     {key:"badge-computing",name:"判定计算中",scene:"computing",filter:"all"}
   ]},
  {code:"C",group:"一级页面",page:"积分",kind:"points",status:"core",
   sheets:[{key:"coupon-unlock",name:"薅羊毛的猫到手弹窗"}],
   frames:[
     {key:"points-home",name:"积分首页"}
   ]},
  {code:"D",group:"一级页面",page:"积分商城",kind:"placeholder",status:"scope",
   sheets:[],
   frames:[
     {key:"mall-placeholder",name:"范围占位",tab:"mall"}
   ]},
  {code:"E",group:"一级页面",page:"我的",kind:"placeholder",status:"scope",
   sheets:[],
   frames:[

const ROUTES={};
const PAGE_TREE=[];
(()=>{
  let id=0;const groups=new Map();
  PAGE_DEFS.forEach(p=>{
    const page={code:p.code,name:p.page,kind:p.kind,status:p.status,frames:[],sheets:[],frameMeta:{},sheetMeta:{}};
    p.frames.forEach(f=>{
      id++;
      ROUTES[f.key]={id,page:p.page,frame:f.name,name:`${p.page} · ${f.name}`,kind:f.kind||p.kind,
        scene:f.scene,filter:f.filter,recordId:f.recordId,platform:f.platform,tab:f.tab};
      page.frames.push(f.key);
      page.frameMeta[f.key]={name:f.name,tag:p.status==="scope"?"范围":(f.scene?"状态":"核心")};
    });
    (p.sheets||[]).forEach(s=>{page.sheets.push(s.key);page.sheetMeta[s.key]={name:s.name};});
    if(!groups.has(p.group))groups.set(p.group,[]);
    groups.get(p.group).push(page);
  });
  groups.forEach((pages,group)=>PAGE_TREE.push({group,pages}));
})();

  else if(scene==="after-eleme") records=[...base4(),cloneRecord("eleme-new")];
  else if(scene==="after-meituan") records=[...base4(),cloneRecord("mt-new")];
  else if(scene==="syncing") records=[...base4(),cloneRecord("syncing")];

    state.retainMonthBadge=true;
  }else records=base5();
  state.records=records;
  state.processedOrderKeys=new Set(records.filter(r=>r.status!=="SYNCING").map(r=>r.orderKey));
  state.badgeFilter="all";
  state.selectedRecordId=records.find(r=>r.status==="ACTIVE")?.id||"r4";

/* 标签状态：locked 未点亮 / progress 已收但未走完档位 / unlocked 收齐可用档位 */
function computedBadges(){
  const isNew=state.scene==="newbie"||state.scene==="empty";
  const lag=state.progressLag;
  return TAG_LIBRARY.map(t=>{
    const total=t.tiers.length;
    /* 新用户/空数据场景：订单派生的标签归零，站内行为标签用 stageNew 自己的进度，
       保证无单用户进来时手里已经有「初次见面喵」这类不打折的成就 */
    let stage=isNew?(t.stageNew||0):(t.stage||0);
    /* 领券族：当天领满 6 张即达成第一档，不需要等结算 */
    if(t.id==="o-wool"&&state.couponClaimed.size>=6)stage=Math.max(stage,1);
    /* 露脸的小喵：完成头像昵称输入才算到手，新用户默认 0，点它走输入器 */
    if(t.id==="o-avatar"&&state.avatarDone)stage=Math.max(stage,1);
    /* 流程预置的「意外解锁」（主流程 A2）：模拟系统在后台记录后突然颁发 */
    if(state.bonusStages&&state.bonusStages[t.id])stage=Math.max(stage,state.bonusStages[t.id]);
    const done=stage>=total;
    const status=stage<=0?"locked":(done?"unlocked":"progress");
    const cur=stage>0?t.tiers[stage-1]:null;
    const next=done?null:t.tiers[stage];
    const fam=TAG_FAMILIES.find(f=>f.key===t.family)||TAG_FAMILIES[0];
    const hint=lag?"正在整理记录":(status==="locked"?"待相遇":`已收录 · ${(t.earnedAt||"").slice(5).replace("-","/")}`);
    return {...t,fam,tint:fam.tint,status,stage,total,
      display:cur?cur.name:t.tiers[0].name,
      next,hint,
      earnedAt:stage>0?(t.earnedAt||"2026-11-04"):null};
  });
}
const collectedTags=()=>computedBadges().filter(b=>b.stage>0);

function badgeById(id){
  const bs=computedBadges();

function visibleBadges(){
  if(state.currentRoute==="badge-wall-empty")return [];

  if(state.badgeFilter==="unlocked"||state.badgeFilter==="collected")return bs.filter(b=>b.stage>0);
  if(state.badgeFilter==="locked")return bs.filter(b=>b.stage===0);
  if(TAG_FAMILIES.some(f=>f.key===state.badgeFilter))return bs.filter(b=>b.family===state.badgeFilter);
  return bs;
}

function applyStepState(step){
  state.couponClaimed=new Set();
  resetScene(step.scene||"normal");
  /* 流程步骤可预置领券进度，用于演示「领满 6 张」之后的形态 */
  if(step.coupons){
    const ids=[];POINT_COUPONS.forEach((c,ci)=>c.items.forEach((_,ii)=>ids.push(`${ci}-${ii}`)));
    ids.slice(0,step.coupons).forEach(id=>state.couponClaimed.add(id));
  }
  if(step.avatarDone)state.avatarDone=true;
  /* 主流程 A2：预置「意外解锁」的档位，模拟系统后台记录后自动颁发 */
  state.bonusStages=step.preset||{};
  state.selectedMonth=step.month||"2026-11";
  state.currentRoute=step.route;
  state.sheet=null;
  if(step.badgeId)state.selectedBadgeId=step.badgeId;
  if(step.focus==="favorite"){
    const r=state.records.find(x=>x.id==="r4");if(r)r.favorite=true;
  }
  setRouteContext(step.route);
  if(step.autoSheet){state.sheet=step.autoSheet;state.sheetOrigin=step.route;}
}

}

const DEMO_TODAY="2026-11-16";
const CELL_DEMO_LABELS=[["B","空·今天"],["C1","登记中"],["C2","已登记"],["C3","多单·今"]];
const CELL_DEMO_DESC={B:"B 无数据 · 今天 → 橙色空格",C1:"C1 1 单登记中 · 今天 → 虚线半透明图",C2:"C2 1 单登记完成 · 今天 → 清晰图",C3:"C3 多单 · 今天 → 合并一格（角标 2）"};
function demoCellOverride(date,d){
  const s=state.cellDemo;
  if(!s)return null;
  const isTarget=date===DEMO_TODAY;
  if(!isTarget||!state.selectedMonth.startsWith("2026-11"))return null;
  const tag=`<span class="demo-cell-tag">${s}</span>`,act=`data-act="demo-cell" data-demo="${s}"`;
  const img=(cls,src)=>`<img class="${cls}" src="${src}" alt=""><span class="day-num">${d}</span>`;
  if(s==="B")return `<button class="day demo-b" ${act}>${tag}${d}</button>`;
  if(s==="C1")return `<button class="day has-record today-cell demo-focus" ${act}>${tag}${img("pending","./assets/records/order-eleme-latte.webp")}</button>`;
  if(s==="C2")return `<button class="day has-record today-cell demo-focus" ${act}>${tag}${img("","./assets/records/order-eleme-latte.webp")}</button>`;
  if(s==="C3")return `<button class="day has-record today-cell demo-focus" ${act}>${tag}${img("","./assets/records/order-eleme-latte.webp")}<span class="day-count">2</span></button>`;
  return null;
}
function calendarCells(){
  const [y,m]=state.selectedMonth.split("-").map(Number);
  const days=new Date(y,m,0).getDate();
  const jsDay=new Date(y,m-1,1).getDay();
  const lead=(jsDay+6)%7;
  const cells=[];
  for(let i=0;i<lead;i++)cells.push(`<button class="day blank" tabindex="-1"></button>`);
  for(let d=1;d<=days;d++){
    const date=`${y}-${pad2(m)}-${pad2(d)}`;
    const demo=demoCellOverride(date,d);
    if(demo){cells.push(demo);continue;}
    const rs=recordsOnDate(date);
    const today=date==="2026-11-16";
    const syncing=state.records.find(r=>r.localDate===date&&r.status==="SYNCING");
    if(rs.length){
      const cover=rs[0];
      cells.push(`<button class="day has-record${today?" today-cell":""}" data-act="open-day-records" data-date="${date}" aria-label="${d}日${today?"（今天）":""}，${rs.length}条记录">
        <img src="${cover.image}" alt=""><span class="day-num">${d}</span>${rs.length>1?`<span class="day-count">${rs.length}</span>`:""}
      </button>`);
    }else if(syncing){
      cells.push(`<button class="day syncing" data-act="syncing-info" aria-label="${d}日，订单同步中"><span class="sync-glyph">↻</span><span class="day-num">${d}</span></button>`);
    }else cells.push(`<button class="day${today?" today-cell":""}" data-act="empty-day" data-date="${date}">${d}</button>`);
  }
  return cells.join("");
}

/* ⑦ REVIEW SHELL RENDERERS */
function renderScreen(){
  const oldScroll=document.querySelector("#screen .page-scroll");
  if(oldScroll&&state.scrollKey)state.scrollStore[state.scrollKey]=oldScroll.scrollTop;
  document.getElementById("screen").innerHTML=frameView();
  const r=routeOf(state.currentRoute);
  document.getElementById("stageName").textContent=r.name;
  const sel=document.getElementById("frameSelect");
  sel.innerHTML=PAGE_TREE.map(g=>g.pages.map(p=>`<optgroup label="${p.code} ${p.name}">${p.frames.map(k=>{const r=routeOf(k);return `<option value="${k}" ${k===state.currentRoute?"selected":""}>${pad2(r.id)} · ${p.name} · ${r.frame}</option>`;}).join("")}</optgroup>`).join("")).join("");
  state.scrollKey=`${state.currentRoute}|${state.selectedMonth}|${state.stampView}`;
  const fresh=document.querySelector("#screen .page-scroll");
  if(fresh&&state.scrollStore[state.scrollKey])fresh.scrollTop=state.scrollStore[state.scrollKey];
}

function renderTabbar(){
  const root=document.getElementById("tabbar");
  const kind=routeOf(state.currentRoute).kind;
  if(["gallery","detail","external","rule"].includes(kind)){root.innerHTML="";return;}
  const tabs=[["stamp","印章","◎"],["points","积分","◈"],["mall","积分商城","◇"],["mine","我的","○"]];
  root.innerHTML=`<nav class="global-tabs" aria-label="全局导航">${tabs.map(([k,n,ic])=>`<button class="${state.globalTab===k?"on":""}" data-act="switch-global-tab" data-tab="${k}"><span class="ico">${ic}</span><span>${n}</span></button>`).join("")}</nav>`;
}

function renderSheet(){document.getElementById("sheetRoot").innerHTML=currentSheetView();}

function renderRail(){
  const root=document.getElementById("railBody");
  let html=`<div class="mode-switch"><button class="mode-btn ${state.railMode==="flow"?"on":""}" data-mode="flow">流程</button><button class="mode-btn ${state.railMode==="page"?"on":""}" data-mode="page">页面</button></div>`;
  if(state.railMode==="flow"){
    FLOWS.forEach(g=>{html+=`<div class="group-head">${g.group}<em>${g.flows.length} 条</em></div>`;g.flows.forEach(f=>{html+=`<button class="rail-item ${state.activeFlowId===f.id?"on":""}" data-flow="${f.id}"><span class="rail-dot"></span><span class="rail-name">${f.name}</span><span class="rail-count">${f.steps.length}</span></button>`;});});
  }else{
    PAGE_TREE.forEach(g=>{const pages=g.pages.filter(p=>p.code!=="G");if(!pages.length)return;html+=`<div class="group-head">${g.group}<em>${pages.length} 页</em></div>`;pages.forEach(p=>{const on=p.frames.includes(state.currentRoute)||p.sheets.includes(state.sheet);html+=`<button class="page-item ${on?"on":""}" data-page="${p.code}" title="${p.name}：${p.frames.length} 个状态帧 · ${p.sheets.length} 个弹层"><span class="page-code">${p.code}</span><span class="rail-name">${p.name}</span><span class="rail-count">${p.frames.length}</span></button>`;});});
  }
  root.innerHTML=html;
}

function pageByCode(code){for(const g of PAGE_TREE){const p=g.pages.find(x=>x.code===code);if(p)return p;}return null;}
function pageForCurrent(){for(const g of PAGE_TREE){for(const p of g.pages){if(p.frames.includes(state.currentRoute)||p.sheets.includes(state.sheet))return p;}}return null;}

function renderFlowCol(){
  const title=document.getElementById("flowTitle"),sub=document.getElementById("flowSub"),root=document.getElementById("flowBody");
  if(state.railMode==="flow"){
    const f=flowById(state.activeFlowId);if(!f){root.innerHTML="";return;}
    title.textContent=`${groupOfFlow(f.id).group} · ${f.id}`;sub.textContent=`${f.name} · ${f.start}`;
    root.innerHTML=f.steps.map((s,i)=>`${i?`<div class="flow-arrow"></div>`:""}<div class="step ${state.activeStepIndex===i?"on":""} ${s.ext?"ext":""}" data-flow-step="${i}"><div class="step-index">${s.ext?"◇":pad2(i+1)}</div><div><div class="step-title">${s.title}</div><div class="step-sub">${s.sub}</div></div></div>`).join("");
  }else{
    const p=pageForCurrent()||PAGE_TREE[0].pages[0];
    title.textContent=`${p.code} ${p.name}`;
    sub.textContent=`同一路由 · ${p.frames.length} 个状态帧 · ${p.sheets.length} 个弹层`;
    let html=`<div class="section-label">STATES / 同一路由下的帧</div>`;
    html+=p.frames.map((k,i)=>{const meta=p.frameMeta[k];return `<div class="step ${state.currentRoute===k&&!state.sheet?"on":""} ${meta.tag==="状态"?"ext":""}" data-page-route="${k}" title="${k}"><div class="step-index">${pad2(i+1)}</div><div><div class="step-title">${meta.name}</div></div></div>`;}).join("");
    if(p.sheets.length){html+=`<div class="section-label">SHEETS · 本页弹层</div>`+p.sheets.map(k=>`<div class="step ${state.sheet===k?"on":""}" data-page-sheet="${k}" title="${k}"><div class="step-index" style="border-style:dashed">▸</div><div><div class="step-title">${p.sheetMeta[k].name}</div></div></div>`).join("");}
    root.innerHTML=html;
  }
}

function renderNotes(){
  const key=state.sheet||state.currentRoute;
  const n=NOTES[key]||{status:"说明",sections:[{h:"页面",rows:[routeOf(state.currentRoute).name]}]};
  document.getElementById("noteStatus").textContent=n.status;
  document.getElementById("noteSub").textContent=`${routeOf(state.currentRoute).name}${state.sheet?` · ${state.sheet}`:""}`;
  document.getElementById("noteBody").innerHTML=n.sections.map(s=>`<section class="note-section"><h4>${s.h}</h4>${s.rows.map((r,i)=>{const obj=typeof r==="object"?r:{text:r};return `<div class="note-row ${obj.warn?"warn":""}"><i>${pad2(i+1)}</i><span>${obj.text}</span></div>`;}).join("")}</section>`).join("");
}

function renderAll(){renderScreen();renderTabbar();renderSheet();renderRail();renderFlowCol();renderNotes();}

/* ⑧ NAVIGATION / ACTIONS */
let toastTimer=null;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),2200);}
function closeSheet(){if(state.sheet==="badge-share"&&state.shareReturnSheet){state.sheet=state.shareReturnSheet;state.shareReturnSheet=null;}else{state.sheet=null;}renderSheet();renderFlowCol();renderNotes();}
function openSheet(key){state.sheet=key;state.sheetOrigin=state.currentRoute;renderSheet();renderFlowCol();renderNotes();}

function go(route,{scene=null,keepScene=false}={}){
  state.sheet=null;
  if(scene)resetScene(scene);else if(!keepScene)resetScene(routeDefaultScene(route));
  state.currentRoute=route;
  setRouteContext(route);
  const r=routeOf(route);if(r.recordId)state.selectedRecordId=r.recordId;
  renderAll();
  /* 新人第一次进印章页：自动弹「初次见面喵」底部抽屉，每个会话只弹一次；
     流程模式的步骤 02 走 applyStepState 的 autoSheet，不经这里 */
  if(route==="badge-wall-newbie"&&state.scene==="newbie"&&!state.newbieGuideSeen){
    state.newbieGuideSeen=true;
    openSheet("newbie-guide");
  }
}

function activateFlowStep(index){
  const f=flowById(state.activeFlowId);if(!f||!f.steps[index])return;
  state.activeStepIndex=index;
  applyStepState(f.steps[index]);
  renderAll();
}

function simulateOrder(key){
  const rec=cloneRecord(key);
  if(state.processedOrderKeys.has(rec.orderKey)){toast("该订单已处理，未重复生成记录");return;}
  const firstRun=state.scene==="newbie";
  const before=monthQty("2026-11");
  state.records.push(rec);state.processedOrderKeys.add(rec.orderKey);
  state.scene=firstRun?"after-first":(key==="eleme-new"?"after-eleme":"after-meituan");
  state.currentRoute=key==="eleme-new"?"stamp-calendar":"stamp-calendar-fallback";
  state.globalTab="stamp";state.stampView="calendar";state.selectedMonth="2026-11";
  const unlocked=before<5&&monthQty("2026-11")>=5;
  renderAll();
  if(unlocked)openSheet("badge-unlock");
  toast(firstRun?"首笔订单已自动入历，小喵记下了你的第一段饮食日常":(key==="eleme-new"?"饿了么订单图已自动写入日历":"已命中美团后台配置图并写入日历"));
}

function setPageSheet(key){
  /* 菜单解耦（2026-11-16）：菜单点弹窗只开弹窗 + 补内容所需的最小状态，
     绝不改 currentRoute / globalTab / 月份等导航与业务状态；
     需要剧情的弹窗（解锁反馈 / 退款失效 / 签到成功）才重置场景，
     完整剧情演示一律走「流程」模式，菜单不承担剧情。 */
  if(key==="day-records"&&!state.selectedDate)state.selectedDate="2026-11-14";
  if(key==="badge-unlock")resetScene("after-eleme");
  if(key==="order-invalidated")resetScene("refunded");
  if(key.startsWith("badge-")&&key!=="badge-unlock"&&!state.selectedBadgeId)state.selectedBadgeId=key==="badge-detail-locked"?"h-breadth":"h-shop";
  /* 菜单解耦补充：详情弹层演示哪个章由章的实际状态决定，避免"已解锁的章被当成未解锁"讲错故事 */
  /* 详情弹层演示哪一枚由标签实际状态决定：已收弹层优先展示有档位进展的，未点亮弹层优先展示尚未点亮的 */
  if(key==="badge-detail-locked"&&badgeById(state.selectedBadgeId).stage>0){const cand=computedBadges().find(b=>b.stage===0&&b.tiers.length>1)||computedBadges().find(b=>b.stage===0);if(cand)state.selectedBadgeId=cand.id;}
  if(key==="badge-detail-unlocked"&&badgeById(state.selectedBadgeId).stage===0){const cand=computedBadges().filter(b=>b.stage>0).sort((a,b)=>(b.status==="progress")-(a.status==="progress"))[0];if(cand)state.selectedBadgeId=cand.id;}
  openSheet(key);renderAll();
}

/* ⑨ EVENT DELEGATION */
document.addEventListener("click",e=>{
  const actEl=e.target.closest("[data-act]");
  if(actEl){
    const act=actEl.dataset.act;
    if(act==="close-sheet"){closeSheet();return;}
    if(act==="switch-global-tab"){
      const tab=actEl.dataset.tab;state.globalTab=tab;
      const route={stamp:state.stampView==="badges"?"badge-wall-all":"stamp-calendar",points:"points-home",mall:"mall-placeholder",mine:"mine-placeholder"}[tab];
      go(route,{keepScene:true});return;
    }
    if(act==="switch-stamp-view"){
      const v=actEl.dataset.view;state.stampView=v;go(v==="calendar"?"stamp-calendar":"badge-wall-all",{keepScene:true});return;
    }
    if(act==="utility-settings"){toast("设置归入「我的」；本稿暂不展开");return;}
    if(act==="top-m-entry"){toast("右上 M 入口语义待确认，原型仅还原视觉");return;}
    if(act==="open-badge-filter"){openSheet("badge-filter");return;}
    if(act==="open-month-records"){openSheet("month-records");return;}
    if(act==="open-month-gallery"){state.detailBackRoute="stamp-calendar";go("month-gallery",{keepScene:true});return;}
    if(act==="open-month-picker"){openSheet("month-picker");return;}
    if(act==="select-month"){
      state.selectedMonth=actEl.dataset.month;state.sheet=null;renderAll();toast(`已切换到${monthLabel(state.selectedMonth)}`);return;
    }
    if(act==="close-gallery"){go("stamp-calendar",{keepScene:true});return;}
    if(act==="gallery-layout"){toast("当前使用双列拍立得布局");return;}
    if(act==="open-day-records"){state.selectedDate=actEl.dataset.date;openSheet("day-records");return;}
    if(act==="empty-day"){toast("这一天还没有有效订单记录");return;}
    if(act==="syncing-info"){toast("订单同步中，暂不计入杯数和印章进度");return;}
    if(act==="set-cell-demo"){state.cellDemo=actEl.dataset.demo;renderAll();return;}
    if(act==="clear-cell-demo"){state.cellDemo=null;renderAll();return;}
    if(act==="demo-cell"){
      const dm=actEl.dataset.demo;
      if(dm==="C1")openSheet("record-pending");
      else if(dm==="C2")openSheet("record-success");
      else if(dm==="C3")openSheet("cell-demo-records");
      else toast("今天 · 无数据：橙色空格，无商品图");
      return;
    }
    if(act==="open-record-detail"){
      state.selectedRecordId=actEl.dataset.record;state.detailBackRoute=state.currentRoute==="month-gallery"?"month-gallery":"stamp-calendar";state.sheet=null;
      state.currentRoute=recordById(state.selectedRecordId)?.platform==="meituan"?"record-detail-meituan":"record-detail-eleme";setRouteContext(state.currentRoute);renderAll();return;
    }
    if(act==="detail-back"){go(state.detailBackRoute||"stamp-calendar",{keepScene:true});return;}
    if(act==="toggle-favorite"||act==="toggle-detail-favorite"){
      e.stopPropagation();const rec=recordById(actEl.dataset.record);if(rec){rec.favorite=!rec.favorite;renderAll();toast(rec.favorite?"已收藏":"已取消收藏");}return;
    }
    if(act==="set-badge-filter"){state.badgeFilter=actEl.dataset.filter;renderAll();return;}
    if(act==="choose-badge-filter"){state.badgeFilter=actEl.dataset.filter;state.sheet=null;state.sheetOrigin=null;state.currentRoute=(state.badgeFilter==="collected"||state.badgeFilter==="unlocked")?"badge-wall-unlocked":"badge-wall-all";renderAll();return;}
    if(act==="weak-link"){go(actEl.dataset.target||"points-home");return;}
    if(act==="open-badge-detail"){
      state.selectedBadgeId=actEl.dataset.badge;const b=badgeById(state.selectedBadgeId);
      openSheet(b.stage>0?"badge-detail-unlocked":"badge-detail-locked");return;
    }
    if(act==="mystery-hint"){toast("这枚小喵暂时保密，等某个特别的时刻再来见你");return;}
    if(act==="share-badge"){
      state.shareBadgeId=actEl.dataset.badge||state.selectedBadgeId||"o-hello";
      state.shareReturnSheet=state.sheet;
      openSheet("badge-share");return;
    }
    if(act==="copy-share-copy"){
      const b=badgeById(state.shareBadgeId||state.selectedBadgeId||"o-hello");
      const copy=`我收录了「${b.display}」🐾\n${b.story}\n你也来看看自己的小喵图鉴吧！`;
      const copyFallback=()=>{const ta=document.createElement("textarea");ta.value=copy;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();toast(ok?"分享文案已复制":copy);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(copy).then(()=>toast("分享文案已复制")).catch(copyFallback);}else copyFallback();
      return;
    }
    if(act==="simulate-eleme-order"){simulateOrder("eleme-new");return;}
    if(act==="simulate-meituan-order"){simulateOrder("mt-new");return;}
    if(act==="unlock-to-wall"){state.sheet=null;state.currentRoute="badge-wall-all";state.stampView="badges";setRouteContext(state.currentRoute);renderAll();return;}
    if(act==="newbie-to-wall"){
      /* 抽屉「去逛逛」：人在印章墙就只关抽屉；从日历页来的则跳墙页 */
      if(state.currentRoute==="badge-wall-newbie"||state.currentRoute==="badge-wall-all"){closeSheet();return;}
      state.sheet=null;go("badge-wall-newbie",{keepScene:true});return;
    }
    if(act==="gain-next-avatar"){
      /* 抽屉里的「下一枚」轻提示整行可点：关掉当前抽屉，落到墙页并直接唤起头像输入器 */
      state.sheet=null;
      if(state.currentRoute!=="badge-wall-newbie"&&state.currentRoute!=="badge-wall-all")go("badge-wall-newbie",{keepScene:true});
      openSheet("avatar-editor");return;
    }
    if(act==="open-avatar-editor"){openSheet("avatar-editor");return;}
    if(act==="avatar-choose"){state.avatarPicked=true;renderSheet();return;}
    if(act==="avatar-save"){
      const nick=document.getElementById("nickInput");
      const nickValue=nick?nick.value.trim():state.nickName;
      if(!state.avatarPicked||!nickValue){toast("资料保存后，小喵会自动为你收录");return;}
      state.nickName=nickValue;state.avatarDone=true;state.avatarPicked=false;
      openSheet("avatar-unlock");return;
    }
    if(act==="avatar-collect"){closeSheet();renderAll();toast("已收进猫谱 · 手上 2 枚");return;}
    if(act==="go-order"){closeSheet();go(actEl.dataset.platform==="eleme"?"external-eleme":"external-meituan",{keepScene:true});return;}
    if(act==="points-checkin"){toast("签到流程与签到成功反馈不在本稿表达范围，签到条为静态展示");return;}
    if(act==="points-entry"){toast(`「${actEl.dataset.entry}」入口由对应业务线接入，本稿不定义目标页`);return;}
    if(act==="points-coupon"){
      const cid=actEl.dataset.cid;
      if(!cid||state.couponClaimed.has(cid))return;
      state.couponClaimed.add(cid);
      const done=state.couponClaimed.size>=6;
      renderAll();
      if(done)openSheet("coupon-unlock");
      else toast("已为你收好这份优惠");
      return;
    }
    if(act==="points-banner"){toast("活动详情页不在本稿范围，仅还原入口");return;}
    if(act==="points-cap"){toast("小程序胶囊按钮，原型仅还原视觉");return;}
  }

  const mode=e.target.closest("[data-mode]");
  if(mode){state.railMode=mode.dataset.mode;renderRail();renderFlowCol();return;}
  const flow=e.target.closest("[data-flow]");
  if(flow){state.railMode="flow";state.activeFlowId=flow.dataset.flow;state.activeStepIndex=0;activateFlowStep(0);return;}
  const flowStep=e.target.closest("[data-flow-step]");
  if(flowStep){activateFlowStep(Number(flowStep.dataset.flowStep));return;}
  const page=e.target.closest("[data-page]");
  if(page){state.railMode="page";const p=pageByCode(page.dataset.page);if(p){go(p.frames[0]);state.railMode="page";renderRail();renderFlowCol();}return;}
  const pageRoute=e.target.closest("[data-page-route]");
  if(pageRoute){go(pageRoute.dataset.pageRoute);state.railMode="page";renderRail();renderFlowCol();return;}
  const pageSheet=e.target.closest("[data-page-sheet]");
  if(pageSheet){state.railMode="page";setPageSheet(pageSheet.dataset.pageSheet);return;}
});

document.addEventListener("change",e=>{if(e.target.id==="frameSelect"){go(e.target.value);}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.sheet){closeSheet();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".record-card")){e.preventDefault();e.target.click();}
});

/* ⑩ INIT */
renderAll();
</script>
</body>
</html>
