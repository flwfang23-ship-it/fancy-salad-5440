<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小喵印章功能链路式测试执行手册">
  <meta name="runbook-release" content="T002-SEAL-V2-20261118">
  <title>小喵印章功能 · 测试执行台</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #68747f;
      --line: #dce2e6;
      --canvas: #f3f5f4;
      --paper: #ffffff;
      --nav: #14231f;
      --nav-soft: #203630;
      --accent: #167c68;
      --accent-soft: #e5f4ef;
      --warn: #b66b19;
      --warn-soft: #fff2df;
      --danger: #b3443d;
      --danger-soft: #faeae8;
      --shadow: 0 12px 32px rgba(30, 45, 40, .08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(22, 124, 104, .28); outline-offset: 2px; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: 282px;
      padding: 24px 18px 28px;
      overflow-y: auto;
      color: #eaf2ef;
      background:
        radial-gradient(circle at 30% 0%, rgba(49, 143, 119, .3), transparent 34%),
        var(--nav);
      transition: transform .24s ease;
    }
    .brand { padding: 0 8px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .brand-kicker { color: #8ed1bd; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    .brand h1 { margin: 7px 0 5px; font-size: 21px; line-height: 1.3; }
    .brand p { margin: 0; color: #a9bbb5; font-size: 12px; }
    .brand-release { margin-top: 8px; color: #7fa99a; font-size: 11px; letter-spacing: .04em; }
    .nav-section { margin-top: 22px; }
    .nav-label {
      padding: 0 10px 7px;
      color: #7f9890;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 4px; }
    .nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      color: #c8d6d1;
      background: transparent;
      text-align: left;
      transition: background .16s ease, color .16s ease;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-item.active { color: #fff; background: var(--nav-soft); box-shadow: inset 3px 0 #61c5aa; }
    .nav-code { color: #79b9a8; font-size: 12px; font-variant-numeric: tabular-nums; }
    .nav-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-progress { color: #8ea49d; font-size: 11px; font-variant-numeric: tabular-nums; }
    .nav-risk { padding: 1px 6px; border-radius: 999px; color: #ffd99b; background: rgba(209, 127, 32, .18); font-size: 10px; }

    .shell { margin-left: 282px; min-height: 100vh; }
    body.sidebar-collapsed .shell { margin-left: 0; }
    body.sidebar-collapsed .sidebar { transform: translateX(-100%); }
    body.sidebar-collapsed .backdrop.show { opacity: 0; pointer-events: none; }
    .menu-toggle { color: var(--accent); border-color: #b8d9cf; background: var(--accent-soft); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 70px;
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 12px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(12px);
    }
    .menu-toggle { display: inline-flex; }
    .top-context { min-width: 180px; flex: 1; }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .top-title { margin-top: 1px; font-weight: 750; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #7c4d0d;
      background: var(--warn-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #d18a31; }
    .global-progress { min-width: 170px; }
    .progress-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .progress-track { height: 7px; margin-top: 5px; overflow: hidden; border-radius: 999px; background: #e8edeb; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
    .search {
      width: min(230px, 22vw);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #f8faf9;
    }
    .icon-button, .soft-button, .primary-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--ink);
      background: #fff;
      font-weight: 700;
    }
    .icon-button:hover, .soft-button:hover { border-color: #b7c4bf; background: #f7faf8; }
    .primary-button { border-color: var(--accent); color: #fff; background: var(--accent); }
    .primary-button:hover { background: #116b5a; }

    .content { width: calc(100% - 48px); margin: 0 auto; padding: 38px 0 70px; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 38px;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(132deg, #163b32 0%, #1b6d5b 72%, #278873 100%);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      right: -110px;
      top: -170px;
      border: 52px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }
    .eyebrow { color: #8bd0bd; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .hero h2 { max-width: 760px; margin: 9px 0 12px; font-size: clamp(28px, 4vw, 44px); line-height: 1.15; }
    .hero p { max-width: 730px; margin: 0; color: #cde2db; font-size: 16px; }
    .hero-points { max-width: 760px; color: #cde2db; font-size: 15px; }
    .hero-points li::before { background: #8bd0bd; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .hero .primary-button { color: #154a3d; border-color: #fff; background: #fff; }
    .hero .soft-button { color: #fff; border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 30px; }
    .stat { padding: 19px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
    .stat-value { font-size: 27px; font-weight: 800; line-height: 1.1; }
    .stat-label { margin-top: 6px; color: var(--muted); font-size: 12px; }

    .section-heading { display: flex; gap: 14px; align-items: end; justify-content: space-between; margin: 32px 0 14px; }
    .section-heading h2, .section-heading h3 { margin: 0; line-height: 1.25; }
    .section-heading p { margin: 4px 0 0; color: var(--muted); }
    .chain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .batch-block { margin: 0 0 30px; padding: 20px 20px 16px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, #fbfdfc, #fff); box-shadow: 0 4px 18px rgba(30,45,40,.03); }
    .batch-head { display: flex; align-items: center; gap: 14px; }
    .batch-index { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 900; }
    .batch-title { display: flex; flex-direction: column; gap: 2px; }
    .batch-title h3 { margin: 0; font-size: 18px; line-height: 1.2; }
    .batch-en { color: #8aa098; font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .batch-progress { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .batch-progress strong { font-size: 18px; color: var(--accent); }
    .batch-progress span { color: var(--muted); font-size: 11px; font-weight: 700; }
    .batch-info { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 10px; font-size: 12.5px; }
    .batch-desc { color: #41534d; }
    .batch-prereq { color: #8a6434; background: #fbf3e7; border: 1px solid #f0dfc5; border-radius: 7px; padding: 2px 9px; font-weight: 700; }
    .batch-bar { height: 5px; margin-bottom: 16px; border-radius: 999px; background: #edf1ef; overflow: hidden; }
    .batch-bar span { display: block; height: 100%; background: linear-gradient(90deg, #9fd2c1, var(--accent)); border-radius: 999px; }
    .batch-next { margin: 16px 0 0; padding-top: 12px; border-top: 1px dashed #d7e1dc; color: #7f9890; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
    .batch-next.done { color: #3d7d6d; border-top-color: #b8d9cf; }
    .nav-batch-no { color: var(--accent); font-weight: 900; letter-spacing: 0; }
    .nav-batch-count { float: right; color: #9aada6; font-weight: 700; letter-spacing: 0; }
    .chain-card {
      position: relative;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 3px 12px rgba(30,45,40,.03);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .chain-card:hover { transform: translateY(-2px); border-color: #b9c9c3; box-shadow: var(--shadow); }
    .chain-card button { position: absolute; inset: 0; width: 100%; border: 0; background: transparent; }
    .chain-card-head { display: flex; align-items: center; justify-content: space-between; }
    .chain-number { color: var(--accent); font-size: 12px; font-weight: 850; letter-spacing: .08em; }
    .chain-card h3 { margin: 9px 0 7px; font-size: 17px; line-height: 1.4; }
    .chain-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .mini-progress { height: 5px; margin-top: 16px; overflow: hidden; border-radius: 999px; background: #edf1ef; }
    .mini-progress span { display: block; height: 100%; background: var(--accent); }

    .page-head { margin-bottom: 24px; }
    .page-head-row { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; }
    .page-kicker { color: var(--accent); font-size: 12px; font-weight: 850; letter-spacing: .11em; }
    .page-head h2 { max-width: 850px; margin: 8px 0 8px; font-size: clamp(27px, 3.3vw, 39px); line-height: 1.25; }
    .page-summary { max-width: 820px; margin: 0; color: var(--muted); font-size: 16px; }
    .page-summary-list { max-width: 820px; margin-top: 10px; color: var(--muted); font-size: 14px; }
    .page-meter { min-width: 110px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: center; }
    .page-meter strong { display: block; font-size: 21px; }
    .page-meter span { color: var(--muted); font-size: 11px; }

    .panel { margin: 16px 0; padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
    .panel h2, .panel h3, .panel h4 { margin-top: 0; }
    .panel > :last-child { margin-bottom: 0; }
    .info-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; }
    .info-card { padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .info-card h3 { margin: 0 0 12px; font-size: 14px; }
    .info-card p { margin: 0; }
    .info-card.goal { border-color: #b9ded3; background: var(--accent-soft); }
    .fact-list, .point-list, .operation-list { margin: 0; padding: 0; list-style: none; }
    .fact-list { display: grid; gap: 10px; }
    .fact-list li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; }
    .fact-label { color: #65746e; font-size: 12px; font-weight: 800; }
    .fact-value { color: #27352f; }
    .point-list { display: grid; gap: 7px; }
    .point-list li { position: relative; padding-left: 17px; }
    .point-list li::before { content: ""; position: absolute; left: 1px; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .notice { margin: 14px 0; padding: 14px 16px; border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; background: #eff7f4; }
    .notice p { margin: 0 0 6px; }
    .notice p:last-child { margin-bottom: 0; }
    .warning { border-left-color: var(--warn); background: var(--warn-soft); }

    .flowline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 6px; }
    .flow-step { padding: 7px 11px; border-radius: 999px; color: #1b5f50; background: var(--accent-soft); font-size: 12px; font-weight: 750; }
    .flow-arrow { color: #91a09a; }

    .prototype-banner {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 18px;
      padding: 12px 15px;
      border: 1px solid #b8d9cf;
      border-radius: 13px;
      color: #235a4c;
      background: linear-gradient(90deg, #eef8f4, #f8fbfa);
      font-size: 13px;
    }
    .prototype-banner strong { color: #154b3e; }
    .prototype-badge { flex: 0 0 auto; padding: 3px 8px; border-radius: 999px; color: #fff; background: var(--accent); font-size: 10px; font-weight: 850; letter-spacing: .06em; }
    .chain-workbench { width: 100%; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 20px; align-items: start; }
    .top-brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 0 0 16px; }
    .top-brief .brief-cell { margin: 0; }
    .top-brief .info-card { padding: 16px 18px; }
    .top-brief .notice { padding: 16px 18px; border-radius: 10px; }
    .top-brief h3 { margin: 0 0 10px; font-size: 14px; }
    .top-brief .point-list, .top-brief .fact-list { font-size: 13px; }
    .route-panel { margin: 0; padding: 16px 22px; }
    .route-panel h3 { margin: 0; font-size: 14px; }
    .route-notes { display: flex; flex-wrap: wrap; gap: 4px 24px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
    .route-notes li { position: relative; padding-left: 14px; }
    .route-notes li::before { content: ""; position: absolute; left: 1px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .chain-execution-column { min-width: 0; }
    .mece-panel {
      position: sticky;
      top: 86px;
      z-index: 8;
      display: flex;
      max-height: calc(100vh - 104px);
      overflow: hidden;
      flex-direction: column;
      border: 1px solid #b9d5cc;
      border-radius: 19px;
      background: #f8fbfa;
      box-shadow: 0 12px 34px rgba(24, 66, 55, .12);
    }
    .mece-panel.expanded {
      position: fixed;
      inset: 20px 24px 20px 306px;
      z-index: 70;
      max-height: none;
      box-shadow: 0 0 0 100vmax rgba(9, 25, 21, .56), 0 22px 70px rgba(8, 37, 29, .28);
    }
    body.mece-modal-open { overflow: hidden; }
    .mece-panel-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 17px 14px; border-bottom: 1px solid #d8e7e2; background: #fff; }
    .mece-panel-kicker { color: var(--accent); font-size: 10px; font-weight: 900; letter-spacing: .12em; }
    .mece-panel-head h3 { margin: 3px 0 2px; font-size: 17px; line-height: 1.3; }
    .mece-panel-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .mece-expand { flex: 0 0 auto; padding: 7px 9px; border: 1px solid #c6d7d1; border-radius: 9px; color: #315c51; background: #f5faf8; font-size: 11px; font-weight: 800; }
    .mece-viewport { min-height: 0; padding: 16px; overflow: auto; overscroll-behavior: contain; }
    body.mece-pan-ready .mece-viewport,
    body.mece-pan-ready .mece-viewport * { cursor: grab !important; }
    .mece-viewport.panning,
    .mece-viewport.panning * { cursor: grabbing !important; user-select: none; }
    .mece-tree { position: relative; min-width: 0; padding: 2px 0 6px; }
    .mece-tree::before { content: ""; position: absolute; left: 13px; top: 62px; bottom: 28px; width: 2px; border-radius: 2px; background: #bad2ca; }
    .mece-root {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid #246d5b;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #173f35, #22725e);
      box-shadow: 0 8px 20px rgba(24, 83, 68, .2);
    }
    .mece-root .mece-root-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; color: #15483b; background: #d7eee7; font-size: 14px; font-weight: 900; }
    .mece-root strong { display: block; font-size: 13px; }
    .mece-root span { display: block; color: #c9e4dc; font-size: 10px; }
    .mece-root-count { padding: 3px 7px; border-radius: 999px; color: #d9eee8 !important; background: rgba(255,255,255,.12); font-size: 10px !important; font-weight: 800; white-space: nowrap; }
    .mece-stage { position: relative; margin: 24px 0 0 28px; }
    .mece-stage::before { content: ""; position: absolute; left: -15px; top: 22px; width: 15px; height: 2px; background: #bad2ca; }
    .mece-stage-head { display: grid; grid-template-columns: 27px 1fr auto; gap: 9px; align-items: center; padding: 10px 11px; border: 1px solid #c7ddd6; border-radius: 11px; background: #edf6f3; }
    .mece-stage-number { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 9px; color: #fff; background: var(--accent); font-size: 11px; font-weight: 900; }
    .mece-stage-head strong { display: block; color: #25463d; font-size: 12px; }
    .mece-stage-head small { display: block; margin-top: 1px; color: #71817b; font-size: 9px; line-height: 1.4; }
    .mece-stage-progress { padding: 2px 6px; border-radius: 999px; color: #35675a; background: #dcece7; font-size: 9px; font-weight: 850; white-space: nowrap; }
    .mece-branch-grid { position: relative; display: grid; grid-template-columns: 1fr; gap: 8px; margin: 10px 0 0 13px; padding-left: 14px; }
    .mece-branch-grid::before { content: ""; position: absolute; left: 0; top: -10px; bottom: 18px; width: 1px; background: #cfdfda; }
    .mece-node {
      position: relative;
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #d7e1de;
      border-radius: 11px;
      color: #263b35;
      background: #fff;
      text-align: left;
      box-shadow: 0 3px 10px rgba(29, 64, 54, .04);
      transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .mece-node::before { content: ""; position: absolute; left: -15px; top: 21px; width: 14px; height: 1px; background: #cfdfda; }
    .mece-node:hover { transform: translateX(2px); border-color: #8ebdaf; box-shadow: 0 7px 18px rgba(29, 76, 62, .1); }
    .mece-node.done { border-color: #87c3b2; background: #eff9f5; }
    .mece-node.risk { border-color: #e6a85e; background: #fffaf3; box-shadow: inset 3px 0 #dc8730; }
    .mece-node.pass { border-color: #a9d4c7; }
    .mece-node.end { border-color: #b7c4d9; background: #f7f9fc; }
    .mece-node-top { display: flex; gap: 7px; align-items: center; }
    .mece-test-id { color: var(--accent); font-size: 10px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .mece-tone { padding: 1px 6px; border-radius: 999px; color: #76501c; background: #f8e9d3; font-size: 8px; font-weight: 900; }
    .mece-node.pass .mece-tone { color: #276553; background: #ddf0ea; }
    .mece-node.risk .mece-tone { color: #9b4e18; background: #fde5cb; }
    .mece-node.end .mece-tone { color: #4f607c; background: #e8edf6; }
    .mece-node-state { margin-left: auto; color: #89958f; font-size: 9px; font-weight: 800; }
    .mece-node.done .mece-node-state { color: #14735f; }
    .mece-node-title { display: block; margin-top: 5px; font-size: 11px; font-weight: 850; line-height: 1.4; }
    .mece-node-result { display: block; margin-top: 3px; color: #5d6b65; font-size: 9px; line-height: 1.45; }
    .mece-node-next { display: block; margin-top: 5px; padding-top: 5px; border-top: 1px dashed #dce4e1; color: #4b685f; font-size: 9px; font-weight: 750; }
    .mece-legend { display: flex; flex-wrap: wrap; gap: 9px 13px; padding: 11px 16px 13px; border-top: 1px solid #d8e7e2; color: #62716b; background: #fff; font-size: 9px; }
    .mece-legend span { display: inline-flex; gap: 5px; align-items: center; }
    .mece-summary { color: #174f41; font-weight: 900; }
    .mece-dot { width: 7px; height: 7px; border-radius: 50%; background: #72ae9d; }
    .mece-dot.risk { background: #dd8432; }
    .mece-dot.end { background: #7b8ca8; }
    .mece-dot.existing { background: #1b8a70; }
    .mece-dot.new { background: #db7c28; }

> 11 条真实用户链路、38 张高优先级必测卡。勾选只代表本地人工执行记录，不代表智能助手已完成测试。

# 第一部分 · 测前准备

> 开始任何链路前，先准备账号、配置、环境能力与核对口径。

## 公共测试数据与配置

### 测试账号（执行前置）

| 代号 | 初始状态 |
| --- | --- |
| 账号一 | 无任何 已入册 记录、头像昵称未完善、首次进入印章 标签页 |
| 账号二 | 有多笔 已入册 记录、部分勋章已收录、有单可进详情 |
| 账号三 | 有一笔订单转 已退款、其余记录 已入册、已有印章 |
| 账号四 | 有单、印章部分收录，用于筛选态与关闭返回核对 |

### 被测对象与本期边界（执行前置）

- 被测对象：矫正后 C 端原型 小喵印章交互稿；B 端 小喵印章后台配置原型 仅作字段与口径对照，不单独出用例。
- 两仓库 主分支 均未实现印章功能，代码未实现不算缺陷；本期只验原型的页面状态、文案、数值、弹窗、判定口径表达与取图层级。
- 本期排除：线上真实接口/数据、积分页红包领取资格、签到/商城/账户设置、饿了么美团真实下单。分享勋章及微信原生分享口径已按已裁决问题22 纳入本期测试（原生唤起在原型上不可验证）。
- 能力差异：差异一（永久一次） 弹窗永久一次（原型刷新重置）、差异二（多枚依次） 多枚依次弹窗（原型无队列）按产品口径写规则，但原型不可验证，验收报告需标注。

### 演示场景切换与口径对照（执行前置）

- 原型用「流程模式 / 页面模式」切换场景；页面模式提供 常规 / 新人 / 空数据 / 已付款准备态 / 饿了么下单后 / 美团下单后 / 退款后 / 结算中 等演示态。
- 日历 B/今天格演示一/今天格演示二/今天格演示三 标签用于演示「今天」格状态；点还原退出演示，非今天格用真实数据。
- 判定口径只读来源：后台「勋章设计」 勋章设计表 + 候选清单第五章；取图口径来源：后台「图片规则配置」 + 候选清单第八章。
- 演示数据（持有率演示值 百分比、获得时间演示值、新章演示标记）不参与判定，不作校验点。

### 字段与时间口径对照表（执行前置）

| 项目 | 判定层 | 展示层 |
| --- | --- | --- |
| 时间字段 | 订单创建时间（北京时段判勋章） | 收货时间（日历/相册归档与展示） |
| 文案字段 | 判定档位 / 判定信号（研发写死，前端不展示） | 解锁前文案=解锁前文案；解锁条件=解锁条件（用户可见） |
| 图片字段 | 图片池版本 桶版本（取图固化） | 真实商品图 / 品类桶图 / 通用兜底图 |
| 分享字段 | — | 分享图=后台「勋章配置」 配置；分享文案复用解锁前文案 |

        const names = [...new Set((String(value).match(/\bU\d{2,}\b/g) || []).map(code => accountAliases[code]).filter(Boolean))];
        return names.join(' ');
      }
      function escRaw(value = '') {
        return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      }
      function esc(value = '') { return escRaw(aliasText(value)); }
      function stripMd(value = '') { return value.replace(/\*\*/g, '').replace(/`/g, '').trim(); }
      function inline(value = '') {
        let text = esc(value);
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return text;
      }
      function splitPoints(value = '') {
        return String(value).split(/[；。]\s*/).map(item => item.trim()).filter(Boolean);
      }
      function pointMarkup(value = '') {
        const item = stripMd(value);
        const match = item.match(/^([^：:]{2,16})[：:]\s*(.+)$/);
        return match ? `<strong>${inline(match[1])}：</strong>${inline(match[2])}` : inline(item);
      }
      function renderPointList(value, className = 'point-list') {
        const items = Array.isArray(value) ? value : splitPoints(value);
        return `<ul class="${className}">${items.map(item => `<li>${pointMarkup(item)}</li>`).join('')}</ul>`;
      }
      function renderFactList(items = []) {
        return `<ul class="fact-list">${items.map(([label, value]) => `<li><span class="fact-label">${inline(label)}</span><span class="fact-value">${inline(value)}</span></li>`).join('')}</ul>`;
      }
      function findHeading(text) { return lines.findIndex(line => line.trim() === text); }
      function sliceSection(startHeading, endHeading) {
        const start = findHeading(startHeading);
        const end = endHeading ? findHeading(endHeading) : lines.length;
        return lines.slice(start + 1, end < 0 ? lines.length : end);
      }
      function splitTableRow(line) {
        return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
      }
      function isSeparatorRow(row) { return row.every(cell => /^:?-{3,}:?$/.test(cell)); }

      function parseBlocks(blockLines) {
        let html = '';
        let i = 0;
        while (i < blockLines.length) {
          const line = blockLines[i];
          const trim = line.trim();
          if (!trim || trim === '---') { i++; continue; }
          if (/^```/.test(trim)) {
            const code = [];
            i++;
            while (i < blockLines.length && !/^```/.test(blockLines[i].trim())) code.push(blockLines[i++]);
            i++;
            html += `<pre>${esc(code.join('\n'))}</pre>`;
            continue;
          }
          const heading = trim.match(/^(#{2,5})\s+(.+)$/);
          if (heading) {
            const level = Math.min(4, heading[1].length - 1);
            html += `<h${level}>${inline(heading[2])}</h${level}>`;
            i++;
            continue;
          }
          if (trim.startsWith('>')) {
            const quote = [];
            while (i < blockLines.length && blockLines[i].trim().startsWith('>')) quote.push(blockLines[i++].trim().replace(/^>\s?/, ''));
            html += `<div class="notice">${quote.filter(Boolean).map(q => renderPointList(q)).join('')}</div>`;
            continue;
          }
          if (trim.startsWith('|')) {
            const rows = [];
            while (i < blockLines.length && blockLines[i].trim().startsWith('|')) rows.push(splitTableRow(blockLines[i++]));
            const header = rows[0] || [];
            const body = rows.slice(1).filter(row => !isSeparatorRow(row));
            const isAccountTable = header[0] === '代号' && body.some(row => /\bU\d{2,}\b/.test(row[0] || ''));
            if (isAccountTable) {
              const accountHeader = ['内部代号', '中文简称', ...header.slice(1)];
              const accountBody = body.map(row => {
                const codes = row[0].match(/\bU\d{2,}\b/g) || [];
                const names = codes.map(code => accountAliases[code]).join(' / ');
                return [row[0], names, ...row.slice(1)];
              });
              html += `<div class="table-wrap"><table><thead><tr>${accountHeader.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${accountBody.map(row => `<tr>${row.map((c, index) => `<td>${index < 2 ? escRaw(c) : inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
            } else {
              html += `<div class="table-wrap"><table><thead><tr>${header.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(row => `<tr>${row.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
            }
            continue;
          }
          if (/^-\s+/.test(trim)) {
            const items = [];
            while (i < blockLines.length && /^-\s+/.test(blockLines[i].trim())) items.push(blockLines[i++].trim().replace(/^-\s+/, ''));
            html += `<ul>${items.map(item => `<li>${inline(item)}</li>`).join('')}</ul>`;
            continue;
          }
          if (/^\d+\.\s+/.test(trim)) {
            const items = [];
            while (i < blockLines.length && /^\d+\.\s+/.test(blockLines[i].trim())) items.push(blockLines[i++].trim().replace(/^\d+\.\s+/, ''));
            html += `<ol>${items.map(item => `<li>${inline(item)}</li>`).join('')}</ol>`;
            continue;
          }
          const paragraph = [trim];
          i++;
          while (i < blockLines.length) {
            const next = blockLines[i].trim();
            if (!next || /^(#{2,5})\s+/.test(next) || next.startsWith('>') || next.startsWith('|') || /^```/.test(next) || /^-\s+/.test(next) || /^\d+\.\s+/.test(next) || next === '---') break;
            paragraph.push(next); i++;
          }
          const paragraphText = paragraph.join(' ');
          html += paragraphText.length > 58 || /[；。].+[；。]/.test(paragraphText) ? renderPointList(paragraphText) : `<p>${inline(paragraphText)}</p>`;
        }
        return html;
      }

      function getChainSegment(id) {
        const number = id.slice(1);
        const start = lines.findIndex(line => line.startsWith(`## 链路 ${number}`));
        let end = lines.findIndex((line, idx) => idx > start && (/^## 链路 \d+/.test(line) || line === '## 收尾'));
        if (end < 0) end = lines.length;
        return lines.slice(start, end);
      }
      function splitChainSections(segment) {
        const title = (segment[0] || '').replace(/^##\s+/, '');
        const sections = {};
        let current = 'intro';
        sections[current] = [];
        segment.slice(1).forEach(line => {
          const match = line.match(/^###\s+(.+)$/);
          if (match) { current = match[1]; sections[current] = []; }
          else sections[current].push(line);
        });
        return { title, sections };
      }
      function plainText(block = []) {
        return block
          .filter(line => line.trim() && line.trim() !== '---' && !line.startsWith('>'))
          .map(line => line.trim().replace(/^[-*>]\s*/, ''))
          .join('；')

      function extractChecklist(section = []) {

        for (let i = tableStart + 2; i < section.length && section[i].trim().startsWith('|'); i++) {
          const cells = splitTableRow(section[i]);
          if (cells.length >= 6) {
            const rawTitle = stripMd(cells[1]);
            const idMatch = rawTitle.match(/(\d+\.\d+)/);
            rows.push({
              id: idMatch ? idMatch[1] : String(rows.length + 1),
              title: rawTitle.replace(/^\d+\.\d+\s*/, ''),

      }
      function chainData(id) {
        const meta = chainMeta.find(item => item.id === id);
        const parsed = splitChainSections(getChainSegment(id));
        const sec = parsed.sections;
        const rows = extractChecklist(sec['执行清单（测到哪行勾哪行）']);

          goal: plainText(sec['用户目标']),

          graph: sec['完整链路图（全覆盖）'] || [],

      const allChains = chainMeta.map(meta => chainData(meta.id));

      function keyFor(chainId, rowId) { return `${chainId}-${rowId}`; }
      function completedFor(chain) { return chain.rows.filter(row => vDone(keyFor(chain.id, row.id))).length; }

      function toast(message) {

      function navButton(route, code, title, extra = '') {

      }

      function renderDocPage(title, kicker, bodyLines, summary) {

        return `<header class="page-head"><div class="page-kicker">${kicker}</div><h2>${title}</h2>${summary ? renderPointList(summary, 'point-list page-summary-list') : ''}</header><section class="panel markdown">${parseBlocks(bodyLines)}</section>`;
      }

      function flowFromGraph(graph) {
        const steps = graph.filter(line => /环节\d+/.test(line)).map(line => {

      }

      function firstRowForStage(chain, stageNumber) {

      }
      function exactNext(chain, row) {

        const mainIndex = stageMainRows.findIndex(item => item.id === row.id);
        if (mainIndex >= 0 && stageMainRows[mainIndex + 1]) {
          const nextMain = stageMainRows[mainIndex + 1];
          return `本项通过后，继续执行 ${displayId(nextMain.id)} ${nextMain.title}`;

      function operationFor(chain, row) {

      function uniqueMeceIds(nodes) {

      function meceKeyFor(chainId, nodeId) { return `MECE-${chainId}-${nodeId}`; }
      function executableMeceNodes(nodes) { return nodes.filter(node => node.card && node.executable !== false); }
      function meceKindLabel(kind) {

      function layoutMeceGraph(graph) {

      function renderBottomNav(id) {
        const index = chainMeta.findIndex(item => item.id === id);
        const prev = index > 0 ? chainMeta[index - 1] : null;
        const next = index < chainMeta.length - 1 ? chainMeta[index + 1] : null;

          ${next ? `<button class="primary-button" data-route="${next.id.toLowerCase()}">${displayId(next.id)} ${esc(next.short)} →</button>` : '<button class="primary-button" data-route="xspec">进入横向专项 →</button>'}

        document.body.classList.remove('mece-modal-open');

        if (currentRoute === 'home') html = renderHome();

          html = renderDocPage('测前准备', 'BEFORE YOU RUN', sliceSection('## 公共测试数据与配置', '## 链路总览'), '活动与测试账号应在开始任何链路前备齐。');
        } else if (currentRoute === 'xspec') {
          html = renderCrossSpecPage();
        } else {
          const id = currentRoute.toUpperCase();
          const chain = allChains.find(item => item.id === id);

          else html = renderChain(chain);

      function setMeceExpanded(panel, expanded) {
        if (!panel) return;
        panel.classList.toggle('expanded', expanded);
        document.body.classList.toggle('mece-modal-open', !!document.querySelector('.mece-panel.expanded'));
        const button = panel.querySelector('[data-action="toggle-mece"]');
        if (button) {
          const inEntry = !!panel.closest('.entry-mece-host');
          button.setAttribute('aria-expanded', String(expanded));
          button.textContent = expanded
            ? (inEntry ? '退出执行 ✕' : '收起大图')
            : (inEntry ? '进入执行' : '展开大图');
        }
      }
      function syncMeceProgress() {
        // 同步所有卡片上的三态按钮 active、卡片样式与节点状态标记
        document.querySelectorAll('.verdict-actions[data-verdict-key]').forEach(group => {
          const key = group.dataset.verdictKey;
          const state = verdictOf(key);
          group.querySelectorAll('.verdict-btn').forEach(btn => {
            const active = btn.dataset.verdict === state;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', String(active));
          });
          const node = group.closest('.priority-card, .mece-graph-node, .test-card');
          if (node) {
            node.classList.toggle('done', vDone(key));
            node.classList.toggle('verdict-fail', state === 'fail');
            node.classList.toggle('verdict-skip', state === 'skip');
            const chip = node.querySelector('.mece-node-state');
            if (chip) chip.textContent = verdictChip(key);
            const title = node.querySelector('.test-title-row');
            if (title) {
              title.querySelector('.node-verdict-flag')?.remove();
              if (state === 'fail') title.insertAdjacentHTML('beforeend', '<span class="node-verdict-flag fail">未通过</span>');
              else if (state === 'skip') title.insertAdjacentHTML('beforeend', '<span class="node-verdict-flag skip">无需测试</span>');
            }
            const top = node.querySelector('.priority-card-top');
            if (top) {
              top.querySelector('.node-verdict-flag')?.remove();
              if (state === 'fail') top.insertAdjacentHTML('beforeend', '<span class="node-verdict-flag fail">未通过</span>');
              else if (state === 'skip') top.insertAdjacentHTML('beforeend', '<span class="node-verdict-flag skip">无需测试</span>');
            }
          }
        });
        document.querySelectorAll('.mece-panel').forEach(panel => {
          const groups = [...panel.querySelectorAll('.verdict-actions[data-verdict-key]')];
          const done = groups.filter(group => vDone(group.dataset.verdictKey)).length;
          const fails = groups.filter(group => vFailed(group.dataset.verdictKey)).length;
          const overall = panel.querySelector('[data-mece-overall]');
          if (overall) overall.textContent = `${done}/${groups.length} 张已处理${fails ? ` · ${fails} 张未通过` : ''}`;
        });
        const chain = allChains.find(item => item.id === currentRoute.toUpperCase());
        
        if (chain && execModel(chain.id)) {
          const gHigh = execNodesFor(chain, 'high');
          const gLow = execNodesFor(chain, 'low');
          const gHighDone = gHigh.filter(node => vDone(meceKeyFor(chain.id, node.id))).length;
          const gLowDone = gLow.filter(node => vDone(meceKeyFor(chain.id, node.id))).length;
          const hp = document.querySelector(`[data-gen-high-progress="${chain.id}"]`);
          if (hp) {
            hp.classList.toggle('complete', gHigh.length > 0 && gHighDone === gHigh.length);
            hp.querySelector('strong').textContent = `${gHighDone}/${gHigh.length}`;
            hp.querySelector('span').textContent = gHigh.length > 0 && gHighDone === gHigh.length ? '必测已完成' : '必测进度';
          }
          const lp = document.querySelector(`[data-gen-low-progress="${chain.id}"]`);
          if (lp) lp.textContent = `选测 ${gLowDone}/${gLow.length}`;
        }
        if (chain && (chain.id === 'L09' || execModel(chain.id))) {
          ['high', 'low'].forEach(group => {
            const stat = verdictGroupStat(chain, group);
            const box = document.querySelector(`.entry-cards [data-entry-stats="${group}"]`);
            if (!box) return;
            Object.keys(stat).forEach(key => {
              if (['untested', 'pass', 'fail', 'skip'].includes(key)) {
                const el = box.querySelector(`[data-stat="${key}"]`);
                if (el) el.textContent = stat[key];
              }
            });
            const bar = document.querySelector(`[data-entry-bar="${group}"]`);
            if (bar) bar.style.width = stat.pct + '%';
          });
        }
        syncFailExportCount();
      }
      function syncFailExportCount() {
        document.querySelectorAll('[data-fail-count]').forEach(el => {
          const chain = allChains.find(item => item.id === el.dataset.failCount);
          if (chain) el.textContent = String(verdictStatFor(chain).fail);
        });
      }
      function setMeceZoom(panel, value) {
        if (!panel) return;
        const scale = panel.querySelector('[data-mece-scale]');
        if (!scale) return;
        const zoom = Math.max(.4, Math.min(2, Math.round(value * 10) / 10));
        scale.style.zoom = String(zoom);
        panel.dataset.meceZoom = String(zoom);
        const label = panel.querySelector('[data-mece-zoom]');
        if (label) label.textContent = `${Math.round(zoom * 100)}%`;
      }
      function setMeceZoomAtPointer(panel, value, clientX, clientY) {
        const viewport = panel?.querySelector('.mece-viewport');
        const scale = panel?.querySelector('[data-mece-scale]');
        if (!viewport || !scale) { setMeceZoom(panel, value); return; }
        const before = Number(panel.dataset.meceZoom || scale.style.zoom || 1.3);
        const box = viewport.getBoundingClientRect();
        const anchorX = clientX - box.left + viewport.scrollLeft;
        const anchorY = clientY - box.top + viewport.scrollTop;
        setMeceZoom(panel, value);
        const after = Number(panel.dataset.meceZoom || before);
        const ratio = after / before;
        viewport.scrollLeft = anchorX * ratio - (clientX - box.left);
        viewport.scrollTop = anchorY * ratio - (clientY - box.top);
      }

          const panel = event.currentTarget.closest('.mece-panel');
          setMeceZoom(panel, Number(panel.dataset.meceZoom || 1.3) + .1);
        }));
        document.querySelectorAll('[data-action="mece-zoom-out"]').forEach(button => button.addEventListener('click', event => {
          const panel = event.currentTarget.closest('.mece-panel');
          setMeceZoom(panel, Number(panel.dataset.meceZoom || 1.3) - .1);
        }));
        document.querySelectorAll('[data-action="mece-zoom-reset"]').forEach(button => button.addEventListener('click', event => {
          setMeceZoom(event.currentTarget.closest('.mece-panel'), 1.3);
        }));
        document.querySelector('[data-action="continue"]')?.addEventListener('click', () => {
          const firstIncomplete = allChains.find(chain => { const state = chainProgress(chain); return state.done < state.total; });
          navigate(firstIncomplete ? firstIncomplete.id.toLowerCase() : 'xspec');
        });
        document.querySelectorAll('.mece-viewport').forEach(viewport => {
          viewport.addEventListener('wheel', event => {
            if (!event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            const panel = viewport.closest('.mece-panel');
            const current = Number(panel.dataset.meceZoom || .8);
            const step = event.deltaY < 0 ? .1 : -.1;
            setMeceZoomAtPointer(panel, current + step, event.clientX, event.clientY);
          }, { passive: false });
          viewport.addEventListener('mousedown', event => {
            if (!spaceHeld || event.button !== 0) return;
            event.preventDefault();
            activePan = { viewport, startX: event.clientX, startY: event.clientY,
              startLeft: viewport.scrollLeft, startTop: viewport.scrollTop };
            viewport.classList.add('panning');
          });
        });
      }
      function updatePageMeter() {
        if (!currentRoute.match(/^l\d+$/)) return;
        const chain = allChains.find(item => item.id === currentRoute.toUpperCase());
        const meter = document.querySelector('.page-meter strong');
        if (chain && meter) { const state = chainProgress(chain); meter.textContent = `${state.done}/${state.total}`; }
      }
      function navigate(route) {
        currentRoute = route;
        localStorage.setItem(ROUTE_KEY, route);
        history.replaceState(null, '', `#${route}`);
        document.getElementById('search').value = '';
        closeMenu(); render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('content').focus({ preventScroll: true });
      }
      function filterCurrentPage(query) {
        const needle = query.trim().toLowerCase();
        if (needle) document.querySelector('details.priority-low')?.setAttribute('open', '');
        const items = [...document.querySelectorAll('[data-searchable]')];
        let visible = 0;
        items.forEach(item => {
          const match = !needle || item.dataset.searchable.toLowerCase().includes(needle);
          if (item.dataset.searchScope === 'graph') {
            item.hidden = false;
            item.classList.toggle('search-dim', !!needle && !match);
            item.classList.toggle('search-match', !!needle && match);
          } else {
            item.hidden = !match;
          }
          if (match) visible++;
        });
        document.querySelector('.empty-search')?.remove();
        if (needle && items.length && visible === 0) {
          const empty = document.createElement('div'); empty.className = 'empty-search'; empty.textContent = '当前页没有匹配项';
          document.getElementById('content').appendChild(empty);
        }
      }
      function chainById(id) { return allChains.find(chain => chain.id === id) || null; }

      // 收集某条链路所有“测试未通过”的卡片详情，用于一键导出
      function failedItemsFor(chain) {
        if (!chain) return [];
        const items = [];
        const addFromNode = (node, key, priority) => {
          if (!vFailed(key)) return;
          items.push({
            检查编号: displayId(node.testId || node.id) || '',
            节点编号: node.id || '',
            卡片标题: node.title || '',
            优先级: priority,
            环节或阶段: node.phase || '',
            来源: node.source || '',
            怎么测: node.steps || [],
            通过标准: node.standards || [],
            失败恢复: node.recovery || '',
            判定: '测试未通过'
          });
        };
        execNodesFor(chain, 'high').forEach(node => addFromNode(node, meceKeyFor(chain.id, node.id), 'P0 必测'));
        execNodesFor(chain, 'low').forEach(node => addFromNode(node, meceKeyFor(chain.id, node.id), 'P1 选测'));
        return items;
      }
      function exportFailedFor(chain) {
        const items = failedItemsFor(chain);
        if (!items.length) { toast('当前链路暂无“测试未通过”项'); return; }
        const stat = verdictStatFor(chain);
        const payload = {
          title: `${displayId(chain.id)} 测试未通过项`,
          chainId: chain.id,
          chainTitle: chain.fullTitle || chain.title || '',
          exportedAt: new Date().toISOString(),
          verdictSummary: { 测试通过: stat.pass, 测试未通过: stat.fail, 无需测试: stat.skip, 判定项总数: stat.total },
          failedCount: items.length,
          failedItems: items
        };
        downloadJson(payload, `${projectMeta.title}-${displayId(chain.id)}-测试未通过-${new Date().toISOString().slice(0, 10)}.json`);
        toast(`已导出 ${items.length} 条未通过项`);
      }
      function downloadJson(payload, filename) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = filename;
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function exportProgress() {
        const allMandatory = [];
        const allOptional = [];
        const allPending = [];
        allChains.forEach(chain => {
          execNodesFor(chain, 'high').forEach(node => { if (vDone(meceKeyFor(chain.id, node.id))) allMandatory.push(meceKeyFor(chain.id, node.id)); });
          execNodesFor(chain, 'low').forEach(node => { if (vDone(meceKeyFor(chain.id, node.id))) allOptional.push(meceKeyFor(chain.id, node.id)); });
          execPendingFor(chain).forEach(node => allPending.push(`${displayId(chain.id)}:${node.id}`));
        });
        const state = trackedProgress();
        const verdictSummary = allChains.map(chain => {
          const stat = verdictStatFor(chain);
          return { 链路: chain.id, 测试通过: stat.pass, 测试未通过: stat.fail, 无需测试: stat.skip, 判定项总数: stat.total };
        });
        const allFailed = allChains.flatMap(chain => failedItemsFor(chain).map(item => ({ 链路: chain.id, ...item })));
        const payload = {
          title: `${projectMeta.title}测试执行进度`,
          exportedAt: new Date().toISOString(),
          mandatory: { completed: allMandatory, done: state.done, total: state.total },
          optional: { completed: allOptional, done: allOptional.length },
          verdictSummary,
          failedCount: allFailed.length,
          failedItems: allFailed,
          pending: allPending,
          pendingQuestions: allChains.flatMap(chain => execPendingFor(chain).map(node => `${displayId(chain.id)}:${node.id} ${node.title}`)),
          newBoundaries: allChains.flatMap(chain => execNodesFor(chain, 'low')
            .filter(node => node.kind === 'new' || node.kind === 'combo' || node.kind === 'cross')
            .map(node => `${displayId(chain.id)}:${node.id} ${node.title}（${node.kind}）`))
        };
        downloadJson(payload, `${projectMeta.title}-测试进度-${new Date().toISOString().slice(0,10)}.json`);
        toast('执行进度已导出');
      }
      function closeMenu() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('show'); }

      document.getElementById('search').addEventListener('input', event => filterCurrentPage(event.target.value));
      document.getElementById('export-button').addEventListener('click', exportProgress);
      document.getElementById('menu-toggle').addEventListener('click', () => {
        if (window.matchMedia('(max-width: 820px)').matches) {
          document.getElementById('sidebar').classList.toggle('open');
          document.getElementById('backdrop').classList.toggle('show');
        } else {
          document.body.classList.toggle('sidebar-collapsed');
        }
      });
      document.getElementById('backdrop').addEventListener('click', closeMenu);
      window.addEventListener('hashchange', () => { const route = location.hash.slice(1); if (route && route !== currentRoute) { currentRoute = route; render(); } });
      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') setMeceExpanded(document.querySelector('.mece-panel.expanded'), false);
        if (event.code === 'Space') {
          const tag = (event.target.tagName || '').toLowerCase();
          const typing = tag === 'input' || tag === 'textarea' || event.target.isContentEditable;
          if (!typing) { event.preventDefault(); spaceHeld = true; document.body.classList.add('mece-pan-ready'); }
        }
      });
      window.addEventListener('keyup', event => {
        if (event.code === 'Space') { spaceHeld = false; document.body.classList.remove('mece-pan-ready'); }
      });
      window.addEventListener('mousemove', event => {
        if (!activePan) return;
        event.preventDefault();
        activePan.viewport.scrollLeft = activePan.startLeft - (event.clientX - activePan.startX);
        activePan.viewport.scrollTop = activePan.startTop - (event.clientY - activePan.startY);
      });
      window.addEventListener('mouseup', () => {
        if (!activePan) return;
        activePan.viewport.classList.remove('panning');
        activePan = null;
      });
      window.addEventListener('blur', () => {
        spaceHeld = false; document.body.classList.remove('mece-pan-ready');
        if (activePan) { activePan.viewport.classList.remove('panning'); activePan = null; }
      });
      render();
    })();
  </script>
</body>
</html>
