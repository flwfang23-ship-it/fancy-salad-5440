    else if (current === "tab-points") html = pointsView();
    else if (current === "external-order") html = externalView();
    else if (current === "tab-mall") html = placeholderView("积分商城", "mall");
    else if (current === "tab-me") html = placeholderView("我的", "me");
    $("screen").innerHTML = html;

    /* 小票大字金额：月/周各自按当前帧态取口径 */
    if (isMonthFrame(current)) {
      const st = monthFrameType(current);
      let target;
      if (st === "over") target = MONTH.overSpent;
      else target = monthStats(st).total;
      countUp("amtMain", target, 1100, 300);
    } else if (isWeekFrame(current)) {
      const st = weekFrameType(current);
      const w = WEEKS[weekViewOf(st)];
      const target = weekStats(w).total;
      countUp("amtMain", target, 1100, 300);
    }

    /* 加桌面提示：5 秒无操作自动消失 */
    if (current === "home-month-desktop") {
      setTimeout(function(){ const t = $("deskTip"); if (t) t.remove(); }, 5000);
    }
  }

  function renderRail(){
    if (railMode === "page") return renderRailPages();
    let html = "";
    FLOWS.forEach(function(grp){
      html += "<div class='rg'><div class='rg-h'><i></i>" + grp.g + "<em>" + grp.flows.length + "</em></div>";
      grp.flows.forEach(function(f){
        const keys = [];
        f.lanes.forEach(function(l){ l.steps.forEach(function(s){ if (keys.indexOf(s.k) < 0) keys.push(s.k); }); });
        const on = activeFlowId === f.id;
        html += "<div class='rf-row " + (on ? "on" : "") + "' data-flow='" + f.id + "'><span class='rf-id'>" + f.id + "</span><span class='rf-n'>" + f.n + "</span><span class='rf-c'>" + keys.length + " 帧</span></div>";
      });
      html += "</div>";
    });
    $("railBody").innerHTML = html;
  }

  function flowById(id){
    for (let gi = 0; gi < FLOWS.length; gi++){
      for (let fi = 0; fi < FLOWS[gi].flows.length; fi++){
        const f = FLOWS[gi].flows[fi];
        if (f.id === id) return { g: FLOWS[gi].g, f: f };
      }
    }
    return null;
  }

  function inFlow(f, key){
    return f.lanes.some(function(l){ return l.steps.some(function(s){ return s.k === key; }); });
  }

  function parseStep(v){
    const p = String(v).split("|");
    return { f: p[0], l: Number(p[1]), i: Number(p[2]) };
  }

  // 只认「流程 + 链路 + 序号」这一条，同名帧不互相牵连
  function markStep(fid, key){
    const hit = flowById(fid);
    activeStep = null;
    if (!hit) return;
    for (let l = 0; l < hit.f.lanes.length; l++){
      const steps = hit.f.lanes[l].steps;
      for (let i = 0; i < steps.length; i++){
        if (steps[i].k === key) { activeStep = { f: fid, l: l, i: i }; return; }
      }
    }
  }

  function currentFlow(){
    for (let gi = 0; gi < FLOWS.length; gi++){
      for (let fi = 0; fi < FLOWS[gi].flows.length; fi++){
        const f = FLOWS[gi].flows[fi];
        if (inFlow(f, current)) return { g: FLOWS[gi].g, f: f };
      }
    }
    return null;
  }

  function renderFlow(){
    const act = flowById(activeFlowId);
    const cur = (act && inFlow(act.f, current)) ? act : currentFlow();
    if (!cur) {
      $("flowBody").innerHTML = "<div class='fc-empty'>当前是骨架帧，不挂流程</div>";
      return;
    }
    let html = "<div class='fc-flow'><span class='fc-id'>" + cur.f.id + "</span><span class='fc-n'>" + cur.f.n + "</span><span class='fc-g'>" + cur.g + "</span></div>" +
      "<div class='fc-start'>起点 · " + cur.f.start + "</div>";
    cur.f.lanes.forEach(function(lane, li){
      html += "<div class='rl-h open'>" + lane.g + "</div>";
      lane.steps.forEach(function(s, i){
        const active = !sheet && activeStep && activeStep.f === cur.f.id && activeStep.l === li && activeStep.i === i;
        const demo = ROUTES[s.k] && ROUTES[s.k].demo;
        const cond = s.cond ? "<span class='dmb'>条件</span>" : "";
        html += "<div class='step " + (active ? "on" : "") + "' data-go='" + s.k + "' data-keep='1' data-step='" + cur.f.id + "|" + li + "|" + i + "'" + (s.v ? " data-v='" + s.v + "'" : "") + "><div class='idx'>" + (i + 1) + "</div><div><div class='t'>" + s.t + cond + (demo ? "<span class='dmb'>演示</span>" : "") + "</div><div class='s'>" + s.s + "</div></div></div>";
        if (i < lane.steps.length - 1) html += "<div class='arrow'></div>";
      });
    });
    $("flowBody").innerHTML = html;
  }

  /* ===== 页面轴：左栏页面树 · 中栏状态 / 抽屉清单 ===== */
  function pagesOf(){
    const out = [];
    PAGE_TREE.forEach(function(g){ g.items.forEach(function(p){ out.push(p); }); });
    return out;
  }
  function pageById(k){
    const arr = pagesOf();
    for (let i = 0; i < arr.length; i++) if (arr[i].k === k) return arr[i];
    return arr[0];
  }
  function pageOfFrame(key){
    const arr = pagesOf();
    for (let i = 0; i < arr.length; i++){
      const all = arr[i].frames.concat(arr[i].sheets || [], arr[i].errors || []);
      for (let z = 0; z < all.length; z++) if (all[z].k === key) return arr[i].k;
    }
    return "home-month";
  }
  function isDemoPage(k){
    const g = PAGE_TREE.filter(function(x){ return x.fold === "demo"; })[0];
    return !!g && g.items.some(function(p){ return p.k === k; });
  }
  function flowsOf(key){
    const out = [];
    FLOWS.forEach(function(grp){
      grp.flows.forEach(function(f){ if (inFlow(f, key) && out.indexOf(f.id) < 0) out.push(f.id); });
    });
    return out;
  }

  function renderRailPages(){
    let html = "";
    PAGE_TREE.forEach(function(grp){
      const n = grp.items.reduce(function(a, p){ return a + p.frames.length + (p.sheets || []).length + (p.errors || []).length; }, 0);
      const fold = grp.fold === "demo";
      const open = !fold || demoOpen;
      html += "<div class='rg'><div class='rg-h" + (fold ? " click" : "") + "'" + (fold ? " data-grp='demo'" : "") + "><i></i>" + grp.g +
        (fold ? "<span class='cv'>" + (open ? "收起" : "展开") + "</span>" : "") + "<em>" + n + "</em></div>";
      if (open) {
        grp.items.forEach(function(p){
          const on = activePage === p.k;
          html += "<div class='ri " + (on ? "on" : "") + "' data-page='" + p.k + "'><span class='dot'></span><span class='n'>" + p.n + "</span><span class='tag'>" + p.tag + "</span></div>";
        });
      } else {
        html += "<div class='rg-fold'>演示稿 · 不参与开发</div>";
      }
      html += "</div>";
    });
    $("railBody").innerHTML = html;
  }

  function isMainFrame(key){
    const page = pageOfFrame(key);
    const sp = SPECS[page];
    if (!sp) return false;
    const r = ROUTES[key];
    const isSheet = !!r && r.kind === "sheet";
    const pool = isSheet ? (sp.drawers || {}) : (sp.frames || {});
    const f = pool[key];
    return !!(f && f.main);
  }
  function pageStep(x){
    const r = ROUTES[x.k];
    const on = sheet ? frameKeyOf(sheet) === x.k : current === x.k;
    const mainBadge = isMainFrame(x.k) ? "<span class='dmb main'>主</span>" : "";
    return "<div class='step " + (on ? "on" : "") + "' data-go='" + x.k + "'>" +
      "<div class='idx'>" + (r ? r.id : "-") + "</div><div><div class='t'>" + x.t +
      mainBadge +
      (r && r.demo ? "<span class='dmb'>演示</span>" : "") + "</div></div></div>";
  }

  function renderPageCol(){
    const p = pageById(activePage);
    const errs = p.errors || [];
    const sheets = p.sheets || [];
    const all = p.frames.concat(sheets, errs);
    const ids = [];
    all.forEach(function(x){ flowsOf(x.k).forEach(function(id){ if (ids.indexOf(id) < 0) ids.push(id); }); });
    let html = "<div class='fc-flow'><span class='fc-id'>页面</span><span class='fc-n'>" + p.n + "</span><span class='fc-g'>" + p.tag + "</span></div>" +
      "<div class='fc-start'>" + all.length + " 帧" + (ids.length ? " · 出现在流程 " + ids.join(" / ") : " · 不挂流程") + "</div>";
    if (p.frames.length){
      html += "<div class='rl-h open'>页 面 状 态</div>" + p.frames.map(pageStep).join("");
    }
    if (sheets.length){
      html += "<div class='rl-h open'>抽 屉 & 弹 层</div>" + sheets.map(pageStep).join("");
    }
    if (errs.length){
      html += "<div class='rl-h open'>异 常</div>" + errs.map(pageStep).join("");
    }
    $("flowBody").innerHTML = html;
  }

  function renderMiddle(){
    $("midTitle").textContent = railMode === "page" ? "页面状态" : "流程链路";
    $("midSub").textContent = railMode === "page" ? "左栏选页面 · 点行跳帧" : "点左栏流程 · 点帧跳转不改流程";
    if (railMode === "page") renderPageCol(); else renderFlow();
  }

  function renderAnnot(){
    const key = sheet ? frameKeyOf(sheet) : current;
    const r = ROUTES[key];
    const label = (r ? r.n : "本帧") + (r && r.demo ? " · 演示帧" : "");
    $("annotLabel").textContent = "帧 " + (r ? r.id : "-") + " · " + label;
    $("frameSel").value = key;
  }

  function renderSheet(){
    if (authPop) { $("sheet").innerHTML = authPopView(); return; }
    $("sheet").innerHTML = sheet ? currentSheetView() : "";
  }

  /* ========== 字段说明栏 ========== */
  function specKey(){
    return sheet ? frameKeyOf(sheet) : current;
  }
  /* SPECS 采用 frames/drawers 结构，每帧一个 { main, inherits, summary } */
  function frameLabel(key){
    const r = ROUTES[key];
    return r ? r.n : key;
  }
  function specOf(key){
    const page = pageOfFrame(key);
    const sp = SPECS[page];
    if (!sp) return null;
    const r = ROUTES[key];
    const isSheet = !!r && r.kind === "sheet";
    const pool = isSheet ? (sp.drawers || {}) : (sp.frames || {});
    return pool[key] || null;
  }
  function renderSpecs(){
    const body = $("specsBody"), sub = $("specsSub");
    if (!body) return;
    const key = specKey(), r = ROUTES[key];
    const lab = (r ? "帧 " + r.id + " · " + r.n : key);
    const annots = $("stageAnnots");
    if (annots) annots.innerHTML = "";
    if (railMode !== "page") { body.innerHTML = ""; sub.textContent = "切到「页面」后显示"; return; }
    if (!$("app").classList.contains("sp-on")) { body.innerHTML = ""; sub.textContent = "已收起"; return; }
    const sp = specOf(key);
    if (!sp) { sub.textContent = lab + " · 未录入"; body.innerHTML = "<div class='specs-empty'>本帧未录入字段说明</div>"; return; }
    let badge = "";
    if (sp.main) badge = "<span class='sp-badge sp-main'>主帧</span>";
    else if (sp.inherits) badge = "<span class='sp-badge sp-inh'>继承 " + frameLabel(sp.inherits) + "</span>";
    sub.innerHTML = lab + (badge ? " · " + badge : "");
    body.innerHTML = sp.summary;
    // 给章节编号，并在手机壳右侧生成对应标注（对准模块）
    const circled = "①②③④⑤⑥⑦⑧⑨⑩";
    const hs = body.querySelectorAll(".sp-h");
    if (hs.length && annots) {
      const stage = annots.parentElement;
      const stageRect = stage.getBoundingClientRect();
      const phone = $("phone");
      const ahtml = [];
      hs.forEach(function(h, i){
        const n = circled[i] || (i + 1);
        h.innerHTML = "<span class='sp-num'>" + n + "</span>" + h.innerHTML;
        const sel = h.getAttribute("data-sp-anchor");
        let target = sel ? phone.querySelector(sel) : null;
        let top = -9999;
        if (target) {
          const tr = target.getBoundingClientRect();
          top = tr.top - stageRect.top + tr.height / 2;
        }
        const label = h.textContent.replace(/^[①②③④⑤⑥⑦⑧⑨⑩\s]+/, "").slice(0, 5);
        ahtml.push("<div class='stage-annot' data-i='" + i + "' style='top:" + top + "px'>" +
          "<span class='ln'></span><span class='num'>" + n + "</span><span class='lbl'>" + label + "</span></div>");
      });
      annots.innerHTML = ahtml.join("");
    }
  }
  function toggleSpecs(){
    const on = !$("app").classList.contains("sp-on");
    $("app").classList.toggle("sp-on", on);
    const b = $("spToggle");
    b.classList.toggle("on", on);
    b.textContent = on ? "字段 开" : "字段";
    renderSpecs();
  }

  function renderAll(force){
    if (railMode === "page") {
      activePage = pageOfFrame(sheet ? frameKeyOf(sheet) : current);
      if (isDemoPage(activePage)) demoOpen = true;   // 跳到演示页时自动展开，免得高亮看不见
    }
    renderScreen(force);
    renderRail();
    renderMiddle();
    renderAnnot();
    renderSheet();
    $("app").classList.toggle("sp-page", railMode === "page");
    renderSpecs();
    document.querySelectorAll(".ms").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === railMode); });
  }

  function go(key, keepFlow){
    current = key;
    sheet = null;
    syncView(key);
    if (!keepFlow) {
      const act = flowById(activeFlowId);
      if (!(act && inFlow(act.f, key))) {
        const hit = currentFlow();
        activeFlowId = hit ? hit.f.id : "";
      }
      markStep(activeFlowId, key);
    }
    renderAll(true);
  }

  function openSheet(kind, origin){
    sheet = kind;
    sheetOrigin = origin || current;
    if (kind === "add") addDraft = { date: defaultAddDate(), meal: "lunch", amount: "32" };
    if (kind === "date-sub") dateSel = [];
    renderAll();
  }

  function closeSheet(force){
    sheet = null;
    authPop = false;
    renderAll(force);
  }

  function toast(msg){
    let el = $("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast"; el.className = "toast";
      $("phone").appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 1900);
  }

  function frameKeyOf(kind){
    return { add: "add-order", subscribe: "subscribe-sheet", coupon: "coupon-success", delete: "delete-confirm", share: "share-sheet", weeks: "week-picker", months: "month-picker" }[kind] || kind;
  }

  function selectFrame(key, mode){
    /* 抽屉/子页从哪里来：沿用当前所在的月/周路由，不在首页时默认落月首页 */
    const backHome = function(){ return isWeekFrame(current) ? "home-week" : "home-month"; };
    if (key === "coupon-success") {
      activeFlowId = "1"; activeStep = { f: "1", l: 0, i: 7 };
      current = "tab-points";
      openSheet("coupon", "tab-points");
    } else if (key === "add-order") {
      activeFlowId = "1"; markStep("1", key);
      current = backHome(); syncView(current);
      openSheet("add", current);
    } else if (key === "subscribe-sheet") {
      activeFlowId = "2"; markStep("2", key);
      current = backHome(); syncView(current);
      openSheet("subscribe", current);
    } else if (key === "date-sub") {
      activeFlowId = "2"; markStep("2", key);
      current = backHome(); syncView(current);
      dateMode = mode || "first";
      openSheet("date-sub", current);
    } else if (key === "sub-refused") {
      activeFlowId = "10"; markStep("10", key);
      current = backHome(); syncView(current);
      subRefused = true;
      pendingSub = { lunch: true, dinner: false, week: false };
      openSheet("sub-refused", current);
    } else if (key === "budget-edit") {
      activeFlowId = "6"; markStep("6", key);
      bFrom = isHomeFrame(current) ? current : "home-month";
      resetBDraft();
      go("budget-edit", true);
    } else if (key === "budget-confirm") {
      activeFlowId = "6"; markStep("6", key);
      bFrom = isHomeFrame(current) ? current : "home-month";
      resetBDraft();
      /* 演示用：给午餐加 ¥3，抽屉里能看到「旧 → 新」差异 */
      bDraft.meals.lunch += 3;
      bDraft.month = budgetMonth(bDraft.meals);
      go("budget-edit", true);
      openSheet("budget-confirm", "budget-edit");
    } else if (key === "delete-confirm") {
      activeFlowId = "7"; markStep("7", key);
      current = backHome(); syncView(current);
      delTarget = firstManualTarget(WEEKS[viewWeek]);
      openSheet("delete", current);
    } else if (key === "share-sheet") {
      activeFlowId = "3"; markStep("3", key);
      current = backHome(); syncView(current);
      shareInfo = buildShareInfo();
      openSheet("share", current);
    } else if (key === "week-picker") {
      activeFlowId = "4"; markStep("4", key);
      current = isWeekFrame(current) ? current : "home-week"; syncView(current);
      openSheet("weeks", current);
    } else if (key === "month-picker") {
      activeFlowId = "5"; markStep("5", key);
      current = isMonthFrame(current) ? current : "home-month"; syncView(current);
      openSheet("months", current);
    } else {
      go(key);
    }
  }

  document.addEventListener("click", function(e){
    const t = e.target;
    if (t.closest("#spToggle")) { toggleSpecs(); return; }
    if (t.dataset && t.dataset.mask) { closeSheet(); return; }

    /* 首页 · 加桌面提示：点任意处关闭（不跳转） */
    if (current === "home-month-desktop") {
      const tip = $("deskTip");
      if (tip && !t.closest("#frameSel, .rail, .annot")) tip.remove();
    }

    const actEl = t.closest("[data-act]");
    if (actEl) {
      const act = actEl.dataset.act;
      if (act === "to-points") {
        const fromNewWeek = (current === "home-month-new" && activeFlowId === "1");
        go("tab-points");
        if (fromNewWeek) { activeStep = { f: "1", l: 0, i: 6 }; renderMiddle(); }
      }
      /* 月/周维度互切：语义对应跳（上月↔上周、超支月↔超支周…），不引入 mode 变量 */
      if (act === "dim-switch") {
        if (isWeekFrame(current)) go(HOME_MONTH_FRAMES[weekFrameType()]);
        else if (isMonthFrame(current)) go(HOME_WEEK_FRAMES[monthFrameType()]);
        return;
      }
      /* 账期左右切换：月/周各自独立，禁用态不渲染 data-act */
      if (/^(month|week)-(prev|next)$/.test(act)) {
        const isM = act.indexOf("month-") === 0;
        const dir = act.slice(-4);
        const st = isM ? monthFrameType() : weekFrameType();
        const nav = isM ? MONTH_NAV : WEEK_NAV;
        const target = nav[st] && nav[st][dir];
        if (target) go(target);
        return;
      }
      else if (act === "open-add") openSheet("add", current);
      else if (act === "open-subscribe") { dateMode = "first"; openSheet("date-sub", current); }
      else if (act === "open-budget") openBudgetEdit();
      else if (act === "open-weeks") openSheet("weeks", current);
      else if (act === "open-months") openSheet("months", current);
      else if (act === "open-share") { shareInfo = buildShareInfo(); openSheet("share", current); }
      else if (act === "open-notice") go(actEl.dataset.to || "home-month");
      else if (act === "ask-delete") {
        delTarget = { di: Number(actEl.dataset.di), oi: Number(actEl.dataset.oi) };
        openSheet("delete", current);
      }
      else if (act === "confirm-delete") {
        if (sheet !== "delete" || !delTarget) return;
        const w = WEEKS[viewWeek];
        const d = w.days[delTarget.di];
        if (d && d.orders[delTarget.oi]) {
          const removed = d.orders.splice(delTarget.oi, 1)[0];
          delTarget = null;
          sheet = null;
          const back = isHomeFrame(current) ? current : (isWeekFrame(current) ? "home-week" : "home-month");
          current = back;
          syncView(back);
          screenKey = "";
          activeFlowId = "7";
          activeStep = (back === "home-month" || back === "home-week") ? { f: "7", l: 0, i: 2 } : null;
          renderAll(true);
          toast("已删除 ¥" + fmt(removed.amt) + "，统计已回滚");
        }
        return;
      }
      else if (act === "claim") {
        claimCoupon = { name: actEl.dataset.name, value: actEl.dataset.value };
        current = "tab-points";
        openSheet("coupon", "tab-points");
      }
      else if (act === "close-sheet") closeSheet();
      else if (act === "close-summary") {
        /* 上周账单总结抽屉关闭：按当前帧决定目标 */
        const target = current === "push-week-summary-over" ? "home-week-over" : "home-week";
        go(target);
        return;
      }
      else if (act === "go-week-home") {
        closeSheet(); go("home-week"); return;
      }
      else if (act === "go-over-week") {
        closeSheet(); go("home-week-over"); return;
      }
      else if (act === "go-budget-edit") {
        closeSheet(); go("budget-edit"); return;
      }
      else if (act === "save-add") {
        if (sheet !== "add") return;
        const amt = Number(addDraft.amount);
        if (!isFinite(amt) || amt <= 0) { toast("请输入大于 0 的金额"); return; }
        const w = WEEKS[viewWeek];
        const day = w.days.filter(function(d){ return d.iso === addDraft.date; })[0];
        if (!day) { toast("只能记到当前查看的这一周"); return; }
        day.orders.push({ time: MEAL_TIME[MEAL[addDraft.meal]] || "/", name: "外部订单", tag: "外部", meal: MEAL[addDraft.meal], amt: amt, manual: true });
        day.orders.sort(function(a, b){ return a.time.localeCompare(b.time); });
        sheet = null;
        const back = isHomeFrame(current) ? current : "home-month";
        current = back;
        syncView(back);
        screenKey = "";
        renderAll(true);
        toast("已记入 " + day.mm + " · " + MEAL[addDraft.meal] + " ¥" + fmt(amt));
      }
      else if (act === "save-budget") {
        if (!bDraft) resetBDraft();
        if (mealsSum(bDraft.meals) <= 0) { toast("三餐四类至少填一项"); return; }
        bDraft.month = budgetMonth(bDraft.meals);
        if (current === "budget-edit") { openSheet("budget-confirm", current); return; }
        saveBudgetFromMeals(bDraft.meals);
        afterBudgetSaved();
      }
      else if (act === "confirm-budget") {
        if (!bDraft) { closeSheet(); return; }
        const meals = Object.assign({}, bDraft.meals);
        sheet = null;
        saveBudgetFromMeals(meals);
        activeFlowId = "6"; activeStep = { f: "6", l: 0, i: 3 };
        afterBudgetSaved();
      }
      else if (act === "budget-back") {
        bDraft = null;
        go((bFrom && isHomeFrame(bFrom)) ? bFrom : "home-month");
      }
      else if (act === "save-sub") {
        const picked = [subDraft.lunch ? "午餐" : "", subDraft.dinner ? "晚餐" : "", subDraft.week ? "周更新" : ""].filter(Boolean);
        if (!picked.length) { toast("至少打开一个提醒"); return; }
        pendingSub = { lunch: !!subDraft.lunch, dinner: !!subDraft.dinner, week: !!subDraft.week };
        pendingDays = dateSel.length;
        /* 订阅触达=流程2：lane 0=主链路公共段 / 1=午餐 / 2=晚餐 / 3=周通知 → 推送种类 0/1/2 */
        pendingLane = (activeFlowId === "2" && activeStep && activeStep.f === "2") ? Math.max(0, activeStep.l - 1) : -1;
        if (subAuthorized) {
          /* 已授权过：不弹授权，直接进补选日期 */
          dateMode = "refill";
          openSheet("date-sub", current);
          return;
        }
        sheet = null;
        authPop = true;
        renderAll(true);
      }
      else if (act === "confirm-dates") {
        if (sheet !== "date-sub") return;
        if (!dateSel.length) { toast("先选至少一天的日期"); return; }
        if (dateMode === "refill" && subAuthorized) {
          /* 已授权：后续补日期直接生效，不再弹窗 */
          const n = dateSel.length;
          sheet = null;
          if (pendingLane >= 0 && activeFlowId === "2") {
            go(["push-noon", "push-eve", "push-week"][pendingLane] || "push-noon", true);
            activeStep = { f: "2", l: pendingLane + 1, i: 0 };
            renderMiddle();
          } else {
            renderAll(true);
          }
          toast("已加推 " + n + " 天");
          return;
        }
        /* 首次：日期选完 → 去「订阅」打开要收的提醒 */
        pendingSub = { lunch: !!subDraft.lunch, dinner: !!subDraft.dinner, week: !!subDraft.week };
        if (!subDraft.lunch && !subDraft.dinner && !subDraft.week) subDraft = { lunch: true, dinner: false, week: false };
        openSheet("subscribe", current);
      }
      else if (act === "auth-allow") {
        authPop = false;
        subRefused = false;
        subAuthorized = true;                 // 授权一次，后续补日期不再弹窗
        subDraft = { lunch: pendingSub.lunch, dinner: pendingSub.dinner, week: pendingSub.week };
        const n = pendingDays;
        dateMode = "refill";
        if (activeFlowId === "2" && activeStep && activeStep.f === "2" && activeStep.l === 0) activeStep = { f: "2", l: 0, i: 3 };
        openSheet("date-sub", current);       // 第三步：授权后补选日期
        toast("已订阅 " + n + " 天");
      }
      else if (act === "auth-deny") {
        authPop = false;
        subRefused = true;
        subDraft = { lunch: false, dinner: false, week: false };
        openSheet("sub-refused", current);
      }
      else if (act === "open-sub-refused") openSheet("sub-refused", current);
      else if (act === "demo-order") go("external-order");
      else if (act === "mp-open") {
        go("tab-points");
        activeFlowId = "1"; markStep("1", "tab-points");
        renderMiddle(); renderAnnot();
      }
      else if (act === "share-card-open") {
        const scope = current === "share-friend-week" ? "week" : (current === "share-friend-month" ? "month" : ((shareInfo && shareInfo.scope) || "month"));
        const land = !guideDone ? "tab-points" : (scope === "week" ? "home-week" : "home-month");
        activeFlowId = "3"; markStep("3", "share-friend-" + scope);
        go(land);
      }
      else if (act === "share-send") { closeSheet(); toast("已唤起微信转发面板 · 卡片落积分页"); }
      else if (act === "toast-existing") toast("详见已有功能");
      else if (act === "points-sub-ok") { guideDone = true; go("home-month"); toast("已订阅积分到账提醒"); }
      return;
    }

    const weekEl = t.closest("[data-week]");
    if (weekEl) {
      const fromWeeks = (sheet === "weeks");
      /* 行自带目标帧；有数据 key 才移动周数据指针 */
      if (weekEl.dataset.week) viewWeek = weekEl.dataset.week;
      current = weekEl.dataset.to || "home-week";
      sheet = null;
      screenKey = "";
      syncView(current);
      // 从选周抽屉里点行，流程高亮跟着落到结果帧
      if (fromWeeks && activeFlowId) markStep(activeFlowId, current);
      renderAll(true);
      return;
    }

    const monthEl = t.closest("[data-month]");
    if (monthEl) {
      const fromMonths = (sheet === "months");
      /* 往期月行：记录取数口径，月帧按它出 label 与金额 */
      const vm = monthEl.dataset.month;
      if (vm === "prev" || vm === "older") viewMonth = vm;
      current = monthEl.dataset.to || "home-month";
      sheet = null;
      screenKey = "";
      syncView(current);
      if (fromMonths && activeFlowId) markStep(activeFlowId, current);
      renderAll(true);
      return;
    }

    const flowEl = t.closest("[data-flow]");
    if (flowEl) {
      const hit = flowById(flowEl.dataset.flow);
      if (hit) {
        activeFlowId = hit.f.id;
        activeStep = { f: hit.f.id, l: 0, i: 0 };
        go(hit.f.lanes[0].steps[0].k, true);
      }
      return;
    }

    const modeEl = t.closest("[data-mode]");
    if (modeEl) {
      railMode = modeEl.dataset.mode;
      if (railMode === "page") activePage = pageOfFrame(current);
      renderAll(true);
      return;
    }

    const grpEl = t.closest("[data-grp]");
    if (grpEl) {
      demoOpen = !demoOpen;
      renderRail();
      return;
    }

    const pageEl = t.closest("[data-page]");
    if (pageEl) {
      activePage = pageEl.dataset.page;
      const p = pageById(activePage);
      const first = p.frames[0] || (p.sheets || [])[0];
      if (first) {
        /* 通用页只有抽屉：走抽屉打开路径，不能当页面帧直接 go */
        if (ROUTES[first.k] && ROUTES[first.k].kind === "sheet") selectFrame(first.k);
        else go(first.k);
      } else { sheet = null; renderAll(true); }
      return;
    }

    const goEl = t.closest("[data-go]");
    if (goEl) {
      const k = goEl.dataset.go;
      const step = goEl.dataset.step;
      if (step) activeStep = parseStep(step);
      // 流程 10 第 1 步是拒绝前的正常首页，回到这步要把订阅卡还原
      if (k === "home-month" && activeStep && activeStep.f === "10" && activeStep.i === 0) subRefused = false;
      // 从哪条订阅链路进来，就把对应那档默认打开
      if (k === "subscribe-sheet" && activeStep && activeStep.f === "2") {
        subDraft = { lunch: activeStep.l <= 1, dinner: activeStep.l === 2, week: activeStep.l === 3 };   // 主链路默认勾午餐
      }
      // 订阅第三步（授权后补选日期）不弹授权；第一步是首次选日期
      const dateModeArg = (k === "date-sub" && activeStep && activeStep.f === "2")
        ? (activeStep.i === 3 ? "refill" : "first") : undefined;
      if (ROUTES[k] && ROUTES[k].kind === "sheet") selectFrame(k, dateModeArg);
      else go(k, goEl.dataset.keep === "1");
      if (step) { activeFlowId = parseStep(step).f; activeStep = parseStep(step); renderMiddle(); }
      return;
    }

    const tabEl = t.closest("[data-tab]");
    if (tabEl) {
      const k = tabEl.dataset.tab;
      if (k === "home") {
        if (!guideDone) { activeFlowId = "1"; go("guide-pain"); markStep("1", "guide-pain"); }
        else go("home-month");
      }
      else if (k === "points") go("tab-points");
      else if (k === "mall") go("tab-mall");
      else if (k === "me") go("tab-me");
      return;
    }

    const meal = t.closest("[data-meal]");
    if (meal) { addDraft.meal = meal.dataset.meal; renderSheet(); return; }

    const dateEl = t.closest("[data-date]");
    if (dateEl) {
      const iso = dateEl.dataset.date;
      const i = dateSel.indexOf(iso);
      if (i >= 0) dateSel.splice(i, 1); else dateSel.push(iso);
      renderSheet();
      return;
    }

    const sw = t.closest("[data-sub]");
    if (sw) {
      const k = sw.dataset.sub;
      subDraft[k] = !subDraft[k];
      renderSheet();
      return;
    }
  });

  document.addEventListener("input", function(e){
    const t = e.target;
    if (t.id === "addAmt") addDraft.amount = t.value;
    if (t.id === "addDate") {
      addDraft.date = t.value;
      const h = $("addDateHint");
      if (h) h.textContent = dayLabel(t.value);
    }
    /* 预算表单单向联动：只改三餐四类，月 / 周 / 日均全部派生（引导③ / 改预算共用） */
    if (t.classList && t.classList.contains("bMeal")){
      if (!bDraft) resetBDraft();
      bDraft.meals[t.dataset.meal] = Math.max(0, Math.round(Number(t.value) || 0));
      bDraft.month = budgetMonth(bDraft.meals);
      const bm = $("bMonth"); if (bm) bm.textContent = bDraft.month;
      const gw2 = $("g-week"); if (gw2) gw2.textContent = budgetWeek(bDraft.meals);
      const gd2 = $("g-daily"); if (gd2) gd2.textContent = budgetDaily(bDraft.meals);
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && sheet) closeSheet();
  });

  function tick(){
    const d = new Date();
    $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  (function init(){
    tick();
    setInterval(tick, 30000);
    const keys = Object.keys(ROUTES).sort(function(a, b){ return ROUTES[a].id - ROUTES[b].id; });
    $("frameSel").innerHTML = keys.map(function(k){
      return "<option value='" + k + "'>" + ROUTES[k].id + " · " + ROUTES[k].n + (ROUTES[k].demo ? "（演示）" : "") + "</option>";
    }).join("");
    $("frameSel").addEventListener("change", function(){ selectFrame(this.value); });
    go("home-month");
  })();
})();
</script>
</body>
</html>
