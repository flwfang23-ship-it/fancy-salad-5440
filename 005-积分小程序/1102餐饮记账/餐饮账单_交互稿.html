<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐饮账单 · 路由拆分版交互稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFEFA; --paper-dim:#F6F2E8; --ink:#1E1B16; --ink-soft:#6E685B;
    --line:#E7E0CF; --dash:#C8C0AC; --seal:#C4392F; --seal-deep:#A02B23; --green:#2E7D4F;
    --mono:'JetBrains Mono', monospace; --sans:'Noto Sans SC', sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  body{ height:100vh; overflow:hidden; background:#EDE9DF; font-family:var(--sans); color:var(--ink); }
  .app{ display:grid; grid-template-columns:236px 318px minmax(0,1fr); height:100vh; }

  /* 左栏：帧列表 */
  .rail{ background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .rail-h{ padding:18px 16px 12px; border-bottom:1px solid var(--line); }
  .rail-h .k{ font-size:10px; letter-spacing:.22em; color:var(--seal); font-weight:700; }
  .rail-h .t{ margin-top:8px; font-size:16px; font-weight:900; letter-spacing:.12em; }
  .rail-h .s{ margin-top:6px; font-size:11px; color:var(--ink-soft); letter-spacing:.06em; }
  .rail-body{ flex:1; overflow-y:auto; padding:10px 10px 20px; }
  .rg{ margin-bottom:2px; }
  .rg-h{ display:flex; align-items:center; gap:7px; padding:14px 8px 7px; font-size:12px; font-weight:900; letter-spacing:.08em; }
  .rg-h i{ width:6px; height:6px; background:var(--seal); transform:rotate(45deg); flex-shrink:0; }
  .rg-h em{ margin-left:auto; font-family:var(--mono); font-size:10px; font-style:normal; color:var(--ink-soft); }
  .ri{ display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:9px; cursor:pointer; font-size:12.5px; color:#4A453D; }
  .ri:hover{ background:var(--paper-dim); }
  .ri.on{ background:rgba(196,57,47,.09); color:var(--seal-deep); font-weight:700; }
  .ri .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ri .ref{ font-family:var(--mono); font-size:9.5px; color:#A79F8D; flex-shrink:0; }
  .ri .dot{ width:5px; height:5px; border-radius:50%; background:#D8D0BD; flex-shrink:0; }
  .ri.on .dot{ background:var(--seal); }
  .rf-row{ display:flex; align-items:center; gap:8px; padding:11px; border-radius:9px; cursor:pointer; font-size:12.5px; color:#4A453D; }
  .rf-row:hover{ background:var(--paper-dim); }
  .rf-row.on{ background:rgba(196,57,47,.09); color:var(--seal-deep); font-weight:700; }
  .rf-row .rf-id{ font-family:var(--mono); font-size:9.5px; font-weight:800; color:var(--seal); flex-shrink:0; }
  .rf-row .rf-n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; letter-spacing:.04em; }
  .rf-row.on .rf-n{ font-weight:900; }
  .rf-row .rf-c{ font-family:var(--mono); font-size:9.5px; color:#A79F8D; flex-shrink:0; }
  .rl-h{ padding:5px 10px 3px 24px; font-size:9.5px; font-weight:700; letter-spacing:.14em; color:#A79F8D; }
  .rl-h.open{ padding:12px 4px 4px; font-size:10px; color:var(--seal); letter-spacing:.16em; }
  /* 流程 / 页面 双轴切换 */
  .mode-switch{ display:flex; gap:3px; margin-top:10px; padding:3px; background:var(--paper-dim); border-radius:8px; }
  .ms{ flex:1; border:0; background:transparent; font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink-soft); padding:5px 0; border-radius:6px; cursor:pointer; }
  .ms.on{ background:#fff; color:var(--seal-deep); box-shadow:0 1px 2px rgba(30,27,22,.1); }
  .ri .tag{ font-size:9px; letter-spacing:.08em; color:#A79F8D; border:1px solid var(--line); border-radius:3px; padding:1px 4px; flex-shrink:0; }
  .rg-h.click{ cursor:pointer; }
  .rg-h.click:hover{ color:var(--seal-deep); }
  .rg-h .cv{ margin-left:auto; font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--seal); border:1px solid rgba(196,57,47,.35); border-radius:3px; padding:1px 5px; }
  .rg-h .cv + em{ margin-left:6px; }
  .rg-fold{ padding:2px 8px 8px 21px; font-size:9.5px; letter-spacing:.08em; color:#A79F8D; }

  /* 中栏：链路 + 字段 */
  .fc-flow{ display:flex; align-items:baseline; gap:7px; padding:2px 4px 0; }
  .fc-id{ font-family:var(--mono); font-size:10px; font-weight:800; color:var(--seal); }
  .fc-n{ font-size:13px; font-weight:900; letter-spacing:.1em; }
  .fc-g{ margin-left:auto; font-size:9px; letter-spacing:.12em; color:#A79F8D; border:1px solid var(--line); border-radius:4px; padding:2px 5px; flex-shrink:0; }
  .fc-start{ margin:4px 4px 8px; font-size:10px; color:var(--ink-soft); letter-spacing:.05em; }
  .fc-empty{ padding:16px 4px; font-size:11px; color:var(--ink-soft); letter-spacing:.06em; }
  .flowcol{ background:#FAF7EF; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .fc-h{ padding:16px 16px 10px; border-bottom:1px solid var(--line); }
  .fc-h .t{ font-size:13px; font-weight:900; letter-spacing:.14em; }
  .fc-h .s{ margin-top:5px; font-size:10.5px; color:var(--ink-soft); letter-spacing:.06em; }
  .fc-body{ flex:1; overflow-y:auto; padding:12px 12px 24px; }
  .step{ display:flex; gap:10px; cursor:pointer; padding:7px 8px; border-radius:9px; }
  .step:hover{ background:#F1ECE0; }
  .step.on{ background:#fff; box-shadow:0 0 0 1px var(--line); }
  .step .idx{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--mono); font-size:10px; font-weight:800; flex-shrink:0; }
  .step.on .idx{ background:var(--ink); color:var(--paper); }
  .step .t{ font-size:12.5px; font-weight:700; letter-spacing:.03em; }
  .step .s{ margin-top:2px; font-size:10px; color:var(--ink-soft); letter-spacing:.03em; }
  .arrow{ margin:0 0 0 18px; height:14px; border-left:1.5px dashed var(--dash); }

  /* 右栏：手机 */
  .stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:18px; min-width:0; position:relative; }
  .annot{ width:392px; max-width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:10.5px; color:#6E6555; letter-spacing:.1em; }
  .annot .fl{ display:flex; align-items:center; gap:7px; }
  .annot .fl i{ width:6px; height:6px; background:var(--seal); transform:rotate(45deg); }
  .fsel{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:var(--sans); font-size:10.5px; color:var(--ink); max-width:200px; outline:none; cursor:pointer; }
  .phone{ width:392px; max-width:100%; height:min(820px, calc(100vh - 90px)); background:var(--paper-dim); border-radius:42px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 0 0 1px rgba(30,27,22,.14), 0 26px 58px rgba(30,27,22,.2); position:relative; }
  .phone::before{ content:""; position:absolute; inset:0; z-index:0; opacity:.35; pointer-events:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.1'/></svg>"); }
  .phone > *{ position:relative; z-index:1; }
  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:15px 24px 0; font-family:var(--mono); font-size:11.5px; font-weight:700; flex-shrink:0; }
  .statusbar .dots{ display:flex; gap:4px; align-items:center; }
  .statusbar .dots b{ display:block; width:3px; height:3px; border-radius:50%; background:var(--ink); }
  #screen{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .fade{ animation:fade .3s ease both; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px); } }
  .nav{ display:flex; align-items:center; gap:10px; padding:10px 16px 4px; flex-shrink:0; }
  .nav .t{ font-size:15px; font-weight:900; letter-spacing:.1em; }

  /* 底部 tab */
  .tabbar{ flex-shrink:0; display:flex; border-top:1px solid var(--line); background:rgba(255,254,250,.95); padding:5px 8px 8px; }
  .tab{ flex:1; min-height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; font-weight:700; letter-spacing:.1em; color:#9A9385; cursor:pointer; position:relative; }
  .tab svg{ width:20px; height:20px; }
  .tab.on{ color:var(--ink); }
  .tab.on::before{ content:""; position:absolute; top:-6px; width:14px; height:3px; background:var(--ink); }

  /* 按钮：纯色 + 硬投影，无渐变 */
  .cta{ border:0; border-radius:12px; background:var(--ink); color:var(--paper); min-height:50px; padding:14px 12px; font-family:var(--sans); font-size:14px; font-weight:900; letter-spacing:.16em; text-indent:.16em; cursor:pointer; box-shadow:0 4px 0 #000, 0 12px 20px -14px rgba(30,27,22,.6); transition:transform .15s, box-shadow .15s; }
  .cta:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; }
  .cta.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); box-shadow:0 4px 0 rgba(30,27,22,.85); }
  .cta.ghost:active{ box-shadow:0 1px 0 rgba(30,27,22,.85); }
  .cta.sm{ min-height:42px; font-size:12.5px; padding:10px 14px; border-radius:10px; letter-spacing:.1em; }

  /* toast */
  .toast{ position:absolute; left:50%; bottom:86px; transform:translate(-50%,12px); background:rgba(30,27,22,.94); color:var(--paper); font-size:12.5px; letter-spacing:.04em; padding:10px 16px; border-radius:9px; opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:82%; text-align:center; }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  /* ========== 首页 ========== */
  .home{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
  .scroll{ flex:1; overflow-y:auto; padding:2px 18px 18px; scrollbar-width:none; }
  .scroll.has-float{ padding-top:58px; }
  .scroll::-webkit-scrollbar{ display:none; }
  .brand{ display:flex; justify-content:space-between; align-items:center; padding:9px 2px 0; animation:fade .4s .06s both; }
  .brand .logo{ display:flex; align-items:center; font-size:14.5px; font-weight:900; letter-spacing:.28em; }
  .brand .logo::before{ content:""; width:7px; height:7px; background:var(--ink); margin-right:8px; }
  .brand .date{ font-family:var(--mono); font-size:10px; color:var(--ink-soft); letter-spacing:.08em; }
  /* 顶部：星期胶囊 + 头像 */
  .wkcap{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--line); border-radius:99px; background:var(--paper); font-size:11.5px; font-weight:700; letter-spacing:.04em; cursor:pointer; }
  .wkcap .wkcap-ar{ font-family:var(--mono); font-size:10px; color:var(--ink-soft); }
  .wkcap .wkcap-lb{ color:var(--ink); }
  .wkcap .wkcap-rg{ font-family:var(--mono); font-size:10px; color:var(--ink-soft); letter-spacing:.02em; }
  /* 账期箭头：到边界时禁用（不绑事件） */
  .wkcap-ar.off{ opacity:.25; }
  /* 月/周维度切换 pill：仅非当前侧可点 */
  .mode-pill{ display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line); border-radius:99px; background:var(--paper-dim); }
  .mode-pill .mp-m, .mode-pill .mp-w{ padding:2px 9px; font-size:11px; font-weight:700; border-radius:99px; color:var(--ink-soft); transition:all .2s; cursor:pointer; }
  .mode-pill .mp-m.on, .mode-pill .mp-w.on{ background:var(--ink); color:var(--paper); cursor:default; }
  .ava{ width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:14px; font-weight:900; cursor:pointer; }
  /* 三餐参考值网格 */
  .refgrid{ display:grid; grid-template-columns:repeat(4,1fr); margin-top:10px; border:1px solid var(--line); border-radius:10px; background:#FFFCF4; overflow:hidden; }
  .ref-cell{ padding:10px 4px 9px; text-align:center; }
  .ref-cell + .ref-cell{ border-left:1px solid var(--line); }
  .ref-cell .ref-k{ display:block; font-size:9.5px; color:var(--ink-soft); letter-spacing:.06em; }
  .ref-cell .ref-a{ display:block; margin-top:2px; font-family:var(--mono); font-size:16px; font-weight:800; color:var(--ink); }
  .ref-cell .ref-a::before{ content:"¥"; font-size:9px; font-weight:500; color:var(--ink-soft); margin-right:1px; }
  .ref-cell em{ display:block; margin-top:3px; font-style:normal; font-size:9px; color:var(--ink-soft); letter-spacing:.01em; }
  .ref-cell em.ok{ color:var(--green); font-weight:700; }
  .ref-cell em.over{ color:var(--seal-deep); font-weight:700; }
  .rc-sec .k-sub{ margin-left:6px; font-size:9.5px; font-weight:500; letter-spacing:.02em; color:var(--ink-soft); }
  .rc-sec .rc-hint{ margin-left:auto; font-size:9px; font-weight:500; letter-spacing:.02em; color:var(--ink-soft); float:right; }
  .rc-sec{ display:flex; align-items:baseline; }
  /* 领券 / 订阅 双入口 */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:13px; }
  .entry{ position:relative; padding:12px 13px; border:1.5px solid var(--line); border-radius:12px; background:var(--paper); cursor:pointer; }
  .entry:active{ transform:scale(.99); }
  .entry b{ display:block; font-size:14px; font-weight:900; letter-spacing:.06em; }
  .entry span{ display:block; margin-top:3px; font-size:10.5px; color:var(--ink-soft); letter-spacing:.02em; }
  .entry .state{ margin-top:6px; font-size:9.5px; color:var(--ink-soft); }
  .entry .go{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:14px; font-weight:800; color:var(--ink); margin:0; }
  .entry.ticket{ border-color:var(--ink); }
  .entry.sub{ background:#F7F4EC; }
  /* 明细头补一笔 & 票尾 */
  .lt-head{ display:flex; align-items:center; justify-content:space-between; }
  .lt-head .add{ font-size:11px; color:var(--ink-soft); border-bottom:1px dashed var(--dash); cursor:pointer; }
  .end-line{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--ink-soft); letter-spacing:.02em; display:flex; align-items:center; gap:6px; }
  .end-line .go{ margin-left:auto; color:var(--ink); border-bottom:1px dashed var(--dash); cursor:pointer; }
  /* 餐段标（替代 emoji） */
  .th.meal-早餐{ background:#FFF0DC; color:#B98A4E; border-color:#E8D4B8; }
  .th.meal-午餐{ background:#E5F5EE; color:#3E8C74; border-color:#BFE0D0; }
  .th.meal-晚餐{ background:#F3ECFA; color:#8B77B5; border-color:#D9CCEC; }
  .th.meal-其他{ background:#F0EBE4; color:#8E8076; border-color:#DCD3C8; }

  /* 7 日明细 */
  .wt-day{ padding:9px 17px 10px; border-top:1px solid var(--line); animation:rowIn .45s cubic-bezier(.22,1,.36,1) both; }
  .wt-day-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .wt-day-top .d{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; letter-spacing:.05em; }
  .wt-day-top .d em{ font-style:normal; font-family:var(--mono); font-size:9.5px; font-weight:400; letter-spacing:.04em; color:var(--ink-soft); }
  .wt-today{ font-size:9.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-soft); }
  .wt-day-top .sum{ font-family:var(--mono); font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
  .wt-orders{ margin-top:6px; }
  .wt-o{ display:flex; align-items:center; gap:9px; padding:5px 0; }
  .wt-o + .wt-o{ margin-top:2px; }
  .wt-o .th{ width:36px; height:36px; border-radius:9px; background:var(--paper-dim); border:1px solid var(--line); display:grid; place-items:center; font-size:17px; flex-shrink:0; }
  .wt-o .th.manual{ background:transparent; border:1.5px dashed var(--dash); font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink-soft); }
  .wt-o .od{ flex:1; min-width:0; }
  .wt-o .on{ font-size:12px; font-weight:700; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wt-o .om{ margin-top:2px; display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9px; color:var(--ink-soft); }
  .wt-o .om .tag{ font-size:8.5px; padding:1px 5px; }
  .wt-o .mo{ flex-shrink:0; font-family:var(--mono); font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums; color:#4A453C; }
  .wt-none{ padding:18px 10px; text-align:center; font-size:10.5px; letter-spacing:.08em; color:#B6AE9C; }
  .wt-del{ flex-shrink:0; min-height:32px; margin-left:2px; padding:0 6px; border:0; background:transparent; font-family:var(--sans); font-size:10px; letter-spacing:.06em; color:#A79F8D; cursor:pointer; }
  .wt-del:active{ color:var(--seal); }

  /* 订阅提醒悬浮条 */
  .subfloat{ position:absolute; top:8px; left:14px; right:14px; z-index:6; min-height:44px; display:flex; align-items:center; gap:8px; padding:9px 15px; background:var(--paper); border:1px solid var(--line); border-radius:99px; box-shadow:0 8px 20px rgba(30,27,22,.15); font-size:11.5px; cursor:pointer; animation:fade .4s .05s both; }
  .subfloat:active{ transform:scale(.99); }
  .subfloat .tx{ font-weight:900; letter-spacing:.06em; white-space:nowrap; }
  .subfloat .tm{ font-family:var(--mono); font-size:9px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subfloat .ar{ margin-left:auto; font-family:var(--mono); font-weight:800; color:var(--seal); }


  /* 参照层（V2 长票）：分段块语法 */
  .rc-block{ position:relative; margin-top:13px; padding:12px 13px 11px; background:#FFFCF4; border:1px solid var(--line); border-radius:12px; }
  .rc-sec{ margin:0 0 7px; text-align:left; font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--ink-soft); animation:fade .4s .52s both; }
  .rc-kv{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:8px; font-size:10.5px; letter-spacing:.04em; color:var(--ink-soft); animation:fade .4s .62s both; }
  .rc-kv .v{ flex-shrink:0; font-family:var(--mono); font-size:12px; color:var(--ink); letter-spacing:0; }
  .rc-dash.d2{ animation-delay:.42s; }
  .rc-prog{ display:flex; align-items:center; gap:2px; margin-top:11px; animation:fade .4s .5s both; }
  .rc-prog i{ flex:1; height:6px; background:rgba(30,27,22,.11); }
  .rc-prog i.on{ background:var(--ink); }
  .rc-prog i.over{ background:var(--seal); }
  .rc-prog .pct{ margin-left:9px; flex-shrink:0; font-family:var(--mono); font-size:9.5px; color:var(--ink-soft); }
  .rc-kv .v.word{ font-family:var(--sans); font-size:11px; letter-spacing:.04em; }
  .rc-amt.neg{ color:var(--seal-deep); }

  /* 首页 · 添加至桌面提示：右上角气泡，点任意处关闭 */
  .dt-tip{ position:absolute; top:46px; right:12px; z-index:40; max-width:196px; padding:10px 13px; background:var(--ink); color:var(--paper); font-size:12px; line-height:1.55; letter-spacing:.03em; border-radius:10px; box-shadow:0 10px 24px rgba(28,26,23,.22); animation:fade .3s ease both; }
  .dt-tip::after{ content:""; position:absolute; top:-4px; right:16px; width:9px; height:9px; background:var(--ink); transform:rotate(45deg); border-radius:2px; }

  /* ========== 周首页独立块卡片样式 ========== */
  .blk-card{ margin-top:14px; border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:12px 13px 11px; }
  .lead-card{ margin-top:14px; padding:12px 13px 11px; background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--ink); border-radius:4px 12px 12px 4px; }
  .lead-card .rc-lead{ margin-top:0; border-top:none; padding:0 0 8px; }

  /* ========== 模块3：7 天支出柱状图 ========== */
  .wkchart{ padding:0; }
  .wkchart-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .wkchart-head .wk-title{ font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--ink-soft); }

  /* 柱子绘图区：固定高，只放柱子 + 参考线（绝对定位） */
  .wkchart-area{ position:relative; margin-top:6px; height:80px; }
  .wkchart-area .wk-ref{ position:absolute; left:0; right:0; border-top:1px dashed rgba(30,27,22,.35); }
  .wkchart-area .wk-ref .wk-ref-label{ position:absolute; right:-1px; top:-11px; font-family:var(--mono); font-size:8.5px; color:rgba(30,27,22,.55); letter-spacing:.03em; padding:1px 4px 1px 5px; background:#FFFCF4; }
  .wkbars{ position:absolute; inset:0; display:flex; align-items:flex-end; }
  .wkbar-col-wrap{ flex:1; display:flex; justify-content:center; align-items:flex-end; height:100%; }
  .wkbar-col{ width:62%; max-width:18px; background:var(--ink); border-radius:2px 2px 0 0; position:relative; }
  .wkbar-col.empty{ height:0 !important; background:transparent; }
  .wkbar-col.over{ background:#C4392F; }
  .wkbar-col.over::after{ content:"▲"; position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:7px; color:#C4392F; font-weight:900; }

  /* 数值 + 日标：独立一行，正常文档流，与柱子一一对齐 */
  .wkbars-foot{ display:flex; align-items:flex-start; margin-top:4px; }
  .wkbar-foot{ flex:1; display:flex; flex-direction:column; align-items:center; }
  .wkbar-foot .wkbar-val{ font-family:var(--mono); font-size:8.5px; font-weight:700; color:var(--ink); letter-spacing:.02em; }
  .wkbar-foot .wkbar-val.empty{ color:rgba(30,27,22,.25); }
  .wkbar-foot .wkbar-lbl{ font-size:9px; color:var(--ink-soft); margin-top:2px; letter-spacing:.02em; }
  .wkbar-foot.today .wkbar-lbl{ color:var(--ink); font-weight:800; }
  .wkbar-foot.today .wkbar-lbl::after{ content:""; display:block; width:4px; height:4px; border-radius:50%; background:var(--ink); margin:1px auto 0; }

  /* 引导语（"照这样分，本周不会超"）：放在柱状图和明细之间的小条 */
  .rc-lead{ padding:8px 13px; margin-top:12px; border-top:1px dashed var(--line); font-size:10px; letter-spacing:.03em; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .rc-lead .lead-t{ font-weight:700; color:var(--ink); font-size:11px; letter-spacing:.04em; }
  .rc-lead .lead-h{ margin-left:auto; font-size:9px; color:var(--ink-soft); letter-spacing:.02em; }

  /* 长票（V2）：小票与明细连成一张纸 · 悬浮微旋转对齐探索稿 */
  @keyframes floatyFlat{ 0%,100%{ transform:rotate(-0.6deg) translateY(0); } 50%{ transform:rotate(-0.6deg) translateY(-6px); } }
  .receipt.long{ transform:rotate(-0.6deg); animation:floatyFlat 5s 1.2s ease-in-out infinite; }
  .lt-head{ margin:0 0 6px; text-align:left; animation:fade .4s 1.26s both; }
  .lt-head .p-t{ font-size:10px; font-weight:700; letter-spacing:.2em; color:var(--ink-soft); }
  .lt-act{ display:flex; align-items:center; gap:8px; min-height:40px; padding:0 2px; font-size:11px; letter-spacing:.02em; color:var(--ink); cursor:pointer; animation:fade .4s 1.32s both; }
  .lt-act + .lt-act{ animation-delay:1.38s; }
  .lt-act .ic{ width:14px; flex-shrink:0; text-align:center; font-family:var(--mono); font-weight:700; color:var(--ink-soft); }
  .lt-act .ar{ margin-left:auto; font-family:var(--mono); font-weight:700; color:var(--ink-soft); }
  .lt-act:active{ opacity:.5; }
  .lt-act.mb{ margin-bottom:8px; }
  /* 明细口径（走查标注，非产品 UI） */
  .lt-filter{ margin:0 0 8px; padding:6px 8px; border-left:2px solid var(--seal); background:rgba(196,57,47,.06); font-size:9.5px; line-height:1.7; color:var(--seal-deep); letter-spacing:.02em; animation:fade .4s 1.3s both; }
  .lt-filter b{ display:block; font-size:9.5px; font-weight:700; letter-spacing:.12em; color:var(--seal); margin-bottom:2px; }
  .lt-filter span{ display:block; }
  .receipt.long .rc-amt{ margin-top:4px; }

  .receipt.long .rc-head{ font-size:9.5px; }
  .receipt.long .rc-foot{ animation-delay:1.58s; }
  .receipt.long .barcode{ animation-delay:1.64s; }
  .receipt.long .wt-day{ margin-top:0; padding:0; border-top:0; }
  .receipt.long .wt-day + .wt-day{ margin-top:11px; padding-top:11px; border-top:1px dotted var(--line); }
  .receipt.long .rc-foot{ margin-top:19px; }
  .subfloat.slim{ left:18px; right:18px; background:var(--paper); border:0; border-bottom:1px solid var(--line); border-radius:0; box-shadow:none; padding:9px 4px; }
  .subfloat.slim .ar{ color:var(--ink); }
  .receipt.long .wt-none{ padding:16px 4px; }

  /* 明细区拆出小票后，行间距沿用长票口径 */
  .lt-wrap .wt-day{ margin-top:0; padding:0; border-top:0; }
  .lt-wrap .wt-day + .wt-day{ margin-top:11px; padding-top:11px; border-top:1px dotted var(--line); }
  .lt-wrap .wt-none{ padding:16px 4px; }

  /* 小票 */
  .rc-wrap{ margin:14px 3px 0; filter:drop-shadow(0 12px 22px rgba(30,27,22,.14)); animation:printIn .7s cubic-bezier(.22,1,.36,1) both; }
  .receipt{ position:relative; transform:rotate(-1.2deg); animation:floaty 5s 1.2s ease-in-out infinite; }
  @keyframes printIn{ 0%{ opacity:0; transform:translateY(-64px) scale(.96); } 60%{ opacity:1; transform:translateY(6px) scale(1.004); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes floaty{ 0%,100%{ transform:rotate(-1.2deg) translateY(0); } 50%{ transform:rotate(-1.2deg) translateY(-6px); } }
  .zz{ height:9px; background-repeat:repeat-x; background-size:12px 9px; }
  .zz.t{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='9'><path d='M0 9 L6 0 L12 9 Z' fill='%23FFFEFA'/></svg>"); }
  .zz.b{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='9'><path d='M0 0 L6 9 L12 0 Z' fill='%23FFFEFA'/></svg>"); }
  .rc-body{ background:var(--paper); padding:15px 19px 13px; position:relative; }
  .rc-head{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:var(--ink-soft); animation:fade .4s .2s both; }
  .rc-label{ margin-top:13px; font-size:11px; font-weight:700; letter-spacing:.26em; color:var(--ink-soft); animation:fade .4s .28s both; }
  .rc-amt{ margin-top:2px; font-family:var(--mono); font-size:44px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; animation:fade .4s .34s both; }
  .rc-amt small{ font-size:18px; font-weight:700; }
  .rc-dash{ border-top:1.5px dashed var(--dash); margin:12px 0; transform-origin:left; animation:dashIn .45s .5s both; }
  .rc-dash.d2{ animation-delay:.74s; }
  @keyframes dashIn{ from{ transform:scaleX(0); } }
  .rc-foot{ display:flex; align-items:center; gap:12px; margin-top:11px; animation:fade .4s .9s both; }
  .barcode{ height:30px; width:118px; flex-shrink:0; background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px); clip-path:inset(0 100% 0 0); animation:barIn .55s .98s ease-out both; }
  @keyframes barIn{ to{ clip-path:inset(0 0 0 0); } }
  .rc-meta{ display:flex; flex-direction:column; gap:3px; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--ink-soft); }
  .rc-meta .cn{ font-family:var(--sans); font-size:9.5px; }
  .stamp{ position:absolute; right:14px; top:56px; width:78px; height:78px; border:2.5px solid var(--green); border-radius:50%; color:var(--green); display:grid; place-items:center; text-align:center; transform:rotate(-6deg); opacity:.92; mix-blend-mode:multiply; animation:stampIn .5s .62s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes stampIn{ 0%{ opacity:0; transform:rotate(-20deg) scale(2.4); } 100%{ opacity:.92; transform:rotate(-6deg) scale(1); } }
  .stamp::before{ content:""; position:absolute; inset:5px; border:1px solid currentColor; border-radius:50%; opacity:.7; }
  .stamp::after{ content:""; position:absolute; inset:-2.5px; border:2px solid currentColor; border-radius:50%; opacity:0; animation:echo .8s .66s ease-out both; }
  @keyframes echo{ 0%{ opacity:.55; transform:scale(1); } 100%{ opacity:0; transform:scale(1.45); } }
  .stamp .t{ font-size:9.5px; font-weight:900; letter-spacing:.02em; white-space:nowrap; }
  .stamp .s{ margin-top:3px; font-family:var(--mono); font-size:7.5px; letter-spacing:.18em; }

  /* 无单小票 */
  @keyframes rowIn{ from{ opacity:0; transform:translateY(14px); } }
  .p-t{ font-size:13.5px; font-weight:900; letter-spacing:.16em; display:flex; align-items:center; }
  .p-t::before{ content:""; width:7px; height:7px; background:var(--ink); margin-right:7px; }

  /* 积分页 */
  .pg{ flex:1; overflow-y:auto; padding:6px 18px 18px; scrollbar-width:none; }
  .pg::-webkit-scrollbar{ display:none; }
  .pg-title{ margin-top:10px; font-size:23px; font-weight:900; letter-spacing:.14em; }
  .pg-sub{ margin-top:5px; font-size:11.5px; color:var(--ink-soft); letter-spacing:.06em; }
  .cp-hero{ margin-top:16px; border:1.5px solid var(--ink); border-radius:14px; background:var(--paper); padding:16px 17px; position:relative; overflow:hidden; }
  .cp-hero .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; color:var(--seal); }
  .cp-hero .t{ margin-top:8px; font-size:17px; font-weight:900; letter-spacing:.08em; }
  .cp-hero .s{ margin-top:6px; font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .cp-hero{ animation:rowIn .5s .1s cubic-bezier(.22,1,.36,1) both; }
  .cp-deco{ position:absolute; right:-14px; top:-14px; width:78px; height:78px; border:2px dashed var(--dash); border-radius:50%; }
  .cp-list{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .cp-card{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 14px; animation:rowIn .5s cubic-bezier(.22,1,.36,1) both; }
  .cp-card:nth-child(1){ animation-delay:.24s; }
  .cp-card:nth-child(2){ animation-delay:.34s; }
  .cp-logo{ width:44px; height:44px; border-radius:10px; display:grid; place-items:center; font-family:var(--mono); font-size:10px; font-weight:800; color:var(--paper); flex-shrink:0; }
  .cp-logo.mt{ background:var(--ink); } .cp-logo.el{ background:var(--seal); }
  .cp-info{ flex:1; min-width:0; }
  .cp-info .n{ font-size:13.5px; font-weight:900; letter-spacing:.04em; }
  .cp-info .v{ margin-top:3px; font-size:11.5px; color:var(--ink-soft); }
  .cp-btn{ flex-shrink:0; min-height:44px; padding:0 16px; border-radius:9px; background:var(--ink); color:var(--paper); border:0; font-family:var(--sans); font-size:12.5px; font-weight:900; letter-spacing:.1em; box-shadow:0 3px 0 #000; cursor:pointer; }
  .cp-note{ margin-top:14px; padding:11px 13px; border:1.5px dashed var(--dash); border-radius:10px; font-size:11px; color:var(--ink-soft); line-height:1.65; animation:rowIn .5s .46s cubic-bezier(.22,1,.36,1) both; }
  .cp-note b{ color:var(--ink); }

  /* 积分页：内容滚动 + 底部常驻提示条 + 吸底 tab */
  .pgwrap{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .pts-sub{ flex-shrink:0; margin:0 14px 8px; display:flex; align-items:center; gap:9px; padding:10px 13px; border:1.5px dashed var(--dash); border-radius:11px; background:var(--paper); cursor:pointer; animation:fade .4s .5s both; }
  .pts-sub:active{ background:var(--paper-dim); }
  .pts-sub .ic{ font-size:13px; flex-shrink:0; }
  .pts-sub .tx{ flex:1; min-width:0; }
  .pts-sub .tx b{ display:block; font-size:11.5px; font-weight:900; letter-spacing:.04em; }
  .pts-sub .tx small{ display:block; margin-top:2px; font-size:9.5px; color:var(--ink-soft); letter-spacing:.02em; }
  .pts-sub .go{ flex-shrink:0; font-family:var(--mono); font-size:10.5px; font-weight:800; color:var(--seal); }

  /* 外部下单 · 指示帧（纯文字，无按钮、无交互） */
  .ext{ flex:1; overflow-y:auto; padding:6px 18px 20px; }
  .ext-tag{ display:inline-block; margin-top:12px; padding:3px 8px; border:1px solid rgba(196,57,47,.45); border-radius:4px; font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--seal); }
  .ext-title{ margin-top:13px; font-size:21px; font-weight:900; letter-spacing:.06em; line-height:1.35; }
  .ext-sub{ margin-top:10px; font-size:12px; line-height:1.85; color:var(--ink-soft); letter-spacing:.02em; }
  .ext-note{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); font-size:12px; line-height:1.85; color:var(--ink-soft); letter-spacing:.02em; }
  .ext-foot{ margin-top:22px; text-align:center; font-size:10px; letter-spacing:.14em; color:#B6AE9C; }

  .tag{ font-size:9px; padding:2px 6px; border-radius:4px; border:1px solid var(--line); color:var(--ink-soft); letter-spacing:.04em; }
  .tag.hl{ border-color:rgba(196,57,47,.45); color:var(--seal); }
  .del-card{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; }
  .del-row{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:11px; color:var(--ink-soft); }
  /* 选周 / 选月抽屉：账期行列表 */
  .wk-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; padding-right:2px; }
  .wk-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:#fff; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
  .wk-row:hover{ border-color:var(--dash); background:var(--paper); }
  .wk-row.on{ border-color:rgba(196,57,47,.45); background:rgba(196,57,47,.06); }
  .wk-row .tl .n{ font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--ink); }
  .wk-row .tl .s{ margin-top:3px; font-size:10px; letter-spacing:.05em; color:var(--ink-soft); }
  .wk-row .tr{ display:flex; align-items:baseline; gap:8px; flex-shrink:0; }
  .wk-row .tr .v{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .wk-row .tr .c{ font-size:9.5px; letter-spacing:.06em; color:var(--ink-soft); white-space:nowrap; }
  .wk-row.on .tr .c{ color:var(--seal); }
  /* 无订单的账期：选择器里置灰不可点 */
  .wk-row.off{ opacity:.45; cursor:not-allowed; background:var(--paper); border-color:var(--line); }
  .wk-row.off:hover{ border-color:var(--line); background:var(--paper); }
  .wk-row.off .tr .v, .wk-row.off .tr .c{ color:var(--ink-soft); }
  .wk-note{ margin-top:10px; font-size:10px; line-height:1.6; color:var(--ink-soft); letter-spacing:.03em; }
  /* 上周账单总结抽屉 */
  .summary-sheet{ bottom:0; left:0; right:0; padding:14px 22px 30px; background:var(--paper); border-radius:24px 24px 0 0; box-shadow:0 -10px 34px rgba(30,27,22,.16); }
  .summary-sheet .grab{ width:38px; height:4px; border-radius:99px; background:#DCD5C4; margin:0 auto 16px; }
  .summary-sheet .ws-h{ display:flex; align-items:center; justify-content:space-between; }
  .summary-sheet .ws-h h3{ font-size:16px; font-weight:900; letter-spacing:.12em; color:var(--ink); }
  .summary-sheet .ws-badge{ font-size:10px; font-weight:700; letter-spacing:.08em; padding:3px 8px; border-radius:99px; border:1px solid var(--green); color:var(--green); }
  .summary-sheet .ws-badge.over{ border-color:var(--seal); color:var(--seal); }
  .summary-sheet .ws-big{ margin-top:22px; }
  .summary-sheet .ws-label{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.08em; }
  .summary-sheet .ws-num{ margin-top:4px; font-family:var(--mono); font-size:34px; font-weight:800; letter-spacing:.02em; line-height:1; }
  .summary-sheet .ws-num .c{ font-size:11px; font-weight:800; margin-right:1px; }
  .summary-sheet .ws-num.hot{ color:var(--seal); }
  .summary-sheet .ws-div{ height:1px; background:var(--line); margin:20px 0 16px; }
  .summary-sheet .ws-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; }
  .summary-sheet .ws-row .lb{ font-size:13px; color:var(--ink-soft); }
  .summary-sheet .ws-row .vl{ font-family:var(--mono); font-size:15px; font-weight:800; }
  .summary-sheet .ws-row .vl.ok{ color:var(--green); }
  .summary-sheet .ws-row .vl.bad{ color:var(--seal); }
  .summary-sheet .ws-row .vl small{ font-size:10px; font-weight:500; color:var(--ink-soft); margin-left:3px; }
  .summary-sheet .ws-hit .lb{ font-weight:700; color:var(--ink); }
  /* 四格参考值 */
  .summary-sheet .ws-grid4{ display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#FFFCF4; margin-top:6px; }
  .summary-sheet .ws-grid4 > div{ padding:11px 4px; text-align:center; }
  .summary-sheet .ws-grid4 > div + div{ border-left:1px solid var(--line); }
  .summary-sheet .ws-grid4 .k{ display:block; font-size:9.5px; color:var(--ink-soft); letter-spacing:.05em; }
  .summary-sheet .ws-grid4 .v{ display:block; margin-top:4px; font-family:var(--mono); font-size:15px; font-weight:800; }
  .summary-sheet .ws-grid4 em{ display:block; margin-top:4px; font-style:normal; font-size:9px; color:var(--ink-soft); }
  .summary-sheet .ws-grid4 em.hi{ color:var(--seal); font-weight:700; }
  .summary-sheet .ws-grid4 em.lo{ color:var(--green); font-weight:700; }
  /* 超支三列诊断 */
  .summary-sheet .ws-meal3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .summary-sheet .ws-meal3 .mc{ border:1.5px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; background:var(--paper); }
  .summary-sheet .ws-meal3 .mc b{ display:block; font-size:11.5px; font-weight:900; letter-spacing:.08em; }
  .summary-sheet .ws-meal3 .mc .mv{ margin-top:7px; font-family:var(--mono); font-size:16px; font-weight:800; }
  .summary-sheet .ws-meal3 .mc .mk{ margin-top:5px; font-size:9.5px; color:var(--ink-soft); }
  .summary-sheet .ws-meal3 .mc .mk.ok{ color:var(--green); font-weight:700; }
  .summary-sheet .ws-meal3 .mc.hit{ border-color:var(--seal); background:#FDF0EE; }
  .summary-sheet .ws-meal3 .mc.hit b{ color:var(--seal); }
  .summary-sheet .ws-meal3 .mc.hit .mk{ color:var(--seal); font-weight:700; }
  /* 引导文案 */
  .summary-sheet .ws-quote{ margin-top:18px; padding:11px 13px; background:var(--paper-dim); border-left:3px solid var(--ink); font-size:12px; line-height:1.65; letter-spacing:.02em; border-radius:0 8px 8px 0; }
  .summary-sheet .ws-quote.over{ border-left-color:var(--seal); background:#FDF0EE; }
  .summary-sheet .ws-quote b{ font-weight:900; color:var(--ink); }
  /* 按钮 */
  .summary-sheet .ws-cta{ display:block; width:100%; margin-top:16px; border:0; border-radius:14px; background:var(--ink); color:var(--paper); min-height:50px; font-family:var(--sans); font-size:14.5px; font-weight:900; letter-spacing:.16em; cursor:pointer; }
  .summary-sheet .ws-cta.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); box-shadow:none; margin-top:10px; }
  .summary-sheet .ws-dismiss{ display:block; margin:14px auto 0; background:transparent; border:0; font-family:var(--sans); font-size:12px; color:var(--ink-soft); letter-spacing:.06em; text-decoration:underline; cursor:pointer; }
  /* END 上周账单总结抽屉 */
  .del-row .v{ font-family:var(--mono); font-size:11.5px; color:var(--ink); text-align:right; }
  .del-note{ margin-top:12px; font-size:10.5px; line-height:1.7; color:var(--ink-soft); letter-spacing:.03em; }

  /* 改预算 · 二次确认抽屉：旧 → 新对比 */
  .bc-rows{ margin:2px 0 2px; }
  .bc-row{ display:flex; justify-content:space-between; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line); }
  .bc-row:last-child{ border-bottom:none; }

  /* 抽屉 */

  @keyframes maskIn{ from{ opacity:0; } }
  .sheet{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:392px; max-width:100%; background:var(--paper); border-radius:20px 20px 0 0; padding:9px 20px 22px; animation:sheetUp .3s cubic-bezier(.22,1,.36,1) both; box-shadow:0 -12px 34px rgba(30,27,22,.2); max-height:88%; overflow-y:auto; }
  @keyframes sheetUp{ from{ transform:translate(-50%,100%); } }
  .handle{ width:36px; height:4px; border-radius:99px; background:var(--dash); margin:3px auto 14px; }
  .sh-title{ font-size:18px; font-weight:900; letter-spacing:.08em; }

  .sh-label{ margin-top:16px; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--ink-soft); }
  .sh-note{ margin-top:9px; font-size:10.5px; line-height:1.65; color:var(--seal); letter-spacing:.03em; }
  .input-row{ display:flex; align-items:center; gap:8px; margin-top:7px; border:1.5px solid var(--ink); border-radius:10px; padding:11px 13px; background:#fff; }
  .input-row .pre{ font-family:var(--mono); font-size:15px; font-weight:800; }
  .input-row .unit{ margin-left:auto; font-size:10.5px; color:var(--ink-soft); }
  .input-row input{ flex:1; min-width:0; border:0; outline:none; font-family:var(--mono); font-size:18px; font-weight:800; color:var(--ink); background:transparent; }
  .meal-inputs{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
  .meal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .meal-cell{ display:flex; flex-direction:column; gap:4px; border:1.5px solid var(--ink); border-radius:10px; padding:9px 11px; background:#fff; }
  .meal-cell label{ font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--ink-soft); }
  .meal-cell input{ border:0; outline:none; font-family:var(--mono); font-size:18px; font-weight:800; color:var(--ink); background:transparent; width:100%; }
  .meal-cell .mu{ font-size:10px; color:var(--ink-soft); align-self:flex-end; letter-spacing:.04em; }
  .be-top{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px 0; }
  .be-back{ width:32px; height:32px; border-radius:50%; border:1px solid rgba(30,27,22,.12); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink); cursor:pointer; }
  .be-t{ font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--ink); }
  .be-ph{ width:32px; }
  .ob-form-meals{ margin-top:10px; }
  .ob-meals-tip{ margin-top:14px; font-size:11px; color:#A9A294; letter-spacing:.04em; }
  .date-row{ display:flex; align-items:center; gap:10px; margin-top:7px; border:1.5px solid var(--ink); border-radius:10px; padding:8px 13px; background:#fff; }
  .date-row input{ flex:1; min-width:0; border:0; outline:none; background:transparent; font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); }
  .date-row .hint{ font-size:10.5px; color:var(--ink-soft); letter-spacing:.06em; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .chip{ min-height:40px; padding:0 14px; border-radius:99px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.04em; cursor:pointer; }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .sh-actions{ display:flex; gap:9px; margin-top:18px; }
  .sh-actions .cta{ flex:1; }
  .toggle{ display:flex; align-items:center; gap:12px; margin-top:9px; padding:12px 13px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .toggle .tx{ flex:1; }
  .toggle .tx .n{ font-size:13px; font-weight:700; }
  .toggle .tx .s{ margin-top:2px; font-size:10.5px; color:var(--ink-soft); }
  .sw{ width:46px; height:26px; border-radius:99px; background:#E3DDCC; border:0; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
  .sw::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .sw.on{ background:var(--green); }
  .sw.on::after{ left:23px; }

  /* 日期订阅：整月日历多选，底部仅 +1 */
  .ds-cal-title{ margin-top:14px; font-size:11px; font-weight:900; letter-spacing:.12em; text-align:center; color:var(--ink); }
  .ds-cal-head{ display:grid; grid-template-columns:repeat(7,1fr); margin-top:9px; }
  .ds-cal-head div{ text-align:center; font-size:9px; font-weight:700; color:var(--ink-soft); letter-spacing:.06em; padding:4px 0; }
  .ds-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:4px; }
  .ds-cal-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px;
                border:1.5px solid var(--line); background:#fff; cursor:pointer; transition:.15s; }
  .ds-cal-cell .d{ font-family:var(--mono); font-size:12px; font-weight:800; color:var(--ink); }
  .ds-cal-cell.empty{ border:1.5px solid transparent; background:transparent; cursor:default; }

  .ds-cal-cell.on{ background:var(--ink); border-color:var(--ink); }

  .ds-count{ margin-top:12px; font-size:11px; color:var(--ink-soft); }
  .ds-count b{ font-family:var(--mono); font-size:15px; font-weight:800; color:var(--seal); }
  .ds-only{ margin-top:10px; }
  .ds-only .cta{ width:100%; }

  /* 成功抽屉 / 券 */
  .cs-ticket{ margin-top:14px; border:1.5px dashed var(--seal); border-radius:12px; background:rgba(196,57,47,.045); padding:15px 16px; }
  .cs-ticket .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; color:var(--seal); }
  .cs-ticket .v{ margin-top:7px; font-size:19px; font-weight:900; letter-spacing:.08em; }
  .cs-ticket .s{ margin-top:5px; font-size:11px; color:var(--ink-soft); }

  /* 占位 */
  .ph{ flex:1; display:grid; place-items:center; padding:24px; }
  .ph-box{ border:1.5px dashed var(--dash); border-radius:13px; padding:24px 20px; text-align:center; max-width:250px; background:var(--paper); }
  .ph-box .k{ font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:var(--seal); border:1px solid rgba(196,57,47,.45); border-radius:4px; padding:3px 7px; display:inline-block; }
  .ph-box .n{ margin-top:11px; font-size:15px; font-weight:900; }
  .ph-box .s{ margin-top:6px; font-size:10.5px; color:var(--ink-soft); }

  /* 订阅推送（微信服务通知 · 订阅消息模板） */
  .nt{ flex:1; display:flex; flex-direction:column; background:#EDEDED; min-height:0; }
  .nt-bar{ display:flex; align-items:center; padding:9px 16px 5px; font-size:14px; font-weight:700; color:#191919; flex-shrink:0; }
  .nt-back{ width:22px; font-size:20px; line-height:1; color:#191919; }
  .nt-title{ flex:1; text-align:center; letter-spacing:.02em; }
  .nt-more{ width:22px; text-align:right; font-size:15px; letter-spacing:1px; color:#9A9A9A; }
  .nt-date{ margin:8px 0 10px; text-align:center; font-size:10px; color:#B2B2B2; flex-shrink:0; }
  .nt-msg{ margin:0 14px; padding:12px 14px 0; background:#fff; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,.05); cursor:pointer; animation:fade .4s .12s both; }
  .nt-msg:active{ background:#FAFAFA; }
  .nt-app{ display:flex; align-items:center; gap:7px; }
  .nt-logo{ width:18px; height:18px; border-radius:4px; background:var(--seal); color:#fff; display:grid; place-items:center; font-size:10px; font-weight:900; }
  .nt-name{ font-size:11px; color:#8A8A8A; letter-spacing:.02em; }
  .nt-badge{ margin-left:auto; font-size:9px; color:#B2B2B2; letter-spacing:.04em; }
  .nt-t{ margin-top:9px; font-size:14.5px; font-weight:700; color:#191919; letter-spacing:.02em; line-height:1.4; }
  .nt-box{ margin-top:9px; padding:9px 10px; background:#F7F7F7; border-radius:4px; }
  .nt-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:3px 0; font-size:11px; color:#8A8A8A; letter-spacing:.02em; }
  .nt-row .v{ flex-shrink:0; color:#191919; font-family:var(--mono); font-size:11px; }

  .nt-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding:10px 0 11px; border-top:1px solid #F0F0F0; font-size:12px; color:#576B95; letter-spacing:.02em; }

  .nt-hint{ margin-top:16px; text-align:center; font-size:10px; letter-spacing:.1em; color:#AFAFAF; }

  /* 企微推广 · 演示帧（聊天页 + 小程序卡片） */
  .wx{ flex:1; display:flex; flex-direction:column; background:#EDEDED; min-height:0; }
  .wx-bar{ display:flex; align-items:center; padding:9px 16px 5px; font-size:14px; font-weight:700; color:#191919; flex-shrink:0; }

  .wx-row{ display:flex; gap:9px; padding:0 14px; animation:fade .4s .1s both; }
  .wx-av{ width:34px; height:34px; border-radius:5px; background:#2E7D4F; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:900; flex-shrink:0; }

  /* 分享面板 */
  .sh-row{ display:flex; align-items:center; gap:10px; margin-top:9px; padding:13px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; }

  /* 演示帧标识 */
  .dmb{ display:inline-block; margin-left:6px; font-size:8.5px; font-weight:700; letter-spacing:.1em; color:var(--seal); border:1px solid rgba(196,57,47,.4); border-radius:3px; padding:1px 4px; vertical-align:1px; }

  /* ========== 右栏：字段说明（走查层，可整体关闭） ========== */
  .app.sp-on.sp-page{ grid-template-columns:236px 318px minmax(0,1fr) 324px; }
  .specs-col{ display:none; flex-direction:column; min-height:0; background:#fff; border-left:1px solid var(--line); }
  .app.sp-on.sp-page .specs-col{ display:flex; }

  .specs-sep::after{ content:""; flex:1; height:1px; background:var(--line); }

  .sp-card .sm-big{ display:flex; align-items:baseline; gap:7px; margin-bottom:7px; }

  /* SPECS 文字叙述版 */

  function mealsSum(m){ return (Number(m.breakfast)||0) + (Number(m.lunch)||0) + (Number(m.dinner)||0) + (Number(m.other)||0); }
  /* ===== 预算模型：三餐四类为主字段，每天 / 每周 / 月预算全部派生 ===== */
  const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];   // 2026 年各月天数（写死）
  function budgetDaily(meals){ return mealsSum(meals); }
  function budgetWeek(meals){ return mealsSum(meals) * 7; }
  function budgetMonth(meals){ return mealsSum(meals) * MONTH_DAYS[MONTH.m]; }
  function saveBudgetFromMeals(meals){
    budget.meals = Object.assign({}, meals);
    budget.dailyAmount = budgetDaily(budget.meals);
    budget.weekAmount = budgetWeek(budget.meals);
    budget.monthAmount = budgetMonth(budget.meals);
  }
  /* ===== 改预算全屏帧草稿：只改三餐四类，月预算 / 周 / 日均全部派生 ===== */
  let bDraft = null;   // { month, meals }
  let bFrom = null;    // 进入改预算前的首页帧
  function resetBDraft(){
    const meals = Object.assign({}, budget.meals);
    bDraft = { month: budgetMonth(meals), meals: meals };
  }
  function openBudgetEdit(){
    bFrom = isHomeFrame(current) ? current : "home-month";
    resetBDraft();
    go("budget-edit");

  function afterBudgetSaved(){
    if (current === "guide-budget"){

      go("home-month-new");
      return;
    }
    if (bFrom === "home-week-over" || bFrom === "home-month-over") overWeekBudget = budget.weekAmount;
    const back = (bFrom && isHomeFrame(bFrom)) ? bFrom : "home-month";
    bDraft = null; bFrom = null;
    go(back);
    toast("修改成功 · 月预算 ¥" + budget.monthAmount);
  }
  const DEFAULT_MEALS = { breakfast: 10, lunch: 20, dinner: 20, other: 10 };

    meals: Object.assign({}, DEFAULT_MEALS),
    dailyAmount: budgetDaily(DEFAULT_MEALS),
    weekAmount: budgetWeek(DEFAULT_MEALS),
    monthAmount: budgetMonth(DEFAULT_MEALS)

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dayLabel(str){
    if (!str) return "今天";
    const parts = str.split("-").map(Number);
    const t = new Date(parts[0], parts[1] - 1, parts[2]);
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const diff = Math.round((now - t) / 86400000);
    if (diff === 0) return "今天";
    if (diff === 1) return "昨天";
    if (diff === 2) return "前天";
    return parts[1] + "-" + String(parts[2]).padStart(2, "0");
  }

      bag: "<path d='M4 7h16l-1.2 14H5.2z'/><path d='M8 7V5a4 4 0 0 1 8 0v2'/>",
      user: "<circle cx='12' cy='8' r='4'/><path d='M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7'/>"
    };
    return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linejoin='round'>" + (paths[name] || "") + "</svg>";
  }

  function tabbar(active){
    const items = [
      { k: "home", n: "首页", ic: "home" },

      { k: "mall", n: "积分商城", ic: "bag" },

    }).join("") + "</nav>";
  }

  /* 周首页顶部胶囊：‹ 上周 / 本周 / 更早月 ›，中间点开「选择周账单」抽屉 */
  function brand(){
    const st = weekFrameType();
    const w = WEEKS[weekViewOf(st)];
    let label = "本周";
    if (st === "past") label = w.tab;
    else if (st === "new") label = "新一周";
    const prevTo = WEEK_NAV[st] && WEEK_NAV[st].prev;
    const nextTo = WEEK_NAV[st] && WEEK_NAV[st].next;
    return "<div class='brand'>" +
      "<div class='wkcap'>" +
        "<span class='wkcap-ar" + (prevTo ? "" : " off") + "'" + (prevTo ? " data-act='week-prev'" : "") + ">‹</span>" +
        "<span class='wkcap-lb' data-act='open-weeks'>" + label + "</span>" +
        "<span class='wkcap-rg' data-act='open-weeks'>" + w.range + "</span>" +
        "<span class='wkcap-ar" + (nextTo ? "" : " off") + "'" + (nextTo ? " data-act='week-next'" : "") + ">›</span>" +
      "</div>" +
      dimPill("week") +
      "<span class='ava' data-tab='me'>小</span>" +
    "</div>";
  }

  function dayRows(w){
    const rows = w.days.map(function(d, di){ return { d: d, di: di }; })
      .filter(function(x){ return x.d.orders.length > 0; })
      .reverse();
    return rows.length ? rows.map(function(x, i){
      const d = x.d;
      const sum = dayTotal(d);
      const orders = "<div class='wt-orders'>" + d.orders.map(function(o, oi){
        if (o.manual) {
          // 外部单：餐段标 + 名称 + 时间(未填时间)·手动 + 金额 + 删
          return "<div class='wt-o'>" +
            "<span class='th manual'>" + (o.meal || "其他").charAt(0) + "</span>" +
            "<div class='od'><div class='on'>" + (o.name || "外部订单") + "</div><div class='om'>" + (MEAL_TIME[o.meal] || "未填时间") + " · 手动</div></div>" +
            "<span class='mo'>¥" + fmt(o.amt) + "</span>" +
            "<button class='wt-del' data-act='ask-delete' data-di='" + x.di + "' data-oi='" + oi + "'>删</button></div>";
        }
        const mealTag = (o.meal || "其他").charAt(0);
        return "<div class='wt-o'>" +
          "<span class='th meal-" + (o.meal || "其他") + "'>" + mealTag + "</span>" +
          "<div class='od'><div class='on'>" + o.name + (o.item ? " · " + o.item : "") + "</div>" +
          "<div class='om'>" + o.time + " · " + o.tag + "</div></div>" +
          "<span class='mo'>¥" + fmt(o.amt) + "</span></div>";
      }).join("") + "</div>";
      return "<div class='wt-day' style='animation-delay:" + (1.36 + i * 0.05).toFixed(2) + "s'>" +
        "<div class='wt-day-top'><div class='d'>" + d.w + "<em>" + d.mm + "</em>" + (d.today ? "<span class='wt-today'>今天</span>" : "") + "</div>" +
        "<div class='sum'>¥" + fmt(sum) + "</div></div>" + orders + "</div>";
    }).join("") : "<div class='wt-none'>本周还没有订单</div>";
  }

  /* 三餐参考值：= 每格默认值 −（本月有数据天均值 − 默认值）× 0.5；本月有数据天为 0 时直接用默认值；第三行仅「没吃 / 已用 ¥X」 */
  function mealRefs(curWeek, mealVals){
    const MEAL_KEYS = ["早餐", "午餐", "晚餐", "其他"];
    const MEAL_MAP = { "早餐":"breakfast", "午餐":"lunch", "晚餐":"dinner", "其他":"other" };
    const todayDay = curWeek.days.find(function(d){ return d.today; });
    const used = { "早餐":0, "午餐":0, "晚餐":0, "其他":0 };
    if (todayDay) todayDay.orders.forEach(function(o){ used[o.meal] += o.amt; });

    /* 按餐段统计本月每天的消费（合并所有周的数据），用于求「本月有数据天的均值」 */
    const sums = { "早餐":0, "午餐":0, "晚餐":0, "其他":0 };
    const days = { "早餐":0, "午餐":0, "晚餐":0, "其他":0 };
    Object.keys(WEEKS).forEach(function(k){
      WEEKS[k].days.forEach(function(d){
        const ds = {};
        d.orders.forEach(function(o){ ds[o.meal] = (ds[o.meal] || 0) + o.amt; });
        Object.keys(ds).forEach(function(m){
          if (sums[m] != null){ sums[m] += ds[m]; days[m]++; }
        });
      });
    });

    return MEAL_KEYS.map(function(m){
      const base = Number(mealVals[MEAL_MAP[m]]) || 0;
      const avg = days[m] > 0 ? sums[m] / days[m] : 0;
      const refRaw = days[m] > 0 ? Math.round(base - (avg - base) * 0.5) : base;
      const ref = refRaw < 0 ? "-" : refRaw;
      const u = used[m];
      return { key:m, amt:ref, used:u, st: u > 0 ? "已用 ¥" + u : "没吃" };
    });
  }

  /* ========== 模块3：7 天支出柱状图 ========== */
  function wkChart(w, opts){
    opts = opts || {};
    const overspend = !!opts.overspend;
    const amount = overspend ? overWeekBudget : budget.weekAmount;
    const refDaily = Math.round(amount / 7);         // 单日预算参考线
    const totals = w.days.map(function(d){ return dayTotal(d); });

    // 显示上限取 max(参考线, 实际最大)，保证柱子不被截断
    const dataMax = Math.max.apply(null, totals.concat([refDaily]));
    const refTop = Math.round((1 - refDaily / dataMax) * 100);   // 参考线距顶部 %

    // 柱子层（只含柱体，wkchart-area 绝对定位）
    const colsHtml = w.days.map(function(d, i){
      const t = totals[i];
      const over = t > refDaily;
      let colCls = "wkbar-col";
      if (t === 0) colCls += " empty";
      if (over) colCls += " over";
      const hPct = t > 0 ? Math.round(t / dataMax * 100) : 0;
      return "<div class='wkbar-col-wrap'><div class='" + colCls + "' style='height:" + hPct + "%'></div></div>";
    }).join("");

    // 数值 + 日标层（独立 flex row，正常文档流）
    const footHtml = w.days.map(function(d, i){
      const t = totals[i];
      const today = !!d.today;
      const valCls = t === 0 ? "wkbar-val empty" : "wkbar-val";
      const dayLabel = d.w ? d.w.charAt(1) : ["一","二","三","四","五","六","日"][i];
      const todayCls = today ? " today" : "";
      return "<div class='wkbar-foot" + todayCls + "'>" +
        "<div class='" + valCls + "'>" + (t > 0 ? t : "—") + "</div>" +
        "<div class='wkbar-lbl'>" + dayLabel + "</div>" +
      "</div>";
    }).join("");

    const refLine = "<div class='wk-ref' style='top:" + refTop + "%'>" +
      "<span class='wk-ref-label'>¥" + refDaily + " 参考线</span></div>";

    return "<div class='rc-block blk-card'><div class='wkchart'>" +
      "<div class='wkchart-head'>" +
        "<span class='wk-title'>本 周 7 天 支 出</span>" +
      "</div>" +
      "<div class='wkchart-area'>" + refLine +
        "<div class='wkbars'>" + colsHtml + "</div>" +
      "</div>" +
      "<div class='wkbars-foot'>" + footHtml + "</div>" +
    "</div></div>";
  }

  /* ===== 帧判定：月/周各一套（cur / past / over / new） ===== */
  function inPool(key, pool){
    key = key || current;
    return Object.keys(pool).some(function(k){ return pool[k] === key; });
  }
  function frameTypeOf(key, pool){
    key = key || current;
    let hit = "";
    Object.keys(pool).forEach(function(k){ if (pool[k] === key) hit = k; });
    return hit || "cur";
  }
  function isMonthFrame(key){ key = key || current; return inPool(key, HOME_MONTH_FRAMES) || key === "home-month-desktop"; }
  function isWeekFrame(key){ return inPool(key, HOME_WEEK_FRAMES); }
  function isHomeFrame(key){ return isMonthFrame(key) || isWeekFrame(key); }
  function monthFrameType(key){ return frameTypeOf(key, HOME_MONTH_FRAMES); }
  function weekFrameType(key){ return frameTypeOf(key, HOME_WEEK_FRAMES); }
  /* 月/周维度切换 pill：仅非当前侧可点，点击跳语义对应帧（cur↔cur、prev↔prev…） */
  function dimPill(dim){
    return "<span class='mode-pill'>" +
      "<span class='mp-m" + (dim === "month" ? " on" : "") + "'" + (dim === "month" ? "" : " data-act='dim-switch'") + ">月</span>" +
      "<span class='mp-w" + (dim === "week" ? " on" : "") + "'" + (dim === "week" ? "" : " data-act='dim-switch'") + ">周</span>" +
    "</span>";
  }
  /* 周帧态 → 周数据 key：往期跟随 viewWeek（上周或 10月8—14日） */
  function weekViewOf(stType){
    if (stType === "past") return (viewWeek === "older2") ? "older2" : "prev";
    return { cur:"cur", over:"cur", new:"newweek" }[stType] || "cur";
  }
  /* 帧跳转时把周数据指针同步到对应账期，供补卡 / 删除 / 选周抽屉使用 */
  function syncView(key){
    if (isMonthFrame(key)){
      const st = monthFrameType(key);
      if (st === "past") { if (viewWeek !== "prev" && viewWeek !== "older2") viewWeek = "prev"; }
      else viewWeek = "cur";
    } else if (isWeekFrame(key)){
      const st = weekFrameType(key);
      if (st === "past") { if (viewWeek !== "prev" && viewWeek !== "older2") viewWeek = "prev"; }
      else viewWeek = weekViewOf(st);
    }
  }

  /* ===== 月胶囊 brand：‹ 往期月 / 下月 ›，往期按选中的月份出 label ===== */
  function monthBrand(){
    const st = monthFrameType();
    let label = "2026年11月";
    if (st === "past") label = (viewMonth === "older" ? "2026年9月" : "2026年10月");
    if (st === "new") label = "2026年12月";
    const prevOn = st !== "new";
    const nextOn = (st === "past");
    return "<div class='brand'>" +
      "<div class='wkcap'>" +
        "<span class='wkcap-ar" + (prevOn ? "" : " off") + "'" + (prevOn ? " data-act='month-prev'" : "") + ">‹</span>" +
        "<span class='wkcap-lb' data-act='open-months'>" + label + "</span>" +
        "<span class='wkcap-ar" + (nextOn ? "" : " off") + "'" + (nextOn ? " data-act='month-next'" : "") + ">›</span>" +
      "</div>" +
      dimPill("month") +
      "<span class='ava' data-tab='me'>小</span>" +
    "</div>";
  }

  /* ===== 月历：金额按帧态传入，只有本期才标今天 ===== */
  function monthCal(amounts, showToday){
    const y = MONTH.y, m = MONTH.m;
    const firstDay = MONTH.firstDay, daysInMonth = MONTH.daysInMonth;
    const today = showToday ? MONTH.today : 0;
    const dayAmount = amounts || MONTH.dayAmount;

    /* 金额分档 */
    const sorted = Object.values(dayAmount).filter(function(v){ return v > 0; }).sort(function(a,b){ return a-b; });
    const quartile = Math.floor(sorted.length / 4);
    const q1 = sorted[quartile] || 20, q2 = sorted[quartile*2] || 30, q3 = sorted[quartile*3] || 40;

    let cells = "";
    /* 前置空白格 */
    for (let i = 0; i < firstDay; i++){
      cells += "<div class='cal-cell empty'></div>";
    }
    /* 每一天 */
    for (let d = 1; d <= daysInMonth; d++){
      const dow = new Date(y, m, d).getDay();
      const amt = dayAmount[d] || 0;
      let cls = "cal-cell";
      if (amt > 0) cls += " has-data";
      if (d === today) cls += " today";
      if (dow === 0 || dow === 6) cls += " weekend";
      if (amt > 0){
        if (amt <= q1) cls += " l1";
        else if (amt <= q2) cls += " l2";
        else if (amt <= q3) cls += " l3";
        else cls += " l4";
      }
      cells += "<div class='" + cls + "' data-cal-day='" + d + "'>" +
        "<span class='d'>" + d + "</span>" +
        (amt > 0 ? "<span class='v'>¥" + amt + "</span>" : "") +
      "</div>";
    }
    /* 底部统计已取消 */
    return "<div class='cal-wrap'>" +
      "<div class='cal-title'>" + (showToday ? "本 月 订 餐 日 历" : "该 月 订 餐 日 历") + "</div>" +
      "<div class='cal-head'><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>" +
      "<div class='cal-grid'>" + cells + "</div>" +
    "</div>";
  }

  /* ===== 月报版新增：本周焦点卡 ===== */
  function monthWeekCard(isNew){
    /* 新账期：无消费数据，今天可花=日均预算、本周剩=月预算全额、还有 7 天，参考值按预算显示 */
    const w = isNew ? WEEKS.newweek : WEEKS.cur;
    const wc = isNew
      ? { todayAvail: budget.dailyAmount, weekRemain: budget.weekAmount, daysLeft: 7 }
      : weekCardStats();

    /* 三餐参考值（复用 mealRefs 输出结构） */
    const refs = mealRefs(w, budget.meals);
    const refHtml = "<div class='refgrid'>" + refs.map(function(r){
      const cls = (r.st.indexOf("超") >= 0) ? "over" : (r.st.indexOf("已用") >= 0 ? "ok" : "");
      return "<div class='ref-cell'><span class='ref-k'>" + r.key + "</span><b class='ref-a'>" + r.amt + "</b><em class='" + cls + "'>" + r.st + "</em></div>";
    }).join("") + "</div>";

    return "<div class='wcard'>" +
      "<div class='wc-now'>今天可花 <b>¥" + wc.todayAvail + "</b></div>" +
      refHtml +
    "</div>";
  }

  /* ===== 小票顶部卡片：月/周统一结构，口径由调用方传入 ===== */
  function rcTop(p){
    const head = "<div class='rc-sec'>" + p.title + (p.period ? "<span class='k-sub'>· " + p.period + "</span>" : "") + "</div>";
    const amt = "<div class='rc-amt" + (p.neg ? " neg" : "") + "'><small>¥</small><span id='amtMain'>0</span></div>";
    let foot = "";
    if (p.mode === "cur" || p.mode === "over"){
      const over = p.remain <= 0;
      const barCls = over ? "over" : (p.pct <= 10 ? "low" : (p.pct <= 30 ? "warn" : "ok"));
      const bar = p.mode === "cur"
        ? "<div class='pb pb-b " + barCls + "'><div class='pb-track'><i style='width:" + p.pct + "%'></i></div></div>"
        : "";
      const avg = p.dailyAvg > 0 ? "¥" + p.dailyAvg : "-";
      foot = "<div class='pb-b-wrap'>" +
        "<div class='pb-b-row1'><span>" + (over ? "已超 <b class='over-amt'>" + Math.abs(Math.round(p.remain)) + "</b>" : "剩 <b>" + Math.round(p.remain) + "</b>") + "</span>" +
          "<span>预算 <b>" + p.budget + "</b></span></div>" +
        bar +
        "<div class='pb-b-row2'><span>日均消费 <b>" + avg + "</b></span>" +
          (p.canEdit ? "<span class='go' data-act='open-budget'>改预算 ›</span>" : "") + "</div>" +
      "</div>";
    } else if (p.mode === "past"){
      foot = "<div class='pb-b-wrap'>" +
        "<div class='pb-b-row1'><span>日均消费 <b>¥" + p.dailyAvg + "</b></span><span>预算 <b>" + p.budget + "</b></span></div>" +
      "</div>";
    }
    return head + amt + foot;
  }

  /* ===== 月首页：按帧 key 分发 4 态（cur / past / over / new）；无空态 ===== */
  function monthHome(opts){
    opts = opts || {};
    const stType = monthFrameType();
    const ms = monthStats(stType);
    const isCur = stType === "cur";
    const isPast = stType === "past";
    const isOver = stType === "over";
    const isNewMonth = stType === "new";
    const pastOlder = isPast && viewMonth === "older";

    const noStr = isNewMonth ? "12" : (isPast ? (pastOlder ? "09" : "10") : "11");

    /* 小票顶部：新账期 = 本期的空数据态（0 单、¥0.00、日均 -）；月小票不显示账期 */
    const top = rcTop({
      title: isCur || isNewMonth ? "本月总支出" : (isPast ? "该月总支出" : "本月已支出"),
      period: "",
      mode: isOver ? "over" : (isPast ? "past" : "cur"),
      amount: isOver ? MONTH.overSpent : ms.total,
      remain: budget.monthAmount - ms.total,
      budget: budget.monthAmount,
      dailyAvg: ms.dailyAvg,
      pct: budget.monthAmount > 0 ? Math.min(100, Math.round(ms.total / budget.monthAmount * 100)) : 0,
      canEdit: !isPast,
      neg: isOver,
      daysLeft: ms.daysLeft
    });

    /* 双入口：四态都渲染，固定两行文案 */
    const duo = "<div class='duo'>" +
      "<div class='entry ticket' data-act='to-points'><b>领券</b><span>领券后自动记账</span><span class='go'>›</span></div>" +
      "<div class='entry sub" + (subRefused ? " warn" : "") + "' data-act='" + (subRefused ? "open-sub-refused" : "open-subscribe") + "'><b>订阅</b><span>到点提醒花了多少</span><span class='go'>›</span></div>" +
    "</div>";

    /* 当前账期（本期 / 超支 / 新账期）统一渲染月历 + 本周卡；往期只读月历 */
    const isThisMonth = isCur || isOver || isNewMonth;
    const cal = monthCal(ms.dayAmount, !isPast);
    const wcard = isThisMonth ? monthWeekCard(isNewMonth) : "";

    /* 明细：当前账期与往期都完整渲染，新账期为 0 单空态 */
    let listBlock = "";
    if (isThisMonth || isPast){
      const lw = isNewMonth ? WEEKS.newweek : (isPast ? (pastOlder ? WEEKS.older2 : WEEKS.prev) : WEEKS.cur);
      const lst = weekStats(lw);
      const manualCount = lw.days.reduce(function(s, d){ return s + d.orders.filter(function(o){ return o.manual; }).length; }, 0);
      const listHead = "<div class='lt-head'><span class='p-t'>" + (isPast ? "该月 " : "本月 ") + lst.count + " 单</span>" +
        (isPast ? "" : "<span class='add' data-act='open-add'>补一笔</span>") + "</div>";
      const tabs = isPast ? "" : "<div class='lt-tabs'>" + ["全部","第1周","第2周","第3周","第4周","第5周"].map(function(t, i){
        return "<div class='lt-tab" + (i === 0 ? " on" : "") + "'>" + t + "</div>";
      }).join("") + "</div>";
      const endLine = lst.count > 0
        ? "<div class='end-line'>" + lst.count + " 单" + (manualCount > 0 ? " · " + manualCount + " 单手动补" : "") + " ✿" +
          "<span class='go' data-act='open-share'>" + (isPast ? "分享该月账单" : "分享本月账单") + "</span></div>"
        : "";
      const emptyBody = isNewMonth ? "<div class='wt-none'>还没有订单</div>" : dayRows(lw);
      listBlock = "<div class='rc-block lt-wrap'>" + listHead + tabs + emptyBody + endLine + "</div>";
    }

    const stampText = isCur || isNewMonth ? "本月自动记账" : (isPast ? "已结算" : "已超支");

    return "<div class='rc-wrap'><div class='receipt'>" +
      "<div class='zz t'></div><div class='rc-body'>" +
        "<div class='rc-dash d2'></div>" +
        "<div class='rc-head'><span>NO." + noStr + "</span></div>" +
        top +
        "<div class='stamp'><div><div class='t'>AUTO LOGGED</div><div class='s'>" + stampText + "</div></div></div>" +
      "</div><div class='zz b'></div></div></div>" +
      duo + cal + wcard + listBlock +
      (opts.deskTip ? "<div class='dt-tip' id='deskTip'>添加至桌面，每天快速记账</div>" : "");
  }

  /* ===== 周首页：按帧 key 分发 4 态（cur / past / over / new）；无空态 ===== */
  function weekHome(opts){
    opts = opts || {};
    const stType = weekFrameType();
    const w = WEEKS[weekViewOf(stType)];
    const st = weekStats(w);
    const isCur = stType === "cur";
    const isPast = stType === "past";
    const isOver = stType === "over";
    const isNewWeek = stType === "new";

    const amount = isOver ? overWeekBudget : budget.weekAmount;
    const remain = amount - st.total;
    const pct = amount > 0 ? Math.min(100, Math.round(st.total / amount * 100)) : 0;

    let ti = -1;
    w.days.forEach(function(d, i){ if (d.today) ti = i; });
    /* 新账期：无消费数据，今天可花=日均预算、还有 7 天 */
    const daysLeft = isNewWeek ? 7 : (ti >= 0 ? 7 - ti : 0);
    const todayAvail = isNewWeek ? budget.dailyAmount : ((isPast || isOver) ? Math.abs(remain) : (daysLeft > 0 ? Math.floor(Math.max(0, remain) / daysLeft) : 0));
    const refs = (isCur || isOver || isNewWeek) ? mealRefs(w, budget.meals) : [];
    const manualCount = w.days.reduce(function(s, d){ return s + d.orders.filter(function(o){ return o.manual; }).length; }, 0);
    /* 小票顶部：新账期 = 本期的空数据态（0 单、¥0.00、日均 -）；周小票不显示日期范围 */
    const top = rcTop({
      title: isCur || isNewWeek ? "本月总支出" : (isPast ? "该周总支出" : "本周已支出"),
      period: "",
      mode: isOver ? "over" : (isPast ? "past" : "cur"),
      amount: st.total,
      remain: remain,
      budget: amount,
      dailyAvg: st.dailyAvg,
      pct: pct,
      canEdit: !isPast,
      neg: isOver
    });

    /* 双入口：四态都渲染，固定两行文案 */
    const subAct = subRefused ? "open-sub-refused" : "open-subscribe";
    const duo = "<div class='duo'>" +
      "<div class='entry ticket' data-act='to-points'><b>领券</b><span>领券后自动记账</span><span class='go'>›</span></div>" +
      "<div class='entry sub" + (subRefused ? " warn" : "") + "' data-act='" + subAct + "'><b>订阅</b><span>到点提醒花了多少</span><span class='go'>›</span></div>" +

  /* 周一推送进来的上周账单总结抽屉（超支为0则正常，一个帧） */
  function weekSummaryView(isOver){
    const prev = WEEKS.prev;
    const prevTotal = Math.round(weekStats(prev).total);
    const prevDays = prev.days || {};
    const budgetWeek = budget.weekAmount;
    const overAmt = Math.max(0, prevTotal - budgetWeek);
    const savedAmt = Math.max(0, budgetWeek - prevTotal);

    /* 四格参考值（正常态） */
    const dailyAvg = Math.round(prevTotal / 7);
    const orderDays = Object.values(prevDays).filter(function(a){ return a > 0; }).length || 5;
    const orderDaysStr = orderDays + "/7";
    const orderCount = 9;
    const maxDayAmt = 62;
    const maxDayName = "周三";

    /* 日均对比预算 */
    const dayBudget = Math.round(budgetWeek / 7);
    const belowBudget = dailyAvg < dayBudget;

    /* 本周每天还能花多少 */
    const perDayLeft = Math.ceil(savedAmt / 7);

    /* 超支诊断（超支态） */
    const mealTotal = { breakfast: 42, lunch: 118, dinner: 281 };
    const mealBudget = { breakfast: 48, lunch: 120, dinner: 252 };
    const mealKeys = ["breakfast", "lunch", "dinner"];
    const mealName = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };

    /* 找重灾区 */
    let worstKey = "dinner", worstOver = mealTotal.dinner - mealBudget.dinner;
    mealKeys.forEach(function(k){
      const o = mealTotal[k] - mealBudget[k];
      if (o > worstOver){ worstOver = o; worstKey = k; }
    });
    const worstPct = Math.round(mealTotal[worstKey] / prevTotal * 100);
    const newBudget = Math.ceil(mealBudget[worstKey] * 1.1);

    const overStr = isOver;
    const sheetClass = "sheet summary-sheet" + (overStr ? " over" : "");
    const badgeClass = "ws-badge" + (overStr ? " over" : "");
    const badgeText = overStr ? "已超支" : "未超支";
    const numClass = "ws-num" + (overStr ? " hot" : "");

    /* 大数字 */
    const numLine = "<div class='ws-big'><div class='ws-label'>上周总支出</div>" +
      "<div class='" + numClass + "'><span class='c'>¥</span>" + prevTotal.toFixed(2) + "</div></div>";

    /* 分隔线 */
    const divider = "<div class='ws-div'></div>";

    /* 周预算 + 结余/超出 */
    const row1 = "<div class='ws-row'><span class='lb'>周预算</span><span class='vl'>¥ " + budgetWeek.toFixed(2) + "</span></div>";
    const row2 = overStr
      ? "<div class='ws-row'><span class='lb'>超出</span><span class='vl bad'>+ ¥ " + overAmt.toFixed(2) + "</span></div>"
      : "<div class='ws-row'><span class='lb'>结余</span><span class='vl ok'>+ ¥ " + savedAmt.toFixed(2) + "</span></div>";

    /* 正常态：四格参考值 */
    const grid4 = "<div class='ws-grid4'>" +
      "<div><span class='k'>日均</span><span class='v'>" + dailyAvg + "</span>" +
        "<em class='" + (belowBudget ? "lo" : "hi") + "'>" + (belowBudget ? "低于预算" : "高于预算") + "</em></div>" +
      "<div><span class='k'>有单天数</span><span class='v'>" + orderDaysStr + "</span><em>" + orderDays + " 天有记录</em></div>" +
      "<div><span class='k'>订单数</span><span class='v'>" + orderCount + "</span><em>笔</em></div>" +
      "<div><span class='k'>最高一天</span><span class='v'>" + maxDayAmt + "</span><em>" + maxDayName + "</em></div>" +
    "</div>";

    /* 超支态：三列诊断 */
    let meal3 = "<div class='ws-row ws-hit'><span class='lb'>超支从哪来？</span></div><div class='ws-meal3'>";
    mealKeys.forEach(function(k){
      const diff = mealTotal[k] - mealBudget[k];
      const hit = diff > 0;
      meal3 += "<div class='mc" + (hit ? " hit" : "") + "'><b>" + mealName[k] + "</b>" +
        "<span class='mv'>" + mealTotal[k] + "</span>" +
        "<span class='mk" + (hit ? "" : " ok") + "'>" +
        (hit ? "✗ 超 ¥" + diff : "✓ 省 ¥" + Math.abs(diff)) +
      "</span></div>";
    });
    meal3 += "</div>";

    /* 引导文案 */
    const quote = overStr
      ? "<div class='ws-quote over'>" + mealName[worstKey] + "是重灾区，占上周 <b>" + worstPct + "%</b>。<br>本周" + mealName[worstKey] + "预算已自动收紧到 <b>¥" + newBudget + "</b>／餐。</div>"
      : "<div class='ws-quote'>照这个节奏，本周每天还能花 <b>¥" + perDayLeft + "</b>。<br>比上上周省了 <b>¥26</b>，继续保持。</div>";

    /* 按钮 */
    const btnCta = overStr
      ? "<button class='ws-cta' data-act='go-over-week'>看超支明细</button>" +
        "<button class='ws-cta ghost' data-act='go-budget-edit'>调整三餐预算</button>"
      : "<button class='ws-cta' data-act='go-week-home'>看本周账单</button>" +
        "<button class='ws-cta ghost' data-act='go-budget-edit'>调整周预算</button>";

    return "<div class='sheet-mask show' data-act='close-summary'>" +
      "<div class='" + sheetClass + "' onclick='event.stopPropagation()'>" +
        "<div class='grab'></div>" +
        "<div class='ws-h'><h3>上周账单总结</h3><span class='" + badgeClass + "'>" + badgeText + "</span></div>" +
        numLine + divider + row1 + row2 +
        (overStr ? meal3 : grid4) +
        quote + btnCta +
        "<button class='ws-dismiss' data-act='close-summary'>我知道了</button>" +
      "</div>" +
    "</div>";
  }

  function countUp(id, val, dur, delay, fmtFn){
    fmtFn = fmtFn || function(v){ return fmt(v); };
    setTimeout(function(){
      const el = $(id);
      if (!el) return;
      let t0 = null;
      function step(ts){
        if (!el.isConnected) return;
        if (!t0) t0 = ts;
        const p = Math.min(1, (ts - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmtFn(val * e);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, delay);
  }
