      const n = grp.items.reduce(function(a, p){ return a + p.frames.length + (p.sheets || []).length + (p.errors || []).length; }, 0);
      const fold = grp.fold === "demo";
      const open = !fold || demoOpen;
      html += "<div class='rg'><div class='rg-h" + (fold ? " click" : "") + "'" + (fold ? " data-grp='demo'" : "") + "><i></i>" + grp.g +
        (fold ? "<span class='cv'>" + (open ? "收起" : "展开") + "</span>" : "") + "<em>" + n + "</em></div>";
      if (open) {
        grp.items.forEach(function(p){
          const on = activePage === p.k;
          html += "<div class='ri " + (on ? "on" : "") + "' data-page='" + p.k + "'><span class='dot'></span><span class='n'>" + p.n + "</span><span class='tag'>" + p.tag + "</span></div>";
        });
      } else {
        html += "<div class='rg-fold'>演示稿 · 不参与开发</div>";
      }
      html += "</div>";
    });
    $("railBody").innerHTML = html;
  }

  function isMainFrame(key){
    const page = pageOfFrame(key);
    const sp = SPECS[page];
    if (!sp) return false;
    const r = ROUTES[key];
    const isSheet = !!r && r.kind === "sheet";
    const pool = isSheet ? (sp.drawers || {}) : (sp.frames || {});
    const f = pool[key];
    return !!(f && f.main);
  }
  function pageStep(x){
    const r = ROUTES[x.k];
    const on = sheet ? frameKeyOf(sheet) === x.k : current === x.k;
    const fl = flowsOf(x.k);
    const mainBadge = isMainFrame(x.k) ? "<span class='dmb main'>主</span>" : "";
    return "<div class='step " + (on ? "on" : "") + "' data-go='" + x.k + "'>" +
      "<div class='idx'>" + (r ? r.id : "-") + "</div><div><div class='t'>" + x.t +
      mainBadge +
      (r && r.demo ? "<span class='dmb'>演示</span>" : "") + "</div>" +
      "<div class='s'>" + x.s + (fl.length ? " · 流程 " + fl.join(" / ") : " · 不挂流程") + "</div></div></div>";
  }

  function renderPageCol(){
    const p = pageById(activePage);
    const errs = p.errors || [];
    const sheets = p.sheets || [];
    const all = p.frames.concat(sheets, errs);
    const ids = [];
    all.forEach(function(x){ flowsOf(x.k).forEach(function(id){ if (ids.indexOf(id) < 0) ids.push(id); }); });
    let html = "<div class='fc-flow'><span class='fc-id'>页面</span><span class='fc-n'>" + p.n + "</span><span class='fc-g'>" + p.tag + "</span></div>" +
      "<div class='fc-start'>" + all.length + " 帧" + (ids.length ? " · 出现在流程 " + ids.join(" / ") : " · 不挂流程") + "</div>";
    if (p.frames.length){
      html += "<div class='rl-h open'>页 面 状 态</div>" + p.frames.map(pageStep).join("");
    }
    if (sheets.length){
      html += "<div class='rl-h open'>抽 屉 & 弹 层</div>" + sheets.map(pageStep).join("");
    }
    if (errs.length){
      html += "<div class='rl-h open'>异 常</div>" + errs.map(pageStep).join("");
    }
    $("flowBody").innerHTML = html;
  }

  function renderMiddle(){
    $("midTitle").textContent = railMode === "page" ? "页面状态" : "流程链路";
    $("midSub").textContent = railMode === "page" ? "左栏选页面 · 点行跳帧" : "点左栏流程 · 点帧跳转不改流程";
    if (railMode === "page") renderPageCol(); else renderFlow();
  }

  function renderAnnot(){
    const key = sheet ? frameKeyOf(sheet) : current;
    const r = ROUTES[key];
    const label = (r ? r.n : "本帧") + (r && r.demo ? " · 演示帧" : "");
    $("annotLabel").textContent = "帧 " + (r ? r.id : "-") + " · " + label;
    $("frameSel").value = key;
  }

  function renderSheet(){
    if (authPop) { $("sheet").innerHTML = authPopView(); return; }
    $("sheet").innerHTML = sheet ? currentSheetView() : "";
    if (sheet === "budget"){
      var keys = ["breakfast","lunch","dinner","other"];
      function recalc(){
        var s = 0;
        keys.forEach(function(k){ var el = $("m-"+k); if (el) s += Number(el.value) || 0; });
        var sumEl = $("mealSum"); if (sumEl) sumEl.textContent = s;
        var budEl = $("derivedBudget"); if (budEl) budEl.textContent = s * 7;
      }
      keys.forEach(function(k){
        var el = $("m-"+k);
        if (el) el.addEventListener("input", recalc);
      });
    }
  }

  /* ========== 字段说明栏 ========== */
  function specKey(){
    return sheet ? frameKeyOf(sheet) : current;
  }
  /* SPECS 采用 frames/drawers 结构，每帧一个 { main, inherits, summary } */
  function frameLabel(key){
    const r = ROUTES[key];
    return r ? r.n : key;
  }
  function specOf(key){
    const page = pageOfFrame(key);
    const sp = SPECS[page];
    if (!sp) return null;
    const r = ROUTES[key];
    const isSheet = !!r && r.kind === "sheet";
    const pool = isSheet ? (sp.drawers || {}) : (sp.frames || {});
    return pool[key] || null;
  }
  function renderSpecs(){
    const body = $("specsBody"), sub = $("specsSub");
    if (!body) return;
    const key = specKey(), r = ROUTES[key];
    const lab = (r ? "帧 " + r.id + " · " + r.n : key);
    const annots = $("stageAnnots");
    if (annots) annots.innerHTML = "";
    if (railMode !== "page") { body.innerHTML = ""; sub.textContent = "切到「页面」后显示"; return; }
    if (!$("app").classList.contains("sp-on")) { body.innerHTML = ""; sub.textContent = "已收起"; return; }
    const sp = specOf(key);
    if (!sp) { sub.textContent = lab + " · 未录入"; body.innerHTML = "<div class='specs-empty'>本帧未录入字段说明</div>"; return; }
    let badge = "";
    if (sp.main) badge = "<span class='sp-badge sp-main'>主帧</span>";
    else if (sp.inherits) badge = "<span class='sp-badge sp-inh'>继承 " + frameLabel(sp.inherits) + "</span>";
    sub.innerHTML = lab + (badge ? " · " + badge : "");
    body.innerHTML = sp.summary;
    // 给章节编号，并在手机壳右侧生成对应标注（对准模块）
    const circled = "①②③④⑤⑥⑦⑧⑨⑩";
    const hs = body.querySelectorAll(".sp-h");
    if (hs.length && annots) {
      const stage = annots.parentElement;
      const stageRect = stage.getBoundingClientRect();
      const phone = $("phone");
      const ahtml = [];
      hs.forEach(function(h, i){
        const n = circled[i] || (i + 1);
        h.innerHTML = "<span class='sp-num'>" + n + "</span>" + h.innerHTML;
        const sel = h.getAttribute("data-sp-anchor");
        let target = sel ? phone.querySelector(sel) : null;
        let top = -9999;
        if (target) {
          const tr = target.getBoundingClientRect();
          top = tr.top - stageRect.top + tr.height / 2;
        }
        const label = h.textContent.replace(/^[①②③④⑤⑥⑦⑧⑨⑩\s]+/, "").slice(0, 5);
        ahtml.push("<div class='stage-annot' data-i='" + i + "' style='top:" + top + "px'>" +
          "<span class='ln'></span><span class='num'>" + n + "</span><span class='lbl'>" + label + "</span></div>");
      });
      annots.innerHTML = ahtml.join("");
    }
  }
  function toggleSpecs(){
    const on = !$("app").classList.contains("sp-on");
    $("app").classList.toggle("sp-on", on);
    const b = $("spToggle");
    b.classList.toggle("on", on);
    b.textContent = on ? "字段 开" : "字段";
    renderSpecs();
  }

  function renderAll(force){
    if (railMode === "page") {
      activePage = pageOfFrame(sheet ? frameKeyOf(sheet) : current);
      if (isDemoPage(activePage)) demoOpen = true;   // 跳到演示页时自动展开，免得高亮看不见
    }
    renderScreen(force);
    renderRail();
    renderMiddle();
    renderAnnot();
    renderSheet();
    $("app").classList.toggle("sp-page", railMode === "page");
    renderSpecs();
    document.querySelectorAll(".ms").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === railMode); });
  }

  function go(key, keepFlow){
    current = key;
    sheet = null;
    if (key === "home-prev") { homeMode = "active"; viewWeek = "prev"; }
    else if (key === "history-empty") { homeMode = "active"; viewWeek = "older"; }
    else if (key === "history-data") { homeMode = "active"; viewWeek = "older2"; }
    else if (key === "home-newweek") { homeMode = "active"; viewWeek = "newweek"; firstWeek = false; }
    else if (key === "home-v2" || key === "home-overspend") { homeMode = "active"; viewWeek = "cur"; }
    if (!keepFlow) {
      const act = flowById(activeFlowId);
      if (!(act && inFlow(act.f, key))) {
        const hit = currentFlow();
        activeFlowId = hit ? hit.f.id : "";
      }
      markStep(activeFlowId, key);
    }
    renderAll(true);
  }

  function openSheet(kind, origin){
    sheet = kind;
    sheetOrigin = origin || current;
    if (kind === "add") addDraft = { date: defaultAddDate(), meal: "lunch", amount: "32" };
    if (kind === "date-sub") dateSel = [];
    renderAll();
  }

  function closeSheet(force){
    sheet = null;
    authPop = false;
    renderAll(force);
  }

  function toast(msg){
    let el = $("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast"; el.className = "toast";
      $("phone").appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 1900);
  }

  function frameKeyOf(kind){
    if (kind === "weeks") return "weeks-sheet";
    return { add: "add-order", subscribe: "subscribe-sheet", coupon: "coupon-success", budget: "budget-sheet", delete: "delete-confirm", share: "share-sheet" }[kind] || kind;
  }

  function selectFrame(key){
    if (key === "coupon-success") {
      activeFlowId = "1"; activeStep = { f: "1", l: 0, i: 7 };
      current = "tab-points"; homeMode = "active"; viewWeek = "cur";
      openSheet("coupon", "tab-points");
    } else if (key === "add-order") {
      activeFlowId = "1"; markStep("1", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("add", "home-v2");
    } else if (key === "subscribe-sheet") {
      activeFlowId = "3"; markStep("3", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("subscribe", "home-v2");
    } else if (key === "date-sub") {
      activeFlowId = "3"; markStep("3", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("date-sub", "home-v2");
    } else if (key === "sub-refused") {
      activeFlowId = "10"; markStep("10", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      subRefused = true;
      pendingSub = { lunch: true, dinner: false, week: false };
      openSheet("sub-refused", "home-v2");
    } else if (key === "budget-sheet") {
      activeFlowId = "2"; markStep("2", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("budget", "home-v2");
    } else if (key === "delete-confirm") {
      activeFlowId = "7"; markStep("7", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      delTarget = firstManualTarget(WEEKS.cur);
      openSheet("delete", "home-v2");
    } else if (key === "share-sheet") {
      activeFlowId = "5"; markStep("5", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("share", "home-v2");
    } else if (key === "weeks-sheet") {
      activeFlowId = "4"; markStep("4", key);
      current = "home-v2"; homeMode = "active"; viewWeek = "cur";
      openSheet("weeks", "home-v2");
    } else {
      go(key);
    }
  }

  document.addEventListener("click", function(e){
    const t = e.target;
    if (t.closest("#spToggle")) { toggleSpecs(); return; }
    if (t.dataset && t.dataset.mask) { closeSheet(); return; }

    const actEl = t.closest("[data-act]");
    if (actEl) {
      const act = actEl.dataset.act;
      if (act === "to-points") {
        const fromNewWeek = (current === "home-newweek" && activeFlowId === "1");
        go("tab-points");
        if (fromNewWeek) { activeStep = { f: "1", l: 0, i: 6 }; renderMiddle(); }
      }
      else if (act === "open-add") openSheet("add", current);
      else if (act === "open-subscribe") openSheet("subscribe", current);
      else if (act === "open-budget") openSheet("budget", current);
      else if (act === "open-weeks") openSheet("weeks", current);
      else if (act === "open-share") openSheet("share", current);
      else if (act === "open-notice") go(actEl.dataset.to || "home-v2");
      else if (act === "ask-delete") {
        delTarget = { di: Number(actEl.dataset.di), oi: Number(actEl.dataset.oi) };
        openSheet("delete", current);
      }
      else if (act === "confirm-delete") {
        if (sheet !== "delete" || !delTarget) return;
        const w = WEEKS[viewWeek];
        const d = w.days[delTarget.di];
        if (d && d.orders[delTarget.oi]) {
          const removed = d.orders.splice(delTarget.oi, 1)[0];
          delTarget = null;
          sheet = null;
          const back = /^home-/.test(current) ? current : "home-v2";
          current = back; homeMode = "active";
          viewWeek = (back === "home-prev") ? "prev" : (back === "history-empty" ? "older" : "cur");
          screenKey = "";
          activeFlowId = "7";
          activeStep = (back === "home-v2") ? { f: "7", l: 0, i: 2 } : null;
          renderAll(true);
          toast("已删除 ¥" + fmt(removed.amt) + "，统计已回滚");
        }
        return;
      }
      else if (act === "claim") {
        claimCoupon = { name: actEl.dataset.name, value: actEl.dataset.value };
        current = "tab-points";
        openSheet("coupon", "tab-points");
      }
      else if (act === "close-sheet") closeSheet();
      else if (act === "save-add") {
        if (sheet !== "add") return;
        const amt = Number(addDraft.amount);
        if (!isFinite(amt) || amt <= 0) { toast("请输入大于 0 的金额"); return; }
        const w = WEEKS[viewWeek];
        const day = w.days.filter(function(d){ return d.iso === addDraft.date; })[0];
        if (!day) { toast("只能记到当前查看的这一周"); return; }
        day.orders.push({ time: MEAL_TIME[MEAL[addDraft.meal]] || "/", name: "外部订单", tag: "外部", meal: MEAL[addDraft.meal], amt: amt, manual: true });
        day.orders.sort(function(a, b){ return a.time.localeCompare(b.time); });
        sheet = null;
        current = "home-v2";
        homeMode = "active";
        screenKey = "";
        renderAll(true);
        toast("已记入 " + day.mm + " · " + MEAL[addDraft.meal] + " ¥" + fmt(amt));
      }
      else if (act === "save-budget") {
        const meals = {};
        ["breakfast","lunch","dinner","other"].forEach(function(k){
          const el = $("m-"+k);
          meals[k] = el ? Math.max(0, Math.round(Number(el.value) || 0)) : 0;
        });
        const sum = mealsSum(meals);
        if (sum <= 0) { toast("三餐合计需大于 0"); return; }
        const newBudget = sum * 7;
        const from = current;
        budget.meals = meals;
        budget.amount = newBudget;
        budget.custom = true;
        if (from === "home-overspend") {
          // 超支态：用新预算更新参照额度；不超支就回「首页 · 有单」
          overBudget = newBudget;
          if (overBudget >= weekStats(WEEKS[viewWeek]).total) { current = "home-v2"; homeMode = "active"; }
        } else if (from === "guide-budget") {
          // 引导 ③ 保存：新账期首页落地（0 单、预算已生效），再从首页「领券」去积分页
          guideDone = true; firstWeek = true;
          current = "home-newweek"; homeMode = "active"; viewWeek = "newweek";
          activeFlowId = "1"; activeStep = { f: "1", l: 0, i: 5 };
        } else if (from === "home-v2") {
          activeFlowId = "2"; activeStep = { f: "2", l: 0, i: 2 };
        }
        sheet = null; screenKey = "";
        renderAll(true);
        toast("已保存：每日 ¥" + sum + " · 周预算 ¥" + newBudget);
      }
      else if (act === "save-sub") {
        const picked = [subDraft.lunch ? "午餐" : "", subDraft.dinner ? "晚餐" : "", subDraft.week ? "周更新" : ""].filter(Boolean);
        if (!picked.length) { toast("至少打开一个提醒"); return; }
        openSheet("date-sub", sheetOrigin || "home-v2");
      }
      else if (act === "confirm-dates") {
        if (sheet !== "date-sub") return;
        if (!dateSel.length) { toast("先选至少一天的日期"); return; }
        // 先把勾选快照存起来：微信原生授权弹窗出现后，抽屉已关闭
        pendingSub = { lunch: !!subDraft.lunch, dinner: !!subDraft.dinner, week: !!subDraft.week };
        pendingDays = dateSel.length;
        pendingLane = (activeStep && activeStep.f === "3") ? activeStep.l : -1;
        sheet = null;
        authPop = true;
        renderAll(true);
      }
      else if (act === "auth-allow") {
        authPop = false;
        subRefused = false;
        subDraft = { lunch: pendingSub.lunch, dinner: pendingSub.dinner, week: pendingSub.week };
        const n = pendingDays;
        sheet = null;
        if (pendingLane >= 0) {
          go(["push-noon", "push-eve", "push-week"][pendingLane] || "push-noon", true);
          activeStep = { f: "3", l: pendingLane, i: 3 };
          renderMiddle();
        } else {
          renderAll(true);
        }
        toast("已订阅 " + n + " 天 · 午 / 晚 / 周更 一起开通");
      }
      else if (act === "auth-deny") {
        authPop = false;
        subRefused = true;
        subDraft = { lunch: false, dinner: false, week: false };
        openSheet("sub-refused", current);
      }
      else if (act === "open-sub-refused") openSheet("sub-refused", current);
      else if (act === "demo-order") go("external-order");
      else if (act === "mp-open") {
        go("tab-points");
        activeFlowId = "1"; markStep("1", "tab-points");
        renderMiddle(); renderAnnot();
      }
      else if (act === "share-card-open") {
        if (guideDone) {
          go("home-v2");
          activeFlowId = "5"; markStep("5", "home-v2");
        } else {
          go("tab-points");
          activeFlowId = "5"; markStep("5", "tab-points");
        }
        renderMiddle(); renderAnnot();
      }
      else if (act === "share-send") { closeSheet(); toast("已唤起微信转发面板 · 卡片落积分页"); }
      else if (act === "share-poster") { closeSheet(); toast("海报已生成 · 扫码落积分页"); }
      else if (act === "share-link") { closeSheet(); toast("链接已复制 · 落地积分页"); }
      else if (act === "toast-existing") toast("详见已有功能");
      else if (act === "points-sub-ok") { guideDone = true; go("home-v2"); toast("已订阅积分到账提醒"); }
      return;
    }

    const weekEl = t.closest("[data-week]");
    if (weekEl) {
      const fromWeeks = (sheet === "weeks");
      viewWeek = weekEl.dataset.week;
      // 切周时让帧跟着周走，避免「新周」外壳套在上周数据上
      if (current === "home-overspend" && viewWeek === "cur") {
        // 超支态点「本周」，原地不动
      } else if (/^home-(v2|prev|newweek|overspend)$/.test(current) || current === "history-empty" || current === "history-data") {
        current = viewWeek === "prev" ? "home-prev"
          : (viewWeek === "older" ? "history-empty"
          : (viewWeek === "older2" ? "history-data" : "home-v2"));
        homeMode = "active";
      }
      sheet = null;
      screenKey = "";
      // 从选周抽屉里点行，流程高亮跟着落到结果帧
      if (fromWeeks && activeFlowId) markStep(activeFlowId, current);
      renderAll(true);
      return;
    }

    const flowEl = t.closest("[data-flow]");
    if (flowEl) {
      const hit = flowById(flowEl.dataset.flow);
      if (hit) {
        activeFlowId = hit.f.id;
        activeStep = { f: hit.f.id, l: 0, i: 0 };
        go(hit.f.lanes[0].steps[0].k, true);
      }
      return;
    }

    const modeEl = t.closest("[data-mode]");
    if (modeEl) {
      railMode = modeEl.dataset.mode;
      if (railMode === "page") activePage = pageOfFrame(current);
      renderAll(true);
      return;
    }

    const grpEl = t.closest("[data-grp]");
    if (grpEl) {
      demoOpen = !demoOpen;
      renderRail();
      return;
    }

    const pageEl = t.closest("[data-page]");
    if (pageEl) {
      activePage = pageEl.dataset.page;
      const p = pageById(activePage);
      const first = p.frames[0] || (p.sheets || [])[0];
      if (first) go(first.k); else { sheet = null; renderAll(true); }
      return;
    }

    const goEl = t.closest("[data-go]");
    if (goEl) {
      const k = goEl.dataset.go;
      const step = goEl.dataset.step;
      if (step) activeStep = parseStep(step);
      // 流程 10 第 1 步是拒绝前的正常首页，回到这步要把订阅卡还原
      if (k === "home-v2" && activeStep && activeStep.f === "10" && activeStep.i === 0) subRefused = false;
      // 从哪条订阅链路进来，就把对应那档默认打开
      if (k === "subscribe-sheet" && activeStep && activeStep.f === "3") {
        subDraft = { lunch: activeStep.l === 0, dinner: activeStep.l === 1, week: activeStep.l === 2 };
      }
      if (ROUTES[k] && ROUTES[k].kind === "sheet") selectFrame(k);
      else go(k, goEl.dataset.keep === "1");
      if (step) { activeFlowId = parseStep(step).f; activeStep = parseStep(step); renderMiddle(); }
      return;
    }

    const tabEl = t.closest("[data-tab]");
    if (tabEl) {
      const k = tabEl.dataset.tab;
      if (k === "home") {
        if (!guideDone) { activeFlowId = "1"; go("guide-pain"); markStep("1", "guide-pain"); }
        else go("home-v2");
      }
      else if (k === "points") go("tab-points");
      else if (k === "mall") go("tab-mall");
      else if (k === "me") go("tab-me");
      return;
    }

    const meal = t.closest("[data-meal]");
    if (meal) { addDraft.meal = meal.dataset.meal; renderSheet(); return; }

    const dateEl = t.closest("[data-date]");
    if (dateEl) {
      const iso = dateEl.dataset.date;
      const i = dateSel.indexOf(iso);
      if (i >= 0) dateSel.splice(i, 1); else dateSel.push(iso);
      renderSheet();
      return;
    }

    const sw = t.closest("[data-sub]");
    if (sw) {
      const k = sw.dataset.sub;
      subDraft[k] = !subDraft[k];
      renderSheet();
      return;
    }
  });

  document.addEventListener("input", function(e){
    const t = e.target;
    if (t.id === "addAmt") addDraft.amount = t.value;
    if (t.id === "addDate") {
      addDraft.date = t.value;
      const h = $("addDateHint");
      if (h) h.textContent = dayLabel(t.value);
    }
    if (/^m-(breakfast|lunch|dinner|other)$/.test(t.id)){
      let s = 0;
      ["breakfast","lunch","dinner","other"].forEach(function(k){ const el = $("m-"+k); if (el) s += Number(el.value) || 0; });
      const g = $("g-week"); if (g) g.textContent = s * 7;
      const gd = $("g-daily"); if (gd) gd.textContent = s;
      const ms = $("mealSum"); if (ms) ms.textContent = s;
      const db = $("derivedBudget"); if (db) db.textContent = s * 7;
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && sheet) closeSheet();
  });

  function tick(){
    const d = new Date();
    $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  (function init(){
    tick();
    setInterval(tick, 30000);
    const keys = Object.keys(ROUTES).sort(function(a, b){ return ROUTES[a].id - ROUTES[b].id; });
    $("frameSel").innerHTML = keys.map(function(k){
      return "<option value='" + k + "'>" + ROUTES[k].id + " · " + ROUTES[k].n + (ROUTES[k].demo ? "（演示）" : "") + "</option>";
    }).join("");
    $("frameSel").addEventListener("change", function(){ selectFrame(this.value); });
    go("home-v2");
  })();
})();
</script>
</body>
</html>
