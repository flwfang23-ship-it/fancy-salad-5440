<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵饭堂 · V4.8 · 双向互动、每日额度与隐藏勋章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   A. 工作台外壳 —— 仿 V3-R1 三栏结构（236 / 306 / 1fr）
   ═══════════════════════════════════════════════════════════ */
:root{
  --wb-bg:#F6F4EF; --wb-paper:#FCFAF6; --wb-panel:#FFFFFF;
  --wb-ink:#2C2621; --wb-ink2:#6B6157; --wb-ink3:#A79C90;
  --wb-line:#EAE4DA; --wb-line2:#F2EDE5; --wb-accent:#B9713F; --wb-accent2:#8E5530; --wb-soft:#F5EADF;
  --wb-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --wb-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* 手机壳内 —— 照 02-页面示例 三份样稿的视觉规范 */
  --bg:#F7F7F7; --card:#FFFFFF;
  --ink:#16181D; --ink-2:#5E636B; --ink-3:#9BA1A9;
  --line:#EDEEF1; --line-2:#E2E4E8;
  --brand:#2EC46B; --brand-d:#159A50; --brand-soft:#EDFBF3; --brand-line:#CFEFDD;
  --r-lg:20px; --r-md:16px;
  --shadow:0 1px 2px rgba(20,24,30,.04),0 8px 22px rgba(20,24,30,.05);
  --num:'Archivo','PingFang SC',sans-serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100vh;overflow:hidden;background:var(--wb-bg);font-family:var(--wb-sans);color:var(--wb-ink)}
.app{display:grid;grid-template-columns:236px 306px minmax(0,1fr);height:100vh}
.rail{background:var(--wb-panel);border-right:1px solid var(--wb-line);display:flex;flex-direction:column;min-height:0}
.rail-h{padding:18px 16px 12px;border-bottom:1px solid var(--wb-line2)}
.rail-h .k{font-size:9.5px;letter-spacing:.22em;color:var(--wb-ink3)}
.rail-h .t{margin-top:8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.rail-h .s{margin-top:6px;font-size:10.5px;color:var(--wb-ink3)}
.rail-body{flex:1;overflow-y:auto;padding:10px 10px 20px}
.mode-switch{display:flex;gap:2px;margin-bottom:8px;padding:3px;background:var(--wb-bg);border-radius:7px}
.ms{flex:1;border:0;background:transparent;font-size:11px;color:var(--wb-ink3);padding:6px 0;border-radius:5px;cursor:pointer;font-family:var(--wb-sans)}
.ms.on{background:var(--wb-panel);color:var(--wb-ink);font-weight:800;border:1px solid var(--wb-line)}
.rg-h{padding:12px 8px 6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--wb-ink2)}
.ri{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--wb-ink2)}
.ri:hover{background:var(--wb-bg)}
.ri.on{background:var(--wb-paper);color:var(--wb-ink);font-weight:700;border:1px solid var(--wb-line)}
.ri .n{flex:1}
.ri .c{font-family:var(--wb-mono);font-size:9px;color:var(--wb-ink3)}
.ri.route-node{border-left:2px solid var(--brand-line);padding-left:9px}
.ri.route-node.on{border-left-color:var(--brand-d)}
.route-subs{margin-top:2px}
.route-subs .rs-h{font-size:10px;font-weight:800;color:var(--wb-ink2);margin-bottom:6px}
.route-subs .rs-list{display:flex;flex-wrap:wrap;gap:4px}
.route-subs .rs{font-family:var(--wb-mono);font-size:9px;padding:2px 6px;border-radius:5px;background:var(--wb-bg);color:var(--wb-ink3);border:1px solid var(--line-2)}
.route-subs .rs.on{background:var(--brand-soft);color:var(--brand-d);border-color:var(--brand-line);font-weight:700}
.flowcol{background:var(--wb-paper);border-right:1px solid var(--wb-line);display:flex;flex-direction:column;min-height:0}
.fc-h{padding:16px 16px 10px;border-bottom:1px solid var(--wb-line2)}
.fc-h .t{font-size:12.5px;font-weight:800}
.fc-h .s{margin-top:5px;font-size:10.5px;color:var(--wb-ink3);line-height:1.5}
.fc-body{flex:1;overflow-y:auto;padding:12px 12px 24px}
.fc-grp{padding:13px 4px 5px;font-size:9px;letter-spacing:.12em;color:var(--wb-ink3);font-weight:700}
.step{display:flex;gap:10px;cursor:pointer;padding:7px 8px;border-radius:7px}
.step:hover{background:var(--wb-bg)}
.step.on{background:var(--wb-panel);border:1px solid var(--wb-line)}
.step .idx{min-width:38px;height:21px;padding:0 6px;border-radius:6px;border:1px solid var(--wb-line);display:grid;place-items:center;font-family:var(--wb-sans);font-size:9px;flex-shrink:0;color:var(--wb-ink2);white-space:nowrap}
.step.on .idx{background:var(--wb-ink);border-color:var(--wb-ink);color:#fff}
.step .t{font-size:12px;font-weight:500}
.step .s{font-size:10px;color:var(--wb-ink3);margin-top:2px}
.arrow{margin:0 0 0 18px;height:12px;border-left:1px dashed var(--wb-line)}
.stage{display:flex;gap:22px;align-items:center;justify-content:center;padding:22px;min-width:0;overflow:auto}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.phone-cap{font-size:10px;color:var(--wb-ink3);letter-spacing:.12em}
.phone{width:392px;max-width:100%;height:min(820px,calc(100vh - 96px));background:var(--bg);border:1px solid var(--wb-line);border-radius:42px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel{width:284px;flex:none;background:var(--wb-panel);border:1px solid var(--wb-line);border-radius:14px;height:min(820px,calc(100vh - 96px));display:flex;flex-direction:column;overflow:hidden;align-self:center}
.panel-h{padding:15px 16px 12px;border-bottom:1px solid var(--wb-line2)}
.panel-h .k{font-size:9.5px;letter-spacing:.2em;color:var(--wb-ink3)}
.panel-h .t{font-size:13px;font-weight:800;margin-top:7px}
.panel-h .d{font-size:10.5px;color:var(--wb-ink2);margin-top:6px;line-height:1.6}
.panel-b{flex:1;overflow-y:auto;padding:15px 16px}
.sec{margin-bottom:17px}
.sec h4{font-size:10px;letter-spacing:.12em;color:var(--wb-accent);font-weight:800;margin-bottom:8px}
.rule{display:flex;gap:8px;font-size:11px;line-height:1.65;color:var(--wb-ink2);margin-bottom:7px}
.rule i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--wb-accent);margin-top:7px}
.api{font-family:var(--wb-mono);font-size:9.5px;color:var(--wb-accent2);background:var(--wb-paper);border:1px solid var(--wb-line2);border-radius:5px;padding:5px 7px;display:inline-block;margin:0 5px 6px 0}
.state-box{font-family:var(--wb-mono);font-size:10px;line-height:1.9;color:var(--wb-ink2);background:var(--wb-paper);border:1px solid var(--wb-line2);border-radius:8px;padding:10px 12px}
.state-box b{color:var(--wb-accent2)}
.panel-f{padding:11px 16px;border-top:1px solid var(--wb-line2);font-size:9.5px;color:var(--wb-ink3);line-height:1.5}

/* ═══════════════════════════════════════════════════════════
   B. 手机壳内 —— 视觉规范取自 02-页面示例（会员成长/邀请好友/外卖点餐）
   ═══════════════════════════════════════════════════════════ */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:13px 24px 0;font:700 12.5px/1 var(--num);flex:none;color:var(--ink)}
.sb-icons{display:flex;align-items:center;gap:5px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px;flex:none}
.appbar h1{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;font-family:var(--sans)}
.appbar h1 em{font-style:normal;position:relative;z-index:0}
.appbar h1 em::after{content:"";position:absolute;left:-1px;right:-1px;bottom:2px;height:7px;border-radius:3px;background:rgba(46,196,107,.24);z-index:-1}
.capsule{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:999px;background:#fff;color:var(--ink-2);pointer-events:none;flex:none}
.capsule i{width:1px;height:12px;background:var(--line-2)}
.annot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 8px;font-size:10px;color:var(--ink-3);flex:none;font-family:var(--sans)}
.annot .fl{display:flex;align-items:center;gap:7px;min-width:0}
.annot .fl i{width:5px;height:5px;border-radius:50%;background:var(--brand);flex:none}
.fsel{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:5px 7px;font-size:9.5px;color:var(--ink-2);max-width:180px;outline:none;cursor:pointer;font-family:var(--sans);flex:none}
.page{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:6px 16px 24px;scrollbar-width:none;font-family:var(--sans)}
.page::-webkit-scrollbar{display:none}
.page>*{flex:0 0 auto}
.card,.cta,.party-banner,.cp-sign{animation:rise .46s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*65ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-title{position:relative;padding-left:11px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-title::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:2px;background:var(--brand)}
.sec-more{font-size:11.5px;color:var(--ink-3)}
/* 饭堂现场 · 2D 桌子场景（表达逻辑照旧稿 V3-R2：座位 + 动销） */
.party-banner{display:flex;align-items:center;gap:10px;padding:13px 15px;border:1.5px solid var(--brand-line);border-radius:var(--r-md);background:var(--brand-soft)}
.party-banner .pb-em{font-size:23px;flex:none}
.party-banner .pb-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.party-banner .pb-tx b{font-size:14.5px;font-weight:700;color:var(--ink)}
.party-banner .pb-tx small{font-size:10.5px;color:var(--brand-d)}
.party-banner .pb-live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--brand-d);flex:none}
.party-banner .pb-live i{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:blink 1.9s infinite}
@keyframes blink{50%{opacity:.3}}
/* 状态筛选 tab：饭堂首页左上角，全部 + 三态 */
.status-tabs{display:flex;gap:6px;padding:0;overflow-x:auto;scrollbar-width:none;font-family:var(--sans)}
.status-tabs::-webkit-scrollbar{display:none}
.st-tab{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid var(--line-2);border-radius:99px;background:#fff;color:var(--ink-2);font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}
.st-tab i{font-style:normal;font-family:var(--num);font-size:10px;color:var(--ink-3)}
.st-tab.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(46,196,107,.28)}
.st-tab.on i{color:rgba(255,255,255,.85)}
.st-tab:not(.on):hover{border-color:var(--brand);color:var(--brand-d)}
.room-empty{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--ink-3);font-size:12px;font-family:var(--sans)}
.room{position:relative}
.room-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 10px;border-bottom:1px dashed var(--line-2);margin-bottom:12px}
.room-bar .rb-t{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.room-bar .rb-live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--brand-d);flex:none}
.room-bar .rb-live i{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:blink 1.9s infinite}
.room-tables{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.dtbl{position:relative;height:160px;border:1px solid var(--line-2);border-radius:16px;background:#FAFBFC}
.dtbl.wide{grid-column:1/-1;height:164px}
/* 桌面包得住座位气泡：顶部座位下移 18px，气泡（-14px）仍在桌内 */
.dt-surface{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:46px;border:1px solid var(--line-2);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.dtbl.wide .dt-surface{width:120px;height:50px}
.dt-no{font-family:var(--num);font-size:8px;color:var(--ink-3)}
.dt-mood{font-size:8px;color:var(--brand-d);font-weight:700;white-space:nowrap}
.dt-seat{position:absolute;width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;cursor:pointer}
.pos-t{top:18px;left:50%;transform:translateX(-50%)}
.pos-b{bottom:8px;left:50%;transform:translateX(-50%)}
.pos-l{left:4px;top:50%;transform:translateY(-50%)}
.pos-r{right:4px;top:50%;transform:translateY(-50%)}
.dtbl.wide .pos-l{left:8%}
.dtbl.wide .pos-r{right:8%}
.dt-seat:hover{background:var(--brand-soft)}
.dt-seat.empty{border:1.5px dashed var(--line-2);background:#fff}
.dt-seat.empty:hover{border-color:var(--brand);background:var(--brand-soft)}
.dt-plus{font-size:16px;color:var(--ink-3);font-weight:300;line-height:1}
.dt-cat{font-size:22px;line-height:1;position:relative;display:block}
.dt-act{position:absolute;right:-4px;bottom:-2px;font-size:10px;line-height:1}
.dt-seat.me{background:var(--brand-soft);border:1.5px solid var(--brand);cursor:pointer}
.dt-me-tag{position:absolute;bottom:-4px;right:-2px;background:var(--brand);color:#fff;font-size:8px;font-weight:800;padding:1px 6px;border-radius:8px;white-space:nowrap}
/* 头顶餐食气泡：在吃什么一眼可见；还没想好显示「?」 */
.food-bubble{position:absolute;z-index:6;top:-14px;left:50%;transform:translateX(-50%);min-width:21px;height:21px;padding:0 4px;border:1.5px solid var(--brand-line);border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;pointer-events:none;white-space:nowrap}
.food-bubble:after{content:"";position:absolute;left:50%;bottom:-4px;width:6px;height:6px;background:#fff;border-right:1.5px solid var(--brand-line);border-bottom:1.5px solid var(--brand-line);transform:translateX(-50%) rotate(45deg)}
.food-bubble.think{border-color:var(--line-2);color:var(--ink-3);font-size:10px;font-weight:800;background:var(--bg);border-style:dashed}
.food-bubble.think:after{background:var(--bg);border-color:var(--line-2)}
.food-bubble.wait{border-color:#d9a441;background:#fff8e6;color:#8a5d00}
.food-bubble.wait:after{background:#fff8e6;border-color:#d9a441}
.food-bubble.wait:before{content:"⏳";font-size:9px;margin-right:2px}
.food-bubble.eat{border-color:#4f9d69;background:#f1f9f3}
.food-bubble.eat:after{background:#f1f9f3;border-color:#4f9d69}
.food-bubble.eat:before{content:"🍚";font-size:9px;margin-right:2px}
/* 动作动销：每种动作一套独立动画 */
.dt-seat.act-chew .dt-cat{animation:scChew 1.5s ease-in-out infinite;transform-origin:50% 76%}
.dt-seat.act-sip .dt-cat{animation:scSip 2.6s ease-in-out infinite;transform-origin:50% 80%}
.dt-seat.act-zZ .dt-cat{animation:scBreathe 2.9s ease-in-out infinite;transform-origin:50% 92%}
.dt-seat.act-peek .dt-cat{animation:scPeek 2.2s ease-in-out infinite}
.dt-seat.act-wait .dt-cat{animation:scWait 2.1s ease-in-out infinite;transform-origin:50% 85%}
.dt-seat.act-delivered .dt-cat{animation:scHop 1.4s ease-in-out infinite}
@keyframes scChew{0%,100%{transform:rotate(0) translateY(0)}18%{transform:rotate(9deg) translateY(2px)}34%{transform:rotate(-4deg) translateY(1px)}52%{transform:rotate(8deg) translateY(2px)}70%{transform:rotate(0) translateY(0)}84%{transform:rotate(-3deg) translateY(0)}}
@keyframes scSip{0%,26%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-3px) rotate(-8deg)}54%{transform:translateY(-2px) rotate(-6deg)}70%{transform:translateY(0) rotate(0)}}
@keyframes scBreathe{0%,100%{transform:scale(1,1) rotate(-4deg)}50%{transform:scale(1.06,1.03) rotate(-6deg)}}
@keyframes scPeek{0%,20%,100%{transform:translateX(0) translateY(0)}35%{transform:translateX(4px) translateY(-2px)}48%{transform:translateX(4px) translateY(-2px)}62%{transform:translateX(-1px) translateY(1px)}}
@keyframes scWait{0%,100%{transform:translateY(0)}45%{transform:translateY(-3px)}60%{transform:translateY(0)}}
@keyframes scHop{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-4px) scale(1.06)}}
.dt-seat.act-zZ .dt-cat:after{content:"z Z";position:absolute;right:-11px;top:-12px;font-size:9px;line-height:1;color:var(--ink-3);font-weight:800;animation:scZ 2.9s ease-out infinite;pointer-events:none}
@keyframes scZ{0%{opacity:0;transform:translate(0,2px) scale(.7)}35%{opacity:1;transform:translate(3px,-4px) scale(1)}80%,100%{opacity:0;transform:translate(7px,-12px) scale(1)}}
/* 场景故事气泡：落在餐桌内的座位间空角，不遮座位与餐食气泡；两行文案；尾巴朝发言猫 */
.dt-bubble{position:absolute;z-index:3;padding:5px 8px;background:#fff;border:1px solid var(--line-2);border-radius:10px;font-size:9px;line-height:1.5;color:var(--ink-2);text-align:center;pointer-events:none;box-shadow:var(--shadow)}
.dt-bubble:after{content:"";position:absolute;width:8px;height:8px;background:#fff;transform:rotate(45deg)}
.dt-bubble.tail-b:after{left:var(--tx,14px);bottom:-5px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.dt-bubble.tail-r:after{top:var(--ty,12px);right:-5px;border-top:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.dt-bubble.tail-l:after{top:var(--ty,12px);left:-5px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.encounter-entry{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px;border:1px solid var(--line-2);border-radius:14px;background:#fff;text-align:left;cursor:pointer;font-family:var(--sans);transition:background .15s,border-color .15s}
.encounter-entry:active{background:var(--brand-soft);border-color:var(--brand-line)}
.encounter-entry .ee-ic{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--brand-soft);font-size:19px;flex:none}
.encounter-entry .ee-tx{flex:1;min-width:0}
.encounter-entry .ee-tx b{display:block;font-size:12.5px;color:var(--ink);font-weight:700}
.encounter-entry .ee-tx small{display:block;margin-top:3px;font-size:10px;color:var(--ink-3)}
.encounter-entry .ee-go{font-size:11px;color:var(--brand-d);font-weight:700;white-space:nowrap}

/* 今日饭桌话题：轻提醒 + 饭堂入口卡片 + 统一底部抽屉 */
.topic-reminder{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--brand-line);border-radius:14px;background:#F4FCF7;font-family:var(--sans);animation:rise .3s ease both}
.topic-reminder .tr-ill{width:42px;height:42px;border-radius:13px;background:#E4F7EB;display:grid;place-items:center;font-size:22px;flex:none}
.topic-reminder .tr-copy{flex:1;min-width:0}
.topic-reminder .tr-copy b{display:block;font-size:12px;color:var(--ink);font-weight:800}
.topic-reminder .tr-copy small{display:block;margin-top:3px;font-size:10px;color:var(--ink-3);line-height:1.4}
.topic-reminder .tr-actions{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.topic-reminder .tr-open{border:0;border-radius:999px;background:var(--brand);color:#fff;padding:7px 10px;font:700 10px var(--sans);white-space:nowrap;cursor:pointer}
.topic-reminder .tr-later{border:0;background:transparent;color:var(--ink-3);font:10px var(--sans);cursor:pointer}
.topic-sheet{font-family:var(--sans)}
.topic-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 13px}
.topic-kicker span{font-size:10px;color:var(--ink-3)}
.topic-state{padding:5px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-d);font-size:10px;font-weight:800}
.topic-question{font-size:21px;line-height:1.4;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:6px 0 5px}
.topic-sub{font-size:11px;line-height:1.6;color:var(--ink-3);margin-bottom:14px}
.topic-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.topic-option{min-height:76px;border:1px solid var(--line-2);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px;padding:12px;cursor:pointer;text-align:left;font-family:var(--sans)}
.topic-option:active{border-color:var(--brand);background:var(--brand-soft)}
.topic-option .to-emoji{font-size:21px;line-height:1}
.topic-option b{font-size:12px;color:var(--ink);font-weight:700}
.topic-footnote{margin-top:12px;text-align:center;font-size:10px;color:var(--ink-3)}
.topic-result-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.topic-result-head b{font-size:14px;color:var(--ink)}
.topic-total{font-size:10px;color:var(--ink-3)}
.topic-result-row{margin:10px 0 12px}
.topic-result-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--ink-2)}
.topic-result-label b{font-weight:700;color:var(--ink)}
.topic-track{height:8px;border-radius:99px;background:#F0F1F2;overflow:hidden}
.topic-track i{display:block;height:100%;border-radius:99px;background:#2EC46B}
.topic-result-row.selected .topic-track i{background:#F06B36}
.topic-result-row.selected .topic-result-label b{color:#D85D2B}
.topic-comments{margin-top:17px;padding-top:13px;border-top:1px solid var(--line-2)}
.topic-comments-title{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:10px}
.topic-comment{display:flex;align-items:flex-start;gap:9px;padding:8px 0}
.topic-comment .tcc-face{width:31px;height:31px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:17px;flex:none}
.topic-comment .tcc-body{flex:1;min-width:0}
.topic-comment .tcc-body b{display:block;font-size:10.5px;color:var(--ink);margin-bottom:3px}
.topic-comment .tcc-body span{font-size:11px;color:var(--ink-2);line-height:1.5}
.topic-ended{padding:10px 12px;border-radius:12px;background:#F6F6F6;color:var(--ink-2);font-size:11px;line-height:1.6;margin-bottom:12px}
.topic-test-tools{padding:12px;border:1px solid var(--wb-line2);border-radius:9px;background:var(--wb-paper);margin-bottom:16px}
.topic-test-tools .tt-title{font-size:10px;font-weight:800;color:var(--wb-accent);margin-bottom:6px}
.topic-test-tools .tt-now{font:10px var(--wb-mono);color:var(--wb-ink2);margin-bottom:8px}
.topic-test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.topic-test-grid button,.topic-test-reset{border:1px solid var(--wb-line);border-radius:6px;background:#fff;padding:6px 3px;font:10px var(--wb-sans);color:var(--wb-ink2);cursor:pointer}
.topic-test-grid button:active,.topic-test-reset:active{background:var(--wb-soft)}
.topic-test-reset{width:100%;margin-top:6px;color:var(--wb-accent2)}
.sheet.topic-sheet{max-height:84%;padding-bottom:26px}
/* 猫咪偶遇：轻动作互动选择与反馈 */
.interaction-target{display:flex;align-items:center;gap:10px;margin:2px 0 13px;padding:10px 11px;border-radius:13px;background:var(--bg)}
.interaction-target>span{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#fff;font-size:25px;flex:none}
.interaction-target>div{flex:1;min-width:0}
.interaction-target b{display:block;font-size:12.5px;color:var(--ink);font-weight:800}
.interaction-target small{display:block;margin-top:4px;font-size:10px;line-height:1.5;color:var(--ink-3)}
.interaction-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.interaction-choice{min-height:82px;display:flex;align-items:center;gap:9px;padding:11px 10px;border:1px solid var(--line-2);border-radius:14px;background:#fff;text-align:left;cursor:pointer;font-family:var(--sans);transition:background .15s,border-color .15s,transform .15s}
.interaction-choice:active{background:var(--brand-soft);border-color:var(--brand);transform:scale(.985)}
.interaction-choice.sent{opacity:.48;background:#F7F7F7;cursor:default}
.interaction-choice .ic-emoji{font-size:25px;flex:none}
.interaction-choice .ic-copy{flex:1;min-width:0}
.interaction-choice .ic-copy b{display:block;font-size:12px;color:var(--ink);font-weight:800}
.interaction-choice .ic-copy small{display:block;margin-top:4px;font-size:9.5px;color:var(--ink-3);line-height:1.4}
.interaction-choice .ic-state{font-size:9px;color:var(--brand-d);font-weight:800;white-space:nowrap}
.interaction-privacy-note,.received-stat-note{margin-top:11px;font-size:10px;line-height:1.6;color:var(--ink-3)}
.interaction-soft-note{margin-top:12px;font-size:10px;line-height:1.6;text-align:center;color:var(--ink-3)}
.interaction-quota{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 2px;padding:10px 11px;border-radius:12px;background:#F5F8F6;border:1px solid #E4F0E8}
.interaction-quota b{font-size:11px;color:var(--ink);white-space:nowrap}
.interaction-quota span{font-size:10px;color:var(--ink-2);text-align:right;line-height:1.5}
.interaction-quota.is-full{background:#FBF5EF;border-color:#F0E2D3}
.interaction-quota.is-full b{color:#9A5C2F}
.interaction-quota-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.interaction-quota-mini>div{padding:8px 6px;border-radius:10px;background:#F7F8F8;text-align:center}
.interaction-quota-mini b{display:block;font:700 13px var(--num);color:var(--ink)}
.interaction-quota-mini small{display:block;margin-top:3px;font-size:9px;color:var(--ink-3)}
.interaction-result-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.interaction-result-pair>div{padding:9px 7px;border-radius:10px;background:#F7F8F8;text-align:center}
.interaction-result-pair b{display:block;font-size:13px;color:var(--brand-d)}
.interaction-result-pair small{display:block;margin-top:3px;font-size:9px;color:var(--ink-3)}
.interaction-session-tools{display:flex;gap:6px;margin:8px 0}
.interaction-session-tools button{flex:1;border:1px solid var(--wb-line);border-radius:6px;background:#fff;padding:7px 4px;font:10px var(--wb-sans);color:var(--wb-ink2);cursor:pointer}
.interaction-session-tools button.on{background:var(--wb-soft);border-color:var(--wb-accent);color:var(--wb-accent2);font-weight:800}
.interaction-stage{display:flex;align-items:center;justify-content:center;gap:15px;padding:20px 12px 16px;border-radius:17px;background:var(--brand-soft)}
.interaction-performer{display:flex;flex-direction:column;align-items:center;gap:5px;animation:catInteractionBob 1.15s ease-in-out infinite alternate}
.interaction-performer.target{animation-delay:.18s}
.interaction-performer>span{width:66px;height:66px;display:grid;place-items:center;border-radius:21px;background:#fff;font-size:38px;box-shadow:0 4px 12px rgba(30,50,40,.07)}
.interaction-performer small{font-size:10px;color:var(--ink-2);font-weight:700}
.interaction-action-mark{font-size:31px;animation:interactionPop .72s ease-in-out infinite alternate}
@keyframes catInteractionBob{from{transform:translateY(3px) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
@keyframes interactionPop{from{transform:scale(.88) rotate(-8deg)}to{transform:scale(1.12) rotate(8deg)}}
.interaction-result-title{margin-top:15px;text-align:center;font-size:16px;font-weight:800;color:var(--ink)}
.interaction-result-copy{margin-top:8px;padding:12px 14px;border-radius:13px;background:var(--bg);font-size:12px;line-height:1.7;color:var(--ink-2);text-align:center}
.interaction-count-result{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:13px;font-size:11px;color:var(--ink-2)}
.interaction-count-result b{font-size:15px;color:var(--brand-d);font-weight:800}
.received-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.received-stat{display:flex;align-items:center;gap:9px;min-width:0;padding:10px;border-radius:12px;background:#F7F8F8}
.received-stat .rs-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#fff;font-size:18px;flex:none}
.received-stat .rs-copy{min-width:0}
.received-stat .rs-copy b{display:block;font-size:13px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.received-stat .rs-copy small{display:block;margin-top:2px;font-size:9.5px;color:var(--ink-3)}
.received-stat-grid.compact .received-stat{padding:8px}
.received-stat-grid.compact .received-stat .rs-icon{width:28px;height:28px;font-size:16px}
.received-set-block{padding-bottom:2px}

/* 小猫勋章：隐藏条件、自然收集，不做任务列表 */
.cat-badge-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cat-badge-head .set-h{margin:0}
.cat-badge-count{font-size:10px;color:var(--brand-d);font-weight:800;white-space:nowrap}
.cat-badge-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat-badge-card{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border-radius:12px;background:#F7F8F8;text-align:center}
.cat-badge-card .cb-medal{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff;font-size:23px;box-shadow:0 2px 7px rgba(25,35,30,.05)}
.cat-badge-card b{display:block;max-width:100%;font-size:9.5px;line-height:1.35;color:var(--ink-2);font-weight:800;word-break:break-word}
.cat-badge-card.locked{background:#F8F8F8}
.cat-badge-card.locked .cb-medal{background:#ECEEEF;color:#AEB4B7;font-size:20px;box-shadow:none}
.cat-badge-card.locked b{color:#A0A6A9;font-weight:600}
.cat-badge-note{margin-top:9px;font-size:10px;line-height:1.55;color:var(--ink-3)}
.cat-badge-unlock{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:13px;padding:10px 12px;border-radius:11px;background:#FFF8E9;border:1px solid #F4E6C8;color:#8A6727;font-size:11px;line-height:1.5;text-align:center}
.cat-badge-unlock b{font-weight:800;color:#78551C}

.enc-cat-head{display:flex;align-items:center;gap:11px;margin:4px 0 13px}
.enc-cat-face{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:var(--brand-soft);font-size:31px;flex:none}
.enc-cat-meta b{display:block;font-size:14px;color:var(--ink);font-weight:800}
.enc-cat-meta small{display:block;margin-top:4px;font-size:10.5px;color:var(--ink-3)}
.cat-action-note{margin:0 0 13px;font-size:12px;line-height:1.6;color:var(--ink-3)}
.cat-action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cat-action-btn{min-height:112px;padding:14px 10px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--sans);text-align:center}
.cat-action-btn.primary{border:1px solid var(--brand);background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(46,196,107,.18)}
.cat-action-btn.secondary{border:1px solid var(--line-2);background:#fff;color:var(--ink)}
.cat-action-btn:active{transform:scale(.98)}
.cat-action-icon{font-size:23px;line-height:1.1}
.cat-action-btn b{font-size:13px;line-height:1.3}
.cat-action-btn small{font-size:10px;line-height:1.35;opacity:.78}
.cat-profile-hero{display:flex;align-items:center;gap:13px;padding:3px 0 15px}
.cat-profile-face{width:66px;height:66px;border-radius:20px;background:var(--brand-soft);display:grid;place-items:center;font-size:39px;flex:none}
.cat-profile-meta b{display:block;font-size:16px;font-weight:800;color:var(--ink)}
.cat-profile-meta small{display:block;margin-top:4px;font-size:11px;color:var(--ink-3)}
.cat-profile-section{margin-top:12px;padding:13px;border:1px solid var(--line-2);border-radius:14px;background:#fff}
.cat-profile-section-title{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:10px}
.cat-profile-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:11.5px;color:var(--ink-3)}
.cat-profile-row b{font-size:11.5px;color:var(--ink-2);font-weight:700;text-align:right}
.cat-food-main,.cat-food-empty{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--brand-soft)}
.cat-food-icon{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:23px;flex:none}
.cat-food-main b,.cat-food-empty b{display:block;font-size:13px;color:var(--ink);font-weight:800}
.cat-food-main small,.cat-food-empty small{display:block;margin-top:4px;font-size:10.5px;color:var(--ink-3);line-height:1.5}
.cat-food-empty{background:var(--bg)}
.cat-food-empty>span{font-size:27px}
.cat-delivery-row{margin-top:8px;padding-top:11px;border-top:1px dashed var(--line-2)}
/* 我的用餐：首页不占版面，缩为右侧吸附圆圈入口，点开进底部抽屉 */
.me-orb{position:absolute;right:12px;bottom:70px;z-index:20;width:54px;height:54px;border-radius:50%;background:var(--brand);border:3px solid #fff;box-shadow:0 8px 20px rgba(46,196,107,.38);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s ease;font-family:var(--sans)}
.me-orb:active{transform:scale(.92)}
.me-orb .o-cat{font-size:24px;line-height:1}
.me-orb .o-badge{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;line-height:1}
.me-orb .o-badge.sit{color:var(--brand-d);font-weight:800}
/* 领券圆入口：吸附在设置圆正上方，同为圆形，用暖橙区分「券」 */
.cp-orb{position:absolute;right:12px;bottom:136px;z-index:21;width:54px;height:54px;border-radius:50%;background:#FF8A3D;border:3px solid #fff;box-shadow:0 8px 20px rgba(255,138,61,.38);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s ease;font-family:var(--sans)}
.cp-orb:active{transform:scale(.92)}
.cp-orb.hide{display:none}
.cp-orb .cp-ic{font-size:22px;line-height:1}
.cp-orb .cp-dot{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#FF3B30;border:2px solid #fff}
/* 领券帧 · 领外卖红包（照业务截图：签到条 + 双列券卡） */
.cp-sign{display:flex;align-items:center;gap:10px;padding:14px 15px;border-radius:var(--r-md);background:#2EC46B;color:#fff}
.cp-sign .sg-tx{flex:1;font-size:13.5px;font-weight:700;line-height:1.4}
.cp-sign .sg-coin{font-size:14px}
.cp-sign .sg-btn{height:32px;padding:0 15px;border:0;border-radius:999px;background:#fff;color:#159A50;font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--sans);flex:none}
.cp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 2px 0}
.cp-head b{font-size:18px;font-weight:700}
.cp-head span{font-size:10.5px;color:var(--ink-3);flex:none}
.cp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp-col{display:flex;flex-direction:column;gap:9px}
.cp-col-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cp-logo{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none}
.cp-logo.tb{background:#FF5000}
.cp-logo.mt{background:#FFD100;color:#3A2C00}
.cp-card{border-radius:var(--r-md);padding:13px 12px;text-align:center}
.cp-card.tb{background:#FFF0EA;border:1.5px solid #FFD9C7}
.cp-card.mt{background:#FFF9E0;border:1.5px solid #FFEFA8}
.cp-card .cc-t{font-size:14px;font-weight:800;line-height:1.35}
.cp-card.tb .cc-t{color:#E14A00}
.cp-card.mt .cc-t{color:#4A3800}
.cp-card .cc-s{margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.cp-get{width:100%;height:34px;margin-top:11px;border:0;border-radius:10px;font-size:12.5px;font-weight:800;color:#fff;cursor:pointer;font-family:var(--sans)}
.cp-card.tb .cp-get{background:#FF6A2B}
.cp-card.mt .cp-get{background:#FFC300;color:#4A3800}
.cp-get:active{opacity:.82}
/* 业务帧：整屏空白，中间只放一行产品文案 */
.page>.biz-blank{flex:1 1 auto;min-height:330px;display:flex;align-items:center;justify-content:center;padding:0 34px;text-align:center}
.biz-blank .bz-tx{font-size:14px;line-height:1.9;color:var(--ink-3);font-family:var(--sans)}
/* 非饭堂帧：隐藏底部导航与两个吸附圆，表达已跳出饭堂 */
.phone.offsite .tabbar,.phone.offsite .me-orb,.phone.offsite .cp-orb{display:none}
.back-btn{width:28px;height:28px;border:0;border-radius:50%;background:var(--bg);color:var(--ink-2);font-size:20px;line-height:1;display:none;place-items:center;cursor:pointer;flex:none;font-family:var(--sans);padding:0}
.back-btn.on{display:grid}
.api-btn{cursor:pointer;border-color:var(--brand-line);color:var(--brand-d);background:var(--brand-soft)}
.api-btn:hover{border-color:var(--brand)}
.meal-top{display:flex;align-items:center;gap:13px}
.meal-av{width:54px;height:54px;border-radius:16px;background:var(--brand-soft);display:grid;place-items:center;font-size:30px;flex:none}
.meal-nm{font-size:15px;font-weight:700}
.meal-st{margin-top:4px;font-size:11.5px;color:var(--ink-3)}
.chip{font-size:10px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--bg);color:var(--ink-3);flex:none;margin-left:auto}
.chip.on{background:var(--brand-soft);color:var(--brand-d)}
.meal-line{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--ink-2);line-height:1.7}
/* 我的猫 · 设置抽屉：资料设置与互动统计 */
.set-line{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-2);font-size:11.5px;color:var(--ink-3);line-height:1.65}
.set-block{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line-2)}
.set-h{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:9px}
.name-input{width:100%;height:44px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;font-size:14px;font-family:var(--sans);color:var(--ink);background:#fff;outline:none}
.name-input:focus{border-color:var(--brand)}
.face-row{display:flex;gap:8px;flex-wrap:wrap}
.face{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:20px;cursor:pointer;background:#fff;transition:border-color .12s ease,background .12s ease}
.face.on{border-color:var(--brand);background:var(--brand-soft)}
.quote-row{display:flex;gap:7px;flex-wrap:wrap}
.qopt{padding:7px 11px;border:1.5px solid var(--line-2);border-radius:999px;font-size:11.5px;color:var(--ink-2);cursor:pointer;background:#fff;white-space:nowrap;transition:border-color .12s ease,background .12s ease}

function interactionQuotaState(){
  const d=interactionUsageDay(),session=state.interactionSession||"lunch";
  const lunch=Number(d.lunch||0),evening=Number(d.evening||0),total=lunch+evening;
  const used=session==="evening"?evening:lunch;
  const remaining=Math.max(0,INTERACTION_SESSION_LIMIT-used);
  return {session,lunch,evening,total,used,remaining,sessionLimit:INTERACTION_SESSION_LIMIT,dailyLimit:INTERACTION_DAILY_LIMIT,full:remaining<=0||total>=INTERACTION_DAILY_LIMIT};
}
function interactionQuotaMessage(q=interactionQuotaState()){
  if(q.total>=INTERACTION_DAILY_LIMIT)return "今天 20 次互动额度已用完，明天再来吧。";
  if(q.session==="lunch"&&q.remaining<=0)return "中午 10 次互动已用完，晚上再来吧。";
  if(q.session==="evening"&&q.remaining<=0)return "晚上 10 次互动已用完，明天再来吧。";
  return "本场还可互动 "+q.remaining+" 次。";
}
function sendCatInteraction(catId,type){
  if(!CAT_INTERACTION_TYPES.some(x=>x.id===type))return {ok:false,reason:"invalid",count:catInteractionCount(catId,type)};
  const key=interactionSentKey(catId,type);
  if(hasSentCatInteraction(catId,type))return {ok:false,reason:"duplicate",count:catInteractionCount(catId,type)};
  const quota=interactionQuotaState();
  if(quota.full)return {ok:false,reason:"quota",quota,count:catInteractionCount(catId,type)};
  if(!catInteractionStore.counts[catId])catInteractionStore.counts[catId]=emptyInteractionCounts();
  if(!catInteractionStore.sentCounts.me)catInteractionStore.sentCounts.me=emptyInteractionCounts();
  /* 一次动作双向记账：发起方记录「我发起的互动」，接收方记录「收到的互动」。 */
  catInteractionStore.counts[catId][type]=catInteractionCount(catId,type)+1;
  catInteractionStore.sentCounts.me[type]=catInteractionSentCount("me",type)+1;
  const usage=interactionUsageDay();
  usage[quota.session]=Number(usage[quota.session]||0)+1;
  catInteractionStore.sent.push(key);
  saveCatInteractionStore();
  const after=interactionQuotaState();
  return {ok:true,receiverCount:catInteractionCount(catId,type),senderCount:catInteractionSentCount("me",type),quota:after};
}

function pageNode(id){for(const g of PAGE_TREE){const it=g.items.find(x=>x.id===id);if(it)return it;}return null;}
function pageFrameNode(pageId,frameId){const p=pageNode(pageId);if(!p)return null;for(const g of p.groups){const f=g.frames.find(x=>x.id===frameId);if(f)return f;}return null;}
function pageFrameCount(p){let n=0;p.groups.forEach(g=>{n+=g.frames.length;});return n;}

function loadMysteryStore(){
  const base={days:{},discovered:{}};
  try{const raw=JSON.parse(localStorage.getItem(MYSTERY_KEY)||"{}");return {days:raw.days&&typeof raw.days==="object"?raw.days:{},discovered:raw.discovered&&typeof raw.discovered==="object"?raw.discovered:{}};}
  catch(e){return base;}
}
let mysteryStore=loadMysteryStore();
function saveMysteryStore(){try{localStorage.setItem(MYSTERY_KEY,JSON.stringify(mysteryStore));}catch(e){}}
function seedMysteryDay(){return {completedIds:[],openedIds:[],activeEventId:null,activePhase:"story",activeChoice:null,activeOutcome:null,rareDrawn:false};}
function mysteryDay(){
  const key=state.topicClock.dateKey;
  if(!mysteryStore.days[key]){mysteryStore.days[key]=seedMysteryDay();saveMysteryStore();}
  const d=mysteryStore.days[key];
  if(!Array.isArray(d.completedIds))d.completedIds=[];
  if(!Array.isArray(d.openedIds))d.openedIds=[];
  if(typeof d.rareDrawn!=="boolean")d.rareDrawn=false;
  return d;
}
function mysteryStatus(){return topicStatus();}
function mysteryEventById(id){return MYSTERY_BANK.find(x=>x.id===id)||null;}
function mysteryDiscoveredCount(){return Object.keys(mysteryStore.discovered).length;}
function mysteryAvailablePool(){const d=mysteryDay();return MYSTERY_BANK.filter(e=>!d.completedIds.includes(e.id)&&!(e.rarity==="rare"&&d.rareDrawn));}
function openMysteryHome(){
  if(!state.seated){toast("先找个位置坐下，再来探索饭堂奇遇。");return;}
  state.mystery.view="home";state.mystery.eventId=null;state.mystery.sub=homeSubByStatus();
  state.sheet="mystery";state.wiz=null;state.notice=null;state.activeFlow="04";
}
function startMysteryEvent(forceId=null){
  if(!state.seated){toast("先找个位置坐下，再来探索饭堂奇遇。");return;}
  const d=mysteryDay();
  if(d.activeEventId&&!d.completedIds.includes(d.activeEventId)){
    state.mystery.view="event";state.mystery.eventId=d.activeEventId;state.mystery.review=false;
    state.mystery.sub=(mysteryEventById(d.activeEventId)||{}).type||"watch";
    state.sheet="mystery";return;
  }
  if(mysteryStatus()==="upcoming"){toast("饭堂奇遇 11:00 开启，等会儿再来看看。 ");return;}
  if(mysteryStatus()==="ended"){toast("今天的午餐奇遇已结束，明天 11:00 再来。 ");return;}
  const pool=mysteryAvailablePool();
  if(!pool.length){toast("今天的奇遇都探索过啦，去图鉴回顾一下吧。 ");state.mystery.view="home";state.sheet="mystery";return;}
  let chosen=forceId?pool.find(e=>e.id===forceId):null;
  if(!chosen){
    const rare=pool.find(e=>e.rarity==="rare");
    const normal=pool.filter(e=>e.rarity!=="rare");
    chosen=rare&&(normal.length===0||Math.random()<0.05)?rare:normal[Math.floor(Math.random()*normal.length)]||rare;
  }
  if(!chosen){toast("暂时没有新的奇遇。 ");return;}
  d.activeEventId=chosen.id;d.activePhase="story";d.activeChoice=null;d.activeOutcome=null;d.openedIds.push(chosen.id);
  if(chosen.rarity==="rare")d.rareDrawn=true;
  saveMysteryStore();
  state.mystery.view="event";state.mystery.eventId=chosen.id;state.mystery.review=false;
  state.mystery.sub=chosen.type;   /* 事件子态 = 六种奇遇之一 */
  state.sheet="mystery";state.wiz=null;state.notice=null;
}
function mysterySetResult(outcome,title){
  const d=mysteryDay(),ev=mysteryEventById(d.activeEventId);
  if(!ev)return;
  d.activePhase="result";d.activeOutcome=outcome||ev.resultText||"一段新的饭堂故事，已经被你发现啦。";d.activeResultTitle=title||ev.resultTitle||"奇遇反馈";saveMysteryStore();
}
function finishMysteryEvent(){
  const d=mysteryDay(),id=d.activeEventId,ev=mysteryEventById(id);
  if(!ev)return;
  if(!d.completedIds.includes(id))d.completedIds.push(id);
  const first=!mysteryStore.discovered[id];
  if(first)mysteryStore.discovered[id]={date:state.topicClock.dateKey,type:ev.type,rarity:ev.rarity};
  d.activeEventId=null;d.activePhase="story";d.activeChoice=null;d.activeOutcome=null;d.activeResultTitle=null;
  saveMysteryStore();state.mystery.view="home";state.mystery.eventId=null;state.mystery.review=false;state.mystery.sub="completed";
  toast(first?(ev.rarity==="rare"?"稀有奇遇已收入图鉴！":"新奇遇已收入图鉴！"):"这段故事已完成，图鉴记录保留啦。");
}
function setupMysteryDemo(mode,eventId=null){
  state.activeFlow="04";state.sheet=null;state.wiz=null;state.notice=null;
  /* mode 即 SHEET_ROUTES["r-mystery"].subs 的稳定子态 ID，写入后供 mysterySub()/stepMatches 精确判定 */
  state.mystery={view:"home",eventId:null,review:false,sub:mode};
  if(mode==="unseated"){
    state.frame="hall-live";state.seated=false;state.mySeat=null;state.catInteraction=null;state.topicPromptVisible=false;return;
  }
  state.frame="hall-joined";state.seated=true;
  if(state.mySeat===null||!state.seats.some(x=>x.cat==="me")){const i=state.seats.findIndex(x=>!x.cat);if(i>=0){state.seats[i].cat="me";state.mySeat=i;}}
  if(mode==="preopen")state.topicClock.minutes=650;
  else if(mode==="ended"||mode==="resume")state.topicClock.minutes=780;
  else if(mode==="nextday"){state.topicClock.dateKey=shiftDateKey(state.topicClock.dateKey,1);state.topicClock.minutes=660;}
  else state.topicClock.minutes=720;
  let d=mysteryDay();
  if(mode==="entry"){state.sheet=null;state.mystery.view="home";return;}
  if(mode==="completed"){
    const ev=mysteryEventById("m_watch_noodles");
    if(!d.completedIds.includes(ev.id))d.completedIds.push(ev.id);
    if(!mysteryStore.discovered[ev.id])mysteryStore.discovered[ev.id]={date:state.topicClock.dateKey,type:ev.type,rarity:ev.rarity};
    d.activeEventId=null;saveMysteryStore();state.sheet="mystery";return;
  }
  if(mode==="book"){
    ["m_watch_noodles","m_guess_bun","m_rare_partner"].forEach(id=>{const ev=mysteryEventById(id);if(!mysteryStore.discovered[id])mysteryStore.discovered[id]={date:state.topicClock.dateKey,type:ev.type,rarity:ev.rarity};});
    saveMysteryStore();state.mystery.view="book";state.sheet="mystery";return;
  }
  if(mode==="ended"){d.activeEventId=null;state.sheet="mystery";saveMysteryStore();return;}
  if(mode==="resume"){
    const id="m_help_chopsticks";d.activeEventId=id;d.activePhase="story";d.activeChoice=null;d.activeOutcome=null;state.mystery.view="event";state.mystery.eventId=id;state.sheet="mystery";saveMysteryStore();return;
  }
  if(mode==="nextday"){state.sheet="mystery";saveMysteryStore();return;}
  const id=eventId||({watch:"m_watch_noodles",guess:"m_guess_bun",quick:"m_quick_drink",help:"m_help_chopsticks",duo:"m_duo_cake",rare:"m_rare_partner"}[mode]);
  if(id){d.activeEventId=id;d.activePhase="story";d.activeChoice=null;d.activeOutcome=null;d.activeResultTitle=null;if(id==="m_rare_partner")d.rareDrawn=true;state.mystery.view="event";state.mystery.eventId=id;state.sheet="mystery";saveMysteryStore();}
  else state.sheet="mystery";
}

  /* 落座业务状态：以下字段是唯一事实来源 */
  seats:freshSeats(),
  seated:false, mySeat:null,
  order:"none", orderDish:null, coupon:null,
  /* UI 层 */
  filter:"all",   /* 饭堂状态筛选 tab：all / none / paid / received */
  sheet:null, wiz:null, notice:null, toastMsg:"",
  catInteraction:null, interactionSession:"lunch",
  topicClock:{dateKey:localDateKey(),minutes:720}, topicPromptVisible:false,
  mystery:{view:"home",eventId:null,review:false,sub:"entry"}   /* sub = SHEET_ROUTES["r-mystery"] 的当前子态 ID，只用于中栏高亮推导 */
};
function topicDay(){
  const key=state.topicClock.dateKey;
  if(!topicStore.days[key]){topicStore.days[key]=seedTopicDay(key);saveTopicStore();}
  const day=topicStore.days[key];
  const meta=topicMetaFor(key);
  if(day.topicId!==meta.id){topicStore.days[key]=seedTopicDay(key);saveTopicStore();}
  return topicStore.days[key];
}
function topicStatus(){return state.topicClock.minutes<660?"upcoming":state.topicClock.minutes>=780?"ended":"open";}
function topicTimeText(){return String(Math.floor(state.topicClock.minutes/60)).padStart(2,"0")+":"+String(state.topicClock.minutes%60).padStart(2,"0");}
function topicDateText(){return state.topicClock.dateKey.replace(/-/g,".");}
function maybeShowTopicReminder(){
  if(!state.seated||topicStatus()!=="open"){state.topicPromptVisible=false;return;}
  const day=topicDay();
  state.topicPromptVisible=!day.reminded&&day.vote===null;
  if(state.topicPromptVisible){day.reminded=true;saveTopicStore();}
}
function openTopicSheet(){
  if(!state.seated){toast("先坐下来加入饭局，再参与今日话题");return;}
  const day=topicDay();day.reminded=true;saveTopicStore();
  state.topicPromptVisible=false;state.sheet="topic";state.wiz=null;state.notice=null;state.activeFlow="03";
}
function resetTopicDay(key=state.topicClock.dateKey){topicStore.days[key]=seedTopicDay(key);saveTopicStore();}
function setTopicClock(value){
  if(value==="nextday"){state.topicClock.dateKey=shiftDateKey(state.topicClock.dateKey,1);state.topicClock.minutes=660;}
  else{const a=String(value).split(":").map(Number);state.topicClock.minutes=a[0]*60+a[1];}
  if(state.activeFlow==="03")maybeShowTopicReminder();
  /* 奇遇独立路由：时间模拟后同步子态，让中栏高亮跟着时间走（13:00 → ended，次日 → nextday） */
  if(state.activeFlow==="04"&&state.sheet==="mystery"&&state.mystery.view==="home"){
    state.mystery.sub = value==="nextday"?"nextday":homeSubByStatus();
  }
}
function setupTopicDemo(mode){
  state.frame="hall-joined";state.seated=true;state.filter="all";state.sheet=null;state.wiz=null;state.notice=null;state.topicPromptVisible=false;
  if(state.mySeat===null){const i=state.seats.findIndex(x=>!x.cat);if(i>=0){state.seats[i].cat="me";state.mySeat=i;}}
  state.catInteraction=null;state.activeFlow="03";
  if(mode==="nextday")state.topicClock.dateKey=shiftDateKey(state.topicClock.dateKey,1);
  if(["reminder","question","voted","nextday"].includes(mode))state.topicClock.minutes=mode==="nextday"?660:720;
  if(mode==="ended")state.topicClock.minutes=780;
  resetTopicDay();
  const day=topicDay();
  if(mode==="reminder"||mode==="nextday"){day.reminded=true;saveTopicStore();state.topicPromptVisible=true;}
  else if(mode==="question"){day.reminded=true;saveTopicStore();state.sheet="topic";}
  else if(mode==="voted"){day.reminded=true;day.vote=1;day.counts[1]++;saveTopicStore();state.sheet="topic";}
  else if(mode==="ended"){day.reminded=true;saveTopicStore();state.sheet="topic";}
}

/* ── 叠层弹窗路由 r-mystery：奇遇独立成一条路由，画面仍是「饭堂帧 + mystery 抽屉」 ──
   currentRouteId() 只从 state 推导当前所处路由，不新增帧、不改渲染模型；
   gotoSheet(id) 是「页面」模式点节点的唯一入口，并进 act() 体系，不是第五处补丁。 */
function currentRouteId(){
  if(state.sheet==="mystery")return "r-mystery";
  return null;
}
function homeSubByStatus(){
  const st=mysteryStatus();
  return st==="upcoming"?"preopen":st==="ended"?"ended":"home";
}
/* 从当前画面纯推导奇遇子态 ID；只有 home/completed/nextday 三个评审快照共用 view==="home"，
   用 state.mystery.sub 兜底区分（这三个本就是跳帧快照，不是产品里可辨的不同画面）。 */
function mysterySub(){
  const s=state,st=mysteryStatus();
  if(s.sheet!=="mystery")return s.sheet===null?(s.seated?"entry":"unseated"):null;
  const v=s.mystery.view;
  if(v==="book"||v==="review")return "book";
  if(v==="event"){
    if(st==="ended")return "resume";
    const ev=mysteryEventById(s.mystery.eventId||mysteryDay().activeEventId);
    return ev?ev.type:null;
  }
  if(st==="upcoming")return "preopen";
  if(st==="ended")return "ended";
  if(s.mystery.sub==="completed")return "completed";
  if(s.mystery.sub==="nextday")return "nextday";
  return "home";
}
function gotoSheet(id){
  const r=SHEET_ROUTES[id];if(!r)return;
  if(id==="r-mystery"){
    if(!state.seated||isOffsite(state.frame))applyPreset(r.host);
    openMysteryHome();
    state.activeFlow="04";
  }
}

/* ── 唯一写入口 ── */
function go(key){
  if(!ROUTES[key])return;
  if(state.frame!==key)state.history.push(state.frame);
  state.frame=key;
  syncStep();
}
/* 所见即所得：中栏高亮由当前画面（帧 + 弹窗组合）精确推导。
   同一饭堂画面会被入座、点餐和离座等多个流程复用，
   优先保持当前所在泳道，避免跨分支乱跳。 */
function stepMatches(st){
  const s=state;
  if(st.frames ? !st.frames.includes(s.frame) : st.k!==s.frame)return false;
  const sh=s.sheet;
  if(st.notice)return sh==="notice"&&s.notice===st.notice;
  if(st.set)return sh==="settings";
  if(st.wiz)return sh==="wizard"&&s.wiz&&s.wiz.step===st.wiz;
  if(st.catAction)return sh==="cat-actions"&&!!s.catInteraction;
  if(st.catProfile)return sh==="cat-profile"&&!!s.catInteraction;
  if(st.catInteractionStep)return sh==="encounter"&&s.catInteraction&&s.catInteraction.step===st.catInteractionStep;
  if(st.topicPrompt)return sh===null&&s.topicPromptVisible;
  if(st.topicEntry)return sh===null&&!s.topicPromptVisible;
  if(st.topicQuestion)return sh==="topic"&&topicStatus()==="open"&&topicDay().vote===null;
  if(st.topicResults)return sh==="topic"&&topicDay().vote!==null;
  if(st.topicEnded)return sh==="topic"&&topicStatus()==="ended";
  /* 饭堂奇遇独立路由 r-mystery：按稳定子态 ID 精确匹配。
     旧版 5 个弱标记都只判 view==="home"，导致首页 / 完成 / 结束 / 次日 5 屏互相抢高亮，
     「13:00 停止开启新奇遇」点了不亮；现统一塌成一条。 */
  if(st.sub!==undefined)return st.sub===mysterySub();
  if(st.end)return sh===null&&!s.catInteraction;
  if(st.entry)return sh===null;
  return sh===null;
}
function syncStep(){
  const f=FLOWS.find(x=>x.id===state.activeFlow); if(!f)return;
  const hits=[];
  f.lanes.forEach((l,li)=>l.steps.forEach((st,i)=>{if(stepMatches(st))hits.push({l:li,i});}));
  if(!hits.length)return;
  const cur=state.activeStep;
  const exact=cur&&hits.find(h=>h.l===cur.l&&h.i===cur.i);
  const same=exact||(cur&&hits.find(h=>h.l===cur.l));
  state.activeStep=same||hits[0];
}
function applyPreset(key){
  /* 评审跳帧：一次性把会话设为该帧的自洽快照，只在此处发生 */
  state.seats=freshSeats();
  Object.assign(state,PRESETS[key]);
  if(state.seated){
    const i=state.seats.findIndex(s=>!s.cat);
    if(i>=0){state.seats[i].cat="me";state.mySeat=i;}
  }
  state.frame=key; state.sheet=null; state.wiz=null; state.notice=null; state.history=[];
  state.catInteraction=null;
  state.filter="all";   /* 评审跳帧回到该帧标准视图，不继承筛选 */
  syncStep();
}
function openWiz(step){ state.sheet="wizard"; state.wiz={step:step||"ask"}; }
function closeSheet(){
  const closingSeatIntro=state.sheet==="wizard"&&state.wiz&&state.wiz.step==="seated";
  const closingCatFlow=["cat-actions","cat-profile","encounter"].includes(state.sheet)&&state.catInteraction;
  const returnFlow=closingCatFlow?(state.catInteraction.originFlow||"01"):null;
  const closingTopic=state.sheet==="topic";
  const closingMystery=state.sheet==="mystery";
  state.sheet=null; state.wiz=null; state.notice=null;
  if(closingTopic)state.activeFlow="03";
  if(closingMystery){state.mystery.view="home";state.mystery.review=false;state.mystery.sub="entry";state.activeFlow="04";}
  if(closingCatFlow){state.catInteraction=null;state.activeFlow=returnFlow;}
  /* 入座成功只触发今日饭桌话题的轻提醒；猫咪互动完全由用户主动发起。 */
  if(closingSeatIntro&&state.seated){maybeShowTopicReminder();if(state.topicPromptVisible)state.activeFlow="03";}
}
function toast(msg){ state.toastMsg=msg; }
/* 点「＋」直接入座：无选座弹窗，坐到点击的那个座位，随即弹入座成功 */
function sitAt(i){
  if(state.seats[i].cat){toast("这个座位已有猫咪在用啦");return;}
  state.seats.forEach(x=>{if(x.cat==="me")x.cat=null;});   /* 防御：不留第二个「我」 */
  state.seats[i].cat="me"; state.mySeat=i; state.seated=true;
  state.frame="hall-joined"; state.order="none"; state.orderDish=null; state.coupon=null;
  state.catInteraction=null;
  state.sheet="wizard"; state.wiz={step:"seated"};
}
function leaveSeat(){
  state.seats=freshSeats();
  state.seated=false; state.mySeat=null;
  state.order="none"; state.orderDish=null; state.coupon=null;
  state.catInteraction=null; state.topicPromptVisible=false;
  state.frame="hall-live"; state.sheet=null; state.wiz=null; state.notice=null;
  /* myName / myFace / myQuote 保留：我的猫资料跨会话沿用 */
}

function act(name,p){
  const s=state;
  switch(name){
    case "mode": s.railMode=p.mode; break;
    case "page": /* 页面模式：只切换一级页面，第二栏整列换成该页面的二级帧 */
      s.railMode="page"; s.page=p.id; s.pageFrame=null; break;
    case "page-frame": { /* 点二级帧：只换右侧预览，不改第一栏选中项 */
      const fr=pageFrameNode(p.page,p.id); if(!fr)break;
      s.page=p.page; s.pageFrame=fr.id;
      if(fr.flow){s.activeFlow=fr.flow;gotoStep(fr.idx);}
      else {s.activeFlow="01";applyPreset(fr.k);}
      break;
    }
    case "flow":
      s.railMode="flow"; s.activeFlow=p.id;
      gotoStep(0);   /* 点左侧流程 → 同时跳到该流程第一步，右侧预览立即有反馈 */
      break;
    case "step": gotoStep(p.idx); break;
    case "topic-open": openTopicSheet(); break;
    case "topic-dismiss": {const d=topicDay();d.reminded=true;saveTopicStore();s.topicPromptVisible=false;break;}
    case "topic-vote": {
      if(!s.seated){toast("先入座，再参与饭桌话题");break;}
      if(topicStatus()!=="open"){toast("今天的话题投票已经结束");break;}
      const d=topicDay(),idx=Number(p.i),meta=topicMetaFor(s.topicClock.dateKey);
      if(d.vote!==null){toast("今天已经投过票啦");break;}
      if(!Number.isInteger(idx)||idx<0||idx>=meta.options.length)break;
      d.vote=idx;d.counts[idx]++;d.reminded=true;saveTopicStore();s.topicPromptVisible=false;s.sheet="topic";s.activeFlow="03";toast("投票成功，来看看大家怎么选");break;
    }
    case "topic-clock": setTopicClock(p.v);break;
    case "topic-reset": resetTopicDay();s.topicPromptVisible=false;s.sheet=null;toast("已重置今日话题演示数据；可再切换到 11:00 测试提醒");break;
    case "mystery-open": openMysteryHome(); break;
    case "mystery-start": startMysteryEvent(); break;
    case "mystery-book": s.mystery.view="book";s.mystery.sub="book";s.sheet="mystery";break;
    case "mystery-home": s.mystery.view="home";s.mystery.sub=homeSubByStatus();s.sheet="mystery";break;
    case "mystery-review": s.mystery.view="review";s.mystery.eventId=p.id;s.mystery.review=true;s.mystery.sub="book";s.sheet="mystery";break;
    case "mystery-review-back": s.mystery.view="book";s.mystery.sub="book";s.sheet="mystery";break;
    case "mystery-watch": {const ev=mysteryEventById(mysteryDay().activeEventId);if(ev)mysterySetResult(ev.resultText,ev.resultTitle);break;}
    case "mystery-help": {const ev=mysteryEventById(mysteryDay().activeEventId);if(ev)mysterySetResult(ev.resultText,ev.resultTitle);break;}
    case "mystery-choice": {
      const d=mysteryDay(),ev=mysteryEventById(d.activeEventId),idx=Number(p.i);
      if(!ev||!Array.isArray(ev.options)||!ev.options[idx])break;
      d.activeChoice=idx;
      const feedback=ev.feedbacks&&ev.feedbacks[idx]||ev.resultText||"猫咪开心地收下了你的建议。";
      const title=ev.type==="guess"?(idx===ev.correctIndex?"猜对啦！":"真相揭晓"):(ev.resultTitle||"趣味反馈");
      mysterySetResult(feedback,title);break;
    }
    case "mystery-finish": finishMysteryEvent();break;
    case "mystery-clock": setTopicClock(p.v);break;
    case "mystery-test-rare": setupMysteryDemo("rare","m_rare_partner");break;
    case "mystery-reset": {const key=state.topicClock.dateKey;mysteryStore.days[key]=seedMysteryDay();saveMysteryStore();state.mystery.view="home";state.mystery.eventId=null;state.sheet="mystery";toast("已重置今日奇遇，可重新抽取事件");break;}
    case "frame": s.pageFrame=null; applyPreset(p.key); break;
    case "goto-sheet": gotoSheet(p.id); break;   /* 「页面」模式点叠层路由节点 */
    case "filter": if(STATUS_TABS.some(x=>x.k===p.v)){s.filter=p.v;} break;
    case "close": closeSheet(); break;
    case "me-entry": case "me-tap":   /* 右下角设置圆 & 场景点自己的猫 → 同一设置弹窗 */
      s.sheet="settings"; s.wiz=null; s.notice=null; break;
    case "set-face": if(p.v){s.myFace=String(p.v);const earned=syncCatBadges();if(earned.length)toast("小猫悄悄收下一枚新勋章："+earned.map(b=>b.name).join("、"));} break;
    case "set-quote": s.myQuote=p.v||null; break;   /* 小猫会话：不选（空值）= 不显示 */
    case "set-name": {const v=String(p.v||"").trim(); if(v)s.myName=v.slice(0,8);const earned=syncCatBadges();if(earned.length)toast("小猫悄悄收下一枚新勋章："+earned.map(b=>b.name).join("、")); break;}
    case "cat-peek": openCatTargetFor(p.cat,"cat"); break;
    case "open-encounter": openRandomCatTarget("manual"); break;
    case "cat-action-interact": if(s.catInteraction){s.catInteraction.step="actions";s.catInteraction.completed=false;s.sheet="encounter";s.wiz=null;s.notice=null;} break;
    case "cat-action-profile": if(s.catInteraction){s.sheet="cat-profile";s.wiz=null;s.notice=null;} break;
    case "cat-interaction-select": {
      if(!s.catInteraction||s.catInteraction.completed)break;
      const cat=catById(s.catInteraction.catId),type=CAT_INTERACTION_TYPES.find(x=>x.id===p.type);
      if(!cat||!type)break;
      const sent=sendCatInteraction(cat.id,type.id);
      if(!sent.ok){
        if(sent.reason==="quota")toast(interactionQuotaMessage(sent.quota));
        else if(sent.reason==="duplicate")toast("这个动作已经对 TA 做过啦，换一种试试");
        break;
      }
      const variantIndex=Math.floor(Math.random()*type.variants.length);
      s.catInteraction.actionType=type.id;
      s.catInteraction.variantIndex=variantIndex;
      s.catInteraction.receiverCount=sent.receiverCount;
      s.catInteraction.senderCount=sent.senderCount;
      s.catInteraction.quotaAfter=sent.quota;
      s.catInteraction.newBadges=syncCatBadges();
      s.catInteraction.completed=true;
      s.catInteraction.previewOnly=false;
      s.catInteraction.step="result";
      s.sheet="encounter";
      break;
    }
    case "cat-interaction-done": closeSheet(); break;
    case "interaction-session": setInteractionSession(p.v); break;
    case "interaction-nextday": s.topicClock.dateKey=shiftDateKey(s.topicClock.dateKey,1);s.interactionSession="lunch";toast("已切换到次日，中午 10 次额度已重置");break;
    case "simulate-incoming": {
      const type=CAT_INTERACTION_TYPES.find(x=>x.id===p.type);
      if(!type)break;
      simulateIncomingInteraction(type.id);
      toast("已模拟有一只猫向你"+type.label);
      break;
    }
    case "interaction-reset": resetCatInteractionDemo();toast("已重置互动统计演示数据");break;
    case "wiz": if(s.wiz){s.wiz.step=p.step;} else openWiz(p.step); break;
    case "ask-sit":       /* 入座邀请：点整张图直接入座 → 显示入座成功抽屉 */
      if(s.seated){toast("已经坐下啦");break;}
      { const i=s.seats.findIndex(x=>!x.cat);
        if(i<0){toast("饭堂暂时没有空位啦");break;}
        sitAt(i); }
      break;
    case "seat-from-scene":   /* 点空位「＋」直接入座 */
      if(s.seated){toast("已经坐下啦，想换座请先离座");break;}
      sitAt(p.i); break;
    case "coupon-entry":   /* 券圆 → 领券整屏帧 */
      if(!s.seated){toast("先坐下，再领券点餐");break;}
      if(s.order!=="none"){toast("已经点过餐啦");break;}
      s.frame="coupon"; s.sheet=null; s.wiz=null; s.notice=null; break;
    case "coupon-claim":   /* 领券成功 → 去下单业务帧 */
      s.coupon=p.i===undefined?0:Number(p.i);
      s.frame="biz-order"; s.sheet=null; s.wiz=null; s.notice=null;
      toast("红包领到啦，去下单吧"); break;
    case "back-hall":      /* 领券与外部点餐整屏帧返回饭堂 */
      s.frame=s.seated?"hall-joined":"hall-live";
      s.sheet=null; s.wiz=null; s.notice=null;
      if(s.frame==="hall-live"){s.catInteraction=null;}
      s.activeFlow="01";
      break;
    case "order-callback":   /* 系统检索到已付款 → 底图切到饭堂主场景（等餐中），通知抽屉叠在饭堂上 */
      s.frame="hall-waiting";
      s.order="paid"; s.orderDish=DISHES[Math.floor(Math.random()*DISHES.length)];
      s.sheet="notice"; s.notice="paid"; s.wiz=null;
      toast("系统检索到订单：已付款"); break;
    case "receive-callback":   /* 系统检索到已收货 → 底图切到饭堂主场景（干饭中），通知抽屉叠在饭堂上 */
      if(s.order!=="paid"){toast("当前没有等餐中的订单");break;}
      s.frame="hall-eating";
      s.order="received"; s.sheet="notice"; s.notice="received"; s.wiz=null;
      toast("已收货，猫咪开饭啦"); break;
    case "done":           /* 通知窗「好的」：已付款 → 待收货业务帧；已收货 → 留在饭堂看干饭 */
      if(s.notice==="paid"){s.frame="biz-receive";closeSheet();}
      else if(s.notice==="received"){s.frame="hall-eating";closeSheet();}
      else closeSheet();
      break;
    case "leave": leaveSeat(); s.activeStep={l:3,i:0}; toast("已离座，回到饭堂"); break;
    case "sign": toast("签到属于成长任务，本稿未接入"); break;
    case "tab": toast("本稿只盘落座一个交互，其余页暂未接入"); break;
    default: break;
  }
  syncStep();   /* 中栏高亮跟随当前画面 */
  render();
}
function gotoStep(idx){
  const f=FLOWS.find(x=>x.id===state.activeFlow); if(!f)return;
  let n=0; let target=null;
  f.lanes.forEach((l,li)=>l.steps.forEach((st,i)=>{if(n===idx){target={l:li,i,st};}n++;}));
  if(!target)return;
  state.activeStep={l:target.l,i:target.i};
  const st=target.st;
  applyPreset(st.k);
  if(st.wiz)openWiz(st.wiz);
  if(st.set){state.sheet="settings";state.wiz=null;state.notice=null;}
  if(st.catAction){openCatTargetFor(st.randomCat?null:"c01","manual");if(state.catInteraction){state.sheet="cat-actions";state.wiz=null;state.notice=null;}}
  if(st.catProfile){openCatTargetFor(st.catId||"c01","manual");if(state.catInteraction){state.sheet="cat-profile";state.wiz=null;state.notice=null;}}
  if(st.catInteractionStep){
    openCatTargetFor(st.catId||"c01","manual");
    if(state.catInteraction){
      state.catInteraction.step=st.catInteractionStep;
      if(st.catInteractionStep==="result"){
        state.catInteraction.actionType="wave";state.catInteraction.variantIndex=0;state.catInteraction.previewOnly=true;state.catInteraction.completed=true;
      }
      state.sheet="encounter";state.wiz=null;state.notice=null;
    }
  }
  if(st.notice){
    state.sheet="notice"; state.notice=st.notice; state.wiz=null;
    if(st.notice==="paid"){state.order="paid";state.orderDish=state.orderDish||DISHES[0];}
    if(st.notice==="received"){state.order="received";state.orderDish=state.orderDish||DISHES[1];}
  }
  if(st.leave){leaveSeat();}
  if(st.topicDemo)setupTopicDemo(st.topicDemo);
  if(st.topicPrompt&&!st.topicDemo)setupTopicDemo("reminder");
  if(st.topicEntry){setupTopicDemo("reminder");state.topicPromptVisible=false;state.sheet=null;}
  if(st.mysteryDemo)setupMysteryDemo(st.mysteryDemo,st.eventId||null);
  /* applyPreset() 内部的 syncStep() 会冲掉开头锁定的泳道；在最终同步前重新锁定，
     让「同一画面被多条分支共用」（如 watch / rare）也能精确落在点击的那一步。 */
  state.activeStep={l:target.l,i:target.i};
  syncStep();
}

const CHATTER=[

/* 状态筛选：座位状态（含自己的猫，空位为 null）→ 桌命中数 → 可见饭桌（按命中数降序） */
function seatStatus(idx){
  const seat=state.seats[idx];
  if(!seat||!seat.cat)return null;
  if(seat.cat==="me")return state.order;
  const c=catById(seat.cat);
  return c?c.status:null;
}
function tableHit(t,f){
  let n=0;
  for(let k=0;k<4;k++){const st=seatStatus(t*4+k);if(st&&(f==="all"||st===f))n++;}
  return n;
}
function statusCount(f){
  let n=0;
  for(let i=0;i<20;i++){const st=seatStatus(i);if(st&&(f==="all"||st===f))n++;}
  return n;
}
/* 筛选满足状态的饭桌；命中猫数越多越靠前，命中数相同按桌号升序（稳定） */
function visibleTables(){
  const f=state.filter||"all",list=[];
  for(let t=0;t<5;t++){
    const hit=tableHit(t,f);
    if(f==="all"||hit>0)list.push({t,hit});
  }
  return list.sort((a,b)=>b.hit-a.hit||a.t-b.t);
}

}

function renderToast(){
  const el=document.getElementById("toast");
  if(!state.toastMsg){el.classList.remove("on");return;}
  el.textContent=state.toastMsg;el.classList.add("on");
  clearTimeout(renderToast._t);
  renderToast._t=setTimeout(()=>{state.toastMsg="";document.getElementById("toast").classList.remove("on");},1900);
}

/* ── 事件委托：所有点击汇入 act() 一处 ── */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const p={};
  ["mode","id","page","idx","key","v","step","i","cat","type"].forEach(k=>{if(el.dataset[k]!==undefined)p[k]=el.dataset[k];});
  if(p.i!==undefined)p.i=Number(p.i);
  if(p.idx!==undefined)p.idx=Number(p.idx);
  act(el.dataset.act,p);
});
document.getElementById("frameSel").addEventListener("change",e=>act("frame",{key:e.target.value}));
/* 名称输入：change（失焦/回车）时写入状态源 */
document.addEventListener("change",e=>{
  if(e.target&&e.target.dataset&&e.target.dataset.set==="name")act("set-name",{v:e.target.value});
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")act("close",{});});

/* 页面初始化时，把历史互动数据同步为已获得勋章；不弹出提示。 */
syncCatBadges();
render();
