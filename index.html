<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>功能文档导航 — SaaS / 统计后台 / 其他</title>
<!-- marked.js for MD rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#f1f5f9;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ═══ 顶部系统 Tab 栏 ═══ */
.顶栏{flex:0 0 auto;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 16px;min-height:54px;}
.顶栏 .品牌{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#172033;flex-shrink:0;padding-right:20px;border-right:1px solid #e2e8f0;margin-right:16px;}
.顶栏 .品牌 .图标{font-size:18px;}
.系统tab组{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;align-items:stretch;}
.系统tab{display:flex;align-items:center;gap:7px;padding:0 18px;cursor:pointer;user-select:none;font-size:14px;font-weight:700;color:#64748b;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.系统tab:hover{background:#f1f5f9;color:#334155;}
.系统tab .图标{font-size:15px;flex-shrink:0;}
.系统tab .计数{font-size:11px;color:#94a3b8;background:#f1f5f9;padding:1px 7px;border-radius:10px;font-weight:600;flex-shrink:0;}
.系统tab.活跃{color:#0f6b8f;border-bottom-color:#0f6b8f;background:#eff6ff;}
.系统tab.活跃 .计数{background:#dbeafe;color:#1d4ed8;}

/* ═══ 主体（侧栏 + 内容区） ═══ */
.主体{flex:1;min-height:0;display:flex;overflow:hidden;}

/* ═══ 左侧导航栏 ═══ */
.侧栏{width:280px;min-width:280px;height:100%;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;}
.侧栏头{padding:14px 16px;border-bottom:1px solid #e2e8f0;flex:0 0 auto;}
.侧栏头 h2{margin:0;font-size:15px;color:#172033;display:flex;align-items:center;gap:6px;}
.侧栏头 p{margin:3px 0 0;font-size:11px;color:#94a3b8;}
.侧栏体{flex:1;overflow-y:auto;padding:6px 0;}
.侧栏尾{flex:0 0 auto;padding:10px 16px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;}

/* ═══ 侧栏收起/展开 ═══ */
.侧栏切换钮{display:flex;align-items:center;justify-content:center;gap:5px;width:auto;min-width:64px;height:36px;padding:0 14px;margin-right:10px;border:0;background:linear-gradient(135deg,#ef4444,#dc2626);cursor:pointer;font-size:13px;font-weight:800;color:#fff;border-radius:8px;flex-shrink:0;transition:all .15s;box-shadow:0 3px 10px rgba(220,38,38,.45), 0 0 0 2px rgba(255,255,255,.5) inset;letter-spacing:1.5px;}
.侧栏切换钮:hover{background:linear-gradient(135deg,#dc2626,#b91c1c);box-shadow:0 5px 14px rgba(220,38,38,.55);transform:translateY(-1px);}
.侧栏切换钮:active{transform:translateY(0);}
.侧栏切换钮 .图标符号{font-size:15px;line-height:1;}
.侧栏切换钮 .按钮文字{font-size:13px;}
.侧栏{transition:width .22s ease, min-width .22s ease;}
.主体.侧栏收起 .侧栏{width:0;min-width:0;border-right:0;}

/* 一级大组 */
.导航大组{margin:0 0 6px;}
.导航大组头{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;font-size:13.5px;font-weight:800;color:#fff;transition:filter .12s;}
.导航大组头:hover{filter:brightness(1.1);}
.导航大组头 .箭头{font-size:10px;opacity:.85;transition:transform .18s;flex-shrink:0;}
.导航大组头 .图标{font-size:15px;flex-shrink:0;}
.导航大组头 .标签{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:1px;}
.导航大组.色调-基础 .导航大组头{background:linear-gradient(90deg,#0f6b8f,#1a8fb8);}
.导航大组.色调-迭代 .导航大组头{background:linear-gradient(90deg,#b45309,#d97706);}
.导航大组.折叠 .箭头{transform:rotate(-90deg);}
.导航大组.折叠 .导航大组体{display:none;}
.导航大组体{padding:3px 0 5px;}
.导航大组体 .导航组头{background:#f8fafc;}

/* 批次分组 */
.导航组{margin:0 0 1px;}
.导航组头{display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;user-select:none;font-size:14px;font-weight:700;color:#334155;transition:background .12s;}
.导航组头:hover{background:#f1f5f9;}
.导航组头 .箭头{font-size:10px;color:#94a3b8;transition:transform .18s;flex-shrink:0;}
.导航组头 .图标{font-size:15px;flex-shrink:0;}
.导航组头 .标签{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.导航组头 .计数{font-size:11px;color:#94a3b8;flex-shrink:0;}
.导航组头.强调{background:#fef2f2;color:#b91c1c;font-weight:900;border-left:3px solid #dc2626;}
.导航组头.强调 .标签{color:#b91c1c;font-weight:900;letter-spacing:.5px;}
.导航组头.强调 .箭头{color:#dc2626;}
.导航组头.强调 .计数{color:#dc2626;background:#fee2e2;}
.导航组.折叠 .箭头{transform:rotate(-90deg);}
.导航组.折叠 .导航子项{display:none;}

/* 子项 */
.导航子项{display:flex;flex-direction:column;}
.导航子项 a{display:flex;align-items:center;gap:7px;padding:7px 16px 7px 42px;text-decoration:none;color:#64748b;font-size:12px;border-left:3px solid transparent;transition:all .12s;overflow:hidden;}
.导航子项 a:hover{background:#f8fafc;color:#334155;}
.导航子项 a.活跃{background:#eff6ff;color:#0f6b8f;border-left-color:#0f6b8f;font-weight:650;}
.导航子项 a .子图标{font-size:12px;flex-shrink:0;}
.导航子项 a .子标签{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.导航子项 a .子类型{font-size:10px;color:#94a3b8;flex-shrink:0;background:#f1f5f9;padding:1px 5px;border-radius:3px;}
.导航子项 a.活跃 .子类型{background:#dbeafe;color:#2563eb;}

/* 简单模式：直接列文件（无大组无批次）— 视觉以 SaaS .导航子项 为准 */
.简单文件列表{display:flex;flex-direction:column;padding:4px 0;}
.简单文件列表 a{display:flex;align-items:center;gap:7px;padding:7px 16px;text-decoration:none;color:#64748b;font-size:12px;font-weight:400;border-left:3px solid transparent;transition:all .12s;overflow:hidden;}
.简单文件列表 a:hover{background:#f8fafc;color:#334155;}
.简单文件列表 a.活跃{background:#eff6ff;color:#0f6b8f;border-left-color:#0f6b8f;font-weight:650;}
.简单文件列表 a .图标{font-size:12px;flex-shrink:0;}
.简单文件列表 a .标签{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.简单文件列表 a .类型{font-size:10px;color:#94a3b8;background:#f1f5f9;padding:1px 5px;border-radius:3px;flex-shrink:0;}
.简单文件列表 a.活跃 .类型{background:#dbeafe;color:#2563eb;}

/* 下载按钮 */
.导航子项 a .下载按钮,.简单文件列表 a .下载按钮{font-size:13px;color:#94a3b8;cursor:pointer;flex-shrink:0;padding:0 6px;border-radius:4px;transition:all .12s;user-select:none;line-height:1;}
.导航子项 a .下载按钮:hover,.简单文件列表 a .下载按钮:hover{color:#0f6b8f;background:#dbeafe;}
.导航子项 a.活跃 .下载按钮,.简单文件列表 a.活跃 .下载按钮{color:#0f6b8f;}

/* ═══ 右侧内容区 ═══ */
.内容区{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.内容顶栏{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;min-height:48px;}
.内容顶栏 .面包屑{font-size:13px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.内容顶栏 .面包屑 b{color:#172033;}
.内容顶栏 .格式标签{flex-shrink:0;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:650;}
.格式标签.html{background:#dbeafe;color:#1d4ed8;}
.格式标签.md{background:#fef3c7;color:#b45309;}
.格式标签.外链{background:#dcfce7;color:#15803d;}

/* 外链条目 */
.简单文件列表 a .外链箭头{font-size:13px;color:#94a3b8;flex-shrink:0;}
.简单文件列表 a.活跃 .外链箭头{color:#0f6b8f;}
.外链按钮{display:inline-block;margin:8px 0 2px;padding:9px 22px;background:#0f6b8f;color:#fff!important;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;}
.外链按钮:hover{background:#0c5570;}
.外链提示{display:block;margin-top:10px;font-size:11px;color:#94a3b8;}

#内容容器{flex:1;min-height:0;position:relative;}
.内容iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}

/* MD 渲染区 */
.md渲染区{position:absolute;inset:0;overflow-y:auto;background:#fff;padding:24px 32px 48px;display:none;}
.md渲染区.活跃{display:block;}

/* MD 内容样式 */
.md-body{max-width:900px;margin:0 auto;font-size:15px;line-height:1.75;color:#1f2937;}
.md-body h1{font-size:28px;margin:0 0 8px;padding-bottom:12px;border-bottom:2px solid #e2e8f0;color:#172033;}
.md-body h2{font-size:22px;margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid #e2e8f0;color:#1e293b;}
.md-body h3{font-size:18px;margin:24px 0 8px;color:#334155;}
.md-body h4{font-size:16px;margin:20px 0 6px;color:#475569;}
.md-body p{margin:10px 0;}
.md-body ul,.md-body ol{margin:10px 0 12px 22px;padding:0;}
.md-body li{margin:5px 0;}
.md-body strong{font-weight:750;color:#1e293b;}
.md-body blockquote{margin:16px 0;border-left:4px solid #0f6b8f;background:#e8f4f8;border-radius:6px;padding:10px 14px;color:#223548;}
.md-body blockquote p{margin:4px 0;}
.md-body code{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:.9em;background:#eef2f6;border-radius:4px;padding:1px 5px;color:#111827;}
.md-body pre{margin:16px 0;border:1px solid #d9e2ec;border-radius:8px;overflow-x:auto;background:#f8fafc;padding:16px;}
.md-body pre code{background:transparent;padding:0;display:block;font-size:13px;line-height:1.55;white-space:pre;}
.md-body table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;}
.md-body th{background:#f8fafc;padding:10px 14px;text-align:left;font-weight:700;color:#475569;border:1px solid #d9e2ec;}
.md-body td{padding:8px 14px;border:1px solid #e2e8f0;color:#334155;}
.md-body hr{margin:28px 0;border:0;border-top:1px solid #e2e8f0;}
.md-body a{color:#2563eb;}
.md-body img{max-width:100%;border-radius:8px;margin:16px 0;}

/* 空/加载/错误状态 */
.状态占位{display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;color:#94a3b8;padding:24px;}
.状态占位 .图标{font-size:48px;margin-bottom:12px;}
.状态占位 .标题{font-size:18px;font-weight:700;color:#64748b;margin-bottom:4px;}
.状态占位 .说明{font-size:13px;text-align:center;}

/* 初始欢迎页：方哥带你飞 */
.状态占位 .欢迎图{max-width:min(70%,340px);max-height:54vh;width:auto;height:auto;border-radius:18px;box-shadow:0 14px 40px rgba(185,28,28,.25);}
.状态占位 .欢迎语{margin-top:22px;font-size:24px;font-weight:750;color:#b91c1c;letter-spacing:6px;}
.加载中{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(255,255,255,.85);z-index:5;}
.加载中.活跃{display:flex;}
.加载中 .旋转{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#0f6b8f;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 响应式 */
@media(max-width:768px){
  body{flex-direction:column;}
  .顶栏{overflow-x:auto;padding:0 10px;}
  .顶栏 .品牌{padding-right:10px;margin-right:10px;}
  .主体{flex-direction:column;}
  .侧栏{width:100%;min-width:0;height:auto;max-height:45vh;border-right:0;border-bottom:1px solid #e2e8f0;}
  .内容区{height:auto;flex:1;}
  .md渲染区{padding:16px 20px 36px;}
}

/* ═══ 锁屏遮罩（接口文档 tab 专用） ═══ */
.锁屏遮罩{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(7,13,22,.55);backdrop-filter:blur(3px);padding:24px;animation:淡入遮罩 .18s ease}
.锁屏遮罩.活跃{display:flex}
@keyframes 淡入遮罩{from{opacity:0}to{opacity:1}}
.锁卡{width:100%;max-width:380px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:34px 30px 22px;box-shadow:0 20px 60px rgba(15,23,42,.25);text-align:center;animation:弹入 .22s ease}
@keyframes 弹入{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.锁标{width:48px;height:48px;margin:0 auto 16px;border-radius:12px;background:linear-gradient(135deg,#1a8fb8,#0f6b8f);color:#fff;font-weight:800;font-size:15px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,107,143,.35)}
.锁卡 h3{margin:0;font-size:19px;color:#0f172a;letter-spacing:1px}
.锁卡 p{margin:6px 0 20px;font-size:12.5px;color:#64748b}
.密码框{display:flex;gap:8px}
.密码框 input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid #dbe2ea;background:#f8fafc;color:#0f172a;padding:0 14px;font-size:14px;outline:none;transition:border-color .12s, box-shadow .12s}
.密码框 input:focus{border-color:#0f6b8f;box-shadow:0 0 0 3px rgba(15,107,143,.15);background:#fff}
.密码框 input::placeholder{color:#94a3b8}
.显隐{width:58px;border:1px solid #dbe2ea;background:#fff;color:#64748b;border-radius:10px;cursor:pointer;font-size:12px;transition:all .12s}
.显隐:hover{color:#0f6b8f;border-color:#0f6b8f}
.解锁钮{width:100%;height:42px;margin-top:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#1a8fb8,#0f6b8f);color:#fff;font-size:14px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:transform .1s, box-shadow .12s}
.解锁钮:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,107,143,.3)}
.错误{min-height:18px;margin-top:8px;font-size:12.5px;color:#dc2626}
.锁脚{margin-top:14px;font-size:11px;color:#94a3b8;letter-spacing:1px}
.抖动{animation:抖动 .35s}
@keyframes 抖动{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 顶栏状态标签（解锁/锁定） */
.解锁状态{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;background:#dcfce7;color:#15803d;cursor:pointer;border:1px solid #bbf7d0;user-select:none;transition:all .12s}
.解锁状态:hover{background:#bbf7d0}
.解锁状态.锁定{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.解锁状态.锁定:hover{background:#fee2e2}
</style>
</head>
<body>

<!-- ═══ 锁屏遮罩（接口文档解锁用） ═══ -->
<div class="锁屏遮罩" id="锁屏遮罩">
  <div class="锁卡">
    <div class="锁标">🔌</div>
    <h3>接口文档</h3>
    <p>内部接口 · 外部接口</p>
    <form id="解锁表单" autocomplete="off">
      <div class="密码框">
        <input id="密码输入" type="password" placeholder="请输入访问密码" autofocus>
        <button class="显隐" id="显隐" type="button">显示</button>
      </div>
      <button class="解锁钮" type="submit">解锁菜单</button>
      <div class="错误" id="错误"></div>
    </form>
    <div class="锁脚">内部资料 · 请勿外传</div>
  </div>
</div>

<!-- ═══ 顶部系统 Tab ═══ -->
<div class="顶栏">
  <button class="侧栏切换钮" id="侧栏切换钮" title="收起/展开左侧导航" onclick="切换侧栏()"><span class="图标符号">☰</span><span class="按钮文字" id="侧栏切换文字">收起</span></button>
  <div class="品牌"><span class="图标">📋</span>功能文档导航</div>
  <div class="系统tab组" id="系统tab组"></div>
  <span class="解锁状态 锁定" id="解锁状态" style="display:none" onclick="锁定接口文档()" title="点击重新锁定">🔒 已锁定</span>
</div>

<!-- ═══ 主体 ═══ -->
<div class="主体">

  <!-- ═══ 左侧导航 ═══ -->
  <nav class="侧栏" id="侧栏">
    <div class="侧栏头">
      <h2 id="当前系统标题">📋 功能文档导航</h2>
      <p id="当前系统说明">基本功能搭建 + 2026年迭代任务 · 共41个需求</p>
    </div>
    <div class="侧栏体" id="导航树"></div>
    <div class="侧栏尾">
      <span id="状态文字">就绪</span>
      <span>HTML + MD</span>
    </div>
  </nav>

  <!-- ═══ 右侧内容区 ═══ -->
  <div class="内容区">
    <div class="内容顶栏" id="面包屑栏">
      <span class="面包屑" id="面包屑">👈 从左侧导航选择需求文档</span>
      <span class="格式标签" id="格式标签" style="display:none;"></span>
    </div>
    <div id="内容容器">
      <div class="状态占位" id="空状态">
        <img class="欢迎图" src="方哥带你飞.jpg" alt="方哥带你飞">
        <span class="欢迎语">方哥带你飞</span>
      </div>
      <div class="加载中" id="加载中"><div class="旋转"></div></div>
      <iframe id="内容iframe" class="内容iframe" style="display:none;" title="HTML内容"></iframe>
      <div class="md渲染区" id="md渲染区"><div class="md-body" id="md正文"></div></div>
    </div>
  </div>

</div>

<script>
// ═══ 批次数据（SaaS 系统使用） ═══
var 批次数据 = [
  { 名称:'第1批_业务骨架', 图标:'🏗️', 文件:[
    {名:'B01_用户登录注册（0619）.html', 显示:'用户登录注册', 类型:'html'},
    {名:'B02_活动管理-联盟（0619）.html', 显示:'活动管理-联盟', 类型:'html'},
    {名:'B03_推广位管理（0619）.html', 显示:'推广位管理', 类型:'html'},
    {名:'B05_自动取链（0619）.html', 显示:'自动取链', 类型:'html'}
  ]},
  { 名称:'第2批_取链', 图标:'🔗', 文件:[

// simple 模式渲染时填充：每项 {路径, 显示, 面包屑, 类型} 或 {外链, 链接, 显示, 面包屑}
var 可打开文件列表 = [];

// ═══ 路径编码：逐段 encodeURIComponent，保留 / 分隔符 ═══
function 编码路径(路径) {
  return 路径.split('/').map(function(seg) {
    return encodeURIComponent(seg);
  }).join('/');
}

// ═══ 文件夹内文件总数（递归，支持文件夹套文件夹） ═══
function 文件夹内文件数(夹) {
  if (!夹.文件 || 夹.文件.length === 0) return 0;
  return 夹.文件.reduce(function(sum, sf){
    return sum + (sf.类型 === '文件夹' ? 文件夹内文件数(sf) : 1);
  }, 0);
}

// ═══ 系统文件总数 ═══
function 系统文件数(s) {
  if (s.类型 === 'full') {
    return s.批次.reduce(function(sum, b){ return sum + b.文件.length; }, 0);
  }
  // simple：文件夹按其内文件数计（递归）
  return s.文件.reduce(function(sum, f){
    return sum + (f.类型 === '文件夹' ? 文件夹内文件数(f) : 1);
  }, 0);
}

// ═══ 递归渲染文件夹体（simple 模式专用，支持文件夹嵌套文件夹） ═══
// 基础路径已累积到当前层；面包屑前缀已含到父级
function 渲染文件夹体(子项, 基础路径, 面包屑前缀, ID前缀) {
  var html = '<div class="导航子项">';
  for (var k = 0; k < 子项.length; k++) {
    var 项 = 子项[k];
    if (项.类型 === '文件夹') {
      var 夹ID = ID前缀 + '-' + k;
      // 虚拟文件夹（目录名为空）不贡献路径段
      var 子基础路径 = 项.目录名 ? 基础路径 + '/' + 项.目录名 : 基础路径;
      var 子面包屑前缀 = 面包屑前缀 + ' &gt; ' + 项.显示;
      html += '<div class="导航组" id="' + 夹ID + '">';
      var 强调class = 项.强调 ? ' 强调' : '';
      html += '<div class="导航组头' + 强调class + '" onclick="切换分组(\'' + 夹ID + '\')">';
      html += '<span class="箭头">▼</span>';
      html += '<span class="图标">' + (项.图标 || '📁') + '</span>';
      html += '<span class="标签" title="' + 项.显示 + '">' + 项.显示 + '</span>';
      html += '<span class="计数">' + 文件夹内文件数(项) + '</span>';
      html += '</div>';
      html += 渲染文件夹体(项.文件 || [], 子基础路径, 子面包屑前缀, 夹ID);
      html += '</div>';
    } else if (项.类型 === '外链') {
      var 外链索引 = 可打开文件列表.length;
      可打开文件列表.push({外链:true, 链接:项.链接, 显示:项.显示, 面包屑:'🔗 ' + 面包屑前缀 + ' &gt; <b>' + 项.显示 + '</b>'});
      html += '<a href="' + 项.链接 + '" target="_blank" rel="noopener noreferrer" onclick="打开外链索引(' + 外链索引 + ',this)">';
      html += '<span class="子图标">🔗</span>';
      html += '<span class="子标签" title="' + 项.链接 + '">' + 项.显示 + '</span>';
      html += '<span class="类型">外链</span>';
      html += '<span class="外链箭头" title="新窗口打开">↗</span>';
      html += '</a>';
    } else {
      // 文件项（html/md/img）
      var 全路径 = 基础路径 + '/' + 项.名;
      var 索引 = 可打开文件列表.length;
      可打开文件列表.push({路径:全路径, 显示:项.显示, 面包屑:'📍 ' + 面包屑前缀 + ' &gt; <b>' + 项.显示 + '</b>', 类型:项.类型, 文件名:项.名});
      html += '<a href="javascript:void(0)" onclick="打开文档索引(' + 索引 + ',this)">';
      html += '<span class="子图标">🌐</span>';
      html += '<span class="子标签" title="' + 项.名 + '">' + 项.显示 + '</span>';
      html += '<span class="下载按钮" title="下载 ' + 项.名 + '" data-路径="' + 全路径 + '" data-文件名="' + 项.名 + '" onclick="event.stopPropagation(); 触发下载(this)">⬇</span>';
      html += '</a>';
    }
  }
  html += '</div>';
  return html;
}

// ═══ 打开文档（simple 模式统一入口，按可打开文件列表索引） ═══
function 打开文档索引(索引, el) {

}

// ═══ 构建导航树（按当前系统类型） ═══
function 构建导航() {
  var 树 = document.getElementById('导航树');
  var s = 系统数据[当前系统索引];
  var html = '';
  // 每次重建导航都重置可打开文件列表（simple 模式专用）
  可打开文件列表 = [];

  if (s.类型 === 'full') {
    // 三层：大组 → 批次 → 文件
    for (var g = 0; g < s.大组.length; g++) {
      var 大组 = s.大组[g];
      var 大组ID = '大组-' + g;
      html += '<div class="导航大组 色调-' + 大组.色调 + '" id="' + 大组ID + '">';
      html += '<div class="导航大组头" onclick="切换大组(\'' + 大组ID + '\')">';
      html += '<span class="箭头">▼</span>';
      html += '<span class="图标">' + 大组.图标 + '</span>';
      html += '<span class="标签">' + 大组.名称 + '</span>';
      html += '</div><div class="导航大组体">';
      for (var k = 0; k < 大组.批次索引.length; k++) {
        var i = 大组.批次索引[k];
        var 批 = s.批次[i];
        var 批ID = '批-' + i;
        html += '<div class="导航组' + (大组.折叠批次 ? ' 折叠' : '') + '" id="' + 批ID + '">';
        html += '<div class="导航组头" onclick="切换分组(\'' + 批ID + '\')">';
        html += '<span class="箭头">▼</span>';
        html += '<span class="图标">' + 批.图标 + '</span>';
        html += '<span class="标签">' + 批.名称 + '</span>';
        html += '<span class="计数">' + 批.文件.length + '</span>';
        html += '</div><div class="导航子项">';
        for (var j = 0; j < 批.文件.length; j++) {
          var f = 批.文件[j];
          var 全路径 = s.目录 + '/' + 批.名称 + '/' + f.名;
          html += '<a href="javascript:void(0)" onclick="打开文档Full(' + i + ',' + j + ',this)">';
          html += '<span class="子图标">🌐</span>';
          html += '<span class="子标签" title="' + f.名 + '">' + f.显示 + '</span>';
          html += '<span class="下载按钮" title="下载 ' + f.名 + '" data-路径="' + 全路径 + '" data-文件名="' + f.名 + '" onclick="event.stopPropagation(); 触发下载(this)">⬇</span>';
          html += '</a>';
        }
        html += '</div></div>';
      }
      html += '</div></div>';
    }
  } else {
    // 一层：直接列文件（顶层散文件/外链/压缩包 + 顶层文件夹递归）
    html += '<div class="简单文件列表">';
    for (var j = 0; j < s.文件.length; j++) {
      var f = s.文件[j];
      if (f.类型 === '外链') {
        // 外链：真实 a 标签，新窗口打开，支持右键复制链接 / 中键打开
        var 外链索引 = 可打开文件列表.length;
        可打开文件列表.push({外链:true, 链接:f.链接, 显示:f.显示, 面包屑:'🔗 ' + s.名称 + ' &gt; <b>' + f.显示 + '</b>'});
        html += '<a href="' + f.链接 + '" target="_blank" rel="noopener noreferrer" onclick="打开外链索引(' + 外链索引 + ',this)">';
        html += '<span class="图标">🔗</span>';
        html += '<span class="标签" title="' + f.链接 + '">' + f.显示 + '</span>';
        html += '<span class="类型">外链</span>';
        html += '<span class="外链箭头" title="新窗口打开">↗</span>';
        html += '</a>';
      } else if (f.类型 === '文件夹') {
        // 顶层文件夹：递归渲染（支持文件夹套文件夹）
        var 夹ID = '文件夹-' + j;
        // 虚拟文件夹（目录名为空）不贡献路径段
        var 子基础路径 = f.目录名 ? s.目录 + '/' + f.目录名 : s.目录;
        var 子面包屑前缀 = s.名称 + ' &gt; ' + f.显示;
        html += '<div class="导航组" id="' + 夹ID + '">';
        var 顶层强调class = f.强调 ? ' 强调' : '';
        html += '<div class="导航组头' + 顶层强调class + '" onclick="切换分组(\'' + 夹ID + '\')">';
        html += '<span class="箭头">▼</span>';
        html += '<span class="图标">' + (f.图标 || '📁') + '</span>';
        html += '<span class="标签" title="' + f.显示 + '">' + f.显示 + '</span>';
        html += '<span class="计数">' + 文件夹内文件数(f) + '</span>';
        html += '</div>';
        html += 渲染文件夹体(f.文件 || [], 子基础路径, 子面包屑前缀, 夹ID);
        html += '</div>';
      } else if (f.类型 === 'rar' || f.类型 === 'zip') {
        // 压缩包：整行点击即下载，不在右侧打开
        var 包路径 = s.目录 + '/' + f.名;
        html += '<a href="javascript:void(0)" title="点击下载 ' + f.名 + '" data-路径="' + 包路径 + '" data-文件名="' + f.名 + '" onclick="触发下载(this)">';
        html += '<span class="图标">🗜️</span>';
        html += '<span class="标签" title="' + f.名 + '">' + f.显示 + '</span>';
        html += '<span class="类型">' + f.类型.toUpperCase() + '</span>';
        html += '<span class="下载按钮" title="点击下载">⬇</span>';
        html += '</a>';
      } else {
        // 顶层散文件
        var 全路径 = s.目录 + '/' + f.名;
        var 索引 = 可打开文件列表.length;
        可打开文件列表.push({路径:全路径, 显示:f.显示, 面包屑:'📍 ' + s.名称 + ' &gt; <b>' + f.显示 + '</b>', 类型:f.类型, 文件名:f.名});
        html += '<a href="javascript:void(0)" onclick="打开文档索引(' + 索引 + ',this)">';
        html += '<span class="图标">📄</span>';
        html += '<span class="标签" title="' + f.名 + '">' + f.显示 + '</span>';
        html += '<span class="类型">' + f.类型.toUpperCase() + '</span>';
        html += '<span class="下载按钮" title="下载 ' + f.名 + '" data-路径="' + 全路径 + '" data-文件名="' + f.名 + '" onclick="event.stopPropagation(); 触发下载(this)">⬇</span>';
        html += '</a>';
      }
    }
    html += '</div>';
  }
  树.innerHTML = html;
}

// ═══ 通用打开文档 ═══
function 打开文档通用(原始路径, f, 面包屑html, el) {
  // 高亮
  document.querySelectorAll('.导航子项 a, .简单文件列表 a').forEach(function(a){a.classList.remove('活跃');});
  el.classList.add('活跃');

  var 路径 = 编码路径(原始路径);
  当前文件 = {文件:f, 路径:原始路径};

  // 更新面包屑
  document.getElementById('面包屑').innerHTML = '📍 ' + 面包屑html;

  // 格式标签
  var 格式标签 = document.getElementById('格式标签');
  格式标签.style.display = '';
  格式标签.textContent = f.类型.toUpperCase();
  格式标签.className = '格式标签 ' + f.类型;

  // 隐藏空状态、隐藏之前的内容
  document.getElementById('空状态').style.display = 'none';
  document.getElementById('md渲染区').classList.remove('活跃');
  var iframe = document.getElementById('内容iframe');
  iframe.style.display = 'none';
  iframe.src = '';

  // 显示加载
  var 加载 = document.getElementById('加载中');
  加载.classList.add('活跃');
  document.getElementById('状态文字').textContent = '加载中...';

  if (f.类型 === 'html' || f.类型 === 'img') {
    // HTML/图片 → iframe（图片由浏览器原生渲染于 iframe 内）
    iframe.src = 路径;
    iframe.onload = function() {
      加载.classList.remove('活跃');
      document.getElementById('状态文字').textContent = f.显示;
    };
    iframe.onerror = function() {
      加载.classList.remove('活跃');
      document.getElementById('状态文字').textContent = '加载失败';
      显示错误('无法加载: ' + 原始路径);
    };
    iframe.style.display = 'block';
  } else if (f.类型 === 'txt') {
    // TXT → 加载 + <pre> 包裹
    fetch(路径).then(function(r){ return r.text(); }).then(function(txt){
      加载.classList.remove('活跃');
      document.getElementById('状态文字').textContent = f.显示;
      var 区 = document.getElementById('md渲染区');
      var 正文 = document.getElementById('md正文');
      正文.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;font-family:Consolas,\'SFMono-Regular\',Menlo,monospace;font-size:13.5px;line-height:1.7;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:18px;color:#1f2937">' + 转义HTML(txt) + '</pre>';
      区.classList.add('活跃');
      区.scrollTop = 0;
    }).catch(function(){
      加载.classList.remove('活跃');
      显示错误('无法加载 TXT: ' + f.名);
    });
  } else {
    // MD → 加载 + marked 渲染（fetch 优先，失败时降级到 XHR）
    加载MD(路径, f, 加载);
  }
}

// ═══ MD 加载：fetch 优先，失败降级到 XHR ═══
function 加载MD(路径, f, 加载) {
  fetch(路径)
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(text) { 渲染MD(text, f, 加载); })
    .catch(function(fetchErr) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 路径, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          渲染MD(xhr.responseText, f, 加载);
        } else {
          加载MD失败(加载, f, 路径, fetchErr);
        }
      };
      xhr.onerror = function() {
        加载MD失败(加载, f, 路径, fetchErr);
      };
      try { xhr.send(); } catch(e) {
        加载MD失败(加载, f, 路径, e);
      }
    });
}

function 渲染MD(text, f, 加载) {
  加载.classList.remove('活跃');
  document.getElementById('状态文字').textContent = f.显示;
  var md区 = document.getElementById('md渲染区');
  var md正文 = document.getElementById('md正文');
  md正文.innerHTML = marked.parse(text);
  md区.classList.add('活跃');
  md区.scrollTop = 0;
}

function 加载MD失败(加载, f, 路径, err) {
  加载.classList.remove('活跃');
  document.getElementById('状态文字').textContent = '加载失败';
  var hint = '';
  if (location.protocol === 'file:') {
    hint = '<br><br>💡 <b>提示：</b>浏览器安全策略限制了 <code>file://</code> 下的文件读取。<br>建议用本地服务器打开，例如在此目录执行：<br><code>npx serve .</code> 或 <code>python -m http.server 8080</code><br>然后访问 <code>http://localhost:8080/批次导航.html</code>';
  }
  显示错误('无法加载 MD: ' + f.名 + '<br><small>' + err.message + '</small>' + hint);
}

// ═══ 触发下载（用临时 a 标签 + download 属性） ═══
function 触发下载(el) {
  var 原始路径 = el.getAttribute('data-路径');
  var 文件名 = el.getAttribute('data-文件名');
  if (!原始路径 || !文件名) return;
  var 路径 = 编码路径(原始路径);
  var a = document.createElement('a');
  a.href = 路径;
  a.download = 文件名;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // 状态栏短暂提示
  var 状态 = document.getElementById('状态文字');
  var 旧 = 状态.textContent;
  状态.textContent = '⬇ 下载: ' + 文件名;
  setTimeout(function(){ 状态.textContent = 旧; }, 1800);
}

var 魔数 = "接口文档v1|";
var 锁屏待切系统 = null;
var 锁屏遮罩_el, 密码输入_el, 错误_el, 显隐_el;

function 转义HTML(s){
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function 接口文档已解锁(){
  try { return localStorage.getItem('接口文档解锁') === '1'; } catch(e){ return false; }
}

function 解密(pw){
  try {
    var bin = atob(接口文档加密数据);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var key = new TextEncoder().encode(pw);
    for (var j = 0; j < bytes.length; j++) bytes[j] ^= key[j % key.length];
    var text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    if (text.slice(0, 魔数.length) !== 魔数) return null;
    return text.slice(魔数.length);
  } catch(e) { return null; }
}

function 弹锁屏(){
  if (!锁屏遮罩_el) {
    锁屏遮罩_el = document.getElementById('锁屏遮罩');
    密码输入_el = document.getElementById('密码输入');
    错误_el = document.getElementById('错误');
    显隐_el = document.getElementById('显隐');
  }
  锁屏遮罩_el.classList.add('活跃');
  错误_el.textContent = '';
  密码输入_el.value = '';
  密码输入_el.type = 'password';
  显隐_el.textContent = '显示';
  setTimeout(function(){ 密码输入_el.focus(); }, 40);
}

function 关闭锁屏(){
  if (!锁屏遮罩_el) return;
  锁屏遮罩_el.classList.remove('活跃');
  锁屏待切系统 = null;
}

function 更新解锁状态标签(s){
  var 标签 = document.getElementById('解锁状态');
  if (s && s.需密码) {
    var 解锁 = 接口文档已解锁();
    标签.style.display = '';
    if (解锁) {
      标签.textContent = '🔓 已解锁';
      标签.classList.remove('锁定');
    } else {
      标签.textContent = '🔒 已锁定';
      标签.classList.add('锁定');
    }
  } else {
    标签.style.display = 'none';
  }
}

function 锁定接口文档(){
  if (!接口文档已解锁()) return;
  try { localStorage.removeItem('接口文档解锁'); } catch(e){}
  锁屏待切系统 = 当前系统索引;
  弹锁屏();
}

// ── 事件绑定（锁屏表单 + 显隐按钮） ──
document.addEventListener('DOMContentLoaded', function(){
  var 表单 = document.getElementById('解锁表单');
  if (!表单) return;
  表单.addEventListener('submit', function(e){
    e.preventDefault();
    var html = 解密(密码输入_el.value);
    if (html === null) {
      错误_el.textContent = '密码不正确，请重试';
      锁屏遮罩_el.querySelector('.锁卡').classList.remove('抖动');
      void 锁屏遮罩_el.querySelector('.锁卡').offsetWidth;
      锁屏遮罩_el.querySelector('.锁卡').classList.add('抖动');
      密码输入_el.select();
      return;
    }
    try { localStorage.setItem('接口文档解锁', '1'); } catch(err){}
    关闭锁屏();
    if (锁屏待切系统 !== null) {
      切换系统(锁屏待切系统);
    }
  });
  显隐_el.addEventListener('click', function(){
    var 显示 = 密码输入_el.type === 'password';
    密码输入_el.type = 显示 ? 'text' : 'password';
    显隐_el.textContent = 显示 ? '隐藏' : '显示';
  });
});

// ═══ 初始化 ═══
构建系统Tab();
构建导航();
// 恢复侧栏收起状态
try { if (localStorage.getItem('侧栏收起') === '1') document.querySelector('.主体').classList.add('侧栏收起'); } catch(e){}
// 同步侧栏头初始文案 + 解锁状态
(function 初始化侧栏头(){
  var s = 系统数据[当前系统索引];
  document.getElementById('当前系统标题').innerHTML = s.图标 + ' ' + s.名称;
  document.getElementById('当前系统说明').textContent = s.说明 + ' · 共' + 系统文件数(s) + '个需求';
  更新解锁状态标签(s);
})();
</script>
