<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口文档 · 内部接口 / 外部接口</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f4f7fa;--panel:#fff;--ink:#0f172a;--sub:#64748b;--line:#e3e9f1;--accent:#0f6b8f;--accent-soft:#e8f3f8;--code-bg:#0b1220}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.75}
button{font-family:inherit}

/* 锁屏 */
.锁屏{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% 0%,#12354a 0%,#0b1220 55%,#070d16 100%);padding:24px}
.锁卡{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:38px 34px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center;backdrop-filter:blur(8px)}
.锁标{width:52px;height:52px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(135deg,#1a8fb8,#0f6b8f);color:#fff;font-weight:800;font-size:18px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(15,107,143,.5)}
.锁卡 h1{margin:0;font-size:24px;color:#fff;letter-spacing:2px}
.锁卡 p{margin:8px 0 26px;font-size:13px;color:#8fa6b8}
.密码框{display:flex;gap:8px}
.密码框 input{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;padding:0 14px;font-size:15px;outline:none}
.密码框 input::placeholder{color:#6f8798}
.密码框 input:focus{border-color:#2b9fc8;box-shadow:0 0 0 3px rgba(43,159,200,.2)}
.显隐{width:56px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#9fb6c6;border-radius:10px;cursor:pointer;font-size:13px}
.解锁钮{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#1a8fb8,#0f6b8f);color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.解锁钮:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(26,143,184,.35)}
.错误{min-height:20px;margin-top:10px;font-size:13px;color:#f87171}
.锁脚{margin-top:18px;font-size:11px;color:#5d7385;letter-spacing:1px}
.抖动{animation:抖动 .35s}
@keyframes 抖动{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* 顶栏 */
.顶栏{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;height:58px;padding:0 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.品牌{display:flex;align-items:center;gap:10px;flex-shrink:0}
.品牌标{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1a8fb8,#0f6b8f);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.品牌语{display:flex;flex-direction:column;line-height:1.2}
.品牌语 b{font-size:14.5px;letter-spacing:.5px}
.品牌语 span{font-size:11px;color:var(--sub)}
.当前位置{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);overflow:hidden}
.当前位置 b{color:#172033;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.位置组{flex-shrink:0;font-size:11px;font-weight:800;color:#0f6b8f;background:var(--accent-soft);border-radius:5px;padding:2px 8px}
.锁定钮{flex-shrink:0;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;cursor:pointer}
.锁定钮:hover{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.菜单钮{display:none;flex-shrink:0;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}

/* 布局 */
.主体{display:flex;align-items:flex-start;max-width:1440px;margin:0 auto}
.侧栏{position:sticky;top:58px;width:262px;flex-shrink:0;height:calc(100vh - 58px);overflow-y:auto;padding:16px 12px 40px;background:#fff;border-right:1px solid var(--line)}
.侧栏题{font-size:10.5px;font-weight:800;color:#94a3b8;letter-spacing:2.5px;padding:0 10px 8px}
.菜单组{margin-bottom:6px}
.组题{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 7px;font-size:11.5px;font-weight:800;color:#8496a8;letter-spacing:1.5px}
.组题 .计数{font-size:10.5px;font-weight:700;color:#a8b6c4;background:#f4f7fa;border-radius:9px;padding:0 7px}
.菜单项{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin:1px 0;border:0;border-radius:9px;background:transparent;color:#334155;text-align:left;cursor:pointer;transition:background .12s,color .12s}
.菜单项:hover{background:#f5f8fb}
.菜单项.活跃{background:var(--accent-soft);color:var(--accent)}
.菜单图标{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:#f2f6fa;display:flex;align-items:center;justify-content:center;font-size:14px}
.菜单项.活跃 .菜单图标{background:#d8ebf4}
.菜单文本{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.菜单文本 b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.菜单文本 span{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.菜单项.活跃 .菜单文本 span{color:#4d94b0}
.内容{flex:1;min-width:0;padding:34px 46px 140px}
.文档{display:none;max-width:1000px;margin:0 auto}
.文档.活跃{display:block;animation:淡入 .2s ease}
@keyframes 淡入{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* 正文 */
.文章标题{font-size:29px;line-height:1.3;margin:0 0 10px;letter-spacing:.5px;color:#0b1a2a}
.导语{font-size:15px;color:#475569;margin:0 0 22px}
h2{font-size:22px;margin:44px 0 14px;padding-left:13px;border-left:4px solid var(--accent);line-height:1.35;color:#0b1a2a;scroll-margin-top:76px}
h3{font-size:17.5px;margin:30px 0 10px;color:#12324a;scroll-margin-top:76px}
h4{font-size:15.5px;margin:22px 0 8px;color:#1e3a52}
p{margin:10px 0;color:#334155}
strong{color:#0f172a;font-weight:750}
a{color:#0b6fa4}
hr{border:0;border-top:1px solid var(--line);margin:38px 0}
code{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:.9em;background:#eef3f8;border:1px solid #e2e9f1;border-radius:5px;padding:1px 5px;color:#0f4c63;word-break:break-all}
blockquote{margin:18px 0;padding:12px 16px;border-left:4px solid #f59e0b;background:#fffbeb;border-radius:0 8px 8px 0;color:#7c5b12;font-size:14px}
blockquote p{margin:0;color:inherit}
ul,ol{margin:10px 0 14px;padding-left:24px;color:#334155}
li{margin:5px 0}
.元信息{font-size:14px;background:#f6f9fc;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:#334155}

/* 本页目录 */
.本页目录{margin:6px 0 24px;border:1px solid var(--line);border-radius:10px;background:#fbfdff;padding:0 14px}
.本页目录 summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#5b7488;padding:9px 0;list-style:none}
.本页目录 summary::-webkit-details-marker{display:none}
.本页目录 summary:before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s;color:#94a3b8}
.本页目录[open] summary:before{transform:rotate(90deg)}
.本页目录 .目录体{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;padding:0 0 12px}
.本页目录 a{font-size:12.5px;color:#5b7488;text-decoration:none;padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.本页目录 a:hover{color:var(--accent)}

/* 代码块 */
.代码块{margin:16px 0;border-radius:11px;overflow:hidden;box-shadow:0 6px 20px rgba(15,23,42,.08)}
.代码栏{display:flex;align-items:center;justify-content:space-between;background:#111c2e;border-bottom:1px solid rgba(255,255,255,.07);padding:7px 12px}
.语言{font-size:11px;color:#7d93a8;text-transform:uppercase;letter-spacing:1.5px}
.复制{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#a9bccd;border-radius:6px;font-size:11.5px;padding:3px 10px;cursor:pointer;transition:all .12s}
.复制:hover{background:rgba(255,255,255,.14);color:#fff}
.复制.已复制{color:#4ade80;border-color:rgba(74,222,128,.4)}
.代码块 pre{margin:0;padding:16px;background:var(--code-bg);overflow:auto;max-height:520px}
.代码块 code{background:none;border:0;padding:0;color:#d7e3ef;font-size:13px;line-height:1.6;white-space:pre;word-break:normal}

/* 表格 */
.表格{margin:14px 0 20px;border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:74vh;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;z-index:2;background:#f2f7fa;color:#33546b;text-align:left;font-weight:800;padding:10px 12px;border-bottom:1px solid #dbe6ee;white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid #eef3f8;vertical-align:top;color:#334155;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8fbfd}
tbody td:first-child{font-family:Consolas,Menlo,monospace;font-size:12.5px;color:#0f4c63;font-weight:600;white-space:nowrap}
tbody td:first-child code{background:none;border:0;padding:0}
tr.分组 td{background:#eaf3f8;color:#0f6b8f;font-weight:800;font-size:13px}
tr.分组 td:first-child{color:#0f6b8f}

/* 端点 */
.端点{display:flex;align-items:center;gap:10px;margin:14px 0;padding:9px 12px;background:#f8fbfd;border:1px solid #dbe7ef;border-radius:10px;flex-wrap:wrap}
.方法{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:3px 9px;border-radius:6px;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px}
.方法.POST{background:#2563eb}.方法.GET{background:#059669}.方法.PUT{background:#d97706}.方法.DELETE{background:#dc2626}.方法.PATCH{background:#7c3aed}
.路径{background:none;border:0;padding:0;font-size:13.5px;color:#0f172a;font-weight:600;word-break:break-all}
.端点 .复制{margin-left:auto;border-color:#d7e3ec;background:#fff;color:#5b7488}
.端点 .复制:hover{background:#eef6fa;color:var(--accent)}

/* 信息卡 / 凭据 */
.信息卡{margin:18px 0 8px;background:linear-gradient(180deg,#f7fbfd,#fff);border:1px solid #dbe7ef;border-radius:13px;padding:16px 18px}
.卡头{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.卡标{flex-shrink:0;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:2px 8px;letter-spacing:1px}
.卡值 code{font-size:13.5px}
.卡头 .复制{margin-left:auto;border-color:#d7e3ec;background:#fff;color:#5b7488}
.卡头 .复制:hover{background:#eef6fa;color:var(--accent)}
.卡注{margin-top:9px;font-size:13px;color:var(--sub)}
.凭据{margin:12px 0;border:1px solid #f0d9a8;background:#fffdf6;border-radius:12px;padding:6px 14px}
.凭据行{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #f0e2c4;flex-wrap:wrap}
.凭据行:last-child{border-bottom:0}
.凭据名{flex-shrink:0;width:96px;font-size:12.5px;font-weight:800;color:#92700f}
.凭据行 code{flex:1;min-width:0;background:#fff;border-color:#efe0bd;color:#5c430a;word-break:break-all}
.凭据行 .复制{border-color:#efe0bd;background:#fff;color:#92700f}
.凭据行 .复制:hover{background:#fdf6e3;color:#7a5c07}
.提示{font-size:12.5px;color:#94a3b8;margin-top:8px}

.遮罩{display:none;position:fixed;inset:58px 0 0;background:rgba(15,23,42,.35);z-index:35}

@media(max-width:1100px){.内容{padding:28px 30px 120px}}
@media(max-width:900px){
  .品牌语 span{display:none}
  .菜单钮{display:block}
  .侧栏{position:fixed;left:0;top:58px;bottom:0;height:auto;z-index:36;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(15,23,42,.12)}
  body.菜单开启 .侧栏{transform:none}
  body.菜单开启 .遮罩{display:block}
  .内容{padding:22px 18px 100px}
  .文章标题{font-size:24px}
  h2{font-size:20px}
  .表格{max-height:none}
  .本页目录 .目录体{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="锁屏" id="锁屏">
  <div class="锁卡">
    <div class="锁标">API</div>
    <h1>接口文档</h1>
    <p>内部接口 · 外部接口</p>
    <form id="解锁表单">
      <div class="密码框"><input id="密码输入" type="password" placeholder="请输入访问密码" autocomplete="current-password"><button class="显隐" id="显隐" type="button">显示</button></div>
      <button class="解锁钮" type="submit">进入文档</button>
      <div class="错误" id="错误"></div>
    </form>
    <div class="锁脚">内部资料 · 请勿外传</div>
  </div>
</div>
<div id="应用" hidden>
  <header class="顶栏">
    <div class="品牌"><span class="品牌标">API</span><div class="品牌语"><b>接口文档</b><span>内部接口 · 外部接口</span></div></div>
    <button class="菜单钮" id="菜单钮" type="button" aria-label="菜单">☰</button>
    <div class="当前位置"><span class="位置组">内部接口</span><b id="当前标题">积分小程序</b></div>
    <button class="锁定钮" id="锁定" type="button">锁定</button>
  </header>
  <div class="主体">
    <aside class="侧栏"><div class="侧栏题">文档菜单</div><div class="菜单组"><div class="组题"><span>内部接口</span><span class="计数">2</span></div><button class="菜单项" type="button" data-doc="jifen" data-组="内部接口" data-标题="积分小程序"><span class="菜单图标">🎯</span><span class="菜单文本"><b>积分小程序</b><span>积分数据接口</span></span></button><button class="菜单项" type="button" data-doc="wuliao" data-组="内部接口" data-标题="内容小程序"><span class="菜单图标">📝</span><span class="菜单文本"><b>内容小程序</b><span>物料接口（11 个）</span></span></button></div><div class="菜单组"><div class="组题"><span>外部接口</span><span class="计数">3</span></div><button class="菜单项" type="button" data-doc="mt-goods" data-组="外部接口" data-标题="商品查询接口"><span class="菜单图标">🛒</span><span class="菜单文本"><b>商品查询接口</b><span>美团联盟</span></span></button><button class="菜单项" type="button" data-doc="mt-order" data-组="外部接口" data-标题="查询订单接口"><span class="菜单图标">📦</span><span class="菜单文本"><b>查询订单接口</b><span>美团联盟</span></span></button><button class="菜单项" type="button" data-doc="mt-link" data-组="外部接口" data-标题="获取推广链接接口"><span class="菜单图标">🔗</span><span class="菜单文本"><b>获取推广链接接口</b><span>美团联盟</span></span></button></div></aside>
    <div class="遮罩" id="遮罩"></div>
    <main class="内容" id="内容"></main>
  </div>
</div>

  var 魔数 = "接口文档v1|";
  var 应用 = document.getElementById('应用');
  var 锁屏 = document.getElementById('锁屏');
  var 输入 = document.getElementById('密码输入');
  var 错误 = document.getElementById('错误');
  var 表单 = document.getElementById('解锁表单');
  var 显隐 = document.getElementById('显隐');
  var 当前 = null;

  function 解密(pw){
    try{
      var bin = atob(数据);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var key = new TextEncoder().encode(pw);
      for (var j = 0; j < bytes.length; j++) bytes[j] ^= key[j % key.length];
      var text = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
      if (text.slice(0, 魔数.length) !== 魔数) return null;
      return text.slice(魔数.length);
    } catch(e){ return null; }
  }

  function 初始化(html){
    var 内容 = document.getElementById('内容');
    内容.innerHTML = html;
    加本页目录();
    绑定复制();
    绑定菜单();
    打开文档('jifen');
  }

  表单.addEventListener('submit', function(e){
    e.preventDefault();
    var html = 解密(输入.value);
    if (html === null) {
      错误.textContent = '密码不正确，请重试';
      锁屏.querySelector('.锁卡').classList.remove('抖动');
      void 锁屏.offsetWidth;
      锁屏.querySelector('.锁卡').classList.add('抖动');
      输入.select();
      return;
    }
    初始化(html);
    锁屏.style.display = 'none';
    应用.hidden = false;
    document.body.style.overflow = '';
  });

  显隐.addEventListener('click', function(){
    var 显示 = 输入.type === 'password';
    输入.type = 显示 ? 'text' : 'password';
    显隐.textContent = 显示 ? '隐藏' : '显示';
  });
  document.getElementById('锁定').addEventListener('click', function(){
    应用.hidden = true;
    锁屏.style.display = 'flex';
    错误.textContent = '';
    输入.value = '';
    输入.type = 'password';
    显隐.textContent = '显示';
    setTimeout(function(){ 输入.focus(); }, 60);
    window.scrollTo(0, 0);
  });
  setTimeout(function(){ 输入.focus(); }, 60);

  function 绑定菜单(){
    document.querySelectorAll('.菜单项').forEach(function(项){
      项.addEventListener('click', function(){
        打开文档(项.getAttribute('data-doc'));
        document.body.classList.remove('菜单开启');
      });
    });
    document.getElementById('菜单钮').addEventListener('click', function(){
      document.body.classList.toggle('菜单开启');
    });
    document.getElementById('遮罩').addEventListener('click', function(){
      document.body.classList.remove('菜单开启');
    });
  }

  function 打开文档(id){
    当前 = id;
    document.querySelectorAll('.文档').forEach(function(区){
      区.classList.toggle('活跃', 区.getAttribute('data-doc') === id);
    });
    var 选中 = null;
    document.querySelectorAll('.菜单项').forEach(function(项){
      var 中 = 项.getAttribute('data-doc') === id;
      项.classList.toggle('活跃', 中);
      if (中) 选中 = 项;
    });
    if (选中) {
      var 组 = document.querySelector('.位置组');
      var 标 = document.getElementById('当前标题');
      组.textContent = 选中.getAttribute('data-组');
      标.textContent = 选中.querySelector('b').textContent;
    }
    window.scrollTo(0, 0);
  }

  function 加本页目录(){
    document.querySelectorAll('.文档').forEach(function(区){
      var 标 = 区.querySelectorAll('h2');
      if (!标.length) return;
      var 盒 = document.createElement('details');
      盒.className = '本页目录';
      盒.innerHTML = '<summary>本页目录（' + 标.length + ' 节）</summary><div class="目录体"></div>';
      var 体 = 盒.querySelector('.目录体');
      标.forEach(function(h){
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.addEventListener('click', function(e){
          e.preventDefault();
          h.scrollIntoView({behavior:'smooth', block:'start'});
        });
        体.appendChild(a);
      });
      var 题 = 区.querySelector('.导语') || 区.querySelector('.文章标题');
      if (题) 题.insertAdjacentElement('afterend', 盒);
    });
  }

  function 复制文本(文本, 按钮){
    function 成功(){
      var 原 = 按钮.textContent;
      按钮.textContent = '已复制';
      按钮.classList.add('已复制');
      setTimeout(function(){ 按钮.textContent = 原; 按钮.classList.remove('已复制'); }, 1400);
    }
    function 降级(){
      var ta = document.createElement('textarea');
      ta.value = 文本;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); 成功(); } catch(e){}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(文本).then(成功).catch(降级);
    } else { 降级(); }
  }

  function 绑定复制(){
    document.addEventListener('click', function(e){
      var 按钮 = e.target.closest('.复制');
      if (!按钮) return;
      var 文本 = 按钮.getAttribute('data-copy');
      if (文本 === null) {
        var 块 = 按钮.closest('.代码块');
        if (块) 文本 = 块.querySelector('code').textContent;
      }
      if (文本 !== null) 复制文本(文本, 按钮);
    });
  }
})();
</script>
